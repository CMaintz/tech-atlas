term:
  en: Secrets management
  da: Håndtering af hemmeligheder (secrets management)
aka:
  en: []
  da: [secrets management]
domain: [platform, security]
cluster: cloud
layer: identity
status: current
era: 2015
summary:
  en: Keeping passwords, keys and tokens that programs use in one guarded store, instead of scattered in code and files.
  da: At holde de adgangskoder, nøgler og tokens, som programmer bruger, i ét bevogtet lager i stedet for spredt i kode og filer.
body:
  formal:
    en: The practice and tooling for storing, handing out, rotating and revoking machine credentials - such as passwords, cryptographic keys and access tokens - from a central, encrypted store with access control and a log of every use.
    da: Praksis og værktøjer til at opbevare, udlevere, udskifte og tilbagekalde maskiners loginoplysninger - fx adgangskoder, kryptografiske nøgler og adgangstokens - fra et centralt, krypteret lager med adgangskontrol og en log over al brug.
  plain:
    en: Like a hotel key desk that hands out room keys only to the right guests, notes who took which key and can cancel a lost one at once - instead of keys hidden under doormats.
    da: Som en hotelreception, der kun udleverer værelsesnøgler til de rette gæster, noterer, hvem der tog hvilken nøgle, og straks kan spærre en mistet - i stedet for nøgler gemt under dørmåtten.
  inPractice:
    en: At a pension fund, developers stop writing the database password into the program's code and keep it in a central secrets store; the program fetches it at start-up, and the store changes it automatically every month.
    da: I en pensionskasse holder udviklerne op med at skrive databasens adgangskode ind i programmets kode og lægger den i et centralt lager til hemmeligheder; programmet henter den ved opstart, og lageret skifter den automatisk hver måned.
  whyItMatters:
    en: Passwords and keys left in code or shared files are easy for attackers to find and hard to change once leaked; a guarded store limits and records who can use them.
    da: Adgangskoder og nøgler, der ligger i kode eller delte filer, er lette for angribere at finde og svære at skifte, når de er lækket; et bevogtet lager begrænser og registrerer, hvem der kan bruge dem.
deepDive:
  en: |-
    The scope is machine credentials: database passwords, API keys, OAuth client secrets, TLS private keys, SSH keys, signing keys and cloud access keys. It overlaps with but differs from key management, where a KMS or HSM performs cryptographic operations and the key never leaves the boundary, and from password managers for humans. Common tools are HashiCorp Vault (relicensed under the Business Source License in 2023, which prompted the OpenBao fork), AWS Secrets Manager, Azure Key Vault and Google Secret Manager. Kubernetes Secrets are only base64-encoded and are stored unencrypted in etcd unless encryption at rest is configured through an EncryptionConfiguration, ideally with a KMS provider.

    Stores protect secrets with envelope encryption: a data key per secret or per store, wrapped by a key-encryption key held in a KMS or HSM. Vault encrypts its storage barrier with a root key that is itself protected by Shamir-split unseal keys or by auto-unseal through a cloud KMS. Clients authenticate with a platform identity (a Kubernetes service account token, an AWS IAM role, an OIDC JWT from a CI pipeline) and receive a token bound to policies; secrets come back with a lease and TTL. Dynamic secrets go further: Vault's database secrets engine creates a unique database user per request and drops it when the lease expires, so a leaked credential dies on its own and every use is attributable. Static secrets are rotated instead; AWS Secrets Manager uses a rotation function and the staging labels AWSPENDING, AWSCURRENT and AWSPREVIOUS so that old and new credentials overlap during the switch.

    The failure modes are mostly about secrets escaping the store: hard-coded credentials (CWE-798), secrets committed to Git (deleting them in a later commit leaves them in history), baked into container image layers, printed in CI logs, dumped with environment variables into crash reports, or stored in plaintext in Terraform state. Scanners such as gitleaks and TruffleHog, and GitHub secret scanning with push protection, catch many of these. The correct response to a leak is to revoke and rotate first and only then purge history. Every scheme also faces the secret-zero problem: the first credential used to reach the store must come from somewhere trustworthy.

    The current direction is to eliminate static secrets altogether through workload identity federation, where a CI job exchanges its OIDC token for short-lived cloud credentials (for example AWS STS AssumeRoleWithWebIdentity), SPIFFE/SPIRE workload identities and short-lived certificates. Relevant references are NIST SP 800-57 Part 1 on key lifecycles and cryptoperiods, ISO/IEC 27001:2022 Annex A 5.17 (authentication information) and 8.24 (use of cryptography), and the OWASP Secrets Management Cheat Sheet.
  da: |-
    Området dækker maskiners loginoplysninger: databaseadgangskoder, API-nøgler, OAuth client secrets, private TLS-nøgler, SSH-nøgler, signeringsnøgler og adgangsnøgler til cloud. Det overlapper med, men er forskelligt fra, nøglehåndtering, hvor en KMS eller HSM udfører de kryptografiske operationer, og nøglen aldrig forlader grænsen, og fra password managers til mennesker. Udbredte værktøjer er HashiCorp Vault (omlicenseret under Business Source License i 2023, hvilket førte til forken OpenBao), AWS Secrets Manager, Azure Key Vault og Google Secret Manager. Kubernetes Secrets er kun base64-kodede og gemmes ukrypteret i etcd, medmindre kryptering af hvilende data er sat op via en EncryptionConfiguration, helst med en KMS-provider.

    Lagrene beskytter hemmelighederne med envelope encryption: en datanøgle pr. hemmelighed eller pr. lager, pakket ind af en nøglekrypteringsnøgle i en KMS eller HSM. Vault krypterer sin storage barrier med en rodnøgle, som selv er beskyttet af unseal-nøgler delt med Shamirs metode eller af auto-unseal via en cloud-KMS. Klienter autentificerer sig med en platformsidentitet (et Kubernetes service account-token, en AWS IAM-rolle, et OIDC-JWT fra en CI-pipeline) og får et token knyttet til politikker; hemmelighederne udleveres med lease og TTL. Dynamiske hemmeligheder går videre: Vaults database secrets engine opretter en unik databasebruger pr. forespørgsel og sletter den, når leasen udløber, så en lækket loginoplysning dør af sig selv, og hver brug kan spores. Statiske hemmeligheder skal i stedet roteres; AWS Secrets Manager bruger en rotationsfunktion og staging-labels AWSPENDING, AWSCURRENT og AWSPREVIOUS, så gamle og nye loginoplysninger overlapper under skiftet.

    Fejlene handler mest om hemmeligheder, der slipper ud af lageret: hardkodede loginoplysninger (CWE-798), hemmeligheder committet til Git (sletning i et senere commit efterlader dem i historikken), bagt ind i lag i container-images, skrevet ud i CI-logs, dumpet med miljøvariabler i crash-rapporter eller gemt i klartekst i Terraform-state. Scannere som gitleaks og TruffleHog samt GitHubs secret scanning med push protection fanger mange af dem. Den rigtige reaktion på et læk er først at tilbagekalde og rotere og først derefter rense historikken. Alle løsninger står desuden over for secret zero-problemet: den første loginoplysning, der bruges til at nå lageret, skal komme et troværdigt sted fra.

    Retningen i dag er helt at fjerne statiske hemmeligheder via workload identity federation, hvor et CI-job veksler sit OIDC-token til kortlivede cloud-loginoplysninger (fx AWS STS AssumeRoleWithWebIdentity), SPIFFE/SPIRE-workload-identiteter og kortlivede certifikater. Relevante referencer er NIST SP 800-57 del 1 om nøglers livscyklus og kryptoperioder, ISO/IEC 27001:2022 bilag A 5.17 (autentifikationsinformation) og 8.24 (brug af kryptografi) samt OWASP Secrets Management Cheat Sheet.
howTo:
  steps:
    en:
      - Find the machine secrets you already have by scanning repositories including their history, CI variables, configuration files, container images and IaC state, and record each secret with an owner and purpose.
      - Choose one central secrets store, such as Vault, OpenBao or your cloud provider's secrets manager, with encryption backed by a KMS or HSM.
      - Let applications and pipelines log in to the store with their platform identity (service account, IAM role or OIDC token) instead of a stored password, and give each one access only to the secrets it needs.
      - Move secrets out of code and files into the store, and have applications fetch them at run time.
      - Rotate static secrets automatically on a fixed schedule, and use dynamic, short-lived secrets or workload identity federation wherever possible.
      - Turn on secret scanning with push protection and pre-commit hooks, and mask secrets in CI logs.
      - In Kubernetes, turn on encryption at rest for Secrets with a KMS provider and limit who can read them.
      - Write and rehearse a leak procedure - revoke and rotate first, then check the logs for misuse, and only then clean up history.
      - Review access policies and the audit log every quarter, and remove secrets and access nobody uses.
    da:
      - Find de maskinhemmeligheder, I allerede har, ved at scanne repositories inklusive historik, CI-variabler, konfigurationsfiler, container-images og IaC-state, og registrér hver hemmelighed med ejer og formål.
      - Vælg ét centralt lager til hemmeligheder, fx Vault, OpenBao eller cloududbyderens secrets manager, med kryptering, der bygger på en KMS eller HSM.
      - Lad applikationer og pipelines logge ind i lageret med deres platformsidentitet (service account, IAM-rolle eller OIDC-token) i stedet for en gemt adgangskode, og giv hver kun adgang til de hemmeligheder, den har brug for.
      - Flyt hemmeligheder ud af kode og filer og ind i lageret, og lad applikationerne hente dem, når de kører.
      - Rotér statiske hemmeligheder automatisk efter en fast plan, og brug dynamiske, kortlivede hemmeligheder eller workload identity federation, hvor det er muligt.
      - Slå secret scanning med push protection og pre-commit-hooks til, og maskér hemmeligheder i CI-logs.
      - Slå kryptering af hvilende data til for Secrets i Kubernetes med en KMS-provider, og begræns, hvem der kan læse dem.
      - Skriv og øv en procedure for læk - tilbagekald og rotér først, tjek derefter logs for misbrug, og rens først til sidst historikken.
      - Gennemgå adgangspolitikker og auditloggen hvert kvartal, og fjern hemmeligheder og adgange, som ingen bruger.
  pitfalls:
    en:
      - Deleting a leaked secret in a new commit and believing it is gone, although it stays in history and in every clone.
      - Assuming Kubernetes Secrets are encrypted, when they are only base64-encoded unless encryption at rest is configured.
      - Moving secrets into a vault but giving every application read access to all of them.
      - Solving the secret-zero problem by putting the vault token itself in an environment file or in the code.
    da:
      - At slette en lækket hemmelighed i et nyt commit og tro, at den er væk, selv om den stadig ligger i historikken og i alle kloner.
      - At gå ud fra, at Kubernetes Secrets er krypterede, selv om de kun er base64-kodede, medmindre kryptering af hvilende data er sat op.
      - At flytte hemmelighederne ind i et lager, men give alle applikationer læseadgang til dem alle.
      - At løse secret zero-problemet ved at lægge selve lagerets token i en miljøfil eller i koden.
  guides:
