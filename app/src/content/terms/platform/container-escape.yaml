term:
  en: Container escape
  da: Container escape
aka:
  en: [container breakout]
  da: [container breakout, udbrud fra container]
domain: [platform, security]
cluster: containers
layer: host
status: current
summary:
  en: An attack where code running inside a container breaks through its fences and gains control of the host machine beneath it.
  da: Et angreb, hvor kode, der kører i en container, bryder gennem afskærmningen og får kontrol over værtsmaskinen nedenunder.
body:
  formal:
    en: A kind of privilege escalation in which a process inside a container uses a flaw in the kernel or container runtime, or a too generous setting, to act outside its container with the host's rights.
    da: En form for rettighedseskalering, hvor en proces i en container udnytter en fejl i kernen eller container-runtimen, eller en for gavmild indstilling, til at handle uden for sin container med værtens rettigheder.
  plain:
    en: Like a guest in one hotel room who finds a loose wall panel and suddenly walks into the hotel's back office.
    da: Som en hotelgæst, der finder en løs vægplade på sit værelse og pludselig står på hotellets kontor.
  inPractice:
    en: An attacker takes over a web app that runs in a container with full admin rights and the host's disks attached, writes a file onto the host itself, and now runs code on the whole machine.
    da: En angriber overtager en webapplikation, der kører i en container med fulde administratorrettigheder og værtens diske tilkoblet, skriver en fil direkte på værten og kører nu kode på hele maskinen.
  whyItMatters:
    en: Many teams treat containers as walls between customers or apps; one escape turns a single weak app into control of every container on the host.
    da: Mange teams bruger containere som skillevægge mellem kunder eller applikationer; ét udbrud gør en enkelt svag applikation til kontrol over alle containere på værten.
edges:
  kind-of: [privilege-escalation]
  requires: [container, container-runtime]
  exploits:
    - to: vulnerability
      why:
        en: Breaking out depends on a flaw in the shared kernel or the runtime, or a setting that gives the container too many rights.
        da: At bryde ud afhænger af en fejl i den fælles kerne eller runtimen, eller en indstilling, der giver containeren for mange rettigheder.
      strength: primary
      confidence: high
  causes:
    - to: lateral-movement
      why:
        en: Control of the host gives access to its other containers and the logins they hold, opening the way to further systems.
        da: Kontrol over værten giver adgang til dens andre containere og de loginoplysninger, de har, hvilket åbner vejen til flere systemer.
      strength: normal
      confidence: medium
sources:
  - title: NIST SP 800-190 — Application Container Security Guide
    url: https://csrc.nist.gov/pubs/sp/800/190/final
    tier: standard
    publisher: NIST
  - title: MITRE ATT&CK — Escape to Host (T1611)
    url: https://attack.mitre.org/techniques/T1611/
    tier: reference
    publisher: MITRE
draft: true
