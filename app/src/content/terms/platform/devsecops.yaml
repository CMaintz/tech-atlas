edges:
  requires: [ci-cd]
  implements: [security-by-design]
  used-with:
    - sbom
    - vulnerability-scanning
    - to: secure-development-lifecycle
      why:
        en: The SDL sets which security steps happen at each stage; DevSecOps automates them in the pipeline so they run on every change.
        da: SDL fastlægger, hvilke sikkerhedstrin der sker i hver fase; DevSecOps automatiserer dem i pipelinen, så de kører ved hver ændring.
      strength: normal
      confidence: high
