term:
  en: Service level objective (SLO)
  da: Serviceniveaumål (SLO)
aka:
  en: [SLO]
  da: [SLO]
domain: [platform]
cluster: observability
layer: process
status: current
summary:
  en: An internal target for how well a service should work, such as 99.9% of requests answered within a second over 30 days.
  da: Et internt mål for, hvor godt en tjeneste skal fungere, fx at 99,9 % af forespørgslerne besvares inden for et sekund over 30 dage.
body:
  formal:
    en: A target value for a measured sign of service quality, such as the share of requests that succeed or answer fast enough, over a set time window; the gap between the target and 100% is the error budget the team may spend.
    da: En målværdi for et målt tegn på servicekvalitet, fx andelen af forespørgsler, der lykkes eller besvares hurtigt nok, over en fast periode; afstanden mellem målet og 100 % er det fejlbudget, teamet må bruge af.
  plain:
    en: Like a bus company aiming for 98% of buses on time; the timetable it prints for passengers promises less, so it has room to spare before it owes anyone money.
    da: Som et busselskab, der sigter efter, at 98 % af busserne kører til tiden; køreplanen, det lover passagererne, lover mindre, så der er luft, før det skylder nogen penge.
  inPractice:
    en: The team behind a school communication portal allows itself 43 minutes out of service a month; after a bad release uses 40 of them, it pauses new features and spends the rest of the month on stability.
    da: Teamet bag en skoleportal tillader sig 43 minutters nedetid om måneden; da en dårlig frigivelse har brugt 40 af dem, sætter teamet nye funktioner på pause og bruger resten af måneden på stabilitet.
  whyItMatters:
    en: It turns availability from a vague wish into a number that guides the choice between speed and stability, and warns the team before it breaks the SLA it has given its own customers.
    da: Det gør tilgængelighed fra et vagt ønske til et tal, der styrer valget mellem hastighed og stabilitet, og advarer teamet, før det bryder den SLA, det har givet sine egne kunder.
edges:
  requires:
    - metrics
    - availability
  used-with:
    - to: supplier-management
      why:
        en: A supplier's SLA caps what an internal SLO can realistically promise, so SLOs are set with the suppliers' own service levels in mind.
        da: En leverandørs SLA sætter et loft over, hvad en intern SLO realistisk kan love, så SLO'er fastsættes med leverandørernes egne serviceniveauer for øje.
      strength: normal
      confidence: medium
sources:
  - title: Google SRE book — Chapter 4, Service Level Objectives
    url: https://sre.google/sre-book/service-level-objectives/
    tier: reference
    publisher: Google
draft: true
