term:
  en: Hypervisor
  da: Hypervisor
aka:
  en: [virtual machine monitor, VMM]
  da: [VMM]
domain: [platform]
cluster: cloud
layer: infrastructure
status: current
era: 1967
summary:
  en: The layer of software that splits one physical computer into several virtual machines and keeps them apart.
  da: Det lag software, der deler én fysisk computer op i flere virtuelle maskiner og holder dem adskilt.
body:
  formal:
    en: Software that creates and runs virtual machines, handing each a share of the real processor, memory and devices while stopping one from reading or changing another; a type 1 hypervisor runs straight on the hardware, a type 2 on top of an operating system.
    da: Software, der skaber og kører virtuelle maskiner, giver hver en del af den rigtige processor, hukommelse og enheder og forhindrer, at én maskine kan læse eller ændre en anden; en type 1-hypervisor kører direkte på hardwaren, en type 2 oven på et styresystem.
  plain:
    en: Like the caretaker of an apartment block who divides up the space, water and heat between the flats and makes sure no tenant can walk into a neighbour's home.
    da: Som viceværten i en ejendom, der fordeler plads, vand og varme mellem lejlighederne og sørger for, at ingen lejer kan gå ind hos naboen.
  inPractice:
    en: A hospital region runs two hundred virtual machines on a handful of servers; when a flaw in the hypervisor is announced, the IT operations manager moves machines aside and patches every host within the week.
    da: En region kører to hundrede virtuelle maskiner på en håndfuld servere; når der offentliggøres en fejl i hypervisoren, flytter den IT-driftsansvarlige maskinerne til side og patcher alle værter inden for ugen.
  whyItMatters:
    en: Every virtual machine on a host depends on it to stay separate, so a single hole in the hypervisor can hand an attacker all of them at once.
    da: Alle virtuelle maskiner på en vært er afhængige af den for at holde sig adskilt, så ét hul i hypervisoren kan give en angriber adgang til dem alle på én gang.
edges:
  requires: [operating-system]
  used-with: [iaas]
sources:
