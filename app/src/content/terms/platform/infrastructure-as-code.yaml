term:
  en: Infrastructure as code (IaC)
  da: Infrastructure as code (IaC)
aka:
  en: [IaC]
  da: [IaC]
domain: [platform]
cluster: delivery
layer: infrastructure
status: current
summary:
  en: Describing servers, networks and cloud settings in text files that a tool reads to build them, instead of setting them up by hand.
  da: At beskrive servere, netværk og cloud-indstillinger i tekstfiler, som et værktøj bygger ud fra, i stedet for at sætte dem op i hånden.
body:
  formal:
    en: A practice where the wanted state of servers, networks, access rules and cloud services is written in files kept under version control, and a tool compares that state with what exists and makes the changes needed to match.
    da: En praksis, hvor den ønskede tilstand for servere, netværk, adgangsregler og cloud-tjenester skrives i filer under versionsstyring, og et værktøj sammenligner tilstanden med det, der findes, og laver de ændringer, der skal til for at de passer sammen.
  plain:
    en: Like a detailed recipe instead of a chef's memory; anyone can cook the same dish again, and you can see exactly which ingredient changed since last time.
    da: Som en detaljeret opskrift i stedet for kokkens hukommelse; alle kan lave den samme ret igen, og man kan se præcis, hvilken ingrediens der er ændret siden sidst.
  inPractice:
    en: A developer at a small Danish software firm rebuilds the firm's whole test setup in the cloud from files in twenty minutes; at review, a colleague spots that one storage area was about to be opened to the internet.
    da: En udvikler i en mindre dansk softwarevirksomhed genopbygger hele firmaets testmiljø i skyen ud fra filer på tyve minutter; ved gennemgangen opdager en kollega, at et lagerområde var ved at blive åbnet mod internettet.
  whyItMatters:
    en: Settings made by hand drift, get forgotten and cannot be checked; written settings can be reviewed, tested for known mistakes and rebuilt the same way after a disaster.
    da: Indstillinger lavet i hånden skrider, bliver glemt og kan ikke efterprøves; skrevne indstillinger kan gennemgås, testes for kendte fejl og genopbygges ens efter en katastrofe.
deepDive:
  en: |-
    IaC tools fall into two families. Declarative provisioning tools - Terraform and its fork OpenTofu (HCL), AWS CloudFormation, Azure Bicep/ARM templates, Pulumi (general-purpose languages that build a declarative resource graph) and Crossplane (Kubernetes custom resources) - describe the end state and let an engine compute the steps. Configuration-management tools such as Ansible, Puppet and Chef converge the state of existing machines; Ansible playbooks are procedural in structure but are written to be idempotent, so re-running them on a correct system changes nothing. Idempotency and convergence are the core properties: applying the same code twice must yield the same infrastructure.

    Terraform's workflow illustrates the mechanics. terraform plan refreshes the recorded state, calls provider APIs to read real resources, builds a dependency graph and prints a diff of creates, updates, in-place changes and replacements; terraform apply executes it, parallelising independent operations. The state file maps each resource address to its real-world ID and stores all attributes - including generated passwords and keys in plaintext - so it must live in a remote backend with encryption, strict access control and locking to prevent concurrent applies. Drift occurs whenever someone changes a resource outside the code; it is detected at the next plan (or by scheduled drift runs, or CloudFormation drift detection), and either imported back into code or overwritten. Immutable-infrastructure practice avoids in-place mutation altogether by replacing servers or images on every change.

    In August 2023 HashiCorp moved Terraform from the MPL 2.0 to the Business Source License 1.1, prompting the community fork OpenTofu under the Linux Foundation, which has since added features such as client-side state encryption. Organisations should record which tool and licence they depend on, because provider and module ecosystems are shared but diverging.

    Security benefits come from making configuration reviewable and testable before it exists: static analysers (Checkov, Trivy/tfsec, KICS) and policy-as-code engines (OPA/Conftest, HashiCorp Sentinel) check for public storage buckets, open security groups, missing encryption or logging, often mapped to CIS Benchmarks, and can block the pull request. IaC also introduces its own supply chain: providers and third-party modules run with the pipeline's cloud credentials, so versions should be pinned and the dependency lock file (.terraform.lock.hcl, which records provider checksums) committed. Plan output and logs can leak secrets, and the credentials used by apply are usually highly privileged, so federated short-lived identities and separate plan and apply permissions are standard. IaC is the declarative description; GitOps adds continuous, pull-based reconciliation of that description.
  da: |-
    IaC-værktøjer falder i to familier. Deklarative provisioneringsværktøjer - Terraform og forgreningen OpenTofu (HCL), AWS CloudFormation, Azure Bicep/ARM-skabeloner, Pulumi (almindelige programmeringssprog, der opbygger en deklarativ ressourcegraf) og Crossplane (Kubernetes custom resources) - beskriver sluttilstanden og lader en motor beregne trinene. Konfigurationsstyringsværktøjer som Ansible, Puppet og Chef bringer eksisterende maskiner i den ønskede tilstand; Ansible-playbooks er procedurale i opbygningen, men skrives idempotent, så en ny kørsel på et korrekt system ikke ændrer noget. Idempotens og konvergens er kerneegenskaberne: anvendes den samme kode to gange, skal resultatet være den samme infrastruktur.

    Terraforms arbejdsgang viser mekanikken. terraform plan opdaterer den registrerede tilstand, kalder providernes API'er for at læse de reelle ressourcer, opbygger en afhængighedsgraf og udskriver en diff med oprettelser, opdateringer, ændringer på stedet og udskiftninger; terraform apply udfører den og paralleliserer uafhængige operationer. State-filen kobler hver ressourceadresse til dens reelle ID og gemmer alle attributter - også genererede adgangskoder og nøgler i klartekst - så den skal ligge i en fjern backend med kryptering, stram adgangskontrol og låsning, der forhindrer samtidige apply-kørsler. Afvigelser (drift) opstår, når nogen ændrer en ressource uden om koden; de opdages ved næste plan (eller ved planlagte drift-kørsler eller CloudFormations drift detection) og bliver enten importeret tilbage i koden eller overskrevet. Uforanderlig infrastruktur undgår ændringer på stedet helt ved at udskifte servere eller images ved hver ændring.

    I august 2023 flyttede HashiCorp Terraform fra MPL 2.0 til Business Source License 1.1, hvilket førte til fællesskabsforgreningen OpenTofu under Linux Foundation, der siden har tilføjet funktioner som klientside-kryptering af state. Organisationer bør registrere, hvilket værktøj og hvilken licens de afhænger af, fordi økosystemerne af providers og moduler er fælles, men glider fra hinanden.

    Sikkerhedsgevinsten kommer af, at konfigurationen kan gennemgås og testes, før den findes: statiske analyseværktøjer (Checkov, Trivy/tfsec, KICS) og policy as code-motorer (OPA/Conftest, HashiCorp Sentinel) tjekker for offentlige lagerbuckets, åbne security groups, manglende kryptering eller logning, ofte koblet til CIS Benchmarks, og kan blokere pull requesten. IaC giver også sin egen forsyningskæde: providers og tredjepartsmoduler kører med pipelinens cloud-legitimationsoplysninger, så versioner bør låses, og afhængighedslåsefilen (.terraform.lock.hcl, der registrerer providernes checksummer) bør committes. Plan-output og logs kan lække hemmeligheder, og de legitimationsoplysninger, apply bruger, er som regel meget privilegerede, så fødererede kortlivede identiteter og adskilte rettigheder til plan og apply er standard. IaC er den deklarative beskrivelse; GitOps tilføjer løbende, pull-baseret afstemning af den beskrivelse.
edges:
  requires: [version-control]
  mitigates:
    - to: cloud-misconfiguration
      why:
        en: Settings in reviewed files can be checked automatically for known mistakes before anything is built.
        da: Indstillinger i gennemgåede filer kan tjekkes automatisk for kendte fejl, før noget bygges.
      strength: primary
      confidence: high
  used-with:
    - secrets-management
