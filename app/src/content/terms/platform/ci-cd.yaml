term:
  en: CI/CD
  da: CI/CD
aka:
  en: [continuous integration and continuous delivery, continuous deployment]
  da: [kontinuerlig integration og levering]
domain: [platform]
cluster: delivery
layer: delivery
status: current
summary:
  en: Merging, testing and releasing small software changes automatically and often, instead of in rare, large batches.
  da: At samle, teste og frigive små ændringer i software automatisk og ofte i stedet for i få, store leverancer.
body:
  formal:
    en: Continuous integration merges each developer's changes into a shared main branch several times a day and checks them with automatic builds and tests; continuous delivery keeps every passing version ready to release, and continuous deployment releases it without a human step.
    da: Kontinuerlig integration fletter hver udviklers ændringer ind i en fælles hovedgren flere gange om dagen og kontrollerer dem med automatiske builds og tests; ved kontinuerlig levering er hver godkendt version klar til frigivelse, og ved kontinuerlig udrulning sættes den i drift uden et menneskeligt trin.
  plain:
    en: Like a bakery that checks and ships each tray as soon as it leaves the oven, rather than baking for a month and discovering on delivery day that the recipe was wrong.
    da: Som et bageri, der tjekker og sender hver plade ud, så snart den kommer ud af ovnen, i stedet for at bage i en måned og først på leveringsdagen opdage, at opskriften var forkert.
  inPractice:
    en: A developer at a Danish web shop fixes a fault in the discount code field; within minutes the change is built, tested and scanned, and it is live before lunch instead of waiting for the monthly release.
    da: En udvikler i en dansk webshop retter en fejl i feltet til rabatkoder; få minutter senere er ændringen bygget, testet og scannet, og den er i drift før frokost i stedet for at vente på den månedlige frigivelse.
  whyItMatters:
    en: Small, frequent, automatically checked changes are easier to review and to undo, and they let security fixes reach production in hours instead of weeks.
    da: Små, hyppige og automatisk kontrollerede ændringer er lettere at gennemgå og at rulle tilbage, og de lader sikkerhedsrettelser nå driften på timer i stedet for uger.
edges:
  requires: [version-control]
  part-of: [software-supply-chain]
  used-with:
    - software-composition-analysis
    - pipeline
    - infrastructure-as-code
    - gitops
    - secrets-management
    - container-registry
    - to: code-signing
      why:
        en: The pipeline's last step signs each release so the servers can check it came from the pipeline unchanged.
        da: Pipelinens sidste trin signerer hver udgivelse, så serverne kan tjekke, at den kom uændret fra pipelinen.
      strength: normal
      confidence: high
    - to: coding-agent
      why:
        en: Agents are more and more often started from the pipeline itself, and their output must pass the same automatic build and tests as human code.
        da: Agenter startes i stigende grad fra selve pipelinen, og deres output skal gennem samme automatiske bygning og tests som menneskers kode.
      strength: normal
      confidence: medium
sources:
  - title: NIST SP 800-204D — Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines
    url: https://csrc.nist.gov/pubs/sp/800/204/d/final
    tier: standard
    publisher: NIST
  - title: Continuous Integration (Martin Fowler)
    url: https://martinfowler.com/articles/continuousIntegration.html
    tier: reference
