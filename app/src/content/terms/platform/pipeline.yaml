term:
  en: Pipeline
  da: Pipeline
aka:
  en: [build pipeline, CI/CD pipeline, deployment pipeline]
  da: [byggepipeline, udrulningspipeline]
domain: [platform]
cluster: delivery
layer: delivery
status: current
summary:
  en: A fixed, automatic chain of steps that takes a code change from saved file to running software, stopping if any step fails.
  da: En fast, automatisk kæde af trin, der fører en kodeændring fra gemt fil til kørende software og stopper, hvis et trin fejler.
body:
  formal:
    en: A written description of ordered stages, such as build, test, security scan, package and deploy, that a CI/CD system runs on every change, where each stage must pass before the next one starts.
    da: En skriftlig beskrivelse af faser i fast rækkefølge — fx at bygge, teste, scanne og pakke softwaren og rulle den ud — som et CI/CD-system kører for hver ændring, og hvor hver fase skal bestå, før den næste går i gang.
  plain:
    en: Like a car factory's assembly line, where each station does one job and a car that fails the brake test never reaches the showroom.
    da: Som samlebåndet på en bilfabrik, hvor hver station udfører én opgave, og en bil, der dumper bremsetesten, aldrig når ud i forretningen.
  inPractice:
    en: At a ferry company, the pipeline for the ticket booking site stops a Friday release because a test finds child fares priced as adult fares; nothing reaches customers until the fault is fixed.
    da: Hos et færgeselskab stopper pipelinen for billetbookingen en frigivelse om fredagen, fordi en test viser, at børnebilletter bliver prissat som voksenbilletter; intet når ud til kunderne, før fejlen er rettet.
  whyItMatters:
    en: The pipeline is where rules become automatic and hard to skip, but it also holds keys to production, so an attacker who takes it over can ship harmful code to every user.
    da: Pipelinen er stedet, hvor regler bliver automatiske og svære at springe over, men den har også nøglerne til driften, så en angriber, der overtager den, kan sende skadelig kode ud til alle brugere.
edges:
  part-of: [ci-cd]
  used-with:
    - secrets-management
    - vulnerability-scanning
    - software-composition-analysis
sources:
  - title: NIST SP 800-204D — Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines
