term:
  en: Pod
  da: Pod
aka:
  en: []
  da: []
domain: [platform]
cluster: containers
layer: orchestration
status: current
era: 2014
summary:
  en: The smallest unit Kubernetes runs — one or a few tightly linked containers that share a network address and storage.
  da: Den mindste enhed, Kubernetes kører — én eller få tæt forbundne containere, der deler netværksadresse og lager.
body:
  formal:
    en: A group of one or more containers that Kubernetes always places together on the same machine, where they share one IP address and can share storage; pods are short-lived and are replaced rather than repaired.
    da: En gruppe af en eller flere containere, som Kubernetes altid placerer sammen på den samme maskine, hvor de deler én IP-adresse og kan dele lager; pods er kortlivede og bliver udskiftet frem for repareret.
  plain:
    en: Like two people sharing one flat — same address, same fridge, and when they move, they move together.
    da: Som to, der deler lejlighed — samme adresse, samme køleskab, og når de flytter, flytter de sammen.
  inPractice:
    en: In a hospital region's setup, a pod holds the lab system's container plus a small helper container that ships its logs; when the pod is moved to another machine, both move as one.
    da: I en regions opsætning rummer en pod laboratoriesystemets container plus en lille hjælpecontainer, der sender dens logs videre; når poden flyttes til en anden maskine, flytter begge som én.
  whyItMatters:
    en: Security settings are made pod by pod — such as whether it may run as the admin user or reach the host's disks — so one pod with too many rights can open a way into the whole host.
    da: Sikkerhedsindstillinger sættes pod for pod — fx om den må køre som administrator eller nå værtens diske — så én pod med for mange rettigheder kan åbne en vej ind til hele værten.
