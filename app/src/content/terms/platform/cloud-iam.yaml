term:
  en: Cloud IAM
  da: Cloud IAM
aka:
  en: [cloud identity and access management]
  da: [cloud-identitets- og adgangsstyring]
domain: [platform, security]
cluster: cloud
layer: identity
status: current
era: 2011
summary:
  en: The cloud provider's built-in system of policies that decides which users, roles and service accounts may do what to each resource.
  da: Cloududbyderens indbyggede system af politikker, der afgør, hvilke brugere, roller og servicekonti der må gøre hvad ved hver ressource.
body:
  formal:
    en: A service run by the cloud provider in which the customer writes policies binding an identity to the actions it may take on named resources; the provider checks them on every request and refuses anything not granted.
    da: En tjeneste, som cloududbyderen driver, hvor kunden skriver politikker, der kobler en identitet til de handlinger, den må udføre på navngivne ressourcer; udbyderen tjekker dem ved hver forespørgsel og afviser alt, der ikke er givet lov til.
  plain:
    en: Like the key card system in an office building — one central list says whose card opens which doors, and every door checks that list each time.
    da: Som adgangskortsystemet i en kontorbygning — én central liste siger, hvis kort åbner hvilke døre, og hver dør tjekker listen hver gang.
  inPractice:
    en: At a pension fund, the cloud architect gives the nightly backup job a service account that may only write to one storage bucket, and gives developers a role that can read logs but not delete databases.
    da: I en pensionskasse giver cloudarkitekten det natlige backupjob en servicekonto, der kun må skrive til én bestemt bucket, og udviklerne en rolle, der kan læse logs, men ikke slette databaser.
  whyItMatters:
    en: The rights are the customer's job, not the provider's, and one policy that grants too much can open every resource in an account to whoever gets hold of it.
    da: Rettighederne er kundens ansvar, ikke udbyderens, og én politik, der giver for meget, kan åbne alle ressourcer på en konto for den, der får fat i den.
edges:
  implements: [access-management]
  requires: [cloud-computing, access-control, authorization]
  used-with:
    - to: least-privilege
      why:
        en: Cloud IAM policies are where the rule of granting only the rights needed is actually put into effect for cloud resources.
        da: Det er i Cloud IAM-politikkerne, at princippet om kun at give de nødvendige rettigheder faktisk føres ud i livet for cloudressourcer.
      strength: primary
      confidence: high
    - service-account
