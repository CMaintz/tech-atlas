term:
  en: Telemetry
  da: Telemetri
aka:
  en: []
  da: []
domain: [platform]
cluster: observability
layer: observability
status: current
summary:
  en: The data a running system sends out about itself, mainly logs, metrics and traces, so people can see how it is doing.
  da: De data, et kørende system sender ud om sig selv, især logs, metrikker og sporinger, så man kan se, hvordan det har det.
body:
  formal:
    en: Signals produced by software and machines while they run and sent to a separate place to be stored and studied, most often as metrics, log entries and traces of single requests, each marked with where and when it came from.
    da: Signaler, som software og maskiner danner, mens de kører, og som sendes til et andet sted for at blive gemt og studeret, oftest som metrikker, logposter og sporinger af enkelte forespørgsler, hver mærket med hvor og hvornår de opstod.
  plain:
    en: Like the readings a hospital monitor sends to the nurses' desk, such as heart rate and oxygen, so nobody has to stand by the bed to know how the patient is.
    da: Som målingerne, en hospitalsmonitor sender til sygeplejerskernes kontor, fx puls og ilt, så ingen behøver stå ved sengen for at vide, hvordan patienten har det.
  inPractice:
    en: Every service behind a ministry's online self-service sends its telemetry through one shared collector, which passes metrics on to the dashboards, logs to the log store and traces to the tracing tool.
    da: Hver tjeneste bag ministeriets selvbetjeningsløsning sender sin telemetri gennem ét fælles samlepunkt, der sender metrikker videre til dashboards, logs til loglageret og sporinger til sporingsværktøjet.
  whyItMatters:
    en: You can only understand, watch or defend a system through the data it gives out; missing or poor telemetry leaves both operators and security teams blind.
    da: Man kan kun forstå, overvåge eller forsvare et system gennem de data, det giver fra sig; manglende eller dårlig telemetri efterlader både driften og sikkerhedsteamet i blinde.
deepDive:
  en: |-
    The word combines the Greek tele (remote) and metron (measure) and originally described instruments that transmitted readings from rockets, aircraft or utility equipment to a ground station. In software it covers any machine-generated signal emitted for later analysis: metrics, logs, traces, profiles, and in security, endpoint and network event streams such as process creation, DNS queries and authentication records. Product or usage telemetry, which reports feature usage and crashes from user devices back to a vendor, is a separate category with its own consent and privacy questions.

    OpenTelemetry has become the reference architecture. Code is instrumented through a language API; the SDK attaches a Resource describing the emitting entity (service.name, service.version, host, Kubernetes pod and namespace attributes) and applies sampling, batching and export. Attribute names follow semantic conventions, so an HTTP status code or database system is named identically across languages and vendors. Data travels over OTLP, a protobuf-based protocol carried over gRPC (default port 4317) or HTTP (default port 4318), usually to an OpenTelemetry Collector.

    The Collector is configured as pipelines per signal type, each composed of receivers (OTLP, Prometheus scrape, filelog, syslog and many others), processors (memory_limiter, batch, attribute redaction, k8sattributes enrichment, tail sampling) and exporters to one or more backends, with connectors joining pipelines, for example to derive span metrics from traces. Common topologies are an agent on every node or as a sidecar, collecting locally with low latency, forwarding to a horizontally scaled gateway tier that centralises credentials, sampling and routing. Designing this path involves backpressure and loss: when a backend is slow, queues fill and data is dropped, so exporters need retry and persistent queues, and the pipeline itself needs monitoring of dropped and refused items.

    Telemetry has security and governance dimensions. It is sensitive data: it often contains IP addresses, user identifiers and occasionally secrets captured in URLs or error messages, so collection should minimise, redact and set retention in line with GDPR, and transport should be encrypted and authenticated, typically with TLS or mTLS between agents and gateways. It is also a target: adversaries disable or tamper with logging and security agents to evade detection, catalogued in MITRE ATT&CK as T1562 Impair Defenses, which is why a sudden silence from a host should itself raise an alert. Finally, telemetry is the raw material and observability the resulting capability; collecting data nobody can query or correlate does not make a system observable.
  da: |-
    Ordet kombinerer det græske tele (fjern) og metron (mål) og betegnede oprindeligt instrumenter, der sendte målinger fra raketter, fly eller forsyningsanlæg til en jordstation. I software dækker det ethvert maskinskabt signal, der udsendes til senere analyse: metrikker, logs, sporinger, profiler og, på sikkerhedsområdet, hændelsesstrømme fra endpoints og netværk som procesoprettelser, DNS-opslag og autentificeringsposter. Produkt- eller brugstelemetri, der rapporterer brug af funktioner og nedbrud fra brugernes enheder tilbage til en leverandør, er en særskilt kategori med sine egne spørgsmål om samtykke og privatliv.

    OpenTelemetry er blevet referencearkitekturen. Koden instrumenteres via et sprog-API; SDK'et tilføjer en Resource, der beskriver den udsendende enhed (service.name, service.version, host samt Kubernetes-attributter for pod og namespace), og står for sampling, batching og eksport. Attributnavne følger semantiske konventioner, så fx en HTTP-statuskode eller et databasesystem navngives ens på tværs af sprog og leverandører. Data sendes via OTLP, en protobuf-baseret protokol over gRPC (standardport 4317) eller HTTP (standardport 4318), som regel til en OpenTelemetry Collector.

    Collectoren konfigureres som pipelines pr. signaltype, hver sammensat af receivers (OTLP, Prometheus-scrape, filelog, syslog og mange andre), processors (memory_limiter, batch, rensning af attributter, berigelse med k8sattributes, tail sampling) og exporters til én eller flere backends, mens connectors forbinder pipelines, fx for at aflede span-metrikker fra sporinger. Typiske topologier er en agent på hver node eller som sidecar, der indsamler lokalt med lav forsinkelse og videresender til et horisontalt skaleret gateway-lag, som samler legitimationsoplysninger, sampling og routing ét sted. Når denne vej designes, skal der tages højde for modtryk og datatab: når en backend er langsom, fyldes køerne, og data smides væk, så exporters skal have genforsøg og persistente køer, og selve pipelinen skal overvåges for tabte og afviste elementer.

    Telemetri har også en sikkerheds- og governance-dimension. Det er følsomme data: de indeholder ofte IP-adresser, bruger-ID'er og af og til hemmeligheder, der er fanget i URL'er eller fejlbeskeder, så indsamlingen bør minimere, rense og fastsætte opbevaringstid i overensstemmelse med databeskyttelsesforordningen, og transporten bør være krypteret og autentificeret, typisk med TLS eller mTLS mellem agenter og gateways. Telemetri er desuden et mål: angribere slår logning og sikkerhedsagenter fra eller manipulerer dem for at undgå opdagelse, katalogiseret i MITRE ATT&CK som T1562 Impair Defenses, og derfor bør pludselig tavshed fra en host i sig selv udløse en alarm. Endelig er telemetri råmaterialet og observerbarhed den evne, der opstår af det; data, som ingen kan forespørge eller korrelere, gør ikke et system observerbart.
edges:
  part-of: [observability]
  requires:
    - log
    - metrics
    - distributed-tracing
  used-with:
    - to: threat-hunting
      why:
        en: Hunters search stored logs and endpoint data for signs the alarms missed; without rich telemetry there is nothing to search.
        da: Trusselsjægere gennemsøger gemte logs og data fra endpoints efter spor, som alarmerne overså; uden detaljeret telemetri er der intet at søge i.
      strength: normal
      confidence: high
