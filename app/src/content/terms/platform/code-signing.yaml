term:
  en: Code signing
  da: Kodesignering
aka:
  en: [software signing]
  da: [softwaresignering]
domain: [platform, security]
cluster: delivery
layer: delivery
status: current
era: 1996
summary:
  en: Adding a digital signature to software so users and systems can check who made it and that nobody changed it afterwards.
  da: At sætte en digital signatur på software, så brugere og systemer kan tjekke, hvem der har lavet den, og at ingen har ændret den bagefter.
body:
  formal:
    en: The publisher computes a hash of a program, update, script or container image and signs it with a private key tied to a digital certificate; before installing or running it, the system checks the signature and certificate and refuses the file on any mismatch.
    da: Udgiveren beregner en hash af et program, en opdatering, et script eller et container-image og signerer den med en privat nøgle knyttet til et digitalt certifikat; før systemet installerer eller kører filen, tjekker det signaturen og certifikatet og afviser filen, hvis noget ikke stemmer.
  plain:
    en: Like the seal on a medicine bottle printed with the maker's name — if the seal is broken or the name is wrong, you do not swallow what is inside.
    da: Som forseglingen på et medicinglas med producentens navn — er forseglingen brudt eller navnet forkert, sluger man ikke indholdet.
  inPractice:
    en: A municipality's IT operations team lets staff computers run only software signed by approved publishers; when a fake “update” arrives by email, Windows refuses to start it because the signature is missing.
    da: En kommunes IT-drift lader kun medarbejdernes computere køre software, der er signeret af godkendte udgivere; da en falsk “opdatering” kommer ind med en mail, nægter Windows at starte den, fordi signaturen mangler.
  whyItMatters:
    en: Attackers often hide malware in updates that look genuine; a signature check stops any file changed after signing, though it cannot help if the signing key itself is stolen.
    da: Angribere gemmer ofte malware i opdateringer, der ser ægte ud; et signaturtjek stopper enhver fil, der er ændret efter signeringen, men hjælper ikke, hvis selve signeringsnøglen bliver stjålet.
edges:
  requires: [digital-signature, digital-certificate]
  part-of: [software-supply-chain]
  mitigates:
    - to: supply-chain-attack
      why:
        en: Software that was changed after it was signed, or signed by the wrong party, fails the check and is not installed.
        da: Software, der er ændret efter signeringen eller signeret af den forkerte part, fejler tjekket og bliver ikke installeret.
      strength: primary
      confidence: high
  used-with:
    - pipeline
    - to: sbom
      why:
        en: An SBOM lists what went into the software; a signature proves the software and its list came from the named maker unchanged.
        da: En SBOM angiver, hvad softwaren består af; en signatur beviser, at softwaren og listen kom uændret fra den nævnte producent.
      strength: normal
      confidence: high
sources:
  - title: NIST — Security Considerations for Code Signing
    url: https://csrc.nist.gov/pubs/cswp/1/final
    tier: standard
    publisher: NIST
  - title: Sigstore documentation
    url: https://docs.sigstore.dev/
    tier: official-doc
    publisher: OpenSSF
