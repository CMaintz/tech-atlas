  used-with:
    - to: soar
      why:
        en: SOAR tools turn the steps of written runbooks into automatic actions that run the moment an alarm arrives.
        da: SOAR-værktøjer gør trinene i skrevne runbooks til automatiske handlinger, der kører, i samme øjeblik en alarm kommer ind.
      strength: primary
      confidence: high
    - soc
