term:
  en: Software supply chain
  da: Softwareforsyningskæde
aka:
  en: []
  da: []
domain: [platform, security]
cluster: delivery
layer: delivery
status: current
summary:
  en: Everything and everyone that goes into making software you run, from outside code parts to the tools that build and ship it.
  da: Alt og alle, der indgår i at lave den software, du kører, fra udefrakommende kodedele til værktøjerne, der bygger og leverer den.
body:
  formal:
    en: The chain of people, code parts from others, build tools, pipelines and delivery routes through which software is written, put together and handed to its users; an attack on any link can reach everyone further down the chain.
    da: Kæden af personer, kodedele fra andre, byggeværktøjer, pipelines og leveringsveje, som software skrives, sættes sammen og overdrages til brugerne igennem; et angreb på ét led kan nå alle længere nede i kæden.
  plain:
    en: Like a food chain from farm to table; if one supplier's flour is poisoned, every bakery that bought it, and every customer, is affected, however clean their own kitchen is.
    da: Som fødevarekæden fra mark til bord; hvis én leverandørs mel er forgiftet, rammes alle bagerier, der har købt det, og alle deres kunder, uanset hvor rent deres eget køkken er.
  inPractice:
    en: Attackers break into a software maker's build system and hide malware inside a normal update, which thousands of customers then install because it comes from a trusted supplier.
    da: Angribere bryder ind i en softwareproducents byggesystem og gemmer malware i en almindelig opdatering, som tusindvis af kunder derefter installerer, fordi den kommer fra en betroet leverandør.
  whyItMatters:
    en: Most software is built mainly from parts written by others, so one weak supplier can open doors into many organisations at once, which is why NIS2 and a new EU law for software products ask firms to manage this risk.
    da: Det meste software bygges hovedsageligt af dele skrevet af andre, så én svag leverandør kan åbne døre ind til mange organisationer på én gang, og derfor kræver NIS2 og en ny EU-lov om softwareprodukter, at virksomheder styrer denne risiko.
edges:
  used-with:
    - supplier-management
sources:
