term:
  en: DORA
  da: DORA-forordningen
aka:
  en: [Digital Operational Resilience Act, Regulation (EU) 2022/2554]
  da: [DORA, forordning (EU) 2022/2554, forordningen om digital operationel modstandsdygtighed]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 2022
summary:
  en: The EU law that makes banks, insurers and other financial firms able to keep running through IT failures and cyber attacks.
  da: EU-forordningen, der skal sikre, at banker, forsikringsselskaber og andre finansielle virksomheder kan klare it-nedbrud og cyberangreb.
body:
  formal:
    en: An EU regulation of 14 December 2022, applying directly in every member state from 17 January 2025, that sets one set of rules for the financial sector on IT risk management, incident reporting, testing, and control of IT suppliers such as cloud providers.
    da: En EU-forordning af 14. december 2022, der gælder direkte i alle medlemslande fra 17. januar 2025, og som giver finanssektoren ét regelsæt for styring af it-risici, indberetning af hændelser, test og kontrol med it-leverandører som fx cloududbydere.
  plain:
    en: Like a fire drill law for banks — not just "have smoke alarms", but prove you can get everyone out, keep the doors open, and tell the fire service what happened.
    da: Som en brandøvelseslov for banker — ikke bare "hav røgalarmer", men bevis, at I kan få alle ud, holde åbent og fortælle brandvæsenet, hvad der skete.
  inPractice:
    en: A Danish pension fund keeps a register of all its IT suppliers, tests its backup site every year, reports a major outage to the Danish financial supervisory authority within hours, and, because it is large, runs a test where hired attackers copy real threat actors against its live systems every three years.
    da: En dansk pensionskasse fører et register over alle sine it-leverandører, tester sit backup-site hvert år, indberetter et større nedbrud til Finanstilsynet inden for få timer og får, fordi den er stor, hvert tredje år lavet en trusselsbaseret penetrationstest af sine produktionssystemer.
  whyItMatters:
    en: Payments, savings and trading now depend almost wholly on IT and a few shared cloud providers, so one failure can spread across the whole financial system; DORA makes firms plan for that and lets supervisors check.
    da: Betalinger, opsparing og handel afhænger nu næsten helt af it og nogle få fælles cloududbydere, så ét nedbrud kan sprede sig i hele det finansielle system; DORA tvinger virksomhederne til at planlægge for det og giver tilsynet mulighed for at kontrollere.
edges:
  mandates:
    - to: incident-reporting
      why:
        en: Article 19 requires major IT incidents to be reported to the financial supervisor in stages — first notice, update and final report.
        da: Artikel 19 kræver, at større it-hændelser indberettes til finanstilsynet i trin — første underretning, opdatering og endelig rapport.
      strength: primary
      confidence: high
    - to: supplier-management
      why:
        en: Articles 28–30 require firms to manage the risk from IT suppliers, keep a register of contracts and put set terms into them.
        da: Artikel 28–30 kræver, at virksomhederne styrer risikoen fra it-leverandører, fører et register over aftaler og indsætter faste vilkår i dem.
      strength: primary
      confidence: high
    - to: penetration-test
      why:
        en: Article 26 requires selected large firms to run threat-led penetration tests on live systems at least every three years.
        da: Artikel 26 kræver, at udvalgte store virksomheder får lavet trusselsbaserede penetrationstest af produktionssystemer mindst hvert tredje år.
      strength: normal
      confidence: high
    - to: business-continuity-plan
      why:
        en: Article 11 requires an IT business continuity policy with plans that are tested regularly.
        da: Artikel 11 kræver en politik for it-forretningskontinuitet med planer, der testes regelmæssigt.
      strength: normal
      confidence: high
    - to: log-retention
      why:
        en: Under the RTS on ICT risk management (Delegated Regulation (EU) 2024/1774, Art. 12), financial entities must set and document how long logs are kept, based on their risk assessment.
        da: Efter RTS'en om IKT-risikostyring (delegeret forordning (EU) 2024/1774, art. 12) skal finansielle enheder fastsætte og dokumentere, hvor længe logs gemmes, ud fra deres risikovurdering.
      strength: normal
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: NIS2 covers many sectors; DORA is the stricter, more detailed rulebook for finance, and where both apply to a financial firm, DORA's rules take the lead.
        da: NIS2 dækker mange sektorer; DORA er det skrappere og mere detaljerede regelsæt for finanssektoren, og hvor begge gælder for en finansiel virksomhed, går DORA forud.
      strength: primary
      confidence: high
  kind-of: [eu-regulation]
sources:
