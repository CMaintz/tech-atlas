term:
  en: DORA
  da: DORA-forordningen
aka:
  en: [Digital Operational Resilience Act, Regulation (EU) 2022/2554]
  da: [DORA, forordning (EU) 2022/2554, forordningen om digital operationel modstandsdygtighed]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 2022
summary:
  en: The EU law that makes banks, insurers and other financial firms able to keep running through IT failures and cyber attacks.
  da: EU-forordningen, der skal sikre, at banker, forsikringsselskaber og andre finansielle virksomheder kan klare IT-nedbrud og cyberangreb.
body:
  formal:
    en: An EU regulation of 14 December 2022, applying directly in every member state from 17 January 2025, that sets one set of rules for the financial sector on IT risk management, incident reporting, testing, and control of IT suppliers such as cloud providers.
    da: En EU-forordning af 14. december 2022, der gælder direkte i alle medlemslande fra 17. januar 2025, og som giver finanssektoren ét regelsæt for styring af IT-risici, indberetning af hændelser, test og kontrol med IT-leverandører som fx cloududbydere.
  plain:
    en: Like fire rules that ask a bank not just to hang smoke alarms, but to prove in a drill that it can get everyone out, keep serving customers and tell the fire service what happened.
    da: Som brandregler, der ikke bare kræver røgalarmer i banken, men at den ved en øvelse beviser, at den kan få alle ud, blive ved med at betjene kunderne og fortælle brandvæsenet, hvad der skete.
  inPractice:
    en: The IT risk manager at a Danish pension fund keeps a register of every IT supplier contract, tests switching over to the backup site each year and, after a major outage, sends the first report to the Danish financial supervisor within hours.
    da: Den IT-risikoansvarlige i en dansk pensionskasse fører et register over alle aftaler med IT-leverandører, tester hvert år skiftet til backup-sitet og sender efter et større nedbrud den første indberetning til Finanstilsynet inden for få timer.
  whyItMatters:
    en: Payments, savings and trading now depend almost wholly on IT and a few shared cloud providers, so one failure can spread across the whole financial system; DORA makes firms plan for that and lets supervisors check.
    da: Betalinger, opsparing og handel afhænger nu næsten helt af IT og nogle få fælles cloududbydere, så ét nedbrud kan sprede sig i hele det finansielle system; DORA tvinger virksomhederne til at planlægge for det og giver tilsynet mulighed for at kontrollere.
deepDive:
  en: |-
    Regulation (EU) 2022/2554 covers some twenty categories of financial entity listed in Art. 2, from credit institutions, investment firms and insurers to payment and e-money institutions, crypto-asset service providers, trading venues and central counterparties, and is accompanied by an amending directive (EU) 2022/2556 that aligns sectoral directives. Most of the operational detail sits in level-2 acts: Commission Delegated Regulation (EU) 2024/1774 on the ICT risk-management framework (including logging and log retention), 2024/1772 on incident classification criteria, 2025/301 on the content and timing of incident reports, and implementing standards for the register of information. Proportionality is built in via Art. 4, and Art. 16 gives small and non-interconnected entities a simplified risk-management framework; microenterprises are relieved of several requirements.

    The regulation has five pillars. ICT risk management (Arts. 5-16) makes the management body ultimately responsible (Art. 5(2)) and requires an ICT risk-management framework covering identification of assets and dependencies, protection, detection, response and recovery, backup and restoration, and learning. Incident management (Arts. 17-23) requires classification of ICT-related incidents against quantitative and qualitative criteria (clients affected, duration, geographic spread, data losses, criticality of services, economic impact); for a major incident, the initial notification is due within four hours of classifying it as major and no later than 24 hours after becoming aware, the intermediate report within 72 hours of the initial notification, and the final report within one month of the latest intermediate report. Digital operational resilience testing (Arts. 24-27) requires a risk-based testing programme with at least yearly testing of critical systems, and threat-led penetration testing (TLPT) on live production systems at least every three years for entities selected by the competent authority, modelled on the TIBER-EU framework.

    ICT third-party risk (Arts. 28-30) requires a register of information on all contractual arrangements with ICT providers, pre-contract due diligence, exit strategies, and the mandatory contract clauses in Art. 30, which are stricter for services supporting critical or important functions. The oversight framework (Arts. 31-44) lets the European Supervisory Authorities designate critical ICT third-party providers and oversee them through a Lead Overseer; the first list of 19 providers, including major hyperscalers, was published on 18 November 2025 and is to be updated yearly. The fifth pillar, Art. 45, allows voluntary cyber threat information sharing.

    DORA is lex specialis to NIS2 for financial entities, and NIS2 Art. 4 defers to it, so a Danish bank reports major ICT incidents to Finanstilsynet under DORA rather than following NIS2 Art. 23 timelines. A common misreading is that DORA applies to cloud providers directly: it binds the financial entity, and only designated CTPPs are reached through ESA oversight; other suppliers are affected indirectly through the contract terms their customers must impose.
  da: |-
    Forordning (EU) 2022/2554 omfatter omkring tyve kategorier af finansielle enheder opregnet i art. 2, fra kreditinstitutter, investeringsselskaber og forsikringsselskaber til betalings- og e-pengeinstitutter, udbydere af kryptoaktivtjenester, markedspladser og centrale modparter, og den ledsages af et ændringsdirektiv (EU) 2022/2556, der tilpasser sektordirektiverne. Det meste af den operationelle detalje ligger i niveau 2-retsakter: Kommissionens delegerede forordning (EU) 2024/1774 om rammen for IKT-risikostyring (herunder logning og opbevaring af logs), 2024/1772 om kriterier for klassificering af hændelser, 2025/301 om indhold og frister for hændelsesrapporter samt gennemførelsesstandarder for informationsregistret. Proportionalitet er indbygget via art. 4, og art. 16 giver små og ikke-forbundne enheder en forenklet risikostyringsramme; mikrovirksomheder er fritaget for flere krav.

    Forordningen har fem søjler. IKT-risikostyring (art. 5-16) gør ledelsesorganet endeligt ansvarligt (art. 5, stk. 2) og kræver en ramme, der dækker identifikation af aktiver og afhængigheder, beskyttelse, detektion, reaktion og genopretning, backup og gendannelse samt læring. Hændelseshåndtering (art. 17-23) kræver, at IKT-relaterede hændelser klassificeres efter kvantitative og kvalitative kriterier (berørte kunder, varighed, geografisk udbredelse, datatab, tjenesternes kritikalitet og økonomisk påvirkning); ved en større hændelse skal den første underretning sendes inden for fire timer efter klassificeringen som større og senest 24 timer efter kendskab, mellemrapporten inden for 72 timer efter den første underretning og den endelige rapport senest en måned efter den seneste mellemrapport. Test af digital operationel modstandsdygtighed (art. 24-27) kræver et risikobaseret testprogram med mindst årlig test af kritiske systemer og trusselsbaseret penetrationstest (TLPT) af produktionssystemer mindst hvert tredje år for enheder, som tilsynet udvælger, efter model af TIBER-EU.

    Tredjepartsrisiko på IKT-området (art. 28-30) kræver et informationsregister over alle aftaler med IKT-leverandører, due diligence før aftaleindgåelse, exitstrategier og de obligatoriske kontraktvilkår i art. 30, som er skrappere for tjenester, der understøtter kritiske eller vigtige funktioner. Tilsynsrammen (art. 31-44) lader de europæiske tilsynsmyndigheder (ESA'erne) udpege kritiske tredjepartsudbydere af IKT-tjenester og føre tilsyn med dem via en ledende tilsynsførende; den første liste med 19 udbydere, herunder de store hyperscalere, blev offentliggjort 18. november 2025 og opdateres årligt. Den femte søjle, art. 45, giver mulighed for frivillig deling af trusselsoplysninger.

    DORA er lex specialis i forhold til NIS2 for finansielle enheder, og NIS2 art. 4 viger for den, så en dansk bank indberetter større IKT-hændelser til Finanstilsynet efter DORA frem for NIS2's frister i art. 23. En udbredt misforståelse er, at DORA gælder direkte for cloududbydere: den binder den finansielle enhed, og kun udpegede kritiske udbydere nås via ESA'ernes tilsyn; andre leverandører påvirkes indirekte gennem de kontraktvilkår, kunderne skal stille.
howTo:
  steps:
    en:
      - Check on Finanstilsynet's list whether you are one of the financial entity types in Art. 2, and whether you qualify for the simplified ICT risk-management framework in Art. 16 or the lighter rules for microenterprises.
      - Have the management body approve and own the ICT risk-management framework (Art. 5), set roles and budget, and keep its members' knowledge of ICT risk up to date.
      - Build the framework under Arts. 6-16 and Delegated Regulation (EU) 2024/1774 - map ICT assets and dependencies, protect and detect, set up backup and restoration, and write an ICT business continuity policy with plans that are tested (Art. 11).
      - Set up incident management (Art. 17) that logs every ICT-related incident, classifies it under Delegated Regulation (EU) 2024/1772, and names who decides that an incident is major.
      - For a major incident, send the initial notification to Finanstilsynet through Virk.dk within four hours of classifying it as major and no later than 24 hours after becoming aware of it, then an intermediate report within 72 hours and a final report within one month of the last intermediate report (Art. 19).
      - Keep a register of information on all contracts with ICT third-party providers (Art. 28), do due diligence before signing, put the Art. 30 clauses into the contracts, and keep exit strategies for services that support critical or important functions.
      - Run a risk-based testing programme that tests systems supporting critical or important functions at least yearly (Art. 24), and prepare for threat-led penetration testing every three years if Finanstilsynet selects you (Art. 26).
      - Review the framework at least yearly and after major incidents or supervisory findings, keep the register current for Finanstilsynet, and report the results to the management body.
    da:
      - Tjek på Finanstilsynets liste, om I er en af de typer finansielle enheder, der står i art. 2, og om I kan bruge den forenklede ramme for IKT-risikostyring i art. 16 eller de lettere regler for mikrovirksomheder.
      - Få ledelsesorganet til at godkende og eje rammen for IKT-risikostyring (art. 5), fastlæg roller og budget, og sørg for, at medlemmerne holder deres viden om IKT-risici ajour.
      - Byg rammen efter art. 6-16 og delegeret forordning (EU) 2024/1774 - kortlæg IKT-aktiver og afhængigheder, beskyt og detektér, indfør backup og gendannelse, og skriv en politik for IKT-forretningskontinuitet med planer, der bliver testet (art. 11).
      - Indfør hændelseshåndtering (art. 17), der registrerer alle IKT-relaterede hændelser, klassificerer dem efter delegeret forordning (EU) 2024/1772 og fastlægger, hvem der afgør, at en hændelse er større.
      - Send ved en større hændelse den første underretning til Finanstilsynet via Virk.dk inden for fire timer efter klassificeringen som større og senest 24 timer efter, at I fik kendskab til den, derefter en mellemrapport inden for 72 timer og en endelig rapport senest en måned efter den seneste mellemrapport (art. 19).
      - Før et informationsregister over alle aftaler med tredjepartsudbydere af IKT-tjenester (art. 28), lav due diligence før aftaleindgåelse, skriv vilkårene i art. 30 ind i kontrakterne, og hav exitstrategier for tjenester, der understøtter kritiske eller vigtige funktioner.
      - Kør et risikobaseret testprogram, der mindst en gang om året tester systemer, som understøtter kritiske eller vigtige funktioner (art. 24), og forbered jer på trusselsbaseret penetrationstest hvert tredje år, hvis Finanstilsynet udvælger jer (art. 26).
      - Gennemgå rammen mindst en gang om året og efter større hændelser eller tilsynsfund, hold registret opdateret til Finanstilsynet, og rapportér resultatet til ledelsesorganet.
  pitfalls:
    en:
      - Reporting a major incident under NIS2 deadlines or to the wrong authority, when DORA takes precedence for financial entities and reports go to Finanstilsynet.
      - Assuming the cloud provider carries the DORA duties, when the financial entity must impose the contract terms and keep its own exit plan.
      - Losing the four-hour window in internal debate, because no classification procedure or on-call decision maker was agreed in advance.
      - Keeping the register of information as a one-off spreadsheet that drifts out of date as contracts and subcontractors change.
    da:
      - At indberette en større hændelse efter NIS2-fristerne eller til den forkerte myndighed, selv om DORA går forud for finansielle enheder, og indberetningen skal til Finanstilsynet.
      - At gå ud fra, at cloududbyderen bærer DORA-pligterne, selv om det er den finansielle enhed, der skal stille kontraktvilkårene og have sin egen exitplan.
      - At miste firetimersfristen i intern diskussion, fordi der ikke på forhånd var aftalt en klassificeringsprocedure eller en beslutningstager på vagt.
      - At føre informationsregistret som et engangsregneark, der bliver forældet, efterhånden som aftaler og underleverandører skifter.
