term:
  en: Certification
  da: Certificering
aka:
  en: [ISO 27001 certification]
  da: [ISO 27001-certificering]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: Formal proof from an approved outside body that an organisation's security meets a published standard such as ISO 27001.
  da: Formelt bevis fra et godkendt eksternt organ på, at en organisations sikkerhed lever op til en offentlig standard som ISO 27001.
body:
  formal:
    en: A certificate issued by an officially approved body after an outside audit shows that an ISMS meets every requirement of ISO 27001; it is valid for three years with yearly follow-up audits. ISO 27002 is guidance only and cannot be certified against.
    da: Et certifikat, som et akkrediteret organ udsteder, efter at en ekstern audit har vist, at et ISMS opfylder alle krav i ISO 27001; det gælder i tre år med årlige opfølgende audits. ISO 27002 er kun vejledning og kan ikke certificeres imod.
  plain:
    en: Like a driving test — you may be a careful driver already, but only the examiner's pass gives you a licence that others will trust.
    da: Som en køreprøve — du kan godt allerede være en forsigtig bilist, men først en bestået prøve giver dig et kørekort, som andre stoler på.
  inPractice:
    en: To win a contract with a large bank, a hosting firm spends a year building its ISMS, passes a two-stage audit by an approved body and shows the certificate in its bid.
    da: For at vinde en kontrakt med en stor bank bruger en hostingvirksomhed et år på at opbygge sit ISMS, består en audit i to trin hos et akkrediteret organ og vedlægger certifikatet i sit tilbud.
  whyItMatters:
    en: Customers cannot check every supplier themselves; a trusted certificate saves them the work, though it proves a working system, not that no breach can happen.
    da: Kunder kan ikke selv tjekke hver leverandør; et troværdigt certifikat sparer dem for arbejdet, men det beviser et fungerende system, ikke at brud er umulige.
edges:
  requires: [isms, security/audit]
  contrasts-with:
    - to: compliance
      why:
        en: Compliance means following the rules; certification is an outside body's formal statement that a standard is met at a point in time.
        da: Compliance betyder at følge reglerne; certificering er et eksternt organs formelle erklæring om, at en standard er opfyldt på et bestemt tidspunkt.
      strength: normal
      confidence: high
  used-with:
    - to: iso-27001
      why:
        en: ISO 27001 is the standard organisations are certified against for information security.
        da: ISO 27001 er den standard, organisationer certificeres efter inden for informationssikkerhed.
      strength: primary
      confidence: high
sources:
  - title: ISO/IEC 27001:2022 — Information security management systems — Requirements
    tier: standard
    publisher: ISO/IEC
  - title: ISO/IEC 27006-1:2024 — Requirements for bodies providing audit and certification of ISMS
    tier: standard
    publisher: ISO/IEC
draft: true
