term:
  en: Certification
  da: Certificering
aka:
  en: [ISO 27001 certification]
  da: [ISO 27001-certificering]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: Formal proof from an approved outside body that an organisation's security meets a published standard such as ISO 27001.
  da: Formelt bevis fra et godkendt eksternt organ på, at en organisations sikkerhed lever op til en offentlig standard som ISO 27001.
body:
  formal:
    en: A certificate issued by an officially approved certification body after an outside audit in two stages shows that an ISMS meets every requirement of ISO 27001; it runs for three years, kept alive by yearly follow-up audits. ISO 27002 is guidance only and cannot be certified against.
    da: Et certifikat, som et officielt godkendt certificeringsorgan udsteder, når en ekstern audit i to trin har vist, at et ISMS opfylder alle krav i ISO 27001; det gælder i tre år og holdes ved lige med audits hvert år. ISO 27002 er kun vejledning og kan ikke bruges til certificering.
  plain:
    en: Like a driving test — you may already drive carefully, but only the examiner's pass gives you a licence that strangers will trust.
    da: Som en køreprøve — du kan sagtens køre forsigtigt i forvejen, men først den beståede prøve giver dig et kørekort, som fremmede stoler på.
  inPractice:
    en: Several municipalities require ISO 27001 certification in a tender for hosting their case systems, so a Danish hosting company books a certification body, passes both audit stages and attaches the certificate to its bid.
    da: Flere kommuner kræver ISO 27001-certificering i et udbud om drift af deres sagssystemer, så en dansk hostingvirksomhed bestiller et certificeringsorgan, består begge audit-trin og sender certifikatet med sit tilbud.
  whyItMatters:
    en: Customers cannot inspect every supplier themselves, so they rely on the certificate — but it proves that a working system exists, not that a breach cannot happen.
    da: Kunder kan ikke selv undersøge hver leverandør og læner sig derfor op ad certifikatet — men det beviser, at der findes et fungerende system, ikke at et brud er umuligt.
edges:
  requires: [isms, security/audit]
  contrasts-with:
    - to: compliance
      why:
        en: Compliance means following the rules; certification is an outside body's formal statement that a standard is met at a point in time.
        da: Compliance betyder at følge reglerne; certificering er et eksternt organs formelle erklæring om, at en standard er opfyldt på et bestemt tidspunkt.
      strength: normal
      confidence: high
  used-with:
    - to: iso-27001
      why:
        en: ISO 27001 is the standard organisations are certified against for information security.
        da: ISO 27001 er den standard, organisationer får certificering efter inden for informationssikkerhed.
      strength: primary
      confidence: high
sources:
  - title: ISO/IEC 27001:2022 — Information security management systems — Requirements
    tier: standard
    publisher: ISO/IEC
  - title: ISO/IEC 27006-1:2024 — Requirements for bodies providing audit and certification of ISMS
    tier: standard
    publisher: ISO/IEC
