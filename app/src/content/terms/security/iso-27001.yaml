term:
  en: ISO 27001
  da: ISO 27001
aka:
  en: [ISO/IEC 27001, ISMS standard]
  da: [ISO/IEC 27001]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 2005
summary:
  en: The international standard for running an information security management system that can be certified.
  da: Den internationale standard for at drive et ledelsessystem for informationssikkerhed, som man kan opnå certificering efter.
body:
  formal:
    en: An international standard, current edition 2022, whose clauses 4–10 set the requirements for an information security management system — context, leadership, planning, support, operation, performance evaluation and improvement — with Annex A listing 93 controls to choose from.
    da: En international standard, nuværende udgave fra 2022, hvis afsnit 4–10 stiller kravene til et ledelsessystem for informationssikkerhed — kontekst, ledelse, planlægning, støtte, drift, evaluering og forbedring — mens anneks A rummer 93 kontroller at vælge imellem.
  plain:
    en: A set of house rules for running security as a daily routine rather than a one-off clean-up — written so that an outside inspector can check it is really followed.
    da: En husorden for at drive sikkerhed som fast rutine frem for en engangsoprydning — skrevet, så en udefrakommende kan kontrollere, at den faktisk bliver fulgt.
  inPractice:
    en: Danish state bodies must follow ISO 27001, so the security lead at a ministry uses its clauses to set the scope, run the risk assessment, pick controls from Annex A and report maturity each year — without seeking a certificate.
    da: Danske statslige myndigheder skal følge ISO 27001, så den sikkerhedsansvarlige i et ministerium bruger standarden til at fastlægge omfanget, lave risikoanalysen, vælge kontroller fra anneks A og indberette modenhed hvert år — uden at søge om certifikat.
  whyItMatters:
    en: Without a common measure every customer, auditor and authority would ask for security to be shown in a different way; ISO 27001 gives one structure that can be recognised, audited and mapped to laws such as NIS2.
    da: Uden en fælles målestok ville hver kunde, revisor og myndighed kræve sikkerheden dokumenteret på sin egen måde; ISO 27001 giver én struktur, der kan genkendes, auditeres og kobles til love som NIS2.
edges:
  kind-of: [security-framework]
  mandates:
    - to: risk-management
      why:
        en: Controls must be chosen from a documented risk assessment and treatment plan.
        da: Kontroller skal vælges ud fra en dokumenteret risikovurdering og plan for risikohåndtering.
      strength: primary
      confidence: high
    - to: pdca
      why:
        en: The system must be reviewed and improved in a repeating cycle.
        da: Systemet skal evalueres og forbedres i en tilbagevendende cyklus.
      strength: primary
      confidence: high
    - to: security/audit
      why:
        en: Clause 9.2 requires planned internal audits of the management system.
        da: Afsnit 9.2 kræver planlagte interne audits af ledelsessystemet.
      strength: normal
      confidence: high
    - to: management-responsibility
      strength: normal
      confidence: high
    - to: security-policy
      strength: normal
      confidence: high
    - isms
    - statement-of-applicability
  used-with:
    - to: iso-27002
      why:
        en: ISO 27002 explains how to carry out the controls listed in ISO 27001's annex.
        da: ISO 27002 forklarer, hvordan kontrollerne i ISO 27001's anneks udføres.
      strength: primary
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: NIS2 is a law you must obey; ISO 27001 is a voluntary standard you can use to meet it.
        da: NIS2 er en lov, man skal overholde; ISO 27001 er en frivillig standard, man kan bruge til at opfylde den.
      strength: normal
      confidence: high
    - to: nist-csf
      why:
        en: ISO 27001 is a management system a firm can be certified against; the NIST CSF is a free, voluntary framework of outcomes with no certificate.
        da: ISO 27001 er et ledelsessystem, man kan opnå certificering efter; NIST CSF er et gratis, frivilligt rammeværk af mål uden certifikat.
      strength: normal
      confidence: high
  part-of: [iso-27000-series]
