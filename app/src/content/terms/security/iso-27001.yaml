term:
  en: ISO 27001
  da: ISO 27001
aka:
  en: [ISO/IEC 27001, ISMS standard]
  da: [ISO/IEC 27001]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: The international standard for running an information security management system that can be certified.
  da: Den internationale standard for at drive et ledelsessystem for informationssikkerhed, som kan certificeres.
body:
  formal:
    en: A standard (current edition 2022) that sets requirements for an information security management system — context, leadership, risk assessment, operation, review and improvement — plus an annex of 93 controls to choose from.
    da: En standard (nuværende udgave fra 2022), der stiller krav til et ledelsessystem for informationssikkerhed — kontekst, ledelse, risikovurdering, drift, evaluering og forbedring — samt et anneks med 93 kontroller at vælge imellem.
  plain:
    en: A recipe for how to run security as a routine, not a one-off — and an outside inspector can check that you follow it.
    da: En opskrift på at drive sikkerhed som en fast rutine frem for en engangsindsats — og en ekstern inspektør kan kontrollere, at man følger den.
  inPractice:
    en: A software house spends a year setting up its risk process and policies, passes an external audit and shows the certificate to win a bank as customer.
    da: Et softwarehus bruger et år på at etablere sin risikoproces og sine politikker, består en ekstern audit og viser certifikatet frem for at vinde en bank som kunde.
  whyItMatters:
    en: It is voluntary, but it gives a proven structure for meeting laws such as NIS2 and a certificate customers trust.
    da: Den er frivillig, men giver en afprøvet struktur til at opfylde love som NIS2 og et certifikat, som kunder har tillid til.
edges:
  kind-of: [security-framework]
  mandates:
    - to: risk-management
      why:
        en: Controls must be chosen from a documented risk assessment and treatment plan.
        da: Kontroller skal vælges ud fra en dokumenteret risikovurdering og plan for risikohåndtering.
      strength: primary
      confidence: high
    - to: pdca
      why:
        en: The system must be reviewed and improved in a repeating cycle.
        da: Systemet skal evalueres og forbedres i en tilbagevendende cyklus.
      strength: primary
      confidence: high
    - to: security/audit
      why:
        en: Clause 9.2 requires planned internal audits of the management system.
        da: Afsnit 9.2 kræver planlagte interne audits af ledelsessystemet.
      strength: normal
      confidence: high
    - to: management-responsibility
      strength: normal
      confidence: high
    - to: security-policy
      strength: normal
      confidence: high
    - isms
    - statement-of-applicability
  used-with:
    - to: iso-27002
      why:
        en: ISO 27002 explains how to carry out the controls listed in ISO 27001's annex.
        da: ISO 27002 forklarer, hvordan kontrollerne i ISO 27001's anneks udføres.
      strength: primary
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: NIS2 is a law you must obey; ISO 27001 is a voluntary standard you can use to meet it.
        da: NIS2 er en lov, man skal overholde; ISO 27001 er en frivillig standard, man kan bruge til at opfylde den.
      strength: normal
      confidence: high
