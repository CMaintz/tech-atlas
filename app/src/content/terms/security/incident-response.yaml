term:
  en: Incident response
  da: Hændelseshåndtering
aka:
  en: [incident handling, incident management]
  da: [incident response]
domain: [security]
cluster: incident-response
layer: governance
status: current
era: 1988
summary:
  en: The organised way a company spots, stops and cleans up after a security attack or accident, then gets back to normal.
  da: Den organiserede måde, en virksomhed opdager, stopper og rydder op efter et sikkerhedsangreb eller uheld og vender tilbage til normal drift.
body:
  formal:
    en: A prepared cycle of phases - preparation, detection and analysis, containment, removal of the cause, recovery, and review afterwards - carried out by named people with agreed authority when a security incident occurs.
    da: Et forberedt forløb i faser - forberedelse, opdagelse og analyse, inddæmning, fjernelse af årsagen, genopretning og efterfølgende evaluering - som udføres af navngivne personer med aftalte beføjelser, når en sikkerhedshændelse indtræffer.
  plain:
    en: Like a fire drill that turns into the real thing - everyone knows who calls for help, who closes the doors and who counts heads.
    da: Ligesom en brandøvelse, der bliver til virkelighed - alle ved, hvem der ringer efter hjælp, hvem der lukker dørene, og hvem der tæller, om alle er kommet ud.
  inPractice:
    en: At three in the morning the SIEM at a municipality flags a strange login; the on-call technician locks the account, cuts the laptop off the network and calls the incident lead.
    da: Klokken tre om natten slår en kommunes SIEM alarm over et mærkeligt login; den vagthavende tekniker spærrer kontoen, kobler den bærbare fra netværket og ringer til den ansvarlige for hændelsen.
  whyItMatters:
    en: Minutes count during an attack, and a team that improvises loses time, evidence and money that a prepared team keeps.
    da: Minutter tæller under et angreb, og et team, der improviserer, mister tid, spor og penge, som et forberedt team bevarer.
deepDive:
  en: |-
    The discipline dates from the Morris worm of November 1988, after which DARPA funded the CERT Coordination Center at Carnegie Mellon; FIRST, the global forum of response teams, followed in 1990. For two decades the dominant process model has been the NIST SP 800-61 lifecycle, whose Revision 2 (2012) describes four phases: preparation; detection and analysis; containment, eradication and recovery; and post-incident activity. Revision 3 (April 2025) retired that lifecycle and instead maps incident response onto the six Functions of the NIST Cybersecurity Framework 2.0 (Govern, Identify, Protect, Detect, Respond, Recover), treating preparation and improvement as continuous rather than as phases. The SANS six-step model (preparation, identification, containment, eradication, recovery, lessons learned) splits the same work differently. ISO/IEC 27035-1:2023 frames it as plan and prepare, detect and report, assess and decide, respond, and learn lessons.

    NIST SP 800-61 Revision 3, finalised in April 2025, withdrew Revision 2 and re-expressed incident response through the six functions of the Cybersecurity Framework 2.0. Govern, Identify and Protect cover the preparation that makes response possible; Detect covers finding and analysing adverse events; Respond covers incident management, analysis, reporting and communication, and mitigation; and Recover covers restoration and recovery communication. The change reflects the view that incident response is an organisation-wide capability tied to risk management rather than a separate team's process, and that lessons learned should feed improvement continuously, not only at the end.

    Technically, detection and analysis rely on correlated telemetry from SIEM, EDR, identity provider and network logs, triage against a severity scheme, and scoping by searching for indicators of compromise and attacker techniques across the estate. Evidence is collected in order of volatility, as described in RFC 3227 (memory, network state and running processes before disk), with hashes and a chain of custody if legal action is possible. Containment choices are trade-offs: isolating a host with EDR keeps it available for forensics, while pulling the power destroys memory; resetting a compromised account before understanding the attacker's persistence can alert them and trigger destructive action. Eradication must remove every foothold, including scheduled tasks, web shells, new accounts, OAuth grants and, after domain compromise, the krbtgt key, which is reset twice.

    Incident response is distinct from its neighbours. Crisis management is the leadership layer that makes business decisions around the incident, business continuity keeps operations running meanwhile, and disaster recovery restores technology after large-scale loss. Incident reporting to authorities under NIS2, GDPR or DORA is one of the obligations handled within incident response. In practice many Danish organisations rely on an external incident response retainer, whose activation procedure, contact details and pre-agreed access must be part of the preparation.
  da: |-
    Disciplinen går tilbage til Morris-ormen i november 1988, hvorefter DARPA finansierede CERT Coordination Center ved Carnegie Mellon; FIRST, det globale forum for responsteams, fulgte i 1990. I to årtier har den dominerende procesmodel været livscyklussen i NIST SP 800-61, hvis Revision 2 (2012) beskriver fire faser: forberedelse; opdagelse og analyse; inddæmning, fjernelse og genopretning; og aktiviteter efter hændelsen. Revision 3 (april 2025) opgav den livscyklus og knytter i stedet hændelseshåndtering til de seks funktioner i NIST Cybersecurity Framework 2.0 (Govern, Identify, Protect, Detect, Respond, Recover), så forberedelse og forbedring ses som løbende arbejde frem for faser. SANS' model i seks trin (preparation, identification, containment, eradication, recovery, lessons learned) deler det samme arbejde op på en anden måde. ISO/IEC 27035-1:2023 beskriver det som planlægning og forberedelse, opdagelse og rapportering, vurdering og beslutning, respons og erfaringsopsamling.

    NIST SP 800-61 Revision 3, der blev endelig i april 2025, trak Revision 2 tilbage og udtrykker nu hændelseshåndtering gennem de seks funktioner i Cybersecurity Framework 2.0. Govern, Identify og Protect dækker den forberedelse, der gør respons mulig; Detect dækker at finde og analysere uønskede hændelser; Respond dækker hændelsesstyring, analyse, rapportering og kommunikation samt afhjælpning; og Recover dækker genopretning og kommunikation om genopretningen. Ændringen afspejler synet på hændelseshåndtering som en kapabilitet i hele organisationen, knyttet til risikostyring, frem for et enkelt teams proces, og at erfaringer skal føde forbedringer løbende, ikke kun til sidst.

    Teknisk bygger opdagelse og analyse på korreleret telemetri fra SIEM, EDR, identitetsudbyderen og netværkslogs, triage efter en alvorlighedsskala og afgrænsning ved at søge efter kompromitteringsindikatorer og angriberteknikker i hele miljøet. Beviser indsamles i rækkefølge efter flygtighed som beskrevet i RFC 3227 (hukommelse, netværkstilstand og kørende processer før disk), med hashværdier og en dokumenteret kæde for håndtering af beviser, hvis retsforfølgning er mulig. Valg af inddæmning er afvejninger: at isolere en maskine med EDR bevarer den til forensisk analyse, mens at trække strømmen sletter hukommelsen; at nulstille en kompromitteret konto, før man forstår angriberens fodfæste, kan advare angriberen og udløse ødelæggende handlinger. Fjernelsen skal omfatte ethvert fodfæste, herunder planlagte opgaver, web shells, nye konti, OAuth-samtykker og efter kompromittering af domænet krbtgt-nøglen, der nulstilles to gange.

    Hændelseshåndtering adskiller sig fra sine naboer. Krisestyring er ledelseslaget, der træffer forretningsbeslutninger omkring hændelsen, driftskontinuitet holder driften i gang imens, og disaster recovery genopretter teknikken efter omfattende tab. Indberetning til myndigheder efter NIS2, databeskyttelsesforordningen eller DORA er en af de forpligtelser, der håndteres inden for hændelseshåndteringen. I praksis bruger mange danske organisationer en ekstern incident response-leverandør på retainer, og aktiveringsproceduren, kontaktoplysningerne og den forhåndsaftalte adgang skal være en del af forberedelsen.
howTo:
  steps:
    en:
      - Get management to approve an incident response policy that defines what counts as an incident, the severity levels and who may decide to isolate systems or shut services down.
      - Name an incident lead, deputies and a core team from IT, security, legal, communications and management, and keep an offline contact list that includes your external IR retainer and the police.
      - Prepare playbooks for the likeliest scenarios, such as ransomware, a compromised account and a data leak, and make sure logs from SIEM, EDR and identity systems are kept long enough to investigate.
      - When an alert comes in, triage it against the severity scale, open an incident record and keep a timestamped log of every observation, decision and action from the first minute.
      - Contain the attack by isolating affected hosts and accounts, and secure logs, memory and disk images before anything is wiped or reinstalled.
      - Check reporting duties early and give one person the job - an NIS2 early warning within 24 hours of becoming aware of a significant incident, and a GDPR notification to Datatilsynet within 72 hours if personal data is hit.
      - Remove every foothold the attacker left, restore from clean backups, reset credentials and monitor closely before declaring a return to normal operation.
      - Hold a lessons-learned review within a few weeks, turn the findings into actions with owners and deadlines, and update the plan and playbooks.
      - Test the plan at least once a year with a table-top exercise, and again after major changes in systems, suppliers or organisation.
    da:
      - Få ledelsen til at godkende en politik for hændelseshåndtering, der fastlægger, hvad der er en hændelse, hvilke alvorlighedsniveauer der findes, og hvem der må beslutte at isolere systemer eller lukke tjenester.
      - Udpeg en hændelsesansvarlig, stedfortrædere og et kerneteam fra IT, sikkerhed, jura, kommunikation og ledelse, og hav en offline kontaktliste med jeres eksterne incident response-leverandør og politiet.
      - Lav playbooks for de mest sandsynlige scenarier som ransomware, en kompromitteret konto og et datalæk, og sørg for, at logs fra SIEM, EDR og identitetssystemer gemmes længe nok til en undersøgelse.
      - Når en alarm kommer ind, så vurdér den efter alvorlighedsskalaen, opret en hændelsessag og før en tidsstemplet log over alle observationer, beslutninger og handlinger fra første minut.
      - Inddæm angrebet ved at isolere ramte maskiner og konti, og sikr logs, hukommelse og diskimages, før noget slettes eller geninstalleres.
      - Afklar tidligt, hvad der skal indberettes, og giv én person opgaven - tidlig varsling efter NIS2 inden 24 timer, efter at I er blevet bekendt med en væsentlig hændelse, og anmeldelse til Datatilsynet inden 72 timer, hvis personoplysninger er ramt.
      - Fjern alle angriberens fodfæster, gendan fra rene backups, nulstil adgangsoplysninger og overvåg tæt, før I erklærer, at driften er normal igen.
      - Hold en evaluering inden for få uger, gør erfaringerne til handlinger med ansvarlige og frister, og opdatér planen og playbooks.
      - Afprøv planen mindst én gang om året med en table-top-øvelse og igen efter større ændringer i systemer, leverandører eller organisation.
  pitfalls:
    en:
      - Keeping the plan only on the network drive or in email, so it disappears together with everything else when ransomware hits.
      - Wiping and reinstalling infected machines before logs and evidence are secured, so the cause and scope can never be established.
      - Resetting passwords or blocking the attacker before the full scope is known, which tips them off and leaves backdoors in place.
      - Losing track of the reporting deadlines to authorities in the middle of the technical work.
    da:
      - At have planen liggende kun på netværksdrevet eller i mailen, så den forsvinder sammen med alt det andet, når ransomware rammer.
      - At slette og geninstallere ramte maskiner, før logs og beviser er sikret, så årsagen og omfanget aldrig kan fastlægges.
      - At nulstille adgangskoder eller blokere angriberen, før det fulde omfang er kendt, så angriberen bliver advaret og bagdøre bliver stående.
      - At miste overblikket over fristerne for indberetning til myndighederne midt i det tekniske arbejde.
