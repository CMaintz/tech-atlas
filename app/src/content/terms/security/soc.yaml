edges:
  requires: [incident-response]
  used-with:
    - to: threat-intelligence
      why:
        en: Up-to-date knowledge of how attackers work helps the team tell a real attack from a false alarm.
        da: Aktuel viden om, hvordan angribere arbejder, hjælper teamet med at skelne et reelt angreb fra en falsk alarm.
      strength: normal
      confidence: high
