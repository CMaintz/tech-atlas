term:
  en: Defence in depth
  da: Lagdelt sikkerhed (defence in depth)
aka:
  en: [defense in depth, layered security]
  da: [defence in depth, lagdelt forsvar]
domain: [security]
cluster: fundamentals
layer: governance
status: current
era: 2000
summary:
  en: Stacking several independent layers of protection so that when one fails, the next one still stops the attacker.
  da: Flere uafhængige lag af beskyttelse oven på hinanden, så det næste lag stadig stopper angriberen, når ét svigter.
body:
  formal:
    en: A design principle that combines several different controls — technical, organisational and physical — at different points, so that no single failure leaves an asset unprotected.
    da: Et designprincip, der kombinerer flere forskellige kontroller — tekniske, organisatoriske og fysiske — på forskellige steder, så ingen enkelt fejl efterlader et aktiv ubeskyttet.
  plain:
    en: Like protecting a home with a locked gate, a locked door, an alarm and a safe for the valuables — a thief who gets past one still meets the next.
    da: Som at beskytte et hjem med en låst låge, en låst dør, en alarm og et pengeskab til smykkerne — en tyv, der kommer forbi det ene, møder stadig det næste.
  inPractice:
    en: At a Danish shipping company, a phishing mail slips past the mail filter and a clerk clicks the link, but MFA stops the stolen password from being used and EDR on the laptop blocks the download.
    da: Hos et rederi slipper en phishingmail forbi mailfilteret, og en medarbejder klikker på linket — men MFA forhindrer, at den stjålne adgangskode kan bruges, og EDR på den bærbare blokerer downloaden.
  whyItMatters:
    en: Every control fails sometimes, so relying on just one means a single mistake is enough for a breach.
    da: Enhver kontrol svigter en gang imellem, så hvis man kun har én, er en enkelt fejl nok til et brud.
edges:
  requires: [control]
  mitigates:
    - to: threat
      why:
        en: An attacker must beat several different barriers in a row instead of just one.
        da: En angriber skal forbi flere forskellige barrierer i træk i stedet for kun én.
      strength: normal
      confidence: high
  used-with:
    - to: zero-trust
      why:
        en: Zero Trust adds checks at every step, which is one more set of layers inside the network.
        da: Zero Trust tilføjer kontrol ved hvert skridt, hvilket giver endnu flere lag inde i netværket.
      strength: normal
      confidence: medium
    - network-segmentation
  contrasts-with: [perimeter-security]
sources:
  - title: NIST Glossary — Defense-in-Depth
    tier: standard
    publisher: NIST
    url: https://csrc.nist.gov/glossary/term/defense_in_depth
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 4
    tier: course-material
