term:
  en: Threat actor
  da: Trusselsaktør
aka:
  en: [attacker, adversary, hacker]
  da: [angriber, aktør, hacker]
domain: [security]
cluster: fundamentals
layer: people
status: current
summary:
  en: The person or group behind an attack, such as a criminal gang, a foreign state, an activist or a careless insider.
  da: Den person eller gruppe, der står bag et angreb — fx en kriminel bande, en fremmed stat, en aktivist eller en uforsigtig medarbejder.
body:
  formal:
    en: An individual or group that causes, or could cause, harm to an organisation, described by its motive, skills and resources — for example crime for money, spying for a state, or protest.
    da: En person eller gruppe, der forvolder eller kan forvolde skade på en organisation, og som beskrives ud fra sit motiv, sine evner og ressourcer — fx kriminalitet for penge, spionage for en stat eller protest.
  plain:
    en: Knowing that bikes get stolen in your area is one thing; knowing it is the same two teenagers every Friday night tells you when and how to lock up.
    da: At vide, at der bliver stjålet cykler i dit område, er én ting; at vide, at det er de samme to teenagere hver fredag aften, fortæller dig, hvornår og hvordan du skal låse.
  inPractice:
    en: CFCS rates the threat from cyber crime against Denmark as very high, so the IT lead at a Danish online shop plans mainly for criminal gangs after payment, not for spying by a foreign state.
    da: CFCS vurderer truslen fra cyberkriminalitet mod Danmark som meget høj, så den IT-ansvarlige i en dansk webshop planlægger primært efter kriminelle bander, der vil have penge — ikke efter spionage fra en fremmed stat.
  whyItMatters:
    en: Knowing who is likely to attack, and why, tells you which defences matter most for your organisation.
    da: Når man ved, hvem der sandsynligvis angriber og hvorfor, ved man også, hvilke forsvar der betyder mest for ens organisation.
edges:
  requires: [threat]
  part-of: [threat-landscape]
  exploits:
    - to: vulnerability
      why:
        en: Attackers look for weaknesses in systems and people that they can use to get in.
        da: Angribere leder efter svagheder i systemer og hos mennesker, som de kan bruge til at komme ind.
      strength: primary
      confidence: high
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 1 (cyberlandskabet og aktører)
    tier: course-material
  - title: NIST Glossary — Threat Actor
    tier: standard
    publisher: NIST
    url: https://csrc.nist.gov/glossary/term/threat_actor
