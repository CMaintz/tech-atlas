term:
  en: Cyber Resilience Act (CRA)
  da: Cyberrobusthedsforordningen (CRA)
aka:
  en: [Regulation (EU) 2024/2847]
  da: [forordning (EU) 2024/2847]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 2024
summary:
  en: The EU law that makes makers of connected products and software build them secure and keep fixing their flaws.
  da: EU-forordningen, der pålægger producenter af tilsluttede produkter og software at gøre dem sikre og blive ved med at rette fejl.
body:
  formal:
    en: An EU regulation, in force since 10 December 2024, that sets basic security requirements for products with digital parts sold in the EU. Makers must report actively exploited flaws and severe incidents from 11 September 2026, and all other duties, including the CE mark for security, apply from 11 December 2027.
    da: En EU-forordning, i kraft siden 10. december 2024, der stiller grundlæggende sikkerhedskrav til produkter med digitale elementer, som sælges i EU. Producenter skal indberette aktivt udnyttede sårbarheder og alvorlige hændelser fra 11. september 2026, og alle øvrige krav, herunder CE-mærkning for sikkerhed, gælder fra 11. december 2027.
  plain:
    en: Like safety rules for toys or electrical goods, but for the software inside things — a product that is easy to hack is treated as unsafe to sell.
    da: Som sikkerhedsregler for legetøj eller elektriske apparater, men for softwaren i tingene — et produkt, der er let at hacke, betragtes som usikkert at sælge.
  inPractice:
    en: A Danish maker of smart door locks ships them without a default password, lists every software part it uses, offers free security updates for five years, and, when it learns a flaw is being used by attackers, warns the authorities within 24 hours.
    da: En dansk producent af smarte dørlåse leverer dem uden standardadgangskode, fører en liste over alle de softwarekomponenter, den bruger, tilbyder gratis sikkerhedsopdateringer i fem år og varsler myndighederne inden for 24 timer, når den opdager, at en sårbarhed bliver udnyttet af angribere.
  whyItMatters:
    en: Until now buyers had no way to judge the security of a camera, router or app, and makers bore little cost when it failed; the CRA moves that burden to the maker, with fines up to 15 million euro or 2.5% of global turnover.
    da: Hidtil havde køberne ingen mulighed for at vurdere sikkerheden i et kamera, en router eller en app, og producenterne betalte kun lidt, når den svigtede; CRA flytter byrden over på producenten med bøder på op til 15 mio. euro eller 2,5 % af den globale omsætning.
edges:
  mandates:
    - to: security-by-design
      why:
        en: Products must be designed, built and shipped with security built in and a secure setup by default.
        da: Produkter skal designes, udvikles og leveres med indbygget sikkerhed og sikre standardindstillinger.
      strength: primary
      confidence: high
    - to: sbom
      why:
        en: Makers must draw up a software bill of materials listing at least the main parts their product depends on.
        da: Producenter skal udarbejde en softwarestykliste, der som minimum viser de vigtigste komponenter, produktet afhænger af.
      strength: normal
      confidence: high
    - to: patch-management
      why:
        en: Makers must fix known flaws without delay and give free security updates for the whole support period, normally at least five years.
        da: Producenter skal rette kendte sårbarheder uden ophold og levere gratis sikkerhedsopdateringer i hele supportperioden, normalt mindst fem år.
      strength: primary
      confidence: high
    - to: incident-reporting
      why:
        en: Article 14 requires actively exploited flaws and severe incidents to be reported, with an early warning within 24 hours.
        da: Artikel 14 kræver, at aktivt udnyttede sårbarheder og alvorlige hændelser indberettes med en tidlig varsling inden for 24 timer.
      strength: normal
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: NIS2 sets duties for the organisations that run vital services; the CRA sets duties for the products and software they, and everyone else, buy.
        da: NIS2 stiller krav til de organisationer, der driver vitale tjenester; CRA stiller krav til de produkter og den software, som de — og alle andre — køber.
      strength: primary
      confidence: high
  kind-of: [eu-regulation]
