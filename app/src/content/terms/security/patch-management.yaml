  requires: [patch, cve]
  mitigates:
    - to: vulnerability
      why:
        en: Installing the fix removes the known weakness itself.
        da: Når rettelsen installeres, fjernes selve den kendte svaghed.
      strength: primary
      confidence: high
    - to: ransomware
      strength: normal
      confidence: medium
    - exploit
  used-with:
    - vulnerability-scanning
