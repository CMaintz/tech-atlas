edges:
  requires: [threat]
  implements:
    - to: control
      why:
        en: The course glossary counts human measures alongside technical and organisational ones as controls.
        da: Kursets ordliste regner menneskelige foranstaltninger med som kontroller på linje med tekniske og organisatoriske.
      strength: normal
      confidence: high
    - people-control
  mitigates:
    - to: social-engineering
      why:
        en: People who recognise manipulation are harder to manipulate.
        da: Mennesker, der kan genkende manipulation, er sværere at manipulere.
      strength: primary
      confidence: high
    - to: phishing
      why:
        en: Trained staff spot and report fake messages instead of acting on them.
        da: Trænede medarbejdere opdager og melder falske beskeder i stedet for at handle på dem.
      strength: primary
      confidence: high
    - pretexting
    - vishing
    - smishing
    - deepfake
  contrasts-with:
    - to: security-culture
      why:
        en: Awareness is what each person knows and does; culture is the shared habits and attitudes of the whole group.
        da: Awareness er, hvad den enkelte ved og gør; kultur er gruppens fælles vaner og holdninger.
      strength: normal
      confidence: high
  used-with: [security-policy]
