term:
  en: Security awareness
  da: Awareness
aka:
  en: [cyber awareness, security awareness training]
  da: [sikkerhedsbevidsthed, cyber awareness]
domain: [security]
cluster: awareness
layer: people
status: current
summary:
  en: What staff know about security and how they act on it in daily work.
  da: Medarbejdernes viden om sikkerhed, og hvordan de handler på den i det daglige arbejde.
body:
  formal:
    en: The level of understanding employees have of the threats facing the organisation, combined with the habits they show in response - built and kept up through planned training, campaigns and follow-up.
    da: Medarbejdernes forståelse af de trusler, organisationen står over for, sammen med den adfærd, de udviser som svar - opbygget og vedligeholdt gennem planlagt træning, kampagner og opfølgning.
  plain:
    en: Like teaching everyone in a building where the fire exits are and why the fire doors must stay shut - knowing is only half of it; doing it every day is the point.
    da: Som at lære alle i en bygning, hvor nødudgangene er, og hvorfor branddørene skal holdes lukkede - det er ikke nok at vide det; pointen er, at man gør det hver dag.
  inPractice:
    en: A school gives security ten minutes at every staff meeting - this month, how to spot a fake MitID login page - and teachers now forward doubtful mails to IT instead of just deleting them.
    da: En skole giver sikkerhed ti minutter på hvert personalemøde - denne måned, hvordan man kender en falsk MitID-loginside - og lærerne sender nu tvivlsomme mails videre til IT i stedet for bare at slette dem.
  whyItMatters:
    en: Many attacks aim at people rather than machines, and NIS2 lists training among its minimum requirements, so awareness is both a defence and a legal duty.
    da: Mange angreb retter sig mod mennesker frem for maskiner, og NIS2 nævner træning blandt minimumskravene, så awareness er både et forsvar og en lovpligt.
deepDive:
  en: |-
    NIST's older guidance, SP 800-16 (1998) and SP 800-50 (2003), both superseded by SP 800-50 Rev. 1 in September 2024, framed learning as a continuum: awareness focuses attention on security and aims at recognition, training builds specific skills for a role, and education integrates skills into a professional body of knowledge. The distinction still matters. Awareness is a population-wide state - can staff recognise a threat and do they know what to do next - whereas training is role-bound, such as secure coding for developers or privileged-access hygiene for administrators. Treating the annual all-staff module as if it were training is a common category error.

    The normative requirements are concrete. ISO/IEC 27001:2022 clause 7.3 requires that people working under the organisation's control are aware of the information security policy, their contribution to the effectiveness of the ISMS including the benefits of improved performance, and the implications of not conforming. Annex A control 6.3, elaborated in ISO/IEC 27002:2022, expects an awareness, education and training programme aligned with policies and topic-specific procedures, updated regularly and covering both new starters and existing staff. NIS2 Art. 21(2)(g) lists basic cyber hygiene practices and cybersecurity training among the minimum risk-management measures, Art. 20(2) requires training for members of management bodies, and DORA Art. 13(6) makes awareness compulsory in financial entities.

    Measurement is the difficult part. The traditional knowledge-attitude-behaviour model assumes that knowledge produces the right attitude, which produces the right behaviour, but the knowing-doing gap is well documented: people who can pass a quiz still click under time pressure. Validated instruments such as the Human Aspects of Information Security Questionnaire (HAIS-Q) measure knowledge, attitude and self-reported behaviour separately, while observed behaviour - reporting rates in real and simulated incidents, time-to-report, policy exceptions, data-handling errors - is the stronger evidence. Large field studies (IEEE S&P 2022 and 2025) found that annual training and embedded post-click lessons had little measurable effect on phishing susceptibility, which is a reason to measure outcomes rather than completions.

    Awareness is individual and cognitive; security culture is the collective set of norms that decides whether that knowledge is applied when it is inconvenient. Awareness is necessary but not sufficient: it works best when paired with nudges at the point of decision and with technical controls, such as phishing-resistant MFA, that do not depend on a person noticing anything at all.
  da: |-
    NIST's ældre vejledninger, SP 800-16 (1998) og SP 800-50 (2003), der begge blev afløst af SP 800-50 Rev. 1 i september 2024, beskrev læring som et kontinuum: Awareness retter opmærksomheden mod sikkerhed og sigter mod genkendelse, træning opbygger konkrete færdigheder til en rolle, og uddannelse samler færdighederne i en professionel vidensbase. Skellet er stadig vigtigt. Awareness er en tilstand i hele medarbejderstaben - kan medarbejderne genkende en trussel, og ved de, hvad de skal gøre bagefter - mens træning er rollebundet, fx sikker kodning for udviklere eller hygiejne omkring privilegeret adgang for administratorer. At behandle det årlige modul for alle ansatte, som om det var træning, er en udbredt kategorifejl.

    De normative krav er konkrete. ISO/IEC 27001:2022 pkt. 7.3 kræver, at personer, der arbejder under organisationens kontrol, kender informationssikkerhedspolitikken, deres bidrag til ISMS'ets effektivitet, herunder fordelene ved forbedret præstation, og konsekvenserne af ikke at overholde kravene. Kontrol 6.3 i bilag A, uddybet i ISO/IEC 27002:2022, forventer et program for awareness, uddannelse og træning, der er afstemt med politikker og emnespecifikke procedurer, opdateres jævnligt og dækker både nyansatte og eksisterende medarbejdere. NIS2 art. 21, stk. 2, litra g, nævner grundlæggende cyberhygiejne og cybersikkerhedstræning blandt minimumsforanstaltningerne, art. 20, stk. 2, kræver træning af medlemmerne af ledelsesorganet, og DORA-forordningens art. 13, stk. 6, gør awareness obligatorisk i finansielle virksomheder.

    Målingen er den svære del. Den klassiske viden-holdning-adfærd-model antager, at viden giver den rette holdning, som giver den rette adfærd, men kløften mellem at vide og at gøre er veldokumenteret: Folk, der kan bestå en quiz, klikker stadig under tidspres. Validerede instrumenter som Human Aspects of Information Security Questionnaire (HAIS-Q) måler viden, holdning og selvrapporteret adfærd hver for sig, mens observeret adfærd - meldeprocent ved rigtige og simulerede hændelser, tid til melding, undtagelser fra politikken, fejl i datahåndtering - er det stærkeste bevis. Store feltstudier (IEEE S&P 2022 og 2025) fandt, at årlig træning og indlejrede lektioner efter et klik havde ringe målbar effekt på modtageligheden for phishing, hvilket er et argument for at måle effekt frem for gennemførelser.

    Awareness er individuel og kognitiv; sikkerhedskultur er det fælles sæt af normer, der afgør, om den viden bliver brugt, når det er ubelejligt. Awareness er nødvendig, men ikke tilstrækkelig: Den virker bedst sammen med nudges i beslutningsøjeblikket og med tekniske kontroller som phishing-resistent MFA, der slet ikke afhænger af, at et menneske opdager noget.
howTo:
  steps:
    en:
      - Get management to name an owner for the awareness programme and set aside budget and staff time, remembering that NIS2 also requires the management body itself to be trained.
      - Use the risk assessment and recent incidents to pick three to five target behaviours for the year, such as reporting suspicious mails, locking screens and handling personal data safely.
      - For each target group, map the gap between today's behaviour and the desired behaviour, including the practical barriers that make the secure choice hard.
      - Write an annual plan that combines onboarding for new starters, short recurring activities (staff meetings, newsletters, e-learning) and role-based training for admins, developers and managers.
      - Make the secure behaviour easy with a report-phishing button, a clear contact point and technical controls such as MFA that do not depend on people noticing anything.
      - Test campaigns and materials on a few users before rollout, then spread the activities across the year instead of one annual push.
      - Set measurable goals up front and measure behaviour rather than completions, such as reporting rate, time to report and repeat incidents.
      - Report results to management at least once a year and adjust topics, target groups and methods for the next cycle.
    da:
      - Få ledelsen til at udpege en ejer af awareness-programmet og afsætte budget og arbejdstid - og husk, at NIS2 også kræver, at ledelsen selv bliver trænet.
      - Brug risikovurderingen og de seneste hændelser til at vælge tre til fem målsadfærder for året, fx at melde mistænkelige mails, låse skærmen og håndtere personoplysninger sikkert.
      - Kortlæg for hver målgruppe spændet mellem den nuværende og den ønskede adfærd, herunder de praktiske barrierer, der gør det sikre valg besværligt.
      - Lav en årsplan, der kombinerer introduktion af nyansatte, korte tilbagevendende aktiviteter (personalemøder, nyhedsbreve, e-læring) og rollebaseret træning for administratorer, udviklere og ledere.
      - Gør den sikre adfærd let med en knap til at melde phishing, et tydeligt kontaktpunkt og tekniske kontroller som MFA, der ikke afhænger af, at folk opdager noget.
      - Test kampagner og materialer på nogle få brugere før udrulning, og spred derefter aktiviteterne ud over året i stedet for én stor årlig indsats.
      - Sæt målbare mål fra start, og mål adfærd frem for gennemførelser, fx meldeprocent, tid til melding og gentagne hændelser.
      - Rapportér resultaterne til ledelsen mindst én gang om året, og justér emner, målgrupper og metoder til næste runde.
  pitfalls:
    en:
      - Treating the annual e-learning module as the whole programme and counting completion rates as success.
      - Blaming or shaming people who make mistakes, so they stop reporting.
      - Running one programme for everyone and forgetting managers, administrators and new starters.
      - Expecting awareness to replace technical controls instead of backing them up.
    da:
      - At behandle det årlige e-læringsmodul som hele programmet og regne gennemførelsesprocenten som succes.
      - At give skylden til eller udstille dem, der laver fejl, så de holder op med at melde.
      - At køre ét program for alle og glemme ledere, administratorer og nyansatte.
      - At forvente, at awareness kan erstatte tekniske kontroller i stedet for at understøtte dem.
