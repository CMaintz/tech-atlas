term:
  en: Personal data
  da: Personoplysninger
aka:
  en: [personal information]
  da: [persondata, personhenførbare oplysninger]
domain: [security]
cluster: compliance
layer: data
status: current
era: 1995
summary:
  en: Any information about a living person who can be named or traced, directly or by putting pieces together.
  da: Enhver oplysning om en levende person, der kan identificeres, enten direkte eller ved at sætte flere oplysninger sammen.
body:
  formal:
    en: Under GDPR Article 4(1), any information relating to an identified or identifiable living person, directly or by combining details such as a name, ID number, location or IP address; Article 9 sets stricter rules for special categories like health, religion and union membership.
    da: Efter GDPR artikel 4, nr. 1, enhver oplysning om en identificeret eller identificerbar fysisk person, direkte eller ved at kombinere fx navn, CPR-nummer, lokation eller IP-adresse; artikel 9 giver skrappere regler for særlige kategorier som helbred, religion og fagforeningsmedlemskab.
  plain:
    en: Anything that points to you — not just your name, but your number plate, your face on a camera or the fact that "the only redhead on the third floor" called in sick.
    da: Alt, der peger på dig — ikke kun dit navn, men også din nummerplade, dit ansigt på et kamera eller at "den eneste rødhårede på 3. sal" har meldt sig syg.
  inPractice:
    en: The developer at a Danish web shop assumes the order logs are harmless, but they hold IP addresses, delivery addresses and buying habits, so the logs fall under GDPR and need access limits and a date by which they are deleted.
    da: Udvikleren i en dansk webshop går ud fra, at ordrelogs er harmløse, men de indeholder IP-adresser, leveringsadresser og købsvaner, så de falder ind under GDPR og kræver begrænset adgang og en slettefrist.
  whyItMatters:
    en: Whether information counts as personal decides whether GDPR applies at all; indirect cases like logs and IDs from devices are easy to overlook, and that is where many breaches and fines start.
    da: Om oplysninger tæller som personoplysninger, afgør, om GDPR overhovedet gælder; indirekte tilfælde som logs og id'er fra enheder er lette at overse, og det er dér, mange brud og bøder begynder.
edges:
  kind-of:
    - to: asset
      why:
        en: Personal data is one of the information assets a firm must know about and protect.
        da: Personoplysninger er et af de informationsaktiver, en virksomhed skal kende og beskytte.
      strength: minor
      confidence: medium
  used-with:
    - to: privacy-by-design
      why:
        en: Privacy by design starts by asking which personal data a system really needs and collecting no more.
        da: Privacy by design starter med at spørge, hvilke personoplysninger et system reelt har brug for, og ikke indsamle mere.
      strength: primary
      confidence: high
    - to: training-data
      why:
        en: Training data scraped or gathered from people often holds personal data, which brings GDPR into AI projects.
        da: Træningsdata indsamlet fra mennesker indeholder ofte personoplysninger, hvilket gør GDPR relevant for AI-projekter.
      strength: normal
      confidence: high
sources:
  - title: Regulation (EU) 2016/679 (GDPR), Article 4(1) and Article 9
    tier: standard
    publisher: European Union
    url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
draft: true
