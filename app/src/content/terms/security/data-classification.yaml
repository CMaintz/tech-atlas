edges:
  requires: [confidentiality]
  used-with:
    - to: encryption
      why:
        en: The classification level often decides which data must be encrypted.
        da: Klassifikationsniveauet afgør ofte, hvilke data der skal krypteres.
      strength: normal
      confidence: high
    - training-data
    - to: personal-data
      why:
        en: Personal data is a legal category that often decides which classification level and handling rules apply.
        da: Personoplysninger er en juridisk kategori, der ofte afgør, hvilket klassifikationsniveau og hvilke håndteringsregler der gælder.
      strength: normal
      confidence: high
