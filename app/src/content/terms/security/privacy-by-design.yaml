      url: https://www.datatilsynet.dk/regler-og-vejledning/behandlingssikkerhed/databeskyttelse-gennem-design-og-standardindstillinger
      publisher: Datatilsynet
      tier: official-doc
      lang: da
    - title: Indbygget databeskyttelse (privacy by design)
      url: https://www.sikkerdigital.dk/myndighed/databeskyttelse-og-gdpr/indbygget-databeskyttelse
      publisher: Styrelsen for Samfundssikkerhed
      tier: official-doc
      lang: da
edges:
  requires: [confidentiality]
  contrasts-with:
    - to: security-by-design
      why:
        en: Security by design protects all systems and data; privacy by design is the GDPR principle focused on people's personal data and collecting less.
        da: Security by design beskytter alle systemer og data; privacy by design er GDPR-princippet med fokus på menneskers personoplysninger og at indsamle mindre.
      strength: primary
      confidence: high
  mitigates:
    - to: data-breach
      why:
        en: Collecting and keeping less personal data shrinks what a breach can expose.
        da: At indsamle og gemme færre personoplysninger mindsker, hvad et brud kan afsløre.
      strength: normal
      confidence: medium
sources:
