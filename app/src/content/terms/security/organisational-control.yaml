term:
  en: Organisational control
  da: Organisatorisk kontrol
aka:
  en: [organizational control, administrative control]
  da: [organisatorisk foranstaltning, administrativ kontrol]
domain: [security]
cluster: controls
layer: governance
status: current
summary:
  en: A safeguard made of rules, roles and routines — who decides, who does what, and how work must be done.
  da: En beskyttelse, der består af regler, roller og rutiner — hvem der beslutter, hvem der gør hvad, og hvordan arbejdet skal udføres.
body:
  formal:
    en: A security control carried out through policies, processes, responsibilities and agreements — such as supplier management, access approval or an incident process — one of the four control themes in ISO 27002.
    da: En sikkerhedskontrol, der udføres gennem politikker, processer, ansvar og aftaler — fx leverandørstyring, godkendelse af adgang eller en hændelsesproces — et af de fire kontroltemaer i ISO 27002.
  plain:
    en: Like the plan for a school trip — the teacher counts heads at every stop, children walk in pairs, and nobody leaves the group without telling an adult. No fence is needed.
    da: Som planen for en skoleudflugt — læreren tæller børnene ved hvert stop, de går to og to, og ingen forlader gruppen uden at sige det til en voksen. Der skal ikke noget hegn til.
  inPractice:
    en: A housing association writes down that a new user account needs the head of department's approval and that HR tells the IT department the same day someone leaves.
    da: Et boligselskab skriver ned, at en ny brugerkonto kræver godkendelse fra afdelingslederen, og at HR giver IT-afdelingen besked samme dag, som nogen stopper.
  whyItMatters:
    en: It is the largest group of controls in ISO 27002, and without clear rules and owners even good technology is set up and used at random.
    da: Det er den største gruppe kontroller i ISO 27002, og uden klare regler og ejere bliver selv god teknologi sat op og brugt tilfældigt.
