term:
  en: EU regulation
  da: EU-forordning
aka:
  en: []
  da: [forordning]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: A type of EU law that applies directly and in the same words in every member state, with no national law needed.
  da: En type EU-lov, der gælder direkte og med samme ordlyd i alle medlemslande, uden at der skal en national lov til.
body:
  formal:
    en: A legal act of the European Union that is binding in full and applies directly in all member states from its start date — for example GDPR, DORA and the Cyber Resilience Act — although countries may add rules on authorities and fines where it allows.
    da: En retsakt fra EU, der er bindende i alle enkeltheder og gælder direkte i alle medlemslande fra ikrafttrædelsen — fx GDPR, DORA og Cyber Resilience Act — dog kan landene tilføje regler om myndigheder og bøder, hvor den giver plads til det.
  plain:
    en: Like the rules of football — the same book is used in every country, and no national league can rewrite what a goal is.
    da: Som reglerne i fodbold — den samme regelbog bruges i alle lande, og ingen national liga kan skrive om, hvad et mål er.
  inPractice:
    en: A web shop selling to both Denmark and Germany follows one GDPR text for handling customer data, and only checks national rules for details the regulation leaves open.
    da: En webshop, der sælger til både Danmark og Tyskland, følger den samme GDPR-tekst for kundedata og tjekker kun nationale regler for de detaljer, forordningen lader stå åbne.
  whyItMatters:
    en: Knowing whether a rule is a regulation or a directive tells you where to read your duties — in the EU text itself or in your own country's law.
    da: At vide, om en regel er en forordning eller et direktiv, fortæller, hvor man skal læse sine pligter — i selve EU-teksten eller i sit eget lands lov.
edges:
  requires: [compliance]
  used-with:
    - to: supervisory-authority
      why:
        en: A regulation applies directly, but each country names the authority that checks it is followed.
        da: En forordning gælder direkte, men hvert land udpeger den myndighed, der fører tilsyn med den.
      confidence: medium
sources:
