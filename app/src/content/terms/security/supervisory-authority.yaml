term:
  en: Supervisory authority
  da: Tilsynsmyndighed
aka:
  en: [data protection authority]
  da: [Datatilsynet]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 1995
summary:
  en: The public body in each EU country that checks how GDPR is followed, handles complaints and can hand out fines; in Denmark, Datatilsynet.
  da: Den offentlige myndighed i hvert EU-land, der fører tilsyn med GDPR, behandler klager og kan udstede bøder; i Danmark Datatilsynet.
body:
  formal:
    en: An independent public authority that each member state must set up under GDPR Article 51 to watch over the rules, look into complaints and breaches, give orders and propose or impose fines.
    da: En uafhængig offentlig myndighed, som hvert medlemsland skal oprette efter GDPR artikel 51 for at føre tilsyn med reglerne, undersøge klager og brud, give påbud og foreslå eller pålægge bøder.
  plain:
    en: Like a food safety inspector for personal data — it can visit, ask questions, demand changes and punish those who ignore the rules.
    da: Som en fødevarekontrollant for personoplysninger — den kan komme på besøg, stille spørgsmål, kræve ændringer og straffe dem, der ignorerer reglerne.
  inPractice:
    en: After a stolen laptop exposes customer records, a Danish firm reports the breach to Datatilsynet within 72 hours; the authority later asks for its risk assessment and issues a warning.
    da: Efter at en stjålen bærbar har lækket kundeoplysninger, anmelder en dansk virksomhed bruddet til Datatilsynet inden for 72 timer; myndigheden beder senere om risikovurderingen og udsteder en advarsel.
  whyItMatters:
    en: Rules without someone to enforce them are easy to ignore; the authority gives people a place to complain and gives firms a real reason to comply.
    da: Regler uden nogen til at håndhæve dem er lette at ignorere; myndigheden giver borgerne et sted at klage og virksomhederne en reel grund til at overholde reglerne.
edges:
  requires: [gdpr, data-controller]
sources:
  - title: Regulation (EU) 2016/679 (GDPR), Articles 33, 51, 57 and 58
    tier: standard
    publisher: European Union
    url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
draft: true
