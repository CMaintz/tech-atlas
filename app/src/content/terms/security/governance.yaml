  used-with:
    - to: risk-management
      why:
        en: Governance sets how much risk is acceptable; risk management works out where the organisation stands against that.
        da: Governance fastlægger, hvor meget risiko der kan accepteres; risikostyring finder ud af, hvor organisationen står i forhold til det.
      strength: primary
      confidence: high
