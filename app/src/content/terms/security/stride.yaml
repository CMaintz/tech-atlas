cluster: application-security
layer: application
status: current
era: 1999
summary:
  en: A memory aid that sorts threats into six kinds, so a team checks every part of a design for each kind in turn.
  da: En huskeregel, der deler trusler op i seks slags, så et team tjekker hver del af et design for hver slags efter tur.
body:
  formal:
    en: A scheme for naming threats, created at Microsoft, whose six letters stand for six kinds of threat — faking an identity (the S), tampering, repudiation, information disclosure, denial of service and elevation of privilege — each the breaking of a property a system should keep, such as authentication, integrity or availability.
    da: En metode til at navngive trusler, udviklet hos Microsoft, hvor de seks bogstaver står for Spoofing, Tampering, Repudiation, Information disclosure, Denial of service og Elevation of privilege — hver især et brud på en egenskab, et system bør have, fx autentificering, integritet eller tilgængelighed.
  plain:
    en: Like a pilot's pre-flight checklist — rather than trusting memory, you go down the same six questions every time so nothing obvious is skipped.
    da: Som en pilots tjekliste før afgang — i stedet for at stole på hukommelsen gennemgår man de samme seks spørgsmål hver gang, så intet oplagt bliver sprunget over.
  inPractice:
    en: Reviewing the design of a new booking system for a regional hospital, a team asks all six questions about the login page and finds that nothing records failed logins, so a user could later deny what they did — a repudiation threat they fix by keeping a log.
    da: Da et team gennemgår designet af et nyt bookingsystem til et regionshospital, stiller det alle seks spørgsmål til login-siden og opdager, at mislykkede login ikke bliver registreret, så en bruger senere kan benægte, hvad vedkommende har gjort — en repudiation-trussel, som teamet løser ved at føre en log.
  whyItMatters:
    en: Without a fixed list, teams tend to think only of the attacks they have heard about; six plain questions make threat work repeatable, even for people new to security.
    da: Uden en fast liste tænker teams gerne kun på de angreb, de har hørt om; seks enkle spørgsmål gør trusselsarbejdet gentageligt, også for folk, der er nye inden for sikkerhed.
