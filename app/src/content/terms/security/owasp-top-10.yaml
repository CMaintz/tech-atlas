term:
  en: OWASP Top 10
  da: OWASP Top 10
aka:
  en: []
  da: []
domain: [security]
cluster: application-security
layer: application
status: current
era: 2003
summary:
  en: A widely used, regularly updated list of the ten most serious kinds of security flaw found in web applications.
  da: En udbredt, jævnligt opdateret liste over de ti mest alvorlige slags sikkerhedsfejl i webapplikationer.
body:
  formal:
    en: An awareness document from the open OWASP community that ranks ten broad categories of web application risk, such as broken access control and injection, using data from real tests and a survey of practitioners; it is revised every few years, most recently in 2025.
    da: Et awareness-dokument fra det åbne OWASP-fællesskab, der rangordner ti brede kategorier af risici i webapplikationer, fx brudt adgangskontrol og injection, ud fra data fra rigtige test og en rundspørge blandt fagfolk; det revideres med få års mellemrum, senest i 2025.
  plain:
    en: Like a motoring group's list of the ten faults most often found in used cars — not every possible fault, but the ones worth checking first.
    da: Som en bilorganisations liste over de ti fejl, der oftest findes i brugte biler — ikke alle tænkelige fejl, men dem, det er værd at tjekke først.
  inPractice:
    en: A region buying a new patient portal writes into the tender that the supplier must document testing against every category on the OWASP Top 10 before go-live.
    da: En region, der skal købe en ny patientportal, skriver ind i udbuddet, at leverandøren skal dokumentere test mod alle kategorier på OWASP Top 10, før portalen sættes i drift.
  whyItMatters:
    en: It gives developers, testers and buyers a shared starting point and a common language, but it is a floor rather than a full checklist — covering all ten does not make an application safe.
    da: Den giver udviklere, testere og indkøbere et fælles udgangspunkt og et fælles sprog, men den er et minimum og ikke en fuld tjekliste — at dække alle ti gør ikke en webapplikation sikker.
edges:
  requires: [vulnerability, web-application]
  used-with:
    - to: sql-injection
      why:
        en: SQL injection sits in the list's Injection category, which in the 2025 edition is A05.
        da: SQL injection hører under listens kategori Injection, som i 2025-udgaven er A05.
      strength: normal
      confidence: high
    - to: penetration-test
      why:
        en: Testers often use the list to plan and report what they checked in a web application.
        da: Testere bruger ofte listen til at planlægge og rapportere, hvad de har tjekket i en webapplikation.
      strength: normal
      confidence: high
    - to: secure-development-lifecycle
      why:
        en: Teams use the list to choose which flaws their training, code review and tests should cover first.
        da: Teams bruger listen til at vælge, hvilke fejl deres uddannelse, kodegennemgang og test skal dække først.
      strength: normal
      confidence: medium
