term:
  en: Disaster recovery plan (DRP)
  da: Disaster recovery plan (DRP)
aka:
  en: [DRP, DR plan]
  da: [DRP, genopretningsplan]
domain: [security]
cluster: incident-response
layer: governance
status: current
summary:
  en: A technical plan for bringing data and systems back after a breakdown or attack, in a set order and time.
  da: En teknisk plan for at få data og systemer tilbage efter et nedbrud eller angreb i en fastlagt rækkefølge og tid.
body:
  formal:
    en: Step-by-step technical instructions for rebuilding systems and restoring data from backup, with a fixed order and target times taken from the recovery objectives and the business impact analysis.
    da: Trinvise tekniske instruktioner for at genopbygge systemer og gendanne data fra backup i en fast rækkefølge og med måltider hentet fra genopretningsmålene og konsekvensanalysen.
  plain:
    en: Like a rebuild guide for a house after a flood - which walls go up first, where the spare parts are, and how long each step takes.
    da: Ligesom en genopbygningsvejledning for et hus efter en oversvømmelse - hvilke vægge der sættes op først, hvor reservedelene er, og hvor lang tid hvert trin tager.
  inPractice:
    en: After ransomware locks a shipping company's servers, the IT department wipes them and restores the booking system from last night's backup first, then email, then the rest.
    da: Efter at ransomware har låst et rederis servere, sletter IT-afdelingen dem og gendanner først bookingsystemet fra nattens backup, derefter mail og så resten.
  whyItMatters:
    en: A backup nobody knows how to restore is worthless, and guessing under pressure can turn a one-day outage into weeks.
    da: En backup, som ingen ved, hvordan man gendanner, er værdiløs, og gætteri under pres kan gøre et nedbrud på én dag til flere uger.
deepDive:
  en: |-
    NIST SP 800-34 Rev. 1 defines the DRP narrowly as an information-system-focused plan for relocating systems to an alternate site after major, usually physical, damage that makes the primary facility unusable, and separates it from the information system contingency plan, which restores a single system in place. In common usage the DRP covers both: the technical procedures, resources and order needed to restore IT services within the recovery time and recovery point objectives set by the business impact analysis. ISO 22301 treats disaster recovery plans as part of the recovery procedures under clause 8.4, and ISO/IEC 27031 gives guidance on ICT readiness for business continuity.

    Recovery strategies are chosen by cost against RTO and RPO. Classic site options are cold sites (space and power only), warm sites (pre-installed hardware, data restored on demand) and hot sites or active-active configurations with continuous replication. Cloud providers describe the same spectrum as backup and restore, pilot light, warm standby and multi-site active-active. Synchronous replication can approach an RPO of zero but faithfully replicates corruption and encryption by ransomware, so point-in-time copies such as snapshots, journaled replication or immutable and offline backups are still required.

    The core of the plan is a dependency-ordered runbook. Foundational services come first: network, DNS, time synchronisation, identity (typically Active Directory or the cloud identity provider), key management and backup infrastructure, followed by databases, application tiers and finally user-facing services. Each step records the owner, estimated duration, validation check and decision point. Credentials, license keys, vendor contracts and the runbook itself must be available when the directory and document management systems are down. Maersk's 2017 NotPetya recovery famously depended on the one domain controller that had survived because it was offline during a power cut in its Ghana office.

    Cyberattacks change DR assumptions. After ransomware, restoring the most recent backup may reintroduce the attacker, because intrusion often precedes encryption by days or weeks, so recovery requires identifying a clean restore point, rebuilding in an isolated recovery environment, scanning restored data, resetting credentials including the krbtgt account, and preserving forensic evidence before wiping systems. Only exercises that measure actual recovery time and point against the objectives show whether a DRP works; untested restores, missing application-consistent backups and bandwidth limits on large data volumes are the usual failures. The DRP gets technology back, whereas the BCP keeps the business operating meanwhile.
  da: |-
    NIST SP 800-34 Rev. 1 definerer DRP'en snævert som en plan med fokus på informationssystemer, der flytter systemer til et alternativt sted efter større, typisk fysisk skade, som gør det primære anlæg ubrugeligt, og adskiller den fra beredskabsplanen for et enkelt informationssystem (ISCP), der genopretter ét system på stedet. I almindelig sprogbrug dækker DRP'en begge dele: de tekniske procedurer, ressourcer og den rækkefølge, der skal til for at genoprette IT-tjenester inden for de mål for genoprettelsestid og tolereret datatab, som konsekvensanalysen har fastsat. ISO 22301 behandler disaster recovery-planer som en del af genopretningsprocedurerne under afsnit 8.4, og ISO/IEC 27031 giver vejledning i IKT-parathed til driftskontinuitet.

    Genopretningsstrategier vælges ved at afveje omkostning mod RTO og RPO. De klassiske muligheder er cold sites (kun plads og strøm), warm sites (forhåndsinstalleret hardware, data gendannes efter behov) og hot sites eller active-active-opsætninger med løbende replikering. Cloududbydere beskriver det samme spektrum som backup and restore, pilot light, warm standby og multi-site active-active. Synkron replikering kan komme tæt på en RPO på nul, men replikerer trofast korruption og ransomwarekryptering, så der stadig er brug for kopier fra bestemte tidspunkter som snapshots, journalført replikering eller uforanderlige og offline backups.

    Kernen i planen er en runbook ordnet efter afhængigheder. De grundlæggende tjenester kommer først: netværk, DNS, tidssynkronisering, identitet (typisk Active Directory eller cloudens identitetsudbyder), nøglehåndtering og backupinfrastruktur, derefter databaser, applikationslag og til sidst de tjenester, brugerne ser. Hvert trin angiver ansvarlig, forventet varighed, valideringstjek og beslutningspunkt. Adgangsoplysninger, licensnøgler, leverandørkontrakter og selve runbooken skal være tilgængelige, når katalogtjenesten og dokumentsystemerne er nede. Maersks genopretning efter NotPetya i 2017 afhang berømt nok af den ene domænecontroller, der havde overlevet, fordi den var offline under en strømafbrydelse på kontoret i Ghana.

    Cyberangreb ændrer forudsætningerne for DR. Efter ransomware kan en gendannelse af den nyeste backup føre angriberen tilbage, fordi indtrængen ofte ligger dage eller uger før krypteringen, så genopretning kræver, at man finder et rent gendannelsespunkt, genopbygger i et isoleret genopretningsmiljø, scanner de gendannede data, nulstiller adgangsoplysninger inklusive krbtgt-kontoen og sikrer forensiske spor, før systemer slettes. Kun øvelser, der måler faktisk genoprettelsestid og faktisk datatab op mod målene, viser, om en DRP virker; utestede gendannelser, manglende applikationskonsistente backups og begrænset båndbredde ved store datamængder er de typiske fejl. DRP'en får teknikken tilbage, mens BCP'en holder forretningen i gang imens.
edges:
  requires: [backup, recovery-objectives]
  part-of: [contingency-plan]
  mitigates:
    - to: ransomware
      why:
        en: A tested way back from clean backups removes the pressure to pay the ransom.
        da: En afprøvet vej tilbage fra rene backups fjerner presset for at betale løsesummen.
      strength: primary
      confidence: high
