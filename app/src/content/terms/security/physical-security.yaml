term:
  en: Physical security
  da: Fysisk sikkerhed
aka:
  en: [physical controls]
  da: [fysiske kontroller, fysisk sikring]
domain: [security]
cluster: fundamentals
status: current
summary:
  en: Protecting buildings, rooms and equipment so that nobody can simply walk in, take, break or plug into them.
  da: At beskytte bygninger, rum og udstyr, så ingen bare kan gå ind og tage, ødelægge eller koble sig på dem.
body:
  formal:
    en: The controls that protect the physical surroundings of information - sites, server rooms, devices and paper - against entry by outsiders, theft, damage and dangers such as fire, water and power loss. ISO 27002 groups them as its physical controls.
    da: De kontroller, der beskytter informationens fysiske omgivelser - lokaler, serverrum, enheder og papir - mod uvedkommende adgang, tyveri, skade og farer som brand, vand og strømsvigt. ISO 27002 samler dem som sine fysiske kontroller.
  plain:
    en: The best lock on a diary is no help if someone can simply pick up the whole diary and walk off with it.
    da: Den bedste lås på en dagbog hjælper ikke, hvis nogen bare kan tage hele dagbogen under armen og gå.
  inPractice:
    en: At a regional hospital, a visitor follows a porter through a card-locked door, finds an empty meeting room and plugs a small device into a free network socket; a no-following rule and switched-off sockets would have stopped it.
    da: På et regionshospital går en besøgende med en portør ind gennem en dør med kortlås, finder et tomt mødelokale og sætter en lille enhed i et ledigt netværksstik; en regel om ikke at lukke andre ind og slukkede stik havde stoppet det.
  whyItMatters:
    en: Anyone with hands on a machine can often get around its digital protection, and fire or flooding can end availability as surely as any attack.
    da: Den, der har fysisk adgang til en maskine, kan ofte komme uden om dens digitale beskyttelse, og brand eller oversvømmelse kan fjerne tilgængeligheden lige så sikkert som et angreb.
deepDive:
  en: |-
    Physical security is the control domain that protects the tangible environment of information: sites, rooms, cabling, devices and paper. ISO/IEC 27002:2022 gathers it under clause 7 (Physical controls), which spans physical security perimeters, entry controls, securing offices and facilities, protection against physical and environmental threats, working in secure areas, clear desk and clear screen, equipment siting and protection, supporting utilities, cabling security, equipment maintenance, and secure disposal or re-use of equipment. These sit alongside the organisational, people and technological controls in the same standard, reflecting that a control failure in any one domain can undo the others.

    In practice physical controls are layered in concentric rings - site fence, building, floor, room, cabinet - so that defeating one barrier does not grant access to the asset, a physical analogue of defence-in-depth. Deterrent, preventive, detective and corrective measures are combined: fencing and lighting deter, card readers and mantraps (interlocking double-door vestibules that defeat tailgating) prevent, CCTV and intrusion sensors detect, and guards or response procedures correct. A central threat is tailgating or piggybacking, where an unauthorised person follows an authorised one through a controlled door; anti-passback logic in the access system and mantraps are the standard countermeasures. Environmental protection is equally part of the domain: fire detection and suppression (VESDA aspirating detection, inert-gas or clean-agent systems rather than water in server rooms), redundant power via UPS and generators, and HVAC for temperature and humidity all defend availability, since a flood or overheating ends service as effectively as an intruder.

    Data centres formalise this with tiered availability models: the Uptime Institute Tier I-IV classification (Tier IV being fault-tolerant with concurrently maintainable, redundant infrastructure) and the EN 50600 series in Europe define expected redundancy and physical protection. Access is typically logged and often gated by multi-factor physical authentication (card plus PIN or biometric), and racks themselves are locked so that colocation tenants cannot reach each other's hardware.

    A key principle is that physical access frequently defeats logical controls: an attacker with hands on a device can boot from external media, extract disks, capture data from memory (cold-boot attacks), attach a hardware keylogger, or plant a rogue network implant, which is why full-disk encryption, disabled boot from removable media, port control and tamper-evident seals matter. A common misconception is that physical security is a facilities concern separate from cyber; NIS2 and ISO 27001 treat it as an integral part of information security precisely because so many logical protections assume the attacker is remote. Secure disposal is the frequently forgotten end of the lifecycle: drives and multifunction printers retain data and must be sanitised (per NIST SP 800-88 media-sanitisation guidance) or physically destroyed before disposal.
  da: |-
    Fysisk sikkerhed er det kontroldomæne, der beskytter informationens håndgribelige omgivelser: lokaler, rum, kabling, enheder og papir. ISO/IEC 27002:2022 samler det under clause 7 (Physical controls), som spænder over fysiske sikkerhedsperimetre, adgangskontrol, sikring af kontorer og faciliteter, beskyttelse mod fysiske og miljømæssige trusler, arbejde i sikre områder, clear desk og clear screen, placering og beskyttelse af udstyr, understøttende forsyninger, kabelsikkerhed, vedligeholdelse af udstyr samt sikker bortskaffelse eller genbrug af udstyr. De står side om side med de organisatoriske, menneskelige og teknologiske kontroller i samme standard og afspejler, at en svigtende kontrol i ét domæne kan ophæve de andre.

    I praksis lagdeles fysiske kontroller i koncentriske ringe - hegn, bygning, etage, rum, skab - så det at bryde én barriere ikke giver adgang til aktivet, en fysisk pendant til defence-in-depth. Afskrækkende, forebyggende, opdagende og korrigerende foranstaltninger kombineres: hegn og belysning afskrækker, kortlæsere og sluser (mantraps - dobbeltdørs-slusen, der modvirker tailgating) forebygger, CCTV og indbrudssensorer opdager, og vagter eller responsprocedurer korrigerer. En central trussel er tailgating eller piggybacking, hvor en uvedkommende følger en autoriseret person gennem en kontrolleret dør; anti-passback-logik i adgangssystemet og sluser er standardmodforanstaltningerne. Miljøbeskyttelse er ligeledes en del af domænet: branddetektion og -slukning (VESDA-aspirationsdetektion, inertgas- eller clean agent-systemer frem for vand i serverrum), redundant strøm via UPS og generatorer samt HVAC til temperatur og fugt beskytter alle tilgængeligheden, for en oversvømmelse eller overophedning stopper driften lige så effektivt som en ubuden gæst.

    Datacentre formaliserer dette med lagdelte tilgængelighedsmodeller: Uptime Institutes Tier I-IV-klassifikation (Tier IV er fejltolerant med samtidig vedligeholdelsesvenlig, redundant infrastruktur) og EN 50600-serien i Europa definerer forventet redundans og fysisk beskyttelse. Adgang logges typisk og er ofte betinget af fysisk multifaktor-autentificering (kort plus PIN eller biometri), og selve rack-skabene er låst, så colocation-lejere ikke kan nå hinandens hardware.

    Et centralt princip er, at fysisk adgang ofte slår logiske kontroller: en angriber med hænderne på en enhed kan boote fra eksternt medie, udtrække diske, opsnappe data fra hukommelsen (cold-boot-angreb), montere en hardware-keylogger eller plante et rogue netværksimplantat - derfor er fulddiskkryptering, deaktiveret boot fra flytbare medier, portkontrol og tamper-evident-forseglinger vigtige. En udbredt misforståelse er, at fysisk sikkerhed er et facility-anliggende adskilt fra cybersikkerhed; NIS2 og ISO 27001 behandler det som en integreret del af informationssikkerheden, netop fordi så mange logiske beskyttelser antager, at angriberen er ekstern. Sikker bortskaffelse er den ofte glemte ende af livscyklussen: diske og multifunktionsprintere gemmer data og skal saneres (efter NIST SP 800-88's retningslinjer for mediesanering) eller destrueres fysisk før bortskaffelse.
howTo:
  steps:
    en:
      - List the sites, rooms and equipment that hold or process important information, including server rooms, network cabinets, printers and paper archives, with an owner for each.
      - Assess the physical and environmental threats for each location, such as break-in, tailgating, theft of laptops, fire, water and power loss.
      - Set up zones from public areas to secure rooms, with locks or card access at each boundary, and give people access only to the zones their work requires.
      - Stop tailgating with a clear rule, visible badges, visitor registration and escorts, and mantraps or anti-passback at the most sensitive doors.
      - Protect server rooms with fire detection and suitable suppression, UPS and backup power, cooling, and water and temperature sensors that raise an alarm.
      - Protect devices outside secure areas with full-disk encryption, locked screens, disabled unused network sockets and a clear desk rule.
      - Wipe or destroy disks, phones and printer drives before disposal or reuse following NIST SP 800-88, and keep a record for each device.
      - Review access lists and logs every quarter, remove leavers at once, and test alarms, backup power and the tailgating rule at least once a year.
    da:
      - Lav en liste over lokaler, rum og udstyr, der rummer eller behandler vigtig information, herunder serverrum, netværksskabe, printere og papirarkiver, med en ejer for hvert.
      - Vurdér de fysiske og miljømæssige trusler for hvert sted, fx indbrud, tailgating, tyveri af bærbare, brand, vand og strømsvigt.
      - Indret zoner fra offentlige områder til sikre rum med lås eller kortadgang ved hver grænse, og giv kun adgang til de zoner, som arbejdet kræver.
      - Stop tailgating med en klar regel, synlige adgangskort, registrering og ledsagelse af gæster og sluser eller anti-passback ved de mest følsomme døre.
      - Beskyt serverrum med branddetektion og egnet slukning, UPS og nødstrøm, køling samt vand- og temperatursensorer, der slår alarm.
      - Beskyt enheder uden for de sikre områder med fulddiskkryptering, låste skærme, slukkede ubrugte netværksstik og en clear desk-regel.
      - Slet eller destruér diske, telefoner og printerdiske før bortskaffelse eller genbrug efter NIST SP 800-88, og registrér hver enhed.
      - Gennemgå adgangslister og logs hvert kvartal, fjern fratrådte med det samme, og test alarmer, nødstrøm og tailgating-reglen mindst én gang om året.
  pitfalls:
    en:
      - Treating physical security as a facilities matter, so network sockets, printers and disposal are left out of the security work.
      - Access cards that are never withdrawn from leavers or temporary staff.
      - A tailgating rule that nobody enforces because it feels rude to stop a colleague.
      - Sending old disks and multifunction printers for recycling without wiping them.
    da:
      - At se fysisk sikkerhed som et anliggende for bygningsdriften, så netværksstik, printere og bortskaffelse falder uden for sikkerhedsarbejdet.
      - Adgangskort, der aldrig inddrages fra fratrådte eller midlertidige medarbejdere.
      - En tailgating-regel, som ingen håndhæver, fordi det føles uhøfligt at stoppe en kollega.
      - At sende gamle diske og multifunktionsprintere til genbrug uden at slette dem.
  guides:
    - title: NIST SP 800-88 Rev. 2 - Guidelines for Media Sanitization
      url: https://csrc.nist.gov/pubs/sp/800/88/r2/final
      publisher: NIST
      tier: standard
    - title: NIST SP 800-53 Rev. 5 - Security and Privacy Controls for Information Systems and Organizations (PE Physical and Environmental Protection)
      url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
      publisher: NIST
      tier: standard
    - title: Security Planning Workbook
      url: https://www.cisa.gov/resources-tools/resources/security-planning-workbook
      publisher: CISA
      tier: official-doc
edges:
  kind-of: [control]
  part-of: [defence-in-depth]
  requires: [asset]
  mitigates:
    - to: data-breach
      why:
        en: Locked rooms and guarded devices stop data from walking out on a stolen laptop, disk or printout.
        da: Låste rum og bevogtede enheder forhindrer, at data forsvinder med en stjålen bærbar, disk eller udskrift.
      strength: normal
      confidence: high
    - to: insider-threat
      why:
        en: Keeping staff out of rooms they do not need, such as the server room, limits what a careless or harmful insider can reach.
        da: At holde medarbejdere ude af rum, de ikke har brug for, fx serverrummet, begrænser, hvad en skødesløs eller ondsindet insider kan nå.
      strength: minor
      confidence: medium
sources:
