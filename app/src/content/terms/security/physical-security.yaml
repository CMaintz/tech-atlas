term:
  en: Physical security
  da: Fysisk sikkerhed
aka:
  en: [physical controls]
  da: [fysiske kontroller, fysisk sikring]
domain: [security]
cluster: fundamentals
status: current
summary:
  en: Protecting buildings, rooms and equipment so that nobody can simply walk in, take, break or plug into them.
  da: At beskytte bygninger, rum og udstyr, så ingen bare kan gå ind og tage, ødelægge eller koble sig på dem.
body:
  formal:
    en: The controls that protect the physical surroundings of information — sites, server rooms, devices and paper — against entry by outsiders, theft, damage and dangers such as fire, water and power loss. ISO 27002 groups them as its physical controls.
    da: De kontroller, der beskytter informationens fysiske omgivelser — lokaler, serverrum, enheder og papir — mod uvedkommende adgang, tyveri, skade og farer som brand, vand og strømsvigt. ISO 27002 samler dem som sine fysiske kontroller.
  plain:
    en: The best lock on a diary is no help if someone can simply pick up the whole diary and walk off with it.
    da: Den bedste lås på en dagbog hjælper ikke, hvis nogen bare kan tage hele dagbogen under armen og gå.
  inPractice:
    en: At a regional hospital, a visitor follows a porter through a card-locked door, finds an empty meeting room and plugs a small device into a free network socket; a no-following rule and switched-off sockets would have stopped it.
    da: På et regionshospital går en besøgende med en portør ind gennem en dør med kortlås, finder et tomt mødelokale og sætter en lille enhed i et ledigt netværksstik; en regel om ikke at lukke andre ind og slukkede stik havde stoppet det.
  whyItMatters:
    en: Anyone with hands on a machine can often get around its digital protection, and fire or flooding can end availability as surely as any attack.
    da: Den, der har fysisk adgang til en maskine, kan ofte komme uden om dens digitale beskyttelse, og brand eller oversvømmelse kan fjerne tilgængeligheden lige så sikkert som et angreb.
edges:
  kind-of: [control]
  part-of: [defence-in-depth]
  requires: [asset]
  mitigates:
    - to: data-breach
      why:
        en: Locked rooms and guarded devices stop data from walking out on a stolen laptop, disk or printout.
        da: Låste rum og bevogtede enheder forhindrer, at data forsvinder med en stjålen bærbar, disk eller udskrift.
      strength: normal
      confidence: high
    - to: insider-threat
      why:
        en: Keeping staff out of rooms they do not need, such as the server room, limits what a careless or harmful insider can reach.
        da: At holde medarbejdere ude af rum, de ikke har brug for, fx serverrummet, begrænser, hvad en skødesløs eller ondsindet insider kan nå.
      strength: minor
      confidence: medium
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: ISO/IEC 27002:2022 — clause 7, Physical controls
    tier: standard
    publisher: ISO/IEC
