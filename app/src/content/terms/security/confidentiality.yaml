term:
  en: Confidentiality
  da: Fortrolighed
aka:
  en: []
  da: []
domain: [security]
cluster: fundamentals
layer: data
status: current
summary:
  en: Making sure only the right people can see a piece of information.
  da: At sikre, at kun de rette personer kan se en given information.
body:
  formal:
    en: The property that information is not made available or disclosed to people, systems or processes that are not allowed to have it - whether it is stored, being sent or being printed.
    da: Egenskaben, at information ikke gøres tilgængelig eller videregives til personer, systemer eller processer, der ikke har lov til at få den - uanset om den er gemt, er på vej eller bliver printet.
  plain:
    en: Like a sealed letter - the address is on the outside, but only the person it is meant for should read what is inside.
    da: Som et lukket brev - adressen står udenpå, men kun den, brevet er til, bør læse indholdet.
  inPractice:
    en: In a municipality's HR system, salary details can be seen only by the payroll team and each employee's own manager, not by colleagues in other departments.
    da: I en kommunes HR-system kan lønoplysninger kun ses af lønkontoret og den enkelte medarbejders egen leder - ikke af kolleger i andre afdelinger.
  whyItMatters:
    en: Once secret information has leaked it cannot be taken back, and a leak of personal data must be reported to the authorities and can bring fines and lasting damage to trust.
    da: Når hemmelig information først er lækket, kan den ikke hentes tilbage, og et læk af personoplysninger skal anmeldes til myndighederne og kan give bøder og varig skade på tilliden.
deepDive:
  en: |-
    ISO/IEC 27000 defines confidentiality as the property that information is not made available or disclosed to unauthorised individuals, entities or processes. It is enforced by two families of mechanism that are easy to confuse. Access control decides who may read an object while it sits inside a system that enforces the rules; encryption protects the object when it leaves that enforcement boundary, on the wire, on a stolen disk, in a backup or at a cloud provider. Neither replaces the other: an encrypted database is fully readable by an application account with excessive privileges, and perfect access control is irrelevant once a file has been copied to a USB stick.

    Access-control models formalise the "who". Discretionary access control (DAC) lets owners grant access, as with file-system ACLs; mandatory access control (MAC) enforces system-wide labels, the classic example being the Bell-LaPadula model (1973) with its "no read up, no write down" rules for classified data; role-based access control (RBAC) attaches permissions to job roles; attribute-based access control (ABAC) evaluates policies over user, resource and context attributes at request time. Across all of them the governing principles are need-to-know and least privilege, and the operational weak point is usually privilege creep as people change jobs.

    For encryption, the usual split is data in transit (TLS 1.3, RFC 8446, with forward secrecy through ephemeral Diffie-Hellman so that a later key compromise does not expose recorded sessions), data at rest (full-disk, database or object-level encryption, where the real question is who controls the keys) and, increasingly, data in use through confidential computing enclaves. "Harvest now, decrypt later" is a confidentiality threat specific to long-lived secrets, and is the main argument for migrating to post-quantum key exchange before large quantum computers exist.

    Confidentiality also leaks through channels that access control does not model: metadata such as who communicates with whom and when, traffic analysis of encrypted flows, error messages and timing differences, side channels such as the Spectre and Meltdown CPU flaws disclosed in 2018, and inference from aggregated or "anonymised" datasets. Confidentiality is distinct from privacy, which is about lawful and fair processing of personal data even by authorised parties, and from integrity, which concerns modification rather than disclosure. Under GDPR, Art. 5(1)(f) and Art. 32 require appropriate confidentiality measures, with Art. 32(1)(a) naming encryption and pseudonymisation, and unauthorised disclosure is a personal data breach that must be assessed for notification to Datatilsynet within 72 hours under Art. 33.
  da: |-
    ISO/IEC 27000 definerer fortrolighed som egenskaben, at information ikke gøres tilgængelig eller videregives til uautoriserede personer, enheder eller processer. Den håndhæves af to familier af mekanismer, som er lette at blande sammen. Adgangskontrol afgør, hvem der må læse et objekt, mens det befinder sig i et system, der håndhæver reglerne; kryptering beskytter objektet, når det forlader denne grænse, på netværket, på en stjålet disk, i en backup eller hos en cloududbyder. Ingen af dem erstatter den anden: en krypteret database kan læses fuldt ud af en applikationskonto med for mange rettigheder, og perfekt adgangskontrol er ligegyldig, når en fil først er kopieret til en USB-nøgle.

    Adgangskontrolmodeller formaliserer "hvem". Discretionary access control (DAC) lader ejeren give adgang, som med ACL'er i filsystemet; mandatory access control (MAC) håndhæver systemdækkende mærkninger, hvor det klassiske eksempel er Bell-LaPadula-modellen (1973) med reglerne "no read up, no write down" for klassificerede data; rollebaseret adgangskontrol (RBAC) knytter rettigheder til jobroller; attributbaseret adgangskontrol (ABAC) evaluerer politikker over bruger-, ressource- og kontekstattributter på forespørgselstidspunktet. For dem alle gælder principperne need-to-know og mindste privilegium, og det operationelle svage punkt er som regel, at rettigheder hober sig op, når folk skifter job.

    Kryptering opdeles normalt i data i transit (TLS 1.3, RFC 8446, med forward secrecy via efemær Diffie-Hellman, så et senere nøglekompromis ikke afslører optagede sessioner), data at rest (kryptering af hele disken, databasen eller enkelte objekter, hvor det egentlige spørgsmål er, hvem der styrer nøglerne) og i stigende grad data in use via confidential computing-enklaver. "Harvest now, decrypt later" er en trussel mod fortroligheden for hemmeligheder med lang levetid og det vigtigste argument for at gå over til post-kvante-nøgleudveksling, før store kvantecomputere findes.

    Fortrolighed lækker også gennem kanaler, som adgangskontrol ikke modellerer: metadata om, hvem der kommunikerer med hvem og hvornår, trafikanalyse af krypterede strømme, fejlmeddelelser og tidsforskelle, sidekanaler som CPU-fejlene Spectre og Meltdown, der blev offentliggjort i 2018, og slutninger fra aggregerede eller "anonymiserede" datasæt. Fortrolighed er ikke det samme som privatliv, der handler om lovlig og rimelig behandling af personoplysninger, også hos autoriserede parter, og heller ikke integritet, der handler om ændring frem for videregivelse. Efter databeskyttelsesforordningen kræver art. 5, stk. 1, litra f, og art. 32 passende fortrolighedsforanstaltninger, hvor art. 32, stk. 1, litra a, nævner kryptering og pseudonymisering, og uautoriseret videregivelse er et brud på persondatasikkerheden, som efter art. 33 skal vurderes med henblik på anmeldelse til Datatilsynet inden for 72 timer.
edges:
  part-of: [cia-triad]
  contrasts-with:
    - to: integrity
      why:
        en: Confidentiality is about who can see information; integrity is about whether it has been changed.
        da: Fortrolighed handler om, hvem der kan se informationen; integritet handler om, hvorvidt den er blevet ændret.
      strength: primary
      confidence: high
