term:
  en: GDPR
  da: GDPR
aka:
  en: [General Data Protection Regulation, Regulation (EU) 2016/679]
  da: [Databeskyttelsesforordningen, persondataforordningen]
domain: [security]
cluster: compliance
layer: data
status: current
summary:
  en: The EU law that protects personal data and gives people rights over how it is used.
  da: EU's databeskyttelseslov, der beskytter personoplysninger og giver folk rettigheder over, hvordan de bruges.
body:
  formal:
    en: An EU regulation, applied directly in every member state since 2018, that sets principles, legal grounds and security duties for handling data about people who can be named or traced, with fines up to 4% of global turnover.
    da: En EU-forordning, der har gældt direkte i alle medlemslande siden 2018, og som fastsætter principper, lovligt grundlag og sikkerhedspligter for behandling af oplysninger om personer, der kan identificeres, med bøder på op til 4 % af den globale omsætning.
  plain:
    en: Information about you is treated as yours — others may borrow it only for a fair reason, must look after it and must tell you what they do with it.
    da: Oplysninger om dig betragtes som dine — andre må kun låne dem af en rimelig grund, skal passe på dem og skal fortælle dig, hvad de gør med dem.
  inPractice:
    en: After a laptop with customer lists is stolen, a shop has 72 hours to tell the Danish data protection authority and must judge whether customers need to be told too.
    da: Efter at en bærbar med kundelister er stjålet, har en butik 72 timer til at anmelde det til Datatilsynet og skal vurdere, om kunderne også skal underrettes.
  whyItMatters:
    en: It makes privacy a legal duty with real penalties, and it overlaps with NIS2 so one data breach can trigger reports under both laws.
    da: Den gør privatliv til en juridisk pligt med reelle sanktioner, og den overlapper med NIS2, så ét databrud kan udløse anmeldelser efter begge love.
edges:
  requires: [confidentiality]
  mandates:
    - to: privacy-by-design
      why:
        en: Article 25 requires data protection to be built in from the start and by default.
        da: Artikel 25 kræver, at databeskyttelse bygges ind fra starten og som standard.
      strength: primary
      confidence: high
    - to: data-processing-agreement
      why:
        en: Article 28 requires a written contract whenever a supplier handles personal data for you.
        da: Artikel 28 kræver en skriftlig aftale, når en leverandør behandler persondata for en.
      strength: primary
      confidence: high
    - to: incident-response
      why:
        en: Personal data breaches must be reported to the authority within 72 hours.
        da: Brud på persondatasikkerheden skal anmeldes til myndigheden inden for 72 timer.
      strength: normal
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: GDPR protects people's personal data; NIS2 protects the services society depends on.
        da: GDPR beskytter menneskers persondata; NIS2 beskytter de tjenester, samfundet er afhængigt af.
      strength: primary
      confidence: high
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: Regulation (EU) 2016/679 (GDPR)
    tier: standard
    publisher: European Union
    url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj'
