term:
  en: GDPR
  da: GDPR
aka:
  en: [General Data Protection Regulation, Regulation (EU) 2016/679]
  da: [Databeskyttelsesforordningen, persondataforordningen]
domain: [security]
cluster: compliance
layer: data
status: current
era: 2016
summary:
  en: The EU law that protects personal data and gives people rights over how it is used.
  da: EU's databeskyttelseslov, der beskytter personoplysninger og giver folk rettigheder over, hvordan de bruges.
body:
  formal:
    en: Regulation (EU) 2016/679, applying directly in every member state since 25 May 2018, which sets principles, legal grounds, rights and security duties for processing data about identifiable people, with fines of up to 20 million euro or 4% of global turnover.
    da: Forordning (EU) 2016/679, der har gældt direkte i alle medlemslande siden 25. maj 2018 og fastsætter principper, lovligt grundlag, rettigheder og sikkerhedspligter for behandling af oplysninger om personer, der kan identificeres, med bøder på op til 20 mio. euro eller 4 % af den globale omsætning.
  plain:
    en: Information about you is treated as yours — others may borrow it only for a fair reason, must look after it and must tell you what they do with it.
    da: Oplysninger om dig betragtes som dine — andre må kun låne dem af en god grund, skal passe på dem og skal fortælle dig, hvad de gør med dem.
  inPractice:
    en: When a laptop holding customer lists is stolen from the owner's car, a Danish web shop has 72 hours to report the breach to Datatilsynet and must decide whether the customers themselves need to be told.
    da: Da en bærbar med kundelister bliver stjålet fra indehaverens bil, har en dansk webshop 72 timer til at anmelde bruddet til Datatilsynet og skal vurdere, om kunderne selv skal have besked.
  whyItMatters:
    en: Before it, data protection rules differed from country to country and were weakly enforced; GDPR gave people the same rights across the EU and made breaking them costly.
    da: Før GDPR var reglerne for databeskyttelse forskellige fra land til land og blev kun svagt håndhævet; forordningen gav borgerne de samme rettigheder i hele EU og gjorde det dyrt at overtræde dem.
edges:
  requires:
    - confidentiality
    - personal-data
  mandates:
    - to: privacy-by-design
      why:
        en: Article 25 requires data protection to be built in from the start and by default.
        da: Artikel 25 kræver, at databeskyttelse bygges ind fra starten og som standard.
      strength: primary
      confidence: high
    - to: data-processing-agreement
      why:
        en: Article 28 requires a written contract whenever a supplier handles personal data for you.
        da: Artikel 28 kræver en skriftlig aftale, når en leverandør behandler personoplysninger for en.
      strength: primary
      confidence: high
    - to: incident-response
      why:
        en: Personal data breaches must be reported to the authority within 72 hours.
        da: Brud på persondatasikkerheden skal anmeldes til myndigheden inden for 72 timer.
      strength: normal
      confidence: high
    - supervisory-authority
    - to: dpia
      why:
        en: "Article 35 requires a DPIA before any processing likely to pose a high risk to people's rights."
        da: Artikel 35 kræver en konsekvensanalyse før enhver behandling, der sandsynligvis indebærer en høj risiko for personers rettigheder.
      strength: primary
      confidence: high
  contrasts-with:
    - to: nis2
      why:
        en: GDPR protects people's personal data; NIS2 protects the services society depends on.
        da: GDPR beskytter menneskers personoplysninger; NIS2 beskytter de tjenester, samfundet er afhængigt af.
      strength: primary
      confidence: high
  used-with: [training-data]
  kind-of: [eu-regulation]
