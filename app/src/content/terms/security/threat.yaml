term:
  en: Threat
  da: Trussel
aka:
  en: []
  da: []
domain: [security]
cluster: fundamentals
layer: governance
status: current
summary:
  en: Anything that could harm the organisation — an attacker, a careless mistake, a fire or a power cut.
  da: Alt, der kan skade virksomheden — en angriber, en skødesløs fejl, en brand eller et strømsvigt.
body:
  formal:
    en: Any person, event or circumstance with the potential to cause harm to information or systems by damaging their confidentiality, integrity or availability.
    da: Enhver person, hændelse eller omstændighed, der kan forvolde skade på information eller systemer ved at ramme deres fortrolighed, integritet eller tilgængelighed.
  plain:
    en: Like a burglar in the neighbourhood or a storm in the forecast — it has not hurt you yet, but it could.
    da: Som en indbrudstyv i kvarteret eller en storm i vejrudsigten — den har ikke ramt dig endnu, men den kunne.
  inPractice:
    en: A company lists its threats — criminal groups sending phishing mails, staff mistakes, and flooding of the basement server room.
    da: En virksomhed opstiller sine trusler — kriminelle grupper, der sender phishing-mails, fejl begået af medarbejdere og oversvømmelse af serverrummet i kælderen.
  whyItMatters:
    en: You cannot guard against what you have not named; knowing the threats tells you what to prepare for and what to ignore.
    da: Man kan ikke beskytte sig mod det, man ikke har sat navn på; kender man truslerne, ved man, hvad man skal forberede sig på, og hvad man kan se bort fra.
edges:
  exploits:
    - to: vulnerability
      why:
        en: A threat only does harm when it finds a weakness to use.
        da: En trussel gør først skade, når den finder en svaghed at udnytte.
      strength: primary
      confidence: high
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments
    tier: standard
    publisher: NIST
draft: true
