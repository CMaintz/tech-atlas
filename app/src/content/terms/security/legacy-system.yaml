term:
  en: Legacy system
  da: Legacy-system
aka:
  en: [legacy software, end-of-life system]
  da: [forældet system, ældre system]
domain: [security, cs]
cluster: fundamentals
layer: host
status: current
summary:
  en: An old system the business still depends on but that can no longer be updated, replaced or protected in the normal way.
  da: Et gammelt system, som forretningen stadig er afhængig af, men som ikke længere kan opdateres, udskiftes eller beskyttes på normal vis.
body:
  formal:
    en: Hardware or software that remains in use after its maker has stopped releasing patches, or that cannot run modern security features, so known weaknesses stay open and must be handled by other means.
    da: Hardware eller software, der stadig er i brug, efter at producenten er holdt op med at udgive patches, eller som ikke kan køre moderne sikkerhedsfunktioner, så kendte svagheder forbliver åbne og må håndteres på andre måder.
  plain:
    en: Like an old car whose maker went out of business — it still drives, but when something breaks there are no new parts.
    da: Som en gammel bil, hvis fabrik er lukket — den kører stadig, men når noget går i stykker, findes der ingen nye reservedele.
  inPractice:
    en: A factory's machine runs on a Windows version that stopped getting updates years ago, so IT puts it on its own network segment with no internet access and watches its traffic.
    da: En fabriks maskine kører på en Windows-version, der holdt op med at få opdateringer for mange år siden, så IT placerer den i sit eget netværkssegment uden internetadgang og overvåger dens trafik.
  whyItMatters:
    en: Such systems often run the most important processes, so they cannot simply be switched off, yet every year they grow easier to attack.
    da: Den slags systemer driver ofte de vigtigste processer, så de kan ikke bare slukkes, men hvert år bliver de lettere at angribe.
edges:
  causes:
    - to: vulnerability
      why:
        en: Without new patches, every weakness found after support ends stays open for good.
        da: Uden nye patches forbliver enhver svaghed, der findes efter supportens ophør, åben for altid.
      strength: primary
      confidence: high
  used-with:
    - to: network-segmentation
      why:
        en: Putting an old system on its own segment limits who can reach it when it cannot be fixed.
        da: At placere et gammelt system i sit eget segment begrænser, hvem der kan nå det, når det ikke kan rettes.
      confidence: high
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 4
    tier: course-material
  - title: CIS Critical Security Controls v8.1 (Control 2 — Inventory and Control of Software Assets)
    tier: standard
