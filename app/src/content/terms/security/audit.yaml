term:
  en: Audit
  da: Audit
aka:
  en: [compliance audit, security audit, internal audit]
  da: [revision, intern audit]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: An independent check of whether an organisation actually follows its own policies and the requirements it has signed up to.
  da: En uafhængig gennemgang af, om en organisation faktisk følger sine egne politikker og de krav, den har forpligtet sig til.
body:
  formal:
    en: A planned, documented and impartial examination that gathers evidence — samples, records, interviews — to judge whether practice matches set criteria such as policies, contracts, laws or a standard, and reports each deviation as a finding.
    da: En planlagt, dokumenteret og upartisk undersøgelse, der indsamler beviser — stikprøver, dokumenter, interview — for at vurdere, om praksis svarer til fastsatte kriterier som politikker, aftaler, love eller en standard, og som rapporterer hver afvigelse som et fund.
  plain:
    en: Like the regular car inspection — the owner may say the brakes are fine, but the inspector puts the car on the test bench and checks for real.
    da: Som når bilen skal til syn — ejeren kan godt sige, at bremserne er i orden, men synsmanden kører bilen op på rullefeltet og tjekker det selv.
  inPractice:
    en: An internal auditor at a Danish region picks twenty staff who left last year and finds that four still have active accounts in the patient system; the report lists it as a finding with a deadline.
    da: En intern auditor i en region vælger tyve medarbejdere ud,, der stoppede sidste år, og finder, at fire stadig har aktive konti i patientsystemet; rapporten angiver det som et fund med en frist.
  whyItMatters:
    en: Written rules slowly drift away from what people actually do; without a regular, independent check, nobody notices until an incident or a customer exposes the gap.
    da: Skrevne regler og den daglige praksis glider langsomt fra hinanden; uden en fast, uafhængig kontrol opdager ingen det, før en hændelse eller en kunde afslører hullet.
edges:
  requires: [security-policy, compliance]
  contrasts-with:
    - to: gap-analysis
      why:
        en: A gap analysis finds what is missing before you start; an audit checks whether what you claim to do is really done.
        da: En gap-analyse finder, hvad der mangler, før man går i gang; en audit kontrollerer, om det, man siger, man gør, faktisk bliver gjort.
      strength: primary
      confidence: high
    - self-assessment
  used-with:
    - to: pdca
      why:
        en: Audits supply the evidence for the Check step of the improvement cycle.
        da: Audits leverer beviserne til Check-trinnet i forbedringscyklussen.
      strength: normal
      confidence: high
    - to: supplier-management
      why:
        en: Organisations audit key suppliers, or read their audit reports, to check they keep their promises.
        da: Virksomheder auditerer vigtige leverandører eller læser deres auditrapporter for at tjekke, at de holder det, de lover.
      strength: normal
      confidence: high
    - explainability
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: ISO/IEC 27001:2022, Clause 9.2 (Internal audit)
    tier: standard
    publisher: ISO/IEC
draft: true
