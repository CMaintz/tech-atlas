term:
  en: Intrusion prevention system (IPS)
  da: Indtrængningsforebyggelse (IPS)
aka:
  en: [IPS]
  da: [IPS, system til indtrængningsforebyggelse]
domain: [security]
cluster: controls
layer: network
status: current
era: 2003
summary:
  en: A guard placed in the path of network traffic that recognises signs of an attack and blocks them as they happen.
  da: En vagt placeret i netværkstrafikkens vej, som genkender tegn på angreb og blokerer dem, mens de sker.
body:
  formal:
    en: A system placed directly in the flow of network packets that checks each against known attack patterns or unusual behaviour and drops or cuts off the traffic it judges harmful before it reaches its target.
    da: Et system placeret direkte i strømmen af netværkspakker, som tjekker hver enkelt mod kendte angrebsmønstre eller usædvanlig adfærd og kasserer eller afbryder den trafik, det vurderer som skadelig, før den når sit mål.
  plain:
    en: Like a bouncer at the door who turns away anyone matching a description, instead of just phoning the police.
    da: Som en dørmand, der afviser enhver, der passer på en efterlysning, i stedet for bare at ringe til politiet.
  inPractice:
    en: An outside server sends a request built to abuse a known flaw in a municipality's self-service site for citizens; the IPS recognises the pattern and drops it, and the network team sees only a blocked entry in the log.
    da: En fremmed server sender en forespørgsel, der er lavet til at misbruge en kendt fejl i kommunens selvbetjening for borgere; IPS'en genkender mønstret og kasserer den, og netværksteamet ser kun en blokering i loggen.
  whyItMatters:
    en: It stops attacks without waiting for a human, but a wrong judgement blocks real users too - so rules must be tuned to balance safety against availability.
    da: Den stopper angreb uden at vente på et menneske, men en forkert vurdering blokerer også rigtige brugere - så reglerne skal justeres, så sikkerhed og tilgængelighed balancerer.
deepDive:
  en: |-
    An IPS is an intrusion detection engine given the authority to act, which requires it to sit inline - as a transparent bridge, a routed hop, or a module inside a next-generation firewall - so that every packet passes through it before being forwarded. NIST SP 800-94 groups IDS and IPS together as IDPS and lists the typical prevention actions: dropping the offending packet, terminating the session with TCP resets, blocking the source address for a period, rewriting or normalising malicious content, and instructing a firewall or router to change its rules. In open-source deployments Suricata or Snort run in IPS mode by receiving packets from the kernel through mechanisms such as Linux NFQUEUE or AF_PACKET in inline mode and returning a verdict for each; commercial appliances use dedicated hardware to inspect at line rate.

    Being inline changes the engineering constraints. The IPS adds latency and becomes a single point of failure, so designs must decide between fail-open (traffic bypasses inspection if the engine or appliance fails, often via a hardware bypass module) and fail-closed (traffic stops). Throughput figures from vendors usually assume a minimal rule set; enabling full signatures, TLS decryption and file inspection can cut real throughput substantially. Stream reassembly and protocol normalisation must be complete before a verdict, since the IPS, unlike a passive IDS, cannot reconstruct traffic afterwards.

    False positives are the operational risk that most distinguishes an IPS from an IDS: an IDS false positive costs analyst time, an IPS false positive is a self-inflicted outage. Deployment therefore usually starts in detect-only mode, measures which signatures fire on legitimate traffic, and enables blocking selectively for high-confidence signatures - typically exploit signatures for specific CVEs - while leaving broad heuristics in alert mode. This targeted use is often called virtual patching: blocking exploitation of a known vulnerability on the wire while the actual patch is tested and rolled out. It is a compensating control, not a fix, and it fails against encrypted traffic the IPS cannot decrypt and against exploit variants that the signature does not match.

    Related concepts: a web application firewall (WAF) is an application-layer IPS specialised in HTTP, operating on parsed requests rather than packets; host-based IPS functionality is today largely absorbed into EDR; and the IPS modules in NGFWs have largely replaced standalone appliances in enterprise perimeters, although standalone sensors remain common in data centres and OT environments where inline blocking must be tightly controlled.
  da: |-
    En IPS er en detektionsmotor, der har fået beføjelse til at handle, og det kræver, at den sidder inline - som en transparent bro, et routet hop eller et modul i en next-generation firewall - så hver pakke passerer den, før den sendes videre. NIST SP 800-94 behandler IDS og IPS samlet som IDPS og nævner de typiske forebyggende handlinger: at kassere den skadelige pakke, afbryde sessionen med TCP-resets, blokere kildeadressen i en periode, omskrive eller normalisere skadeligt indhold og instruere en firewall eller router i at ændre sine regler. I open source-opsætninger kører Suricata eller Snort i IPS-tilstand ved at modtage pakker fra kernen via mekanismer som Linux NFQUEUE eller AF_PACKET i inline-tilstand og returnere en afgørelse for hver enkelt; kommercielle appliances bruger dedikeret hardware til at inspicere ved linjehastighed.

    At sidde inline ændrer de tekniske rammer. IPS'en tilføjer forsinkelse og bliver et single point of failure, så designet skal vælge mellem fail-open (trafikken går uden om inspektionen, hvis motoren eller enheden fejler, ofte via et hardware-bypassmodul) og fail-closed (trafikken stopper). Leverandørernes tal for gennemløb forudsætter som regel et minimalt regelsæt; aktiveres alle signaturer, TLS-dekryptering og filinspektion, kan det reelle gennemløb falde betydeligt. Strømsamling og protokolnormalisering skal være fuldført, før der træffes en afgørelse, fordi en IPS i modsætning til en passiv IDS ikke kan rekonstruere trafikken bagefter.

    Falske positiver er den driftsrisiko, der mest adskiller en IPS fra en IDS: en falsk positiv i en IDS koster analytikertid, en falsk positiv i en IPS er et selvforskyldt nedbrud. Udrulning starter derfor normalt i ren detektionstilstand, måler hvilke signaturer der udløses af legitim trafik, og slår blokering til selektivt for signaturer med høj træfsikkerhed - typisk exploit-signaturer for konkrete CVE'er - mens brede heuristikker forbliver i alarmtilstand. Denne målrettede brug kaldes ofte virtuel patching: udnyttelse af en kendt sårbarhed blokeres på nettet, mens den egentlige patch testes og rulles ud. Det er en kompenserende kontrol, ikke en rettelse, og den svigter over for krypteret trafik, som IPS'en ikke kan dekryptere, og over for exploit-varianter, som signaturen ikke matcher.

    Beslægtede begreber: en web application firewall (WAF) er en IPS på applikationslaget, specialiseret i HTTP og arbejdende på parsede forespørgsler frem for pakker; værtsbaseret IPS-funktionalitet er i dag stort set opslugt af EDR; og IPS-modulerne i NGFW'er har stort set erstattet selvstændige appliances ved virksomhedens perimeter, selv om selvstændige sensorer stadig er almindelige i datacentre og OT-miljøer, hvor inline-blokering skal styres stramt.
howTo:
  steps:
    en:
      - Decide which traffic the IPS must protect, typically the internet edge and the paths into servers holding critical data, and name who owns the decision to block.
      - Place the IPS inline, as a module in the next-generation firewall or as a dedicated sensor, and choose fail-open or fail-closed for each link depending on whether availability or protection matters most.
      - Size it for peak traffic with all the rules, TLS inspection and file checks you plan to turn on, not for the vendor's headline throughput.
      - Run it in detect-only mode for the first weeks, and record which signatures fire on legitimate traffic.
      - Turn on blocking first for high-confidence signatures, such as exploits for specific CVEs in software you actually run, and leave broad heuristics in alert mode.
      - Use targeted signatures as a virtual patch when a critical vulnerability cannot be patched at once, and give each one an end date tied to the real patch.
      - Send every block and alert to the SIEM, and give the service desk a fast way to report and lift a block when legitimate traffic is stopped.
      - Update signatures automatically, review blocking rules and exceptions every quarter, and test failover so the chosen fail mode actually works.
    da:
      - Beslut, hvilken trafik IPS'en skal beskytte, typisk internetkanten og vejene ind til servere med kritiske data, og udpeg, hvem der ejer beslutningen om at blokere.
      - Placér IPS'en inline, som modul i next-generation firewallen eller som selvstændig sensor, og vælg fail-open eller fail-closed for hver forbindelse efter, om tilgængelighed eller beskyttelse vejer tungest.
      - Dimensionér den til spidsbelastning med alle de regler, den TLS-inspektion og de filtjek, I vil slå til, og ikke efter leverandørens overskriftstal for gennemløb.
      - Kør den i ren detektionstilstand de første uger, og notér, hvilke signaturer der udløses af legitim trafik.
      - Slå først blokering til for signaturer med høj træfsikkerhed, fx exploits mod konkrete CVE'er i software, I faktisk bruger, og lad brede heuristikker blive i alarmtilstand.
      - Brug målrettede signaturer som virtuel patch, når en kritisk sårbarhed ikke kan patches med det samme, og giv hver af dem en slutdato knyttet til den rigtige patch.
      - Send alle blokeringer og alarmer til SIEM'en, og giv servicedesken en hurtig vej til at melde og ophæve en blokering, når legitim trafik bliver stoppet.
      - Opdatér signaturer automatisk, gennemgå blokeringsregler og undtagelser hvert kvartal, og test failover, så den valgte fejltilstand faktisk virker.
  pitfalls:
    en:
      - Turning on blocking for every signature on day one and causing a self-inflicted outage.
      - Treating a virtual patch as the fix and never installing the real patch.
      - Assuming the IPS stops attacks hidden in encrypted traffic that it cannot decrypt.
    da:
      - At slå blokering til for alle signaturer fra første dag og dermed skabe et selvforskyldt nedbrud.
      - At betragte en virtuel patch som løsningen og aldrig installere den rigtige patch.
      - At regne med, at IPS'en stopper angreb gemt i krypteret trafik, som den ikke kan dekryptere.
