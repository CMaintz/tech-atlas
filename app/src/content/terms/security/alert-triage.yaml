term:
  en: Alert triage
  da: Triage af alarmer
aka:
  en: [alarm triage]
  da: [alarmtriage]
domain: [security]
cluster: security-operations
layer: people
status: current
summary:
  en: Sorting incoming alarms quickly into real threats, harmless noise and cases that need a closer look, so the worst get handled first.
  da: Hurtig sortering af indkomne alarmer i reelle trusler, harmløs støj og sager, der kræver et nærmere kig, så de værste håndteres først.
body:
  formal:
    en: The first step of handling an alarm, in which an analyst checks its context, decides whether it points to a real security incident, gives it a priority and either closes it or passes it on — up to management when the harm could be serious.
    da: Det første trin i håndteringen af en alarm, hvor en analytiker undersøger sammenhængen, afgør, om den peger på en reel sikkerhedshændelse, giver den en prioritet og enten lukker den eller sender den videre — helt op til ledelsen, når skaden kan blive alvorlig.
  plain:
    en: Like the nurse at a hospital's emergency desk who looks at everyone coming in and decides who sees a doctor now, who can wait, and who can go home.
    da: Som sygeplejersken i skadestuens modtagelse, der ser på alle, der kommer ind, og afgør, hvem der skal til lægen nu, hvem der kan vente, og hvem der kan gå hjem.
  inPractice:
    en: Of forty overnight alarms in a region's SOC, the analyst closes thirty-five as a known backup job, groups four into one case about a single laptop, and sends the last — an admin login from abroad — straight to the on-call lead.
    da: Af fyrre alarmer i en regions SOC i løbet af natten lukker analytikeren 35 som et kendt backupjob, samler fire i én sag om en enkelt bærbar og sender den sidste — et admin-login fra udlandet — straks videre til den vagthavende leder.
  whyItMatters:
    en: A team cannot look deeply at every alarm, so the quality of this first sort decides whether a real attack is caught in minutes or lost among hundreds of harmless ones.
    da: Et team kan ikke gå i dybden med hver alarm, så kvaliteten af den første sortering afgør, om et reelt angreb fanges på minutter eller drukner blandt hundredvis af harmløse.
edges:
  part-of: [incident-response]
  requires: [alerting]
  used-with:
    - to: false-positive
      why:
        en: Much of the work is spotting false alarms quickly, so real ones get the time they need.
        da: En stor del af arbejdet er hurtigt at genkende falske alarmer, så de reelle får den tid, de kræver.
      strength: primary
      confidence: high
    - soc
    - incident-reporting
  contrasts-with:
    - to: threat-hunting
      why:
        en: Triage reacts to alarms that tools have already raised; hunting starts from a guess and searches for what raised no alarm.
        da: Triage reagerer på alarmer, værktøjerne allerede har rejst; trusselsjagt starter fra et gæt og leder efter det, der ikke gav alarm.
      strength: primary
      confidence: high
sources:
