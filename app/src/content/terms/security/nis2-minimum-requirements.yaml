edges:
  part-of: [nis2]
  mandates:
    - to: business-continuity-plan
      why:
        en: Business continuity, including backup and crisis management, is a listed measure.
        da: Evnen til at holde driften i gang, herunder backup og krisestyring, er et af de nævnte tiltag.
      strength: primary
      confidence: high
    - to: backup
      strength: normal
      confidence: high
    - to: mfa
      why:
        en: Multi-factor authentication is named explicitly as a measure to use where appropriate.
        da: Multifaktorgodkendelse er nævnt direkte som et tiltag, der skal bruges, hvor det er relevant.
      strength: normal
      confidence: high
    - to: encryption
      strength: normal
      confidence: high
    - to: asset-inventory
      why:
        en: Asset management is listed alongside access control and staff security.
        da: Styring af aktiver er nævnt sammen med adgangsstyring og personalesikkerhed.
      strength: minor
      confidence: medium
    - risk-management
    - incident-response
    - security-awareness
    - supplier-management
