term:
  en: Cross-site scripting (XSS)
  da: Cross-site scripting (XSS)
aka:
  en: [XSS]
  da: [XSS]
domain: [security]
cluster: application-security
layer: application
status: current
era: 2000
summary:
  en: An attack that smuggles a harmful script into a web page, so it runs in the browser of everyone who visits the page.
  da: Et angreb, der smugler et skadeligt script ind på en webside, så det kører i browseren hos alle, der besøger siden.
body:
  formal:
    en: A flaw in a web application that places untrusted input into its pages without making it safe first; the web browser then runs that input as code with the same rights as the site's own code, so it can read what the user sees and act in their name.
    da: En fejl i en webapplikation, der sætter input udefra ind i sine sider uden først at gøre det ufarligt; webbrowseren kører så inputtet som kode med samme rettigheder som sitets egen kode og kan dermed læse, hvad brugeren ser, og handle i brugerens navn.
  plain:
    en: Like a notice board where someone pins up a note that, when read aloud, makes the reader hand over their house keys - the board itself never checks what is pinned to it.
    da: Som en opslagstavle, hvor nogen hænger en seddel op, der får den, der læser den højt, til at udlevere sine husnøgler - tavlen tjekker aldrig, hvad der bliver hængt op.
  inPractice:
    en: An attacker posts a comment with a hidden script on a municipality's public consultation page; every resident who opens the page while logged in unknowingly hands the attacker their session.
    da: En angriber skriver en kommentar med et skjult script på en kommunes høringsside; hver borger, der åbner siden, mens vedkommende er logget ind, giver uden at vide det angriberen sin session.
  whyItMatters:
    en: The harmful code runs inside a site the visitor trusts, so the browser gives it the visitor's session and data; it remains one of the most often reported flaws in web applications.
    da: Den skadelige kode kører inde på et site, som den besøgende stoler på, så browseren giver den adgang til den besøgendes session og data; det er fortsat en af de oftest rapporterede fejl i webapplikationer.
deepDive:
  en: |-
    XSS is classified by where the payload lives and where it is turned into code. Reflected XSS echoes input from the current request (a search term, an error parameter) back into the response. Stored XSS persists the payload in the application's data (comments, profile fields, support tickets) and serves it to every viewer, which is why it scales best for the attacker; the 2005 Samy worm on MySpace spread to over a million profiles this way. DOM-based XSS never touches the server's HTML: client-side JavaScript reads an attacker-controlled source such as location.hash or postMessage data and writes it into a dangerous sink such as innerHTML, document.write, eval or a javascript: URL. Mutation XSS (mXSS) exploits the difference between how a sanitizer parses markup and how the browser re-parses it after serialisation.

    The root defence is contextual output encoding: the same value needs different escaping in an HTML body, a quoted attribute, a JavaScript string, a CSS value or a URL, and HTML-entity encoding is not sufficient inside a script block or an event-handler attribute. Modern template engines and frameworks (React JSX, Angular, Razor, Thymeleaf) auto-escape by default, so real-world XSS concentrates in escape hatches such as dangerouslySetInnerHTML, bypassSecurityTrustHtml, v-html and raw string templates. When rich HTML must be accepted, it goes through an allowlist sanitizer such as DOMPurify rather than a hand-written regex.

    Content Security Policy is the main defence-in-depth layer. A strict CSP uses per-response nonces or hashes with 'strict-dynamic' and disallows inline event handlers, which blocks most injected scripts even when encoding has failed; domain allowlists are routinely bypassed through JSONP endpoints and script gadgets on allowed CDNs. Trusted Types, first shipped in Chromium-based browsers, make DOM sinks reject plain strings, which turns DOM XSS into a type error. HttpOnly cookies stop script from reading the session cookie but do not stop the script from making authenticated requests on the victim's behalf, so they limit rather than prevent the damage.

    XSS is catalogued as CWE-79. It was its own OWASP Top 10 category until 2017 (A7), was merged into Injection in 2021 (A03) and remains under Injection as A05 in the 2025 edition. Input validation helps with narrowly typed fields, but it cannot be the primary control, because many legitimate values (names such as O'Brien, free text, markup in a CMS) contain the characters that matter in some output context.
  da: |-
    XSS inddeles efter, hvor payloaden ligger, og hvor den bliver til kode. Reflekteret XSS sender input fra den aktuelle forespørgsel (et søgeord, en fejlparameter) tilbage i svaret. Lagret XSS gemmer payloaden i applikationens data (kommentarer, profilfelter, supportsager) og serverer den for alle, der ser siden, og skalerer derfor bedst for angriberen; Samy-ormen på MySpace i 2005 spredte sig på den måde til over en million profiler. DOM-baseret XSS rører aldrig serverens HTML: JavaScript i klienten læser en kilde, angriberen styrer, fx location.hash eller postMessage-data, og skriver den ind i en farlig sink som innerHTML, document.write, eval eller en javascript:-URL. Mutation XSS (mXSS) udnytter forskellen på, hvordan en sanitizer parser markup, og hvordan browseren parser den igen efter serialisering.

    Grundforsvaret er kontekstafhængig output-encoding: den samme værdi skal escapes forskelligt i HTML-brødtekst, i en attribut i anførselstegn, i en JavaScript-streng, i en CSS-værdi eller i en URL, og HTML-entity-encoding er ikke nok inde i en script-blok eller en event handler-attribut. Moderne templatemotorer og frameworks (React JSX, Angular, Razor, Thymeleaf) escaper automatisk, så XSS i praksis samler sig i nødudgangene som dangerouslySetInnerHTML, bypassSecurityTrustHtml, v-html og rå strengskabeloner. Skal der tages imod rig HTML, sendes den gennem en allowlist-baseret sanitizer som DOMPurify frem for et hjemmestrikket regulært udtryk.

    Content Security Policy er det vigtigste ekstra forsvarslag. En streng CSP bruger nonces eller hashes pr. svar sammen med 'strict-dynamic' og forbyder inline event handlers, hvilket blokerer de fleste injicerede scripts, selv når encodingen har svigtet; domænebaserede allowlists omgås jævnligt via JSONP-endpoints og script gadgets på tilladte CDN'er. Trusted Types, som først kom i Chromium-baserede browsere, får DOM-sinks til at afvise almindelige strenge, så DOM-XSS bliver til en typefejl. HttpOnly-cookies forhindrer script i at læse sessionscookien, men ikke i at sende autentificerede forespørgsler i offerets navn, så de begrænser skaden uden at forhindre den.

    XSS er katalogiseret som CWE-79. Det var en selvstændig kategori i OWASP Top 10 frem til 2017 (A7), blev lagt ind under Injection i 2021 (A03) og ligger stadig under Injection som A05 i 2025-udgaven. Inputvalidering hjælper på snævert typede felter, men kan ikke være den primære kontrol, fordi mange legitime værdier (navne som O'Brien, fritekst, markup i et CMS) indeholder netop de tegn, der betyder noget i en eller anden outputkontekst.
edges:
  requires: [web-browser, web-application]
  causes:
    - to: session-hijacking
      why:
        en: A script running in the page can read the session cookie and send it to the attacker.
        da: Et script, der kører på siden, kan læse sessionscookien og sende den til angriberen.
      strength: primary
      confidence: high
  contrasts-with:
    - to: sql-injection
      why:
        en: Both abuse input the site trusts too much, but SQL injection attacks the database on the server, while XSS attacks the visitor's browser.
        da: Begge misbruger input, som sitet stoler for meget på, men SQL injection angriber databasen på serveren, mens XSS angriber den besøgendes browser.
      strength: primary
      confidence: high
  used-with:
    - to: owasp-top-10
      why:
        en: Since the 2021 edition it is counted under the list's Injection category, which in the 2025 edition is A05.
        da: Siden 2021-udgaven hører det under listens kategori Injection, som i 2025-udgaven er A05.
      strength: normal
      confidence: high
