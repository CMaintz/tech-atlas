term:
  en: Centre for Cyber Security (CFCS)
  da: Center for Cybersikkerhed (CFCS)
aka:
  en: [Danish Centre for Cyber Security]
  da: []
domain: [security]
cluster: compliance
layer: governance
status: legacy
era: 2012
summary:
  en: Denmark's national cyber security body from 2012, which in January 2025 became part of the Danish agency for public safety.
  da: Danmarks nationale myndighed for cybersikkerhed fra 2012, som i januar 2025 blev en del af Styrelsen for Samfundssikkerhed.
body:
  formal:
    en: A Danish public body set up in 2012 under the Defence Intelligence Service to warn, advise and assist against serious cyber attacks. Since January 2025 its advice and threat work sits in the agency for public safety, while incident reports go to the Defence Intelligence Service as national response team.
    da: En dansk myndighed oprettet i 2012 under Forsvarets Efterretningstjeneste for at advare, rådgive og hjælpe ved alvorlige cyberangreb. Siden januar 2025 ligger rådgivningen og trusselsarbejdet i Styrelsen for Samfundssikkerhed (SAMSIK), mens indberetninger om hændelser går til Forsvarets Efterretningstjeneste som nationalt CSIRT.
  plain:
    en: Like a national weather service for storms on the internet — it watched the sky, sent out warnings and told people how to prepare, and was later folded into a larger agency.
    da: Som en national vejrtjeneste for storme på nettet — den holdt øje med himlen, sendte advarsler ud og fortalte folk, hvordan de skulle forberede sig, og blev siden lagt ind i en større styrelse.
  inPractice:
    en: An IT manager in a Danish municipality still finds CFCS guides and threat assessments when she searches online; for current advice she now uses the versions the agency for public safety publishes.
    da: En IT-chef i en dansk kommune finder stadig CFCS-vejledninger og trusselsvurderinger, når hun søger på nettet; til den nyeste rådgivning bruger hun nu de udgaver, SAMSIK udgiver.
  whyItMatters:
    en: Much Danish guidance and course material still names CFCS; without knowing where its tasks went, a firm may look for advice in the wrong place or be unsure where to report a serious incident.
    da: Meget dansk vejledning og undervisningsmateriale nævner stadig CFCS; uden at vide, hvor opgaverne er flyttet hen, kan en virksomhed lede efter rådgivning det forkerte sted eller være i tvivl om, hvor en alvorlig hændelse skal indberettes.
edges:
  requires: [cyber-and-information-security]
  used-with:
    - to: threat-landscape
      why:
        en: Its yearly threat reports described the cyber threat against Denmark and are still widely used.
        da: Dens årlige trusselsvurderinger beskrev cybertruslen mod Danmark og bruges stadig bredt.
      strength: primary
      confidence: high
    - to: incident-reporting
      why:
        en: Under the first Danish NIS rules it was the national incident response team that received reports of serious incidents; that task now sits with the Defence Intelligence Service.
        da: Under de første danske NIS-regler var den det nationale CSIRT, der modtog indberetninger om alvorlige hændelser; den opgave ligger nu hos Forsvarets Efterretningstjeneste.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: supervisory-authority
      why:
        en: CFCS dealt with cyber threats to Danish firms and society; Datatilsynet checks how personal data is handled under GDPR — easily mixed up when a breach must be reported.
        da: CFCS beskæftigede sig med cybertrusler mod danske virksomheder og samfundet; Datatilsynet fører tilsyn med behandling af personoplysninger efter GDPR — de forveksles let, når et brud skal anmeldes.
      strength: normal
      confidence: high
