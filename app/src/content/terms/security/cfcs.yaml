term:
  en: Centre for Cyber Security (CFCS)
  da: Center for Cybersikkerhed (CFCS)
aka:
  en: [Danish Centre for Cyber Security]
  da: []
domain: [security]
cluster: compliance
layer: governance
status: legacy
era: 2012
summary:
  en: Denmark's national cyber security body from 2012, merged in January 2025 into a new Danish agency for public safety.
  da: Danmarks nationale it-sikkerhedsmyndighed fra 2012, som i januar 2025 blev lagt ind i Styrelsen for Samfundssikkerhed.
body:
  formal:
    en: A Danish public body set up in 2012 under the Defence Intelligence Service to warn, advise and help with serious cyber attacks. From January 2025 its advice and threat work moved to a new Danish agency for public safety and emergency planning, while the national incident response team stayed with the Defence Intelligence Service.
    da: En dansk myndighed oprettet i 2012 under Forsvarets Efterretningstjeneste til at varsle, rådgive og hjælpe ved alvorlige cyberangreb. Fra januar 2025 flyttede rådgivningen og trusselsarbejdet til den nye Styrelsen for Samfundssikkerhed (SAMSIK), mens det nationale CSIRT blev hos Forsvarets Efterretningstjeneste.
  plain:
    en: Like a national weather service for cyber storms — it watched for danger, sent out warnings and told people how to prepare, before being folded into a larger agency.
    da: Som en national vejrtjeneste for cyberstorme — den holdt øje med farer, sendte varsler og fortalte, hvordan man forbereder sig, før den blev lagt ind i en større styrelse.
  inPractice:
    en: A Danish IT manager still finds CFCS guides and yearly threat reports when searching online; the newer versions are now published by the agency that took over, and the old CFCS web address now sends visitors there.
    da: En dansk it-chef finder stadig CFCS-vejledninger og årlige trusselsvurderinger, når hun søger på nettet; de nyere udgaver udgives nu af SAMSIK, og cfcs.dk sender besøgende videre dertil.
  whyItMatters:
    en: Much Danish guidance and course material still names CFCS, so knowing where its tasks went tells you who to turn to today for advice and who takes serious incident reports.
    da: Meget dansk vejledning og undervisningsmateriale nævner stadig CFCS, så når man ved, hvor opgaverne er flyttet hen, ved man også, hvem man i dag skal gå til for rådgivning, og hvem der modtager indberetninger om alvorlige hændelser.
edges:
  requires: [cyber-and-information-security]
  used-with:
    - to: threat-landscape
      why:
        en: Its yearly threat reports described the cyber threat against Denmark and are still widely used.
        da: Dens årlige trusselsvurderinger beskrev cybertruslen mod Danmark og bruges stadig bredt.
      strength: primary
      confidence: high
    - to: incident-reporting
      why:
        en: Under the first Danish NIS rules it was the national incident response team that received reports of serious incidents; that task now sits with the Defence Intelligence Service.
        da: Under de første danske NIS-regler var den det nationale CSIRT, der modtog indberetninger om alvorlige hændelser; den opgave ligger nu hos Forsvarets Efterretningstjeneste.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: supervisory-authority
      why:
        en: CFCS dealt with cyber threats to Danish firms and society; Datatilsynet checks how personal data is handled under GDPR — easily mixed up when a breach must be reported.
        da: CFCS beskæftigede sig med cybertrusler mod danske virksomheder og samfundet; Datatilsynet fører tilsyn med behandling af personoplysninger efter GDPR — de forveksles let, når et brud skal anmeldes.
      strength: normal
      confidence: high
