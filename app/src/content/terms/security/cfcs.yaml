term:
  en: Centre for Cyber Security (CFCS)
  da: Center for Cybersikkerhed (CFCS)
aka:
  en: [Danish Centre for Cyber Security]
  da: []
domain: [security]
cluster: compliance
layer: governance
status: legacy
era: 2012
summary:
  en: Denmark's national cyber security body from 2012, which in January 2025 became part of the Danish Resilience Agency (SAMSIK).
  da: Danmarks nationale myndighed for cybersikkerhed fra 2012, som i januar 2025 blev en del af Styrelsen for Samfundssikkerhed.
body:
  formal:
    en: A Danish public body set up in 2012 under the Defence Intelligence Service to warn, advise and assist against serious cyber attacks. Since January 2025 its advice and threat work sits in the Danish Resilience Agency, while incident reports go to the Defence Intelligence Service as national response team.
    da: En dansk myndighed oprettet i 2012 under Forsvarets Efterretningstjeneste for at advare, rådgive og hjælpe ved alvorlige cyberangreb. Siden januar 2025 ligger rådgivningen og trusselsarbejdet i Styrelsen for Samfundssikkerhed (SAMSIK), mens indberetninger om hændelser går til Forsvarets Efterretningstjeneste som nationalt CSIRT.
  plain:
    en: Like a national weather service for storms on the internet - it watched the sky, sent out warnings and told people how to prepare, and was later folded into a larger agency.
    da: Som en national vejrtjeneste for storme på nettet - den holdt øje med himlen, sendte advarsler ud og fortalte folk, hvordan de skulle forberede sig, og blev siden lagt ind i en større styrelse.
  inPractice:
    en: An IT manager in a Danish municipality still finds CFCS guides and threat assessments when she searches online; for current advice she now uses the versions the Danish Resilience Agency publishes.
    da: En IT-chef i en dansk kommune finder stadig CFCS-vejledninger og trusselsvurderinger, når hun søger på nettet; til den nyeste rådgivning bruger hun nu de udgaver, SAMSIK udgiver.
  whyItMatters:
    en: Much Danish guidance and course material still names CFCS; without knowing where its tasks went, a firm may look for advice in the wrong place or be unsure where to report a serious incident.
    da: Meget dansk vejledning og undervisningsmateriale nævner stadig CFCS; uden at vide, hvor opgaverne er flyttet hen, kan en virksomhed lede efter rådgivning det forkerte sted eller være i tvivl om, hvor en alvorlig hændelse skal indberettes.
deepDive:
  en: |-
    CFCS was established in 2012 as a unit of the Danish Defence Intelligence Service (Forsvarets Efterretningstjeneste, FE), absorbing the government CERT function (GovCERT) that had previously sat in the civilian National IT and Telecom Agency (IT- og Telestyrelsen). Its legal basis came with lov om Center for Cybersikkerhed, lov nr. 713 af 25. juni 2014, in force from 1 July 2014 and amended in 2018 and 2019, the latter broadening its monitoring powers. The law made CFCS the national IT security authority, gave it a network security service (Netsikkerhedstjenesten) and allowed it to operate as both GovCERT and MILCERT.

    The operational core was the sensor network: authorities and companies connected to Netsikkerhedstjenesten had traffic at their internet boundary analysed by CFCS sensors, combined with FE's foreign intelligence on state-sponsored actors. This intelligence link was the unit's distinctive feature and also its most debated one, since it placed defensive cyber services inside a military intelligence service subject to oversight by the Danish Intelligence Oversight Board rather than an ordinary civilian regulator. Outward-facing work included the recurring threat assessment "Cybertruslen mod Danmark", which rated threat categories such as cyber crime, espionage and destructive attacks on a published threat-level scale, targeted warnings, and practical guidance on topics such as logging, segmentation and supply-chain security. Under the first Danish NIS implementation it also received incident notifications from operators of essential services and acted as a national CSIRT.

    In August 2024 responsibility for cyber security matters was moved from the Ministry of Defence to the newly created Ministry for Societal Security and Emergency Preparedness (Ministeriet for Samfundssikkerhed og Beredskab). On 29 January 2025 the civilian-facing parts of CFCS became part of the Danish Resilience Agency (Styrelsen for Samfundssikkerhed, SAMSIK), which now handles advice, communication and coordination of the NIS2 implementation. Netsikkerhedstjenesten stayed with FE, and FE acts as the national CSIRT, so technical incident handling and sensor-based detection remain military-intelligence functions while policy and guidance are civilian.

    In practice, older references need translating. Guidance or procurement documents that say "report to CFCS" should now be read against the NIS2-loven (in force 1 July 2025) and SAMSIK's current guidance, where significant incidents are handled with FE as national CSIRT and supervision rests with the relevant sector authority. CFCS material itself remains technically useful, but the institutional name should not be used as the current authority in new policies, contracts or incident response plans. CFCS should also not be confused with Datatilsynet, which handles personal data breach notifications under GDPR Art. 33, or with Rigspolitiet's NC3, which handles cyber crime.
  da: |-
    CFCS blev oprettet i 2012 som en enhed i Forsvarets Efterretningstjeneste (FE) og overtog funktionen som statens CERT (GovCERT), der tidligere lå i den civile IT- og Telestyrelse. Det lovmæssige grundlag kom med lov om Center for Cybersikkerhed, lov nr. 713 af 25. juni 2014, der trådte i kraft 1. juli 2014 og blev ændret i 2018 og 2019, sidstnævnte med udvidede overvågningsbeføjelser. Loven gjorde CFCS til national IT-sikkerhedsmyndighed, gav centret en netsikkerhedstjeneste (Netsikkerhedstjenesten) og lod det fungere som både GovCERT og MILCERT.

    Den operative kerne var sensornetværket: myndigheder og virksomheder, der var tilsluttet Netsikkerhedstjenesten, fik trafikken ved deres internetgrænse analyseret af CFCS' sensorer, kombineret med FE's udlandsefterretninger om statsstøttede aktører. Koblingen til efterretningstjenesten var enhedens særkende og samtidig det mest omdiskuterede, fordi den placerede defensive cybertjenester i en militær efterretningstjeneste under Tilsynet med Efterretningstjenesterne frem for en almindelig civil myndighed. Udadtil udgav centret den tilbagevendende trusselsvurdering "Cybertruslen mod Danmark", hvor trusselstyper som cyberkriminalitet, cyberspionage og destruktive angreb blev vurderet på en offentlig skala for trusselsniveauer, målrettede varsler og praktiske vejledninger om fx logning, segmentering og sikkerhed i forsyningskæden. Under den første danske NIS-implementering modtog det også indberetninger fra operatører af væsentlige tjenester og fungerede som nationalt CSIRT.

    I august 2024 blev ressortansvaret for cybersikkerhed flyttet fra Forsvarsministeriet til det nyoprettede Ministeriet for Samfundssikkerhed og Beredskab. Den 29. januar 2025 blev de udadvendte dele af CFCS en del af Styrelsen for Samfundssikkerhed (SAMSIK), som nu står for rådgivning, kommunikation og koordinering af NIS2-implementeringen. Netsikkerhedstjenesten blev i FE, og FE varetager rollen som nationalt CSIRT, så teknisk hændelseshåndtering og sensorbaseret detektion fortsat er efterretningsfunktioner, mens politik og vejledning er civile.

    I praksis skal ældre henvisninger oversættes. Vejledninger eller udbudsmateriale, der siger "indberet til CFCS", skal i dag læses i lyset af NIS2-loven (i kraft 1. juli 2025) og SAMSIK's aktuelle vejledning, hvor væsentlige hændelser håndteres med FE som nationalt CSIRT, og tilsynet ligger hos den relevante sektormyndighed. CFCS' materiale er stadig fagligt brugbart, men navnet bør ikke bruges som den gældende myndighed i nye politikker, kontrakter eller beredskabsplaner. CFCS må heller ikke forveksles med Datatilsynet, der modtager anmeldelser af brud på persondatasikkerheden efter GDPR art. 33, eller med Rigspolitiets NC3, der efterforsker cyberkriminalitet.
edges:
  requires: [cyber-and-information-security]
  used-with:
    - to: threat-landscape
      why:
        en: Its yearly threat reports described the cyber threat against Denmark and are still widely used.
        da: Dens årlige trusselsvurderinger beskrev cybertruslen mod Danmark og bruges stadig bredt.
      strength: primary
      confidence: high
    - to: incident-reporting
      why:
        en: Under the first Danish NIS rules it was the national incident response team that received reports of serious incidents; that task now sits with the Defence Intelligence Service.
        da: Under de første danske NIS-regler var den det nationale CSIRT, der modtog indberetninger om alvorlige hændelser; den opgave ligger nu hos Forsvarets Efterretningstjeneste.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: supervisory-authority
      why:
        en: CFCS dealt with cyber threats to Danish firms and society; Datatilsynet checks how personal data is handled under GDPR - easily mixed up when a breach must be reported.
        da: CFCS beskæftigede sig med cybertrusler mod danske virksomheder og samfundet; Datatilsynet fører tilsyn med behandling af personoplysninger efter GDPR - de forveksles let, når et brud skal anmeldes.
      strength: normal
      confidence: high
