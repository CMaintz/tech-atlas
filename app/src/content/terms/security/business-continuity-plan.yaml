term:
  en: Business continuity plan (BCP)
  da: Business continuity plan (BCP)
aka:
  en: [BCP, continuity plan]
  da: [BCP, kontinuitetsplan]
domain: [security]
cluster: incident-response
layer: governance
status: current
summary:
  en: A plan for keeping the most important work going during and after a crisis, even while the systems are down.
  da: En plan for at holde det vigtigste arbejde i gang under og efter en krise, også mens systemerne er nede.
body:
  formal:
    en: A documented set of procedures that keeps critical activities running at an agreed minimum level during a disruption, falling back on manual routines where needed, in the order of priority set by the business impact analysis.
    da: Et dokumenteret sæt procedurer, der holder kritiske aktiviteter kørende på et aftalt minimumsniveau under en afbrydelse, om nødvendigt med manuelle rutiner, i den prioritering, konsekvensanalysen har fastlagt.
  plain:
    en: Like a shop that keeps selling with a paper notebook and cash when the card terminal dies.
    da: Ligesom en butik, der bliver ved med at sælge med en notesblok og kontanter, når kortterminalen går ned.
  inPractice:
    en: When an attack takes a municipality's systems down for a week, its care homes follow the BCP — medicine charts on paper, phone lists printed in advance and meal orders phoned through to the central kitchen.
    da: Da et cyberangreb lægger en kommunes systemer ned i en uge, følger plejehjemmene BCP'en — medicinskemaer på papir, telefonlister printet på forhånd og madbestillinger ringet ind til centralkøkkenet.
  whyItMatters:
    en: Citizens and patients still need help while IT is being repaired; without an agreed plan B, staff improvise and the most urgent tasks may be the ones that stop.
    da: Borgere og patienter har stadig brug for hjælp, mens IT bliver repareret; uden en aftalt plan B improviserer medarbejderne, og de mest presserende opgaver kan være dem, der går i stå.
edges:
  requires: [business-impact-analysis]
  part-of: [contingency-plan]
  contrasts-with:
    - to: disaster-recovery-plan
      why:
        en: The BCP keeps the business working during the crisis; the DRP gets the technology back afterwards.
        da: BCP holder forretningen kørende under krisen; DRP får teknikken tilbage bagefter.
      strength: primary
      confidence: high
  used-with: [crisis-management]
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: ISO 22301:2019
    tier: standard
  - title: NIST SP 800-34 Rev. 1
    tier: standard
draft: true
