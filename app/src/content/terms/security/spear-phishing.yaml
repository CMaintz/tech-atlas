term:
  en: Spear phishing
  da: Spear phishing
aka:
  en: [targeted phishing]
  da: [målrettet phishing]
domain: [security]
cluster: awareness
layer: people
status: current
era: 2005
summary:
  en: A phishing message tailored to one person or team, made to look like it comes from someone they know.
  da: En phishing-besked skræddersyet til én person eller ét team, så den ligner noget fra en, de kender.
body:
  formal:
    en: Phishing aimed at a chosen person or small group, where the attacker first gathers details about the target — names, roles, current projects — to make the message look like it comes from a known contact.
    da: Phishing rettet mod en udvalgt person eller lille gruppe, hvor angriberen først samler oplysninger om målet — navne, roller, aktuelle projekter — så beskeden ligner noget fra en kendt kontakt.
  plain:
    en: Like a fisher who ignores the shoal and aims a spear at one particular fish, after watching where it likes to swim.
    da: Som en fisker, der er ligeglad med stimen og sigter med et spyd efter én bestemt fisk efter at have set, hvor den plejer at svømme.
  inPractice:
    en: The IT administrator at a regional hospital gets a mail that names a real system upgrade and the supplier's project manager, with a link to “the updated plan” that leads to a fake login page.
    da: IT-administratoren på et regionshospital får en mail, der nævner en rigtig systemopgradering og leverandørens projektleder ved navn, med et link til “den opdaterede plan”, som fører til en falsk login-side.
  whyItMatters:
    en: Because it uses real names and real context, the usual warning signs are missing, so even careful staff can be fooled — and the targets are often the people with the most access.
    da: Fordi den bruger rigtige navne og rigtig sammenhæng, mangler de sædvanlige advarselstegn, så selv forsigtige medarbejdere kan blive narret — og målene er ofte dem med den bredeste adgang.
edges:
  kind-of: [phishing]
  causes:
    - to: data-breach
      why:
        en: Targets are often chosen because they can reach money or sensitive data.
        da: Målene vælges ofte, fordi de har adgang til penge eller følsomme data.
      strength: normal
      confidence: medium
sources:
