term:
  en: Spear phishing
  da: Spear phishing
aka:
  en: [targeted phishing]
  da: [målrettet phishing]
domain: [security]
cluster: awareness
layer: people
status: current
era: 2005
summary:
  en: A phishing message tailored to one person or team, made to look like it comes from someone they know.
  da: En phishing-besked skræddersyet til én person eller ét team, så den ligner noget fra en, de kender.
body:
  formal:
    en: Phishing aimed at a chosen person or small group, where the attacker first gathers details about the target — names, roles, current projects — to make the message look like it comes from a known contact.
    da: Phishing rettet mod en udvalgt person eller lille gruppe, hvor angriberen først samler oplysninger om målet — navne, roller, aktuelle projekter — så beskeden ligner noget fra en kendt kontakt.
  plain:
    en: Where ordinary phishing is a fishing net, spear phishing is a harpoon aimed at one particular fish.
    da: Hvor almindelig phishing er et fiskenet, er spear phishing en harpun rettet mod én bestemt fisk.
  inPractice:
    en: An accountant gets an email that seems to be from her own director, mentions a real supplier by name, and asks her to pay an "urgent" invoice today.
    da: En bogholder får en mail, der ser ud til at komme fra hendes egen direktør, nævner en rigtig leverandør ved navn og beder hende betale en "hastende" faktura i dag.
  whyItMatters:
    en: Because it uses real names and real context, the usual warning signs are missing, so even careful staff can be fooled.
    da: Fordi den bruger rigtige navne og rigtig sammenhæng, mangler de sædvanlige advarselstegn, så selv forsigtige medarbejdere kan blive narret.
edges:
  kind-of: [phishing]
  causes:
    - to: data-breach
      why:
        en: Targets are often chosen because they can reach money or sensitive data.
        da: Målene vælges ofte, fordi de har adgang til penge eller følsomme data.
      strength: normal
      confidence: medium
sources:
