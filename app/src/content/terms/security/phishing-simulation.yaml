term:
  en: Phishing simulation
  da: Phishing-simulering
aka:
  en: [phishing test, simulated phishing campaign]
  da: [phishing-test, phishing-kampagne]
domain: [security]
cluster: awareness
layer: people
status: current
era: 2008
summary:
  en: Sending staff harmless fake phishing mails to see who clicks and to teach them to spot the real thing.
  da: At sende medarbejderne harmløse falske phishingmails for at se, hvem der klikker, og lære dem at genkende de ægte.
body:
  formal:
    en: A planned training exercise in which an organisation sends realistic but safe phishing messages to its own staff, measures how many click or report them, and follows up with short lessons.
    da: En planlagt træningsøvelse, hvor organisationen sender realistiske, men ufarlige phishingbeskeder til sine egne medarbejdere, måler, hvor mange der klikker eller melder dem, og følger op med korte lektioner.
  plain:
    en: Like a fire drill for the inbox — practising the right reaction while nothing is really burning.
    da: Som en brandøvelse for indbakken — man øver den rigtige reaktion, mens intet brænder.
  inPractice:
    en: The IT security officer at an audit firm sends a fake “You have new digital post” mail; staff who click see a friendly page pointing out the warning signs they missed.
    da: Den IT-sikkerhedsansvarlige i et revisionsfirma sender en falsk mail om, at “Du har fået ny digital post”; de, der klikker, ser en venlig side, der peger på de advarselstegn, de overså.
  whyItMatters:
    en: It turns awareness into a number that can be followed over time and gives safe practice before a real attacker tests people — as long as it is used to teach rather than to shame.
    da: Det gør awareness til et tal, der kan følges over tid, og giver sikker øvelse, før en rigtig angriber prøver folk af — så længe det bruges til at lære og ikke til at udstille nogen.
edges:
  kind-of: [control]
  requires: [phishing]
  mitigates:
    - to: phishing
      why:
        en: Staff who have practised spotting fake mails are less likely to fall for real ones and more likely to report them.
        da: Medarbejdere, der har øvet sig i at spotte falske mails, falder sjældnere for de ægte og melder dem oftere.
      strength: primary
      confidence: medium
    - smishing
  used-with:
    - to: security-awareness
      why:
        en: Simulations are one of the main tools and measures in an awareness programme.
        da: Simuleringer er et af de vigtigste værktøjer og målepunkter i et awareness-program.
      strength: primary
      confidence: high
  part-of: [awareness-programme]
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 2
    tier: course-material
  - title: CIS Controls v8 — Control 14 (Security Awareness and Skills Training)
    tier: standard
    publisher: Center for Internet Security
draft: true
