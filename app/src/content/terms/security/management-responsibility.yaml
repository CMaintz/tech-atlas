term:
  en: Management responsibility
  da: Ledelsesansvar
aka:
  en: [management accountability, leadership accountability]
  da: [ledelsens ansvar]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: The duty of top leaders to own, approve and be able to show the organisation's security work.
  da: Den øverste ledelses pligt til at eje, godkende og kunne dokumentere virksomhedens sikkerhedsarbejde.
body:
  formal:
    en: The duty in NIS2 Article 20 for the management body to approve the security measures, oversee how they are carried out and take part in training, with members liable if they fail; ISO 27001 clause 5 sets a similar leadership duty.
    da: Pligten i NIS2's artikel 20 for ledelsesorganet til at godkende sikkerhedstiltagene, føre tilsyn med, at de gennemføres, og deltage i uddannelse, så medlemmerne kan holdes ansvarlige, hvis de svigter; ISO 27001 afsnit 5 stiller et lignende krav til ledelsen.
  plain:
    en: The captain answers for the ship — the crew may do the work, but when it hits the rocks the captain cannot say "that was not my job".
    da: Kaptajnen står til ansvar for skibet — besætningen udfører arbejdet, men når skibet går på grund, kan kaptajnen ikke sige "det var ikke min opgave".
  inPractice:
    en: The chief executive of a Danish municipality signs off the risk assessment each year, attends a half-day course on cyber risk with the rest of the management team and gets a status report from the security lead every quarter.
    da: Den øverste direktør i en dansk kommune godkender hvert år risikoanalysen, deltager sammen med resten af topledelsen i et halvdagskursus om cyberrisici og får hvert kvartal en statusrapport fra den sikkerhedsansvarlige.
  whyItMatters:
    en: When leaders do not own security, it loses out in every budget round; making them personally answerable moves it from the server room to the boardroom.
    da: Når ledelsen ikke ejer sikkerheden, taber den i hver budgetforhandling; når ledelsen holdes personligt ansvarlig, flytter sikkerhed fra serverrummet til bestyrelseslokalet.
edges:
  part-of: [governance]
  requires: [risk-management]
  used-with:
    - to: security-policy
      why:
        en: Leaders show their ownership by approving the security policy and its goals.
        da: Ledelsen viser sit ejerskab ved at godkende sikkerhedspolitikken og dens mål.
      strength: normal
      confidence: high
