term:
  en: Security framework
  da: Rammeværk
aka:
  en: [cybersecurity framework]
  da: [sikkerhedsrammeværk, framework]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: A ready-made, shared structure of goals and controls that an organisation follows to build and check its security work.
  da: En færdig, fælles struktur af mål og kontroller, som en organisation følger for at opbygge og tjekke sit sikkerhedsarbejde.
body:
  formal:
    en: A published, structured set of principles, processes and controls — such as ISO 27001, the NIST CSF or the CIS Controls — that an organisation adopts to decide what to protect, in which order, and how to measure progress.
    da: Et offentliggjort, struktureret sæt af principper, processer og kontroller — fx ISO 27001, NIST CSF eller CIS Controls — som en organisation tager i brug for at afgøre, hvad der skal beskyttes, i hvilken rækkefølge, og hvordan fremskridt måles.
  plain:
    en: A well-tested cookbook — you do not invent the dish from scratch, you follow proven steps and adjust to taste.
    da: En gennemprøvet kogebog — man opfinder ikke retten fra bunden, men følger afprøvede trin og tilpasser efter smag.
  inPractice:
    en: The newly hired IT manager at a Danish housing association uses the CIS Controls as a checklist to see which basic protections are already in place and which to add first.
    da: Den nye IT-chef i en dansk boligforening bruger CIS Controls som tjekliste for at se, hvilke grundlæggende beskyttelser der allerede er på plads, og hvilke der skal tilføjes først.
  whyItMatters:
    en: Without one, each organisation guesses at what good security looks like and misses whole areas; a shared framework also gives a common language with auditors, partners and authorities.
    da: Uden et rammeværk gætter hver organisation på, hvad god sikkerhed er, og overser hele områder; et fælles rammeværk giver også et fælles sprog med revisorer, samarbejdspartnere og myndigheder.
edges:
  requires: [control]
  part-of:
    - to: governance
      why:
        en: Frameworks give the overall steering of security work a shared, tested structure.
        da: Rammeværker giver den overordnede styring af sikkerhedsarbejdet en fælles, afprøvet struktur.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: security-policy
      why:
        en: A framework is an outside, shared structure; a policy is the organisation's own document of its goals and rules.
        da: Et rammeværk er en fælles struktur udefra; en politik er organisationens eget dokument om dens mål og regler.
      strength: normal
      confidence: high
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 1 og 4
    tier: course-material
  - title: NIST Cybersecurity Framework 2.0
    tier: standard
    publisher: NIST
    url: https://www.nist.gov/cyberframework
draft: true
