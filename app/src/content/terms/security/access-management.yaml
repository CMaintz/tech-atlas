term:
  en: Access management
  da: Adgangsstyring
aka:
  en: [identity and access management, IAM]
  da: [IAM, adgangsstyring og identitetsstyring]
domain: [security]
cluster: controls
layer: identity
status: current
summary:
  en: The rules and routines that decide who may use which data and systems, and that keep those rights correct over time.
  da: De regler og rutiner, der afgør, hvem der må bruge hvilke data og systemer, og som holder rettighederne korrekte over tid.
body:
  formal:
    en: The ongoing process of granting, reviewing and removing each user account's rights to data and systems, based on the holder's role and approved need, so that access control always enforces a decision that still holds.
    da: Den løbende proces, hvor hver brugerkontos rettigheder til data og systemer tildeles, gennemgås og fjernes ud fra personens rolle og godkendte behov, så adgangskontrollen altid håndhæver en beslutning, der stadig gælder.
  plain:
    en: Like the office manager who decides who gets a key to which rooms, and collects the keys back when someone changes job or leaves.
    da: Som kontorchefen, der bestemmer, hvem der får nøgle til hvilke rum, og som samler nøglerne ind igen, når nogen skifter job eller stopper.
  inPractice:
    en: When a case officer in a municipality moves from social services to the payroll office, IT removes her access to citizens' case files the same week and grants payroll access, approved by her new manager.
    da: Når en sagsbehandler i en kommune skifter fra socialforvaltningen til lønkontoret, fjerner IT hendes adgang til borgernes sager samme uge og giver hende adgang til lønsystemet, godkendt af hendes nye chef.
  whyItMatters:
    en: Rights pile up quietly as people change roles; if nobody reviews them, one stolen account can open far more than its owner ever needed.
    da: Rettigheder hober sig stille op, når folk skifter roller; uden opfølgning kan én stjålet konto åbne langt mere, end ejeren nogensinde havde brug for.
