term:
  en: Integrity
  da: Integritet
aka:
  en: [data integrity]
  da: [dataintegritet]
domain: [security]
cluster: fundamentals
layer: data
status: current
summary:
  en: Making sure information stays correct and complete, and is not changed by accident or without permission.
  da: At sikre, at information forbliver korrekt og fuldstændig og ikke ændres ved et uheld eller uden tilladelse.
body:
  formal:
    en: The property that information is accurate and complete, and that any change to it is made only by those allowed to, in a way that can be noticed. Hashing and digital signatures are common ways to show that nothing has been altered.
    da: Egenskaben, at information er nøjagtig og fuldstændig, og at enhver ændring kun foretages af dem, der har lov, og på en måde, der kan opdages. Hashing og digitale signaturer bruges ofte til at vise, at intet er ændret.
  plain:
    en: Like a recipe card — if someone quietly changes “one teaspoon of salt” to “one cup”, everyone who follows it ruins the dish without knowing why.
    da: Som et opskriftskort — hvis nogen i al stilhed retter “lidt salt” til “en hel kop salt”, ødelægger alle, der følger det, retten uden at vide hvorfor.
  inPractice:
    en: An attacker inside a supplier's mailbox changes the account number on an invoice sent to a municipality, and a finance clerk pays a large sum to the wrong account.
    da: En angriber, der har fået adgang til en leverandørs mailboks, ændrer kontonummeret på en faktura til en kommune, og en medarbejder i økonomiafdelingen betaler et stort beløb til den forkerte konto.
  whyItMatters:
    en: Decisions, payments and even medical treatment rely on data being right; wrong data can do more harm than missing data because nobody questions it.
    da: Beslutninger, betalinger og selv medicinsk behandling bygger på, at data er rigtige; forkerte data kan gøre mere skade end manglende data, fordi ingen stiller spørgsmål ved dem.
deepDive:
  en: |-
    ISO/IEC 27000 defines integrity simply as the property of accuracy and completeness, while the US FISMA definition used in FIPS 199 speaks of guarding against improper modification or destruction and explicitly folds in authenticity and non-repudiation. In practice the term covers two different problems: detecting unauthorised or accidental change to data, and ensuring that authorised changes are themselves correct, which is a matter of business rules, validation and process rather than cryptography.

    The cryptographic toolkit forms a ladder. A checksum or CRC detects random corruption but offers no protection against a deliberate attacker, who can simply recompute it. A cryptographic hash such as SHA-256 is collision-resistant, but a bare hash only helps if the reference value itself is delivered over a trusted channel. A message authentication code such as HMAC (RFC 2104) binds integrity to a shared secret key, so anyone holding the key can verify and also forge; it therefore gives integrity and data-origin authentication between two parties but not non-repudiation. A digital signature uses an asymmetric key pair, so only the private-key holder can sign and anyone can verify, which is what makes non-repudiation possible. Modern protocols use authenticated encryption (AEAD), for example AES-GCM or ChaCha20-Poly1305 in TLS 1.3, so that confidentiality and integrity are provided together and tampered ciphertext is rejected before decryption output is used.

    At the model level, the Biba model (1977) is the integrity counterpart of Bell-LaPadula, forbidding subjects from reading down to less trustworthy data or writing up to more trustworthy data, and the Clark-Wilson model (1987) describes commercial integrity through well-formed transactions, constrained data items and separation of duties. Databases enforce integrity through constraints, transactions and ACID properties; storage uses checksumming file systems and Merkle trees; backups use immutable or WORM storage so ransomware cannot rewrite them; software supply chains rely on code signing, reproducible builds and provenance frameworks such as SLSA.

    Common failure modes include verifying a hash downloaded from the same compromised server as the file, signing data but never checking the signature, and logs that an administrator can edit, which undermines both forensic value and accountability. Business email compromise shows that integrity attacks often target process, not bits: a correctly transmitted invoice with a changed account number passes every technical check. GDPR Art. 5(1)(f) and Art. 32(1)(b) name integrity explicitly, and an unauthorised alteration of personal data counts as a personal data breach under Art. 4(12).
  da: |-
    ISO/IEC 27000 definerer integritet kort som egenskaben nøjagtighed og fuldstændighed, mens den amerikanske FISMA-definition, som FIPS 199 bygger på, taler om beskyttelse mod uretmæssig ændring eller sletning og udtrykkeligt medregner ægthed og uafviselighed. I praksis dækker begrebet to forskellige problemer: at opdage uautoriserede eller utilsigtede ændringer af data, og at sikre, at autoriserede ændringer i sig selv er korrekte, hvilket handler om forretningsregler, validering og processer snarere end kryptografi.

    Den kryptografiske værktøjskasse udgør en stige. En checksum eller CRC opdager tilfældig korruption, men beskytter ikke mod en bevidst angriber, som blot kan beregne den igen. En kryptografisk hash som SHA-256 er kollisionsresistent, men en hash alene hjælper kun, hvis referenceværdien selv leveres via en betroet kanal. En message authentication code som HMAC (RFC 2104) binder integriteten til en delt hemmelig nøgle, så enhver med nøglen både kan verificere og forfalske; den giver derfor integritet og autentificering af afsender mellem to parter, men ikke uafviselighed. En digital signatur bruger et asymmetrisk nøglepar, så kun indehaveren af den private nøgle kan signere, mens alle kan verificere, og det er det, der gør uafviselighed mulig. Moderne protokoller bruger authenticated encryption (AEAD), fx AES-GCM eller ChaCha20-Poly1305 i TLS 1.3, så fortrolighed og integritet leveres samlet, og manipuleret ciffertekst afvises, før dekrypteret output tages i brug.

    På modelniveau er Biba-modellen (1977) integritetens modstykke til Bell-LaPadula og forbyder subjekter at læse ned i mindre troværdige data eller skrive op i mere troværdige data, mens Clark-Wilson-modellen (1987) beskriver kommerciel integritet gennem velformede transaktioner, begrænsede dataelementer og funktionsadskillelse. Databaser håndhæver integritet med constraints, transaktioner og ACID-egenskaber; lagring bruger filsystemer med checksummer og Merkle-træer; backup bruger immutable eller WORM-lagring, så ransomware ikke kan overskrive den; og softwareforsyningskæden bygger på kodesignering, reproducerbare builds og provenance-rammer som SLSA.

    Typiske fejl er at verificere en hash hentet fra den samme kompromitterede server som filen, at signere data uden nogensinde at tjekke signaturen, og logs, som en administrator kan redigere, hvilket undergraver både den forensiske værdi og ansvarligheden. Business email compromise viser, at integritetsangreb ofte rammer processen og ikke bittene: en korrekt overført faktura med et ændret kontonummer består alle tekniske tjek. Databeskyttelsesforordningens art. 5, stk. 1, litra f, og art. 32, stk. 1, litra b, nævner integritet direkte, og en uautoriseret ændring af personoplysninger er et brud på persondatasikkerheden efter art. 4, nr. 12.
