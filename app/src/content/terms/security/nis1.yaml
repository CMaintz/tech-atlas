term:
  en: NIS1 Directive
  da: NIS1-direktivet
aka:
  en: [NIS1, NIS Directive, Directive (EU) 2016/1148]
  da: [NIS1, NIS-direktivet]
domain: [security]
cluster: compliance
layer: governance
status: legacy
era: 2016
summary:
  en: The first EU-wide cybersecurity law, from 2016, which set security and reporting duties for key service providers until NIS2 replaced it.
  da: EU's første fælles cybersikkerhedslov fra 2016, der stillede krav om sikkerhed og indberetning til vitale tjenester, til NIS2 afløste den.
body:
  formal:
    en: Directive (EU) 2016/1148, written into each member state's own law by May 2018, covering operators of essential services in sectors such as energy, transport, banking, health and drinking water, plus online marketplaces, search engines and cloud services.
    da: Direktiv (EU) 2016/1148, som hvert medlemsland skulle skrive ind i sin egen lovgivning senest maj 2018, og som dækkede operatører af væsentlige tjenester inden for fx energi, transport, bank, sundhed og drikkevand samt online markedspladser, søgemaskiner og cloudtjenester.
  plain:
    en: Like the first edition of a book of rules — it set the idea that firms society leans on must guard their systems, but left each country free to decide who had to follow it.
    da: Som første udgave af en regelbog — den slog fast, at de virksomheder, samfundet læner sig op ad, skal passe på deres systemer, men lod hvert land selv bestemme, hvem der skulle følge den.
  inPractice:
    en: In 2018 a Danish energy company was named an operator of essential services, so it had to take suitable security measures and report incidents that seriously disrupted its supply to the national authority.
    da: I 2018 blev et dansk energiselskab udpeget som operatør af en væsentlig tjeneste og skulle derfor træffe passende sikkerhedstiltag og indberette hændelser, der alvorligt forstyrrede forsyningen, til den nationale myndighed.
  whyItMatters:
    en: It was the first time the EU made cyber risk a legal duty across borders; because countries drew the lines so differently, it was repealed and replaced by NIS2 from 18 October 2024.
    da: Det var første gang, EU gjorde cyberrisiko til en juridisk pligt på tværs af grænser; fordi landene trak grænserne så forskelligt, blev det ophævet og afløst af NIS2 fra 18. oktober 2024.
edges:
  requires: [cyber-and-information-security]
  mandates:
    - to: risk-management
      why:
        en: Covered organisations had to take measures suited to the risks facing the systems behind their services.
        da: De organisationer, loven dækkede, skulle træffe tiltag, der passede til risiciene for de systemer, som deres tjenester byggede på.
      strength: primary
      confidence: high
    - to: incident-reporting
      why:
        en: Incidents with a significant impact on the service had to be reported to the national authority without undue delay.
        da: Hændelser med betydelig indvirkning på tjenesten skulle indberettes til den nationale myndighed uden unødig forsinkelse.
      strength: primary
      confidence: high
sources:
