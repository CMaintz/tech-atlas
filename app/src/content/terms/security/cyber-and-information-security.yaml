term:
  en: Cyber and information security
  da: Cyber- og informationssikkerhed
aka:
  en: [information security, cybersecurity, infosec]
  da: [informationssikkerhed, cybersikkerhed, IT-sikkerhed]
domain: [security]
cluster: fundamentals
layer: governance
status: current
summary:
  en: Protecting an organisation's data, systems and ways of working against loss, misuse and interruption.
  da: Beskyttelse af en organisations data, systemer og processer mod tab, misbrug og afbrydelser.
body:
  formal:
    en: The discipline of keeping information, and the systems that handle it, confidential, correct and available — whether the information is digital or on paper.
    da: Fagområdet, der sørger for, at information og de systemer, der håndterer den, forbliver fortrolige, korrekte og tilgængelige — uanset om informationen er digital eller på papir.
  plain:
    en: Like looking after a house — you lock the doors, check nothing has been tampered with, and make sure the family can still get in when they need to.
    da: Som at passe på et hus — du låser døren, tjekker, at intet er blevet rodet med, og sørger for, at familien stadig kan komme ind, når de skal.
  inPractice:
    en: A small accounting firm locks its laptops, keeps copies of client files, and teaches staff to spot fake emails — all parts of one security effort.
    da: Et lille revisionsfirma låser sine bærbare, tager kopier af kundefiler og lærer medarbejderne at genkende falske mails — alt sammen dele af én samlet sikkerhedsindsats.
  whyItMatters:
    en: Nearly every business now depends on its data and systems; losing them, even for a day, can halt work, break the law and cost customers' trust.
    da: Næsten alle virksomheder er i dag afhængige af deres data og systemer; mister de dem, blot for en dag, kan det stoppe driften, bryde loven og koste kundernes tillid.
edges:
  used-with:
    - governance
    - to: risk-management
      why:
        en: Security work is steered by risk management, which decides where limited effort does the most good.
        da: Sikkerhedsarbejdet styres af risikostyring, som afgør, hvor begrænsede ressourcer gør mest gavn.
      strength: primary
      confidence: high
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: ISO/IEC 27000:2018 — Information security management systems — Overview and vocabulary
    tier: standard
    publisher: ISO/IEC
draft: true
