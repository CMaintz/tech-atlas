term:
  en: Ransomware
  da: Ransomware
aka:
  en: []
  da: [løsepengeangreb, løsepengevirus]
domain: [security]
cluster: awareness
layer: data
status: current
era: 1989
summary:
  en: Harmful software that locks an organisation's data and demands payment to unlock it.
  da: Skadelig software, der låser en organisations data og kræver løsepenge for at låse dem op igen.
body:
  formal:
    en: Harmful software that uses encryption to make files or whole systems unreadable to their owner, then demands a ransom for the key — often while also threatening to publish stolen copies.
    da: Skadelig software, der bruger kryptering til at låse filer eller hele systemer, så ejeren ikke kan læse dem, og derefter kræver løsepenge for nøglen — ofte med en trussel om også at offentliggøre stjålne kopier.
  plain:
    en: Like a burglar who takes nothing but changes all the locks in your house and sells you the new keys.
    da: Som en indbrudstyv, der ikke tager noget, men skifter alle låsene i dit hus og sælger dig de nye nøgler.
  inPractice:
    en: On a Monday morning, staff at a regional hospital find every shared drive full of files that will not open and a note demanding payment within 72 hours; wards fall back on paper.
    da: En mandag morgen opdager personalet på et regionshospital, at alle fælles drev er fyldt med filer, der ikke kan åbnes, og en besked, der kræver betaling inden for 72 timer; afdelingerne må gå over til papir.
  whyItMatters:
    en: It can halt an entire organisation at once, and paying gives no guarantee the data comes back — only tested backups kept out of the attacker's reach do.
    da: Det kan lamme en hel organisation på én gang, og betaling giver ingen garanti for at få data tilbage — det gør kun testede backups, som angriberen ikke kan nå.
edges:
  kind-of: [threat, malware]
  requires: [encryption, availability]
  exploits:
    - to: vulnerability
      why:
        en: It usually gets in and spreads through unpatched weaknesses or stolen logins.
        da: Det kommer typisk ind og spreder sig via svagheder, der ikke er rettet, eller stjålne logins.
      strength: normal
      confidence: high
  causes:
    - to: data-breach
      why:
        en: Many groups copy data out before locking it, so an attack is often also a breach.
        da: Mange grupper kopierer data ud, før de låser dem, så et angreb ofte også er et databrud.
      strength: normal
      confidence: medium
