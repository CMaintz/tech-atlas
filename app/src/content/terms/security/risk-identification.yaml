term:
  en: Risk identification
  da: Risikoidentifikation
aka:
  en: []
  da: []
domain: [security]
cluster: risk-management
layer: governance
status: current
summary:
  en: The first step of a risk assessment — finding and writing down what could go wrong, to what, and why.
  da: Første trin i en risikoanalyse — at finde og skrive ned, hvad der kan gå galt, med hvad, og hvorfor.
body:
  formal:
    en: The part of risk assessment that finds, recognises and describes risks by listing the assets that matter, the threats that could harm them and the vulnerabilities those threats could use, before any rating is done.
    da: Den del af risikoanalysen, der finder, genkender og beskriver risici ved at liste de aktiver, der betyder noget, de trusler, der kan skade dem, og de sårbarheder, truslerne kan udnytte, før der foretages nogen vurdering.
  plain:
    en: Like walking through a new flat before moving in and noting every loose wire, wobbly step and window that does not close — fixing comes later.
    da: Som at gå en ny lejlighed igennem, før man flytter ind, og notere hver løs ledning, vaklende trappetrin og vindue, der ikke lukker — reparationerne kommer bagefter.
  inPractice:
    en: At a two-hour meeting in a brewery, staff from production, finance and IT write down their key systems and data and what could hit each one, from ransomware to a fire in the server room.
    da: På et møde på to timer i et bryggeri skriver medarbejdere fra produktion, økonomi og IT deres vigtigste systemer og data op og det, der kan ramme hver af dem, fra ransomware til brand i serverrummet.
  whyItMatters:
    en: A risk that is never named is never handled, so the quality of the whole risk process depends on how wide this first search is.
    da: En risiko, der aldrig bliver nævnt, bliver aldrig håndteret, så kvaliteten af hele risikoarbejdet afhænger af, hvor bredt denne første søgning favner.
