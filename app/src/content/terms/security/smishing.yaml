term:
  en: Smishing
  da: Smishing (sms-svindel)
aka:
  en: [SMS phishing, text message phishing]
  da: [sms-svindel, sms-phishing]
domain: [security]
cluster: awareness
layer: people
status: current
summary:
  en: Phishing sent as a text message, usually a short, urgent note with a link or a number to call.
  da: Phishing sendt som sms, typisk en kort, hastende besked med et link eller et nummer, man skal ringe til.
body:
  formal:
    en: A form of phishing delivered by text message or chat app instead of email. The short format hides the real sender and link address, and phones rarely have the filters that catch fake email.
    da: En form for phishing, der sendes som sms eller i en chat-app i stedet for mail. Det korte format skjuler den rigtige afsender og linkadresse, og telefoner har sjældent de filtre, der fanger falske mails.
  plain:
    en: A fake parking ticket tucked under your wiper — it looks official enough that you pay before you check.
    da: En falsk parkeringsbøde under viskeren — den ser officiel nok ud til, at du betaler, før du tjekker.
  inPractice:
    en: A text claiming to be from a delivery company says a parcel is held until a small fee is paid, and the link leads to a copy of a payment page that captures card details.
    da: En sms, der udgiver sig for at komme fra et fragtfirma, siger, at en pakke tilbageholdes, indtil et lille gebyr er betalt, og linket fører til en kopi af en betalingsside, der opsnapper kortoplysninger.
  whyItMatters:
    en: People read texts within minutes and trust their phone more than their inbox, while work phones often sit outside the company's usual protection.
    da: Folk læser sms'er inden for få minutter og stoler mere på telefonen end på indbakken, mens arbejdstelefoner ofte står uden for virksomhedens sædvanlige beskyttelse.
edges:
  kind-of: [phishing]
  contrasts-with:
    - to: vishing
      why:
        en: Smishing sends a written message and waits for a click; vishing uses a live voice to push the victim in real time.
        da: Smishing sender en skrevet besked og venter på et klik; vishing bruger en levende stemme til at presse offeret i øjeblikket.
      strength: normal
      confidence: high
  causes:
    - to: data-breach
      why:
        en: Card details or logins typed into the fake page go straight to the attacker.
        da: Kortoplysninger eller logins, der tastes ind på den falske side, går direkte til angriberen.
      strength: normal
      confidence: medium
sources:
  - title: NIST Glossary — Smishing
    tier: standard
    publisher: NIST
    url: https://csrc.nist.gov/glossary/term/smishing
  - title: ENISA Threat Landscape
    tier: standard
    publisher: ENISA
