term:
  en: Endpoint
  da: Endpoint
aka:
  en: [end-user device, endpoint device]
  da: [slutbrugerenhed]
domain: [security, cs]
cluster: controls
layer: host
status: current
summary:
  en: Any device that connects to the network at its edge and is used directly — a PC, phone, printer or similar.
  da: Enhver enhed, der kobles på netværket i dets yderkant og bruges direkte — fx en pc, mobil eller printer.
body:
  formal:
    en: A device at the end of a network connection that people or machines use directly, such as a laptop, phone, tablet, printer or smart sensor, as opposed to equipment that only passes traffic along.
    da: En enhed for enden af en netværksforbindelse, som mennesker eller maskiner bruger direkte, fx en bærbar, mobil, tablet, printer eller smart sensor, i modsætning til udstyr, der blot sender trafikken videre.
  plain:
    en: Like the houses along a road system — the places the roads actually lead to, where people live and work, rather than the junctions in between.
    da: Som husene langs et vejnet — de steder, vejene faktisk fører hen, og hvor folk bor og arbejder, i modsætning til vejkrydsene imellem.
  inPractice:
    en: At a school, a teacher's laptop that travels between home, classroom and staff room is one endpoint; the screen in the classroom and the printer in the office are two more the school's IT lead must track.
    da: På en skole er en lærers bærbare, der flytter mellem hjemmet, klasselokalet og lærerværelset, ét endpoint; skærmen i klassen og printeren på kontoret er to mere, som skolens IT-ansvarlige skal holde styr på.
  whyItMatters:
    en: Endpoints are where people click, plug in and log in, so they are where most attacks start — and every one needs to be known, updated and watched.
    da: Endpoints er dér, folk klikker, sætter ting i og logger ind, så det er dér, de fleste angreb begynder — og hvert eneste skal kendes, opdateres og overvåges.
