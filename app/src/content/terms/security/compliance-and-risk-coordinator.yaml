term:
  en: Compliance and risk coordinator
  da: Compliance- og risikokoordinator
aka:
  en: [compliance coordinator, risk coordinator]
  da: [compliancekoordinator, risikokoordinator]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: An entry-level role that tracks which rules apply, where the organisation falls short, and how its risks are being handled.
  da: En rolle på begynderniveau, der holder styr på, hvilke regler der gælder, hvor organisationen halter, og hvordan dens risici håndteres.
body:
  formal:
    en: A role that maps legal and standard requirements to the organisation's practice, runs gap analyses and risk assessments, keeps the evidence in order and reports progress and open risks to management.
    da: En rolle, der kobler krav fra love og standarder til organisationens praksis, gennemfører gap-analyser og risikoanalyser, holder dokumentationen i orden og rapporterer fremdrift og åbne risici til ledelsen.
  plain:
    en: Like a bookkeeper for rules — keeping the list of what is owed, what is paid and what is overdue, so there are no surprises when the inspector comes.
    da: Som en bogholder for regler — der holder listen over, hvad der skyldes, hvad der er betalt, og hvad der er forfaldent, så der ikke kommer overraskelser, når kontrollen kommer.
  inPractice:
    en: Before an ISO 27001 audit, the coordinator checks each requirement against the evidence folder and asks three owners for missing records.
    da: Før en ISO 27001-audit tjekker koordinatoren hvert krav mod mappen med dokumentation og beder tre ejere om manglende materiale.
  whyItMatters:
    en: Rules like NIS2 and GDPR expect proof, not good intentions, and this role is what turns scattered work into something the organisation can show.
    da: Regler som NIS2 og GDPR kræver bevis, ikke gode hensigter, og denne rolle er det, der gør spredt arbejde til noget, organisationen kan fremvise.
edges:
  kind-of: [grey-roles]
  requires: [compliance, risk-management]
  used-with: [gap-analysis, risk-assessment]
  contrasts-with:
    - to: information-security-coordinator
      why:
        en: The compliance and risk coordinator checks against rules and risks; the security coordinator runs the whole security programme day to day.
        da: Compliance- og risikokoordinatoren tjekker mod regler og risici; sikkerhedskoordinatoren driver hele sikkerhedsarbejdet i hverdagen.
      confidence: medium
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Kursistens udbytte
    tier: course-material
