term:
  en: Security control
  da: Kontrol (foranstaltning)
aka:
  en: [control, safeguard, countermeasure]
  da: [kontrol, sikkerhedsforanstaltning, foranstaltning]
domain: [security]
cluster: fundamentals
status: current
summary:
  en: A measure that lowers risk — technical, like a lock on a system, or organisational, like a rule or training.
  da: Et tiltag, der mindsker risikoen — teknisk som en lås på et system, eller organisatorisk som en regel eller træning.
body:
  formal:
    en: Any technical, organisational, physical or human measure put in place to reduce the likelihood or the impact of a risk. Controls are often sorted by what they do — prevent, detect or correct.
    da: Ethvert teknisk, organisatorisk, fysisk eller menneskeligt tiltag, der indføres for at mindske sandsynligheden for eller konsekvensen af en risiko. Kontroller inddeles ofte efter, om de forebygger, opdager eller retter op.
  plain:
    en: Like a smoke alarm, a fire door and a fire drill — three different kinds of measure against the same danger.
    da: Som en røgalarm, en branddør og en brandøvelse — tre forskellige slags tiltag mod den samme fare.
  inPractice:
    en: To cut the risk of stolen logins, the IT manager at a small Danish manufacturer turns on MFA (technical), writes a password rule (organisational) and gives staff a short course (human).
    da: For at mindske risikoen for stjålne logins slår IT-chefen i en mindre produktionsvirksomhed MFA til (teknisk), skriver en regel for adgangskoder (organisatorisk) og holder et kort kursus for medarbejderne (menneskelig).
  whyItMatters:
    en: Controls are how security decisions become real; each one should answer a named risk, or it only costs money and effort.
    da: Kontroller er det, der gør sikkerhedsbeslutninger til virkelighed; hver kontrol bør svare på en navngiven risiko — ellers koster den bare penge og besvær.
edges:
  requires: [risk]
  mitigates:
    - to: vulnerability
      why:
        en: A control closes or guards a weakness so a threat can no longer use it as easily.
        da: En kontrol lukker eller beskytter en svaghed, så en trussel ikke længere så let kan udnytte den.
      strength: primary
      confidence: high
  contrasts-with:
    - to: security-policy
      why:
        en: A policy says what should be achieved; a control is the concrete measure that achieves it.
        da: En politik siger, hvad der skal opnås; en kontrol er det konkrete tiltag, der opnår det.
      strength: normal
      confidence: high
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: NIST SP 800-53 Rev. 5 — Security and Privacy Controls for Information Systems and Organizations
    tier: standard
    publisher: NIST
draft: true
