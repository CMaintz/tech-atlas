      url: https://csrc.nist.gov/pubs/sp/800/39/final
      publisher: NIST
      tier: standard
edges:
  kind-of: [risk-treatment]
  requires: [risk-appetite, residual-risk]
  contrasts-with:
    - to: risk-avoidance
      why:
        en: Acceptance keeps the activity and its risk; avoidance stops the activity so the risk disappears.
        da: Accept beholder aktiviteten og dens risiko; undgåelse stopper aktiviteten, så risikoen forsvinder.
      strength: primary
      confidence: high
