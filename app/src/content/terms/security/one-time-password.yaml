term:
  en: One-time password (OTP)
  da: Engangskode (OTP)
aka:
  en: [OTP, one-time code, SMS code]
  da: [OTP, sms-kode, engangskodeord]
domain: [security, cs]
cluster: controls
layer: identity
status: current
era: 1986
summary:
  en: A short code that works for a single login and then expires, sent by text message or shown in an app.
  da: En kort kode, der virker til ét enkelt login og derefter udløber, sendt som sms eller vist i en app.
body:
  formal:
    en: A code valid for one use or a short time window, worked out by an app or token from a shared secret and the clock or a counter, or sent by SMS - used as the "something you have" factor in MFA.
    da: En kode, der gælder til én brug eller et kort tidsrum, beregnet af en app eller et token ud fra en delt hemmelighed og uret eller en tæller, eller sendt som sms - brugt som "noget man har"-faktoren i MFA.
  plain:
    en: Like a ticket that is torn in half at the door - it gets you in once, and a copy is worth nothing afterwards.
    da: Som en billet, der bliver revet over ved indgangen - den lukker én ind én gang, og en kopi er intet værd bagefter.
  inPractice:
    en: A lawyer at a Danish law firm logs in to the case system from home; after her password she types the six numbers shown in an app on her phone, which change every 30 seconds.
    da: En advokat i et dansk advokatfirma logger ind i sagssystemet hjemmefra; efter adgangskoden taster hun de seks cifre, som en app på telefonen viser, og som skifter hvert 30. sekund.
  whyItMatters:
    en: A stolen password alone no longer gets anyone in, but a code can still be tricked out of a person on a fake page, so phishing-proof methods are stronger.
    da: En stjålet adgangskode alene er ikke længere nok, men en kode kan stadig lokkes ud af folk på en falsk side, så phishing-sikre metoder er stærkere.
deepDive:
  en: |-
    Two open algorithms dominate. HOTP (RFC 4226, 2005) computes HMAC-SHA-1 over an 8-byte counter using a shared secret K, then applies dynamic truncation: the low four bits of the last byte of the 20-byte HMAC select an offset, four bytes from that offset are read as a 31-bit integer, and the result modulo 10^d gives a d-digit code (six by default). TOTP (RFC 6238, 2011) replaces the counter with T = floor((Unix time − T0) / X), with T0 = 0 and a time step X of 30 seconds by default, and permits HMAC-SHA-256 and HMAC-SHA-512 as well as SHA-1. Most authenticator apps still use SHA-1, six digits and 30 seconds, which is safe here because HMAC security does not depend on SHA-1 collision resistance.

    Verification needs tolerance. HOTP servers use a look-ahead window to resynchronise when a user has pressed the token without logging in; TOTP servers typically accept one time step on either side to allow for clock skew and network delay, and RFC 6238 recommends allowing no more than one step backward. Both need throttling: a six-digit code has only 10^6 values, so without rate limiting an attacker can guess within a validity window, and NIST SP 800-63B requires verifiers to limit consecutive failed attempts. A verifier must also reject reuse of a code that has already been accepted within its window, otherwise a shoulder-surfed or intercepted code can be replayed.

    Enrolment is usually a QR code encoding an otpauth:// URI (a de facto format originating with Google Authenticator, not an IETF standard) containing the Base32-encoded secret, issuer, account and parameters. Because the verifier must compute the same HMAC, it stores the secret in recoverable form rather than as a one-way hash; a breach of the seed database compromises every token, as the 2011 attack on RSA's SecurID seeds illustrated. Older schemes include S/KEY (Lamport's hash chain, RFC 1760) and proprietary hardware tokens.

    SMS OTP is a different mechanism: the server generates a random code and sends it out-of-band over the telephone network. It inherits that network's weaknesses - SIM-swap fraud, number porting, SS7 interception and malware reading SMS on the device - which is why NIST classifies PSTN delivery as a restricted authenticator. All OTP variants share a structural limitation: the code is a bearer value typed by a human, not bound to the site's origin, so an adversary-in-the-middle phishing page can relay it within its validity window. OTP therefore raises the cost of credential stuffing and password reuse attacks but is not phishing-resistant in the NIST sense, unlike FIDO2/WebAuthn passkeys.
  da: |-
    To åbne algoritmer dominerer. HOTP (RFC 4226, 2005) beregner HMAC-SHA-1 over en 8-byte tæller med en delt hemmelighed K og anvender derefter dynamisk trunkering: de fire laveste bit i den sidste byte af den 20 byte lange HMAC udpeger et offset, fire bytes fra det offset læses som et 31-bit heltal, og resultatet modulo 10^d giver en kode på d cifre (som standard seks). TOTP (RFC 6238, 2011) erstatter tælleren med T = floor((Unix-tid − T0) / X), hvor T0 = 0 og tidsskridtet X som standard er 30 sekunder, og tillader HMAC-SHA-256 og HMAC-SHA-512 ud over SHA-1. De fleste autentifikator-apps bruger stadig SHA-1, seks cifre og 30 sekunder, hvilket er forsvarligt her, fordi HMAC's sikkerhed ikke afhænger af SHA-1's kollisionsresistens.

    Verifikationen kræver tolerance. HOTP-servere bruger et look-ahead-vindue til at gensynkronisere, når brugeren har trykket på tokenet uden at logge ind; TOTP-servere accepterer typisk ét tidsskridt til hver side for at tage højde for urforskydning og netværksforsinkelse, og RFC 6238 anbefaler højst ét skridt bagud. Begge kræver begrænsning af forsøg: en sekscifret kode har kun 10^6 værdier, så uden rate limiting kan en angriber gætte inden for et gyldighedsvindue, og NIST SP 800-63B kræver, at verifikatoren begrænser antallet af fejlede forsøg i træk. En verifikator skal også afvise genbrug af en kode, der allerede er accepteret inden for vinduet, ellers kan en aflurt eller opsnappet kode afspilles igen.

    Tilmelding sker som regel via en QR-kode med en otpauth://-URI (et de facto-format, der stammer fra Google Authenticator, ikke en IETF-standard), som indeholder den Base32-kodede hemmelighed, udsteder, konto og parametre. Fordi verifikatoren skal beregne samme HMAC, gemmer den hemmeligheden i genskabelig form frem for som et envejshash; et brud på seed-databasen kompromitterer alle tokens, som angrebet på RSA's SecurID-seeds i 2011 viste. Ældre ordninger omfatter S/KEY (Lamports hashkæde, RFC 1760) og proprietære hardwaretokens.

    Sms-engangskoder er en anden mekanisme: serveren genererer en tilfældig kode og sender den out-of-band over telefonnettet. Den arver nettets svagheder - SIM-swap-svindel, nummerflytning, SS7-aflytning og malware, der læser sms'er på enheden - og derfor klassificerer NIST levering via PSTN som en "restricted" autentifikator. Alle OTP-varianter deler en strukturel begrænsning: koden er en ihændehaverværdi, som et menneske taster, og den er ikke bundet til sitets origin, så en adversary-in-the-middle-phishingside kan videresende den inden for gyldighedsvinduet. OTP gør derfor credential stuffing og genbrug af adgangskoder dyrere for angriberen, men er ikke phishing-resistent i NIST's forstand, i modsætning til FIDO2/WebAuthn-passkeys.
howTo:
  steps:
    en:
      - Choose the variant, normally TOTP (RFC 6238) in an authenticator app, HOTP (RFC 4226) for hardware tokens, and SMS codes only as a documented exception.
      - Generate a random secret per user on the server, at least 128 bits and preferably 160 as RFC 4226 recommends, and show it once at enrolment as a QR code with the text key beside it.
      - Switch OTP on for the account only after the user has typed one valid code, which proves the app and the server agree.
      - Store the secrets encrypted with a key kept outside the database, for example in an HSM or key vault, because the server must be able to read them to check codes.
      - Accept a code only within a narrow window, normally the current 30-second step plus at most one step on either side for clock drift and delay.
      - Reject any code that has already been accepted, and limit failed attempts per account with a lockout or growing delays.
      - Issue single-use recovery codes at enrolment, and require re-authentication and notify the user whenever OTP is reset or a new device is added.
      - Plan the move to passkeys or security keys for administrators and other high-risk users, since phishing kits can relay a one-time code in real time.
    da:
      - Vælg variant, normalt TOTP (RFC 6238) i en autentifikator-app, HOTP (RFC 4226) til hardwaretokens og kun sms-koder som dokumenteret undtagelse.
      - Generér en tilfældig hemmelighed pr. bruger på serveren, mindst 128 bit og helst 160, som RFC 4226 anbefaler, og vis den kun én gang ved tilmelding som QR-kode med tekstnøglen ved siden af.
      - Slå først OTP til på kontoen, når brugeren har tastet én gyldig kode, så det er bevist, at app og server er enige.
      - Gem hemmelighederne krypteret med en nøgle, der ligger uden for databasen, fx i et HSM eller en key vault, fordi serveren skal kunne læse dem for at tjekke koder.
      - Acceptér kun en kode inden for et snævert vindue, normalt det aktuelle 30-sekunders skridt plus højst ét skridt til hver side for urforskydning og forsinkelse.
      - Afvis enhver kode, der allerede er accepteret, og begræns antallet af fejlede forsøg pr. konto med spærring eller stigende ventetid.
      - Udsted gendannelseskoder til engangsbrug ved tilmelding, og kræv ny autentificering og giv brugeren besked, hver gang OTP nulstilles eller en ny enhed tilføjes.
      - Planlæg overgangen til passkeys eller sikkerhedsnøgler for administratorer og andre brugere med høj risiko, da phishingværktøjer kan videresende en engangskode i realtid.
  pitfalls:
    en:
      - Having no limit on failed attempts, so an attacker can work through the million possible six-digit codes.
      - Letting the same code be used twice within its window.
      - Storing OTP secrets unencrypted in the same database as the password hashes.
      - Treating SMS codes as equal to app codes despite SIM swapping and interception.
    da:
      - Ikke at begrænse fejlede forsøg, så en angriber kan gennemgå de en million mulige sekscifrede koder.
      - At lade samme kode blive brugt to gange inden for vinduet.
      - At gemme OTP-hemmeligheder ukrypteret i samme database som adgangskode-hashene.
      - At sidestille sms-koder med app-koder trods SIM-swap og aflytning.
