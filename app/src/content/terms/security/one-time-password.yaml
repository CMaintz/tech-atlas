term:
  en: One-time password (OTP)
  da: Engangskode (OTP)
aka:
  en: [OTP, one-time code, SMS code]
  da: [OTP, sms-kode, engangskodeord]
domain: [security, cs]
cluster: controls
layer: identity
status: current
summary:
  en: A short code that works for a single login and then expires, sent by text message or shown in an app.
  da: En kort kode, der virker til ét enkelt login og derefter udløber, sendt som sms eller vist i en app.
body:
  formal:
    en: A code valid for one use or a short time window, produced by an app or token from a shared secret and the clock, or sent by SMS — used as the "something you have" factor in MFA.
    da: En kode, der gælder til én brug eller et kort tidsrum, dannet af en app eller et token ud fra en delt hemmelighed og uret eller sendt via sms — brugt som "noget man har"-faktoren i MFA.
  plain:
    en: Like a raffle ticket that is torn in half at the door — it gets you in once, and a copy is worth nothing afterwards.
    da: Som en billet, der bliver revet over ved indgangen — den lukker én ind én gang, og en kopi er intet værd bagefter.
  inPractice:
    en: When logging in to the payroll system from home, an accountant types the six numbers her phone app shows, which change every 30 seconds.
    da: Når en bogholder logger ind i lønsystemet hjemmefra, taster hun de seks tal, som app'en på telefonen viser, og som skifter hvert 30. sekund.
  whyItMatters:
    en: A stolen password alone no longer works, but a code can still be tricked out of a person on a fake page, so phishing-proof methods are stronger.
    da: En stjålet adgangskode alene virker ikke længere, men en kode kan stadig lokkes ud af folk på en falsk side, så phishing-sikre metoder er stærkere.
edges:
  kind-of: [authentication-factor]
  mitigates: [credential-stuffing]
  contrasts-with:
    - to: passkey
      why:
        en: A one-time code can be typed into a fake site by mistake; a passkey only answers the real site.
        da: En engangskode kan ved en fejl tastes ind på en falsk side; en passkey svarer kun det rigtige site.
      confidence: high
  used-with: [password, two-factor-authentication]
sources:
