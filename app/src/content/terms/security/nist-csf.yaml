term:
  en: NIST Cybersecurity Framework (CSF)
  da: NIST Cybersecurity Framework (CSF)
aka:
  en: [NIST CSF]
  da: [NIST CSF]
domain: [security]
cluster: compliance
layer: governance
status: current
era: 2014
summary:
  en: A free US framework that sorts security work into six broad goals, from steering it to recovering after an attack.
  da: Et gratis amerikansk rammeværk, der inddeler sikkerhedsarbejdet i seks overordnede funktioner, fra styring til genopretning efter et angreb.
body:
  formal:
    en: A voluntary framework from the US National Institute of Standards and Technology, first published in February 2014 and updated to version 2.0 in February 2024. Version 2.0 groups outcomes into six functions — Govern, Identify, Protect, Detect, Respond and Recover — and lets a firm compare a current profile with a target profile.
    da: Et frivilligt rammeværk fra det amerikanske National Institute of Standards and Technology, første gang udgivet i februar 2014 og opdateret til version 2.0 i februar 2024. Version 2.0 samler resultaterne i seks funktioner — Govern, Identify, Protect, Detect, Respond og Recover — og lader en virksomhed sammenligne en nuværende profil med en målprofil.
  plain:
    en: A map with six regions rather than a checklist — it shows where you are, where you want to be and which roads connect them, but not exactly how to drive.
    da: Et kort med seks regioner snarere end en tjekliste — det viser, hvor man er, hvor man vil hen, og hvilke veje der forbinder dem, men ikke præcis hvordan man skal køre.
  inPractice:
    en: The security lead at a Danish software company with US customers scores the firm against the six functions, finds Detect and Recover weak, and uses the gap between current and target profile to argue for next year's budget.
    da: Den sikkerhedsansvarlige i en dansk softwarevirksomhed med amerikanske kunder vurderer firmaet mod de seks funktioner, finder Detect og Recover svage og bruger afstanden mellem den nuværende profil og målprofilen som argument i næste års budget.
  whyItMatters:
    en: Leaders and technical staff often talk past each other about security; the framework gives them one free, shared language that suits any size of firm and maps onto ISO 27001 and the CIS Controls.
    da: Ledelse og teknikere taler ofte forbi hinanden om sikkerhed; rammeværket giver dem ét gratis, fælles sprog, der passer til virksomheder af alle størrelser og kan kobles til ISO 27001 og CIS Controls.
