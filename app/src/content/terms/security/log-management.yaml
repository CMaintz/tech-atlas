  requires: [log]
  used-with:
    - to: siem
      why:
        en: Log management gathers and stores the logs; the SIEM reads them and raises alarms.
        da: Loghåndtering samler og gemmer logs; SIEM'en læser dem og slår alarm.
      strength: primary
      confidence: high
