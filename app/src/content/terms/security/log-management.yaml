term:
  en: Log management
  da: Loghåndtering
aka:
  en: [log analysis, log collection]
  da: [loganalyse, logindsamling]
domain: [security, cs]
cluster: security-operations
layer: data
status: current
summary:
  en: Collecting logs from every system into one place, in one format, kept safe from change and for as long as they are needed.
  da: At samle logs fra alle systemer ét sted, i ét format, beskyttet mod ændringer og så længe, der er brug for dem.
body:
  formal:
    en: The planned handling of logs through their whole life — deciding what to record, sending it to a central store, putting it in a common format with correct times, protecting it against change, keeping it for a set period and then deleting it.
    da: Den planlagte håndtering af logs gennem hele deres levetid — at beslutte, hvad der skal registreres, sende det til et centralt lager, bringe det på et fælles format med korrekte tidsstempler, beskytte det mod ændringer, gemme det i en fastsat periode og derefter slette det.
  plain:
    en: Like a town archive that gathers the papers from every office, files them the same way, locks them up and throws them out on a fixed date.
    da: Som et kommunalt arkiv, der samler papirerne fra alle kontorer, arkiverer dem på samme måde, låser dem inde og kasserer dem på en fast dato.
  inPractice:
    en: A company finds that its firewall, email and cloud servers each keep logs for only a week, each on its own clock, so it sends all of them to one central store with the same time source.
    da: En virksomhed opdager, at dens firewall, mail og cloudservere kun gemmer logs i en uge og hver med sit eget ur, så den sender dem alle til ét centralt lager med samme tidskilde.
  whyItMatters:
    en: Logs scattered across machines, with clocks that disagree, cannot be searched or trusted when an incident happens; good handling is what makes them useful as evidence.
    da: Logs spredt ud over mange maskiner, med ure der ikke stemmer overens, kan hverken gennemsøges eller stoles på, når en hændelse sker; god håndtering er det, der gør dem brugbare som bevis.
edges:
  requires: [log]
  used-with:
    - to: siem
      why:
        en: Log management gathers and stores the logs; the SIEM reads them and raises alarms.
        da: Loghåndtering samler og gemmer logs; SIEM'en læser dem og slår alarm.
      strength: primary
      confidence: high
    - observability
    - security-monitoring
sources:
  - title: NIST SP 800-92 — Guide to Computer Security Log Management
    url: https://doi.org/10.6028/NIST.SP.800-92
    tier: standard
    publisher: NIST
  - title: CIS Controls v8 — Control 8 (Audit Log Management)
    tier: standard
    publisher: Center for Internet Security
