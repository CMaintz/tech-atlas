edges:
  kind-of: [control]
  mitigates:
    - to: shadow-it
      why:
        en: Regularly comparing what is found against the list exposes apps and devices nobody approved.
        da: Når man jævnligt sammenligner det fundne med listen, afsløres apps og enheder, som ingen har godkendt.
      strength: primary
      confidence: high
  used-with:
    - endpoint
    - vulnerability-scanning
