term:
  en: ISO 27001 Annex A
  da: ISO 27001 Annex A (bilag A)
aka:
  en: [Annex A, Annex A controls]
  da: [bilag A, Annex A]
domain: [security]
cluster: compliance
layer: governance
status: current
summary:
  en: The list of 93 reference controls at the back of ISO 27001 that every organisation using the standard must hold its own controls up against.
  da: De 93 referencekontroller bagerst i ISO 27001, som enhver organisation, der følger standarden, skal holde sine kontroller op imod.
body:
  formal:
    en: The annex of ISO 27001:2022 listing 93 controls in four themes (organisational, people, physical, technological); the organisation compares its risk treatment with the list and records in its Statement of Applicability which controls apply and why.
    da: Anneks A til ISO 27001:2022 rummer 93 kontroller i fire temaer (organisatoriske, menneskelige, fysiske og teknologiske); organisationen sammenholder sin risikohåndtering med listen og noterer i sin Statement of Applicability, hvilke kontroller der gælder, og hvorfor.
  plain:
    en: Like planning a set dinner from a restaurant's full menu — you read every dish, pick the ones that suit your guests, and can say why the rest were left off.
    da: Som at sammensætte en festmiddag ud fra restaurantens fulde menukort — man læser hver ret, vælger dem, der passer til gæsterne, og kan forklare, hvorfor resten blev fravalgt.
  inPractice:
    en: A Danish software firm with 40 staff works through all 93 controls; it keeps the ones for secure coding and access, and marks the controls for server rooms as not needed, writing down why — it has no server room of its own.
    da: Et dansk softwarefirma med 40 ansatte gennemgår alle 93 kontroller; det beholder dem om sikker udvikling og adgangsstyring og markerer kontrollerne for serverrum som ikke relevante med en skriftlig begrundelse — firmaet har intet serverrum.
  whyItMatters:
    en: The list stops organisations from quietly skipping whole areas, and the ISO 27002 guide explains how to carry out each item.
    da: Listen forhindrer organisationer i stille og roligt at springe hele områder over, og ISO 27002 forklarer, hvordan hvert punkt gennemføres.
edges:
  part-of: [iso-27001]
  requires: [control]
  used-with:
    - to: iso-27002
      why:
        en: Annex A names each control in one line; ISO 27002 gives the guidance for the same 93 controls.
        da: Annex A nævner hver kontrol på én linje; ISO 27002 giver vejledningen til de samme 93 kontroller.
      strength: primary
      confidence: high
sources:
  - title: Cyber Security Fast Track — Kursuskompendium, Modul 3 (ISO 27001 — appendix)
    tier: course-material
  - title: ISO/IEC 27001:2022, Annex A
    tier: standard
draft: true
