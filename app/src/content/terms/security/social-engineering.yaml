term:
  en: Social engineering
  da: Social engineering
aka:
  en: [social engineering attack, human hacking]
  da: [social manipulation]
domain: [security]
cluster: awareness
layer: people
status: current
summary:
  en: Manipulating people into giving away information or access, instead of breaking into systems directly.
  da: Manipulation af mennesker, så de udleverer oplysninger eller adgang, i stedet for at bryde direkte ind i systemer.
body:
  formal:
    en: A family of attacks that play on human trust, respect for authority, helpfulness or time pressure to make a person reveal information or grant access, getting around technical controls entirely.
    da: En gruppe af angreb, der udnytter menneskers tillid, respekt for autoritet, hjælpsomhed eller tidspres til at få en person til at afsløre oplysninger eller give adgang — helt uden om de tekniske kontroller.
  plain:
    en: A con artist who does not pick the lock but simply talks the doorman into holding the door open.
    da: En svindler, der ikke dirker låsen op, men blot snakker dørmanden til at holde døren åben.
  inPractice:
    en: A caller claiming to be from IT support tells a receptionist there is an urgent problem and gets her to read out the code she just received by text.
    da: En opringer, der påstår at være fra IT-support, fortæller en receptionist, at der er et akut problem, og får hende til at læse den kode op, hun lige har fået på sms.
  whyItMatters:
    en: The strongest locks and walls do not help if a person can be talked into opening them, so people are a target in their own right.
    da: De stærkeste låse og mure hjælper ikke, hvis en person kan snakkes til at åbne dem, så mennesker er et mål i sig selv.
edges:
  kind-of: [threat]
  exploits:
    - to: vulnerability
      why:
        en: It treats human trust and helpfulness as the weakness to abuse, rather than a flaw in a machine.
        da: Det behandler menneskelig tillid og hjælpsomhed som den svaghed, der udnyttes, frem for en fejl i en maskine.
      strength: primary
      confidence: medium
    - human-factor
  causes:
    - to: data-breach
      why:
        en: Information handed over to a manipulator is information that has left the organisation's control.
        da: Oplysninger, der udleveres til en manipulator, er oplysninger, som organisationen har mistet kontrollen over.
      strength: normal
      confidence: medium
sources:
  - title: Cyber Security Fast Track — Ordliste
    tier: course-material
  - title: NIST Glossary — Social Engineering
    tier: standard
