  en: [escalation path]
  da: [eskaleringsvej]
domain: [security]
cluster: incident-response
layer: governance
status: current
summary:
  en: Agreed rules for when a problem must be passed up to someone more senior or more expert, and to whom.
  da: Aftalte regler for, hvornår et problem skal sendes videre op til en mere erfaren eller mere ansvarlig person, og til hvem.
body:
  formal:
    en: The part of an incident plan that defines thresholds, contact chains and time limits for moving an alert or incident from first responders to specialists, management, authorities and other parties as its severity grows.
    da: Den del af en beredskabsplan, der fastlægger tærskler, kontaktkæder og tidsfrister for at flytte en alarm eller hændelse fra de første til at reagere videre til specialister, ledelse, myndigheder og andre parter, efterhånden som alvoren vokser.
  plain:
    en: Like a hospital emergency room — a nurse handles small cuts, but chest pain goes straight to the senior doctor, and everyone knows the rule.
    da: Som en skadestue — en sygeplejerske tager sig af små snitsår, men brystsmerter går direkte til overlægen, og alle kender reglen.
  inPractice:
    en: An analyst sees one account logging in from two countries; under the procedure a single case goes to IT, but ten cases in an hour call the security lead and then the director.
    da: En analytiker ser én konto logge ind fra to lande; efter proceduren går et enkelt tilfælde til IT, men ti tilfælde på en time udløser et opkald til sikkerhedschefen og derefter direktøren.
  whyItMatters:
    en: In an incident minutes count, and NIS2 sets short deadlines for reporting, so no one should have to guess who to wake up.
    da: Under en hændelse tæller minutterne, og NIS2 sætter korte frister for indberetning, så ingen skal gætte på, hvem der skal vækkes.
