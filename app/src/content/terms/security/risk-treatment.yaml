term:
  en: Risk treatment
  da: Risikohåndtering
aka:
  en: [risk response]
  da: []
domain: [security]
cluster: risk-management
layer: governance
status: current
summary:
  en: Choosing what to do about each risk — accept it, reduce it, hand it to someone else, or remove it.
  da: Valget af, hvad man gør ved hver risiko — accepterer den, reducerer den, overfører den eller fjerner den.
body:
  formal:
    en: The step in risk management where each assessed risk gets one of four responses — accept, reduce with a control, transfer to another party, or eliminate by stopping the activity.
    da: Trinnet i risikostyringen, hvor hver vurderet risiko får én af fire håndteringer — accept, reduktion med en kontrol, overførsel til en anden part eller eliminering ved at stoppe aktiviteten.
  plain:
    en: Like facing a leaky roof — you can live with it, patch it, buy insurance, or move out.
    da: Ligesom med et utæt tag — man kan leve med det, lappe det, tegne en forsikring eller flytte.
  inPractice:
    en: The board buys cyber insurance to transfer ransom costs, adds MFA to reduce the risk of stolen passwords, and accepts the small risk of a printer failing.
    da: Bestyrelsen tegner en cyberforsikring for at overføre udgifter til løsesum, indfører MFA for at reducere login-risikoen og accepterer den lille risiko for, at en printer fejler.
  whyItMatters:
    en: Finding risks is pointless without a decision about each one, and that decision shows who owns it and what it costs.
    da: Det nytter ikke at finde risici uden en beslutning om hver enkelt, og den beslutning viser, hvem der ejer risikoen, og hvad den koster.
