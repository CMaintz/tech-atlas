term:
  en: Web application firewall (WAF)
  da: Web application firewall (WAF)
aka:
  en: [WAF]
  da: [WAF]
domain: [security, cs]
cluster: application-security
layer: application
status: current
era: 1999
summary:
  en: A filter in front of a website that reads each web request and blocks those that look like known attacks.
  da: Et filter foran et website, der læser hver webforespørgsel og blokerer dem, der ligner kendte angreb.
body:
  formal:
    en: A firewall that works at the level of HTTP rather than single packets, checking the content of each request to a web application — form fields, headers, cookie values — against rules for known attack patterns, and blocking or logging matches.
    da: En firewall, der arbejder på HTTP-niveau i stedet for med enkelte pakker og tjekker indholdet af hver forespørgsel til en webapplikation — formularfelter, headers, cookie-værdier — mod regler for kendte angrebsmønstre og blokerer eller logger dem, der matcher.
  plain:
    en: Like a receptionist who opens every letter to a company and throws out the ones with a known scam inside, whereas an ordinary firewall only checks the address on the envelope.
    da: Som en receptionist, der åbner alle breve til en virksomhed og smider dem ud, der indeholder et kendt svindelnummer, hvor en almindelig firewall kun tjekker adressen på kuverten.
  inPractice:
    en: A shop cannot fix a flaw in its old checkout page this week, so it turns on a WAF rule that blocks requests carrying SQL commands in the search field until the code is fixed.
    da: En webshop kan ikke rette en fejl i sin gamle betalingsside i denne uge, så den slår en WAF-regel til, der blokerer forespørgsler med SQL-kommandoer i søgefeltet, indtil koden er rettet.
  whyItMatters:
    en: Web attacks pass straight through a normal firewall because they arrive on the same open door as real visitors; a WAF buys time, but a clever attacker can often word a request to slip past its rules.
    da: Webangreb går lige igennem en almindelig firewall, fordi de kommer ind ad den samme åbne dør som rigtige besøgende; en WAF køber tid, men en snu angriber kan ofte formulere en forespørgsel, så den slipper forbi reglerne.
edges:
  kind-of: [firewall]
  requires: [http, web-application]
  mitigates:
    - to: sql-injection
      why:
        en: Its rules spot and block requests that carry database commands in fields meant for plain text.
        da: Dens regler opdager og blokerer forespørgsler, der bærer databasekommandoer i felter beregnet til almindelig tekst.
      strength: normal
      confidence: high
    - to: cross-site-scripting
      why:
        en: It can block requests that try to plant a script, but it cannot see a script already stored in the site.
        da: Den kan blokere forespørgsler, der forsøger at plante et script, men den kan ikke se et script, der allerede ligger gemt på sitet.
      strength: normal
      confidence: medium
sources:
