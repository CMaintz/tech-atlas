      why:
        en: When treating a risk, teams pick fitting controls and use the guidance to put them in place.
        da: Når en risiko skal håndteres, vælger man passende kontroller og bruger vejledningen til at indføre dem.
      strength: normal
      confidence: high
    - to: security-policy
      strength: minor
      confidence: medium
    - to: statement-of-applicability
      why:
        en: The SoA lists the Annex A controls that ISO 27002 explains in detail.
        da: SoA'en gennemgår de kontroller i anneks A, som ISO 27002 forklarer i detaljer.
