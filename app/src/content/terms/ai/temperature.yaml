term:
  en: Temperature
  da: Temperatur
aka:
  en: [sampling temperature]
  da: [samplingtemperatur]
domain: [ai]
cluster: prompting
layer: inference
status: current
summary:
  en: A per-request dial — low keeps a language model's wording steady and repeatable, high makes it more varied and less predictable.
  da: En indstilling pr. kald — lav holder en sprogmodels ordvalg stabilt og gentageligt, høj gør det mere skiftende og uforudsigeligt.
body:
  formal:
    en: A number, usually from 0 to 1 or 0 to 2 depending on the provider, that reshapes the chances from next-token prediction before sampling picks a token; values below 1 sharpen them toward the most likely tokens, values above 1 flatten them so unlikely tokens are picked more often.
    da: Et tal, typisk fra 0 til 1 eller 0 til 2 afhængigt af udbyderen, der ændrer de chancer, forudsigelse af næste token giver, før sampling vælger et token; værdier under 1 skærper dem mod de mest sandsynlige tokens, værdier over 1 gør dem mere lige, så usandsynlige tokens vælges oftere.
  plain:
    en: Like a DJ's shuffle setting — turned down, you mostly hear the crowd favourites; turned up, more rare tracks slip in.
    da: Som en DJ's blandeknap — skruet ned hører man mest publikumsfavoritterne; skruet op sniger flere sjældne numre sig ind.
  inPractice:
    en: A developer in a municipality sets temperature near 0 for the tool that reads date and amount from incoming invoices, so the same invoice almost always gives the same result, and near 1 for the one that suggests headlines for the residents' newsletter.
    da: En udvikler i en kommune sætter temperaturen tæt på 0 for værktøjet, der aflæser dato og beløb på indgående fakturaer, så samme faktura næsten altid giver samme resultat, og tæt på 1 for det, der foreslår overskrifter til borgernes nyhedsbrev.
  whyItMatters:
    en: It is one of the few levers you can change per request without touching the model; set wrong, text turns stiff and repetitive or loose and rambling, and even 0 does not promise identical answers every time.
    da: Det er et af de få håndtag, man kan ændre pr. kald uden at røre modellen; sat forkert bliver teksten stiv og gentagende eller løs og springende, og selv 0 garanterer ikke ens svar hver gang.
edges:
  requires: [next-token-prediction]
  part-of:
    - to: sampling
      why:
        en: It is a setting of the sampling step, adjusting the chances just before each token is drawn.
        da: Den er en indstilling i sampling-trinnet, der justerer chancerne lige før hvert token trækkes.
      strength: primary
      confidence: high
  used-with:
    - to: top-p-sampling
      why:
        en: The two are often set together; many providers advise changing one and leaving the other at its default.
        da: De to sættes ofte sammen; mange udbydere anbefaler at ændre den ene og lade den anden stå på standardværdien.
      strength: normal
      confidence: high
sources:
  - title: 'Jurafsky & Martin, Speech and Language Processing (3rd ed. draft), chapter on large language models (temperature sampling)'
    tier: textbook
  - title: OpenAI API reference — Chat Completions (temperature, top_p)
    tier: official-doc
    publisher: OpenAI
draft: true
