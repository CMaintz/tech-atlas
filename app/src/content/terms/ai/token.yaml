term:
  en: Token
  da: Token
aka:
  en: []
  da: []
domain: [ai]
cluster: llm
layer: model
status: current
summary:
  en: A small piece of text - a whole word, part of a word or a symbol - that a language model reads and writes in; also how use is priced.
  da: Et lille stykke tekst - et ord, en del af et ord eller et tegn - som en sprogmodel læser og skriver i; også enheden, brug prissættes efter.
body:
  formal:
    en: The unit a language model works in; text is cut into tokens from a fixed list, each token is turned into a number, and the model reads and produces text one token at a time.
    da: Den enhed, en sprogmodel arbejder i; tekst deles op i tokens fra en fast liste, hvert token laves om til et tal, og modellen læser og skriver tekst ét token ad gangen.
  plain:
    en: Like Lego bricks for text - common words are one brick, rare or long words are built from several smaller bricks.
    da: Som legoklodser til tekst - almindelige ord er én klods, sjældne eller lange ord bygges af flere mindre klodser.
  inPractice:
    en: An online shop paying per token for its customer-service chat assistant finds Danish replies cost more than English ones, because a word like “sikkerhedshændelse” may be split into four or five tokens while “the” is one.
    da: En webshop, der betaler per token for sin chatassistent til kundeservice, opdager, at danske svar koster mere end engelske, fordi et ord som “sikkerhedshændelse” kan blive delt i fire-fem tokens, mens “the” er ét.
  whyItMatters:
    en: Tokens decide cost, speed and how much a model can take in at once; note that this AI meaning has nothing to do with a login token.
    da: Tokens bestemmer pris, hastighed og hvor meget en model kan tage ind på én gang; bemærk, at denne AI-betydning intet har med et login-token at gøre.
deepDive:
  en: |-
    A token is an entry in a model's fixed vocabulary, identified by an integer ID. Most vocabularies are learned with subword algorithms such as byte-pair encoding, so frequent words, common word fragments, whitespace-prefixed words, punctuation, digit groups and raw bytes each get their own entries. Vocabulary size is a design choice fixed before pretraining: GPT-2 used 50,257 entries, and more recent model families use vocabularies of roughly 100,000 to more than 250,000 entries so that more languages and code compress well. The ID is used to look up a row of the embedding matrix on input, and the output layer produces one logit per ID.

    Beyond ordinary text tokens, vocabularies contain special tokens that never appear as literal text: beginning- and end-of-sequence markers, padding, role and turn delimiters used by chat templates, tool-call markers and, in some models, reasoning delimiters. Serving stacks normally refuse to let user text produce these tokens by accident, because a user who could inject a turn delimiter could fake a system or assistant message. Images, audio and video in multimodal models are also converted to tokens (patches or frames mapped to embeddings), which is why a picture has a token cost.

    Token counts drive three operational quantities. Pricing is per million input and output tokens, with output typically priced several times higher and cached input cheaper. The context window and maximum output are expressed in tokens. Latency scales with output tokens because each requires a forward pass. A widely quoted rule of thumb is roughly four characters or three quarters of a word per token for English text, but the ratio depends on the tokenizer: Anthropic's documentation notes that 1 million tokens holds fewer words on its newest tokenizer than on earlier models, so identical text can cost different amounts on successive model generations.

    The ratio also varies sharply by language and script. Petrov et al. (2023) measured tokenization lengths for parallel translations of the same text and found differences of up to 15 times between languages, persisting even in tokenizers designed to be multilingual. Danish is written in Latin script and fares better than many languages, but long compounds are still split into several pieces, so Danish text typically costs more tokens than equivalent English and fills the context window faster. For budgeting, count tokens with the specific model's tokenizer or token-counting endpoint rather than estimating from words. The AI sense of token is unrelated to authentication tokens, API keys or cryptographic tokens.
  da: |-
    Et token er en post i en models faste ordforråd, identificeret ved et heltals-ID. De fleste ordforråd læres med subword-algoritmer som byte-pair encoding, så hyppige ord, almindelige orddele, ord med foranstillet mellemrum, tegnsætning, grupper af cifre og rå bytes hver får deres egne poster. Ordforrådets størrelse er et designvalg, der låses før fortræningen: GPT-2 brugte 50.257 poster, og nyere modelfamilier bruger ordforråd på omkring 100.000 til over 250.000 poster, så flere sprog og kode komprimeres godt. ID'et bruges til at slå en række op i embedding-matricen på vej ind, og outputlaget giver én logit pr. ID.

    Ud over almindelige teksttokens indeholder ordforråd særlige tokens, der aldrig optræder som bogstavelig tekst: markører for start og slut på en sekvens, udfyldning, skilletegn for roller og ture i chatskabeloner, markører for værktøjskald og i nogle modeller skilletegn for ræsonnement. Serveringslag forhindrer normalt, at brugertekst ved et uheld bliver til disse tokens, for en bruger, der kunne indsætte et tur-skilletegn, kunne forfalske en system- eller assistentbesked. Billeder, lyd og video i multimodale modeller omsættes også til tokens (felter eller billeder afbildet til embeddings), og derfor har et billede en token-pris.

    Antallet af tokens styrer tre driftsstørrelser. Prisen er pr. million input- og output-tokens, hvor output typisk koster flere gange mere, og cachet input mindre. Kontekstvinduet og det maksimale output angives i tokens. Ventetiden vokser med antallet af output-tokens, fordi hvert kræver et forward pass. En udbredt tommelfingerregel er omkring fire tegn eller trekvart ord pr. token for engelsk tekst, men forholdet afhænger af tokenizeren: Anthropics dokumentation oplyser, at 1 million tokens rummer færre ord med den nyeste tokenizer end med tidligere modeller, så den samme tekst kan koste forskelligt på efterfølgende modelgenerationer.

    Forholdet varierer også kraftigt mellem sprog og skriftsystemer. Petrov m.fl. (2023) målte tokenlængder for parallelle oversættelser af samme tekst og fandt forskelle på op til 15 gange mellem sprog, også i tokenizere designet til at være flersprogede. Dansk skrives med latinske bogstaver og klarer sig bedre end mange sprog, men lange sammensatte ord deles stadig i flere stykker, så dansk tekst typisk koster flere tokens end tilsvarende engelsk og fylder kontekstvinduet hurtigere. Til budgettering bør man tælle tokens med den konkrete models tokenizer eller tælle-endpoint i stedet for at skønne ud fra antal ord. AI-betydningen af token har intet med login-tokens, API-nøgler eller kryptografiske tokens at gøre.
