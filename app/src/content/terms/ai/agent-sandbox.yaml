edges:
  requires: [ai-agent]
  mitigates:
    - to: excessive-agency
      why:
        en: Even if an agent has broad tools, the walls around it cap what those tools can actually reach.
        da: Selv hvis en agent har brede værktøjer, sætter væggene omkring den en grænse for, hvad værktøjerne faktisk kan nå.
      strength: primary
      confidence: high
    - to: prompt-injection
      why:
        en: It does not stop the trick, but it limits the damage - a tricked agent can only harm what is inside the walls.
        da: Det stopper ikke tricket, men begrænser skaden - en narret agent kan kun skade det, der er inden for væggene.
      strength: normal
      confidence: high
  used-with:
    - to: container
      why:
        en: Containers are the most common way to build an agent sandbox quickly and throw it away after each task.
        da: Containere er den mest udbredte måde at bygge en agent-sandkasse hurtigt og smide den væk efter hver opgave.
      strength: primary
      confidence: high
    - least-privilege
    - computer-use
    - to: coding-agent
      why:
        en: Run the agent inside a sandbox so its commands, file access and network reach stop at the project; a tricked agent then cannot touch the rest of the machine.
        da: Kør agenten i en sandkasse, så dens kommandoer, filadgang og netværksadgang stopper ved projektet; en narret agent kan så ikke røre resten af maskinen.
      strength: normal
      confidence: medium
