term:
  en: Clustering
  da: Klyngeanalyse (clustering)
aka:
  en: []
  da: [clustering, klyngedannelse]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Letting a computer put similar items into groups by itself, with no names or right answers given in advance.
  da: At lade en computer selv dele ting, der ligner hinanden, op i grupper, uden at navne eller rigtige svar er givet på forhånd.
body:
  formal:
    en: A task in machine learning that splits unlabelled items into groups so that items in the same group are more alike than items in different groups; the number and meaning of the groups are not given.
    da: En opgave i maskinlæring, der deler ting uden mærkater op i grupper, så ting i samme gruppe ligner hinanden mere end ting i forskellige grupper; antallet af grupper og deres betydning er ikke givet.
  plain:
    en: Like looking up at the night sky and seeing which stars sit close together; the groups come first, and the names for them come afterwards.
    da: Som at kigge op på nattehimlen og se, hvilke stjerner der ligger tæt sammen - grupperne kommer først, og navnene på dem kommer bagefter.
  inPractice:
    en: A data analyst at a Danish online shop groups 80,000 customers by what and when they buy and finds six groups, including one that only ever shops during sales.
    da: En dataanalytiker i en dansk webshop grupperer 80.000 kunder efter, hvad og hvornår de køber, og finder seks grupper, herunder én, der kun handler, når der er udsalg.
  whyItMatters:
    en: It finds order in piles of data nobody has time to label, but the groups carry no meaning until a person looks at them, and a different setting can split the same data quite differently.
    da: Den finder orden i bunker af data, som ingen har tid til at mærke, men grupperne betyder intet, før et menneske har set på dem - og en anden indstilling kan dele de samme data helt anderledes.
deepDive:
  en: |-
    k-means is the default partitioning method. Given k, it minimises the within-cluster sum of squared distances to the cluster centroids by Lloyd's algorithm: assign each point to its nearest centroid, recompute each centroid as the mean of its points, and repeat until assignments stop changing. Each iteration costs O(n·k·d). Finding the global optimum is NP-hard even for two clusters, so the result depends on initialisation; k-means++ (Arthur and Vassilvitskii, 2007) picks spread-out starting centroids with probability proportional to squared distance and is O(log k)-competitive with the optimal clustering in expectation, and implementations run several restarts and keep the best. k-means assumes roughly spherical clusters of similar size in Euclidean space and is sensitive to outliers and to feature scaling.

    Other families make different assumptions. Hierarchical agglomerative clustering starts with every point alone and repeatedly merges the closest pair of clusters, with the linkage criterion (single, complete, average or Ward's minimum variance) defining "closest"; the result is a dendrogram that can be cut at any level. Density-based DBSCAN (Ester et al., 1996) takes a radius eps and a minimum neighbourhood size minPts, grows clusters from core points in dense regions, finds arbitrarily shaped clusters and labels sparse points as noise; HDBSCAN removes the need for a single global eps. Gaussian mixture models fitted with the EM algorithm give soft, probabilistic assignments and elliptical clusters. Spectral clustering works on the eigenvectors of a similarity graph.

    Choosing the number of clusters is a judgement call. The elbow method looks for a bend in the within-cluster error curve; the silhouette coefficient (Rousseeuw, 1987) compares each point's mean distance to its own cluster with that to the nearest other cluster, from -1 to 1; information criteria such as BIC apply to mixture models. These indices measure geometric separation, not usefulness. Kleinberg (2002) proved that no clustering function can satisfy three natural axioms (scale invariance, richness and consistency) at once, which formalises why different algorithms legitimately disagree.

    In practice results depend more on representation than on algorithm. Features must be scaled or standardised, categorical data needs suitable distances, and high-dimensional data suffers from distance concentration, so text and images are usually embedded first and compared with cosine similarity, often after dimensionality reduction. Cluster labels are also unstable: rerunning with a different seed or a slightly different sample can reshuffle membership, so stability should be checked before clusters feed decisions.

    Clustering is sometimes confused with classification because both produce groups, but classification assigns inputs to predefined, labelled classes learned from examples, while clustering discovers groups whose meaning must be interpreted afterwards. When clusters are used to segment or profile customers or citizens, the resulting segments can amount to profiling under GDPR Article 4(4).
  da: |-
    k-means er standardmetoden til opdeling. Givet k minimerer den summen af kvadrerede afstande til klyngernes centroider inden for hver klynge med Lloyds algoritme: Hvert punkt tildeles den nærmeste centroide, hver centroide genberegnes som gennemsnittet af sine punkter, og det gentages, til tildelingerne ikke ændrer sig. Hver iteration koster O(n·k·d). Det globale optimum er NP-svært at finde, selv med to klynger, så resultatet afhænger af initialiseringen; k-means++ (Arthur og Vassilvitskii, 2007) vælger spredte startcentroider med sandsynlighed proportional med den kvadrerede afstand og er i forventning O(log k)-konkurrencedygtig med den optimale opdeling, og implementeringer kører flere genstarter og beholder den bedste. k-means antager nogenlunde kugleformede klynger af ens størrelse i euklidisk rum og er følsom over for afvigere og skalering af features.

    Andre familier bygger på andre antagelser. Hierarkisk agglomerativ klyngeanalyse starter med hvert punkt for sig og slår gentagne gange det nærmeste par klynger sammen, hvor linkage-kriteriet (single, complete, average eller Wards minimumvarians) definerer "nærmest"; resultatet er et dendrogram, der kan skæres på ethvert niveau. Den tæthedsbaserede DBSCAN (Ester m.fl., 1996) tager en radius eps og en mindste nabolagsstørrelse minPts, vokser klynger fra kernepunkter i tætte områder, finder klynger af vilkårlig form og markerer spredte punkter som støj; HDBSCAN fjerner behovet for én global eps. Gaussiske mixture-modeller tilpasset med EM-algoritmen giver bløde, sandsynlighedsbaserede tildelinger og elliptiske klynger. Spektral klyngeanalyse arbejder på egenvektorerne af en similaritetsgraf.

    Valget af antal klynger er et skøn. Albuemetoden leder efter et knæk i kurven for fejlen inden for klyngerne; silhouette-koefficienten (Rousseeuw, 1987) sammenligner hvert punkts gennemsnitlige afstand til egen klynge med afstanden til den nærmeste anden klynge, fra -1 til 1; informationskriterier som BIC bruges til mixture-modeller. Disse indeks måler geometrisk adskillelse, ikke nytte. Kleinberg (2002) beviste, at ingen klyngefunktion kan opfylde tre naturlige aksiomer (skalainvarians, rigdom og konsistens) på én gang, hvilket formaliserer, hvorfor forskellige algoritmer med rette kan være uenige.

    I praksis afhænger resultatet mere af repræsentationen end af algoritmen. Features skal skaleres eller standardiseres, kategoriske data kræver passende afstandsmål, og data i mange dimensioner lider under afstandskoncentration, så tekst og billeder laves som regel først om til embeddings og sammenlignes med cosinus-similaritet, ofte efter dimensionsreduktion. Klyngemærkerne er også ustabile: En ny kørsel med et andet seed eller en lidt anden stikprøve kan blande medlemskabet om, så stabiliteten bør tjekkes, før klynger bruges til beslutninger.

    Klyngeanalyse forveksles undertiden med klassifikation, fordi begge danner grupper, men klassifikation placerer input i foruddefinerede, navngivne klasser lært fra eksempler, mens klyngeanalyse opdager grupper, hvis betydning må fortolkes bagefter. Når klynger bruges til at segmentere eller profilere kunder eller borgere, kan segmenterne udgøre profilering efter databeskyttelsesforordningens artikel 4, nr. 4.
edges:
  requires: [training-data]
  kind-of: [unsupervised-learning]
  used-with:
    - to: embedding
      why:
        en: Texts or images are first turned into embeddings, so that "alike" becomes "close together", and then grouped.
        da: Tekster eller billeder laves først om til embeddings, så "ens" bliver til "tæt på hinanden", og grupperes derefter.
      strength: primary
      confidence: high
    - cosine-similarity
