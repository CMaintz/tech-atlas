term:
  en: Code completion
  da: Kodefuldførelse (code completion)
aka:
  en: [AI code completion, inline code suggestions]
  da: [AI-kodefuldførelse, kodeforslag i linjen]
domain: [ai]
cluster: ai-coding
layer: application
status: current
summary:
  en: Greyed-out code that appears as you type, predicting the next line or block so you can accept it with one key.
  da: Grå kode, der dukker op, mens du skriver, og gætter næste linje eller blok, så du kan tage imod den med én tast.
body:
  formal:
    en: A feature that, after each pause in typing, sends the code before and after the editing point to a model trained with fill-in-the-middle and shows the most likely continuation inline; older forms only listed matching names from the project.
    da: En funktion, der hver gang man holder pause med at skrive, sender koden før og efter redigeringsstedet til en model trænet med fill-in-the-middle og viser den mest sandsynlige fortsættelse i linjen; ældre former viste kun passende navne fra projektet.
  plain:
    en: Like a friend who finishes your sentences as you talk — nod and their ending is yours, or just keep talking and it is forgotten.
    da: Som en ven, der gør dine sætninger færdige, mens du taler — nikker du, er slutningen din, og taler du bare videre, er den glemt.
  inPractice:
    en: A developer at a Danish web shop types the name of a function that checks phone numbers; before she writes the body, a ten-line version appears in grey and she presses Tab.
    da: En udvikler i en dansk webshop skriver navnet på en funktion, der tjekker telefonnumre; før hun skriver indholdet, dukker en version på ti linjer op i gråt, og hun trykker Tab.
  whyItMatters:
    en: Suggestions arrive many times an hour and each takes one key press to accept, so weak or unsafe lines slip in easily unless someone reads them.
    da: Forslagene kommer mange gange i timen, og hvert kræver kun ét tastetryk at tage imod, så svage eller usikre linjer glider let ind, medmindre nogen læser dem.
edges:
  part-of:
    - to: ai-coding-assistant
      why:
        en: Inline suggestions are the core, always-on feature of an AI coding assistant, alongside chat and larger edits.
        da: Forslag i linjen er den centrale, altid aktive funktion i en AI-kodeassistent ved siden af chat og større ændringer.
      strength: primary
      confidence: high
  requires: [fill-in-the-middle, next-token-prediction]
  contrasts-with:
    - to: coding-agent
      why:
        en: Completion offers a few lines at the exact spot being typed; a coding agent plans and changes many files toward a goal.
        da: Fuldførelse tilbyder nogle få linjer netop dér, hvor der skrives; en kodeagent planlægger og ændrer mange filer mod et mål.
      strength: normal
      confidence: high
  causes:
    - to: vulnerability
      why:
        en: Studies of AI suggestions found a large share of the offered code contained known kinds of security flaws when accepted without checking.
        da: Undersøgelser af AI-forslag fandt, at en stor del af den tilbudte kode indeholdt kendte typer sikkerhedsfejl, når den blev taget imod uden tjek.
      strength: minor
      confidence: medium
sources:
  - title: Chen et al. (2021), Evaluating Large Language Models Trained on Code
    tier: reference
  - title: "Pearce et al. (2022), Asleep at the Keyboard? Assessing the Security of GitHub Copilot's Code Contributions (IEEE S&P)"
    tier: reference
draft: true
