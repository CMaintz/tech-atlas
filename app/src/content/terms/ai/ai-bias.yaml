term:
  en: AI bias
  da: Bias i AI
aka:
  en: [algorithmic bias, machine learning bias]
  da: [algoritmisk bias, skævhed i AI]
domain: [ai]
cluster: ai-risk
layer: model
status: current
era: 2016
summary:
  en: When an AI system treats some people or cases unfairly because of one-sided data or design choices.
  da: Når et AI-system systematisk behandler nogle mennesker eller sager uretfærdigt på grund af skæve data eller valg i designet.
body:
  formal:
    en: A systematic error in which a model's results favour or harm certain groups, usually because the training data under-represents them or reflects past unfair decisions, or because of how the goal was defined.
    da: En systematisk fejl, hvor en models resultater stiller bestemte grupper bedre eller dårligere, som regel fordi træningsdataene underrepræsenterer dem eller afspejler tidligere uretfærdige beslutninger, eller fordi målet er defineret skævt.
  plain:
    en: Like a new manager who only ever learned from one old boss's hiring records — they copy every habit, fair or not, and do it at speed.
    da: Som en ny leder, der kun har lært af én gammel chefs ansættelser — vedkommende kopierer alle vanerne, fair eller ej, og gør det i højt tempo.
  inPractice:
    en: A municipality tests an AI tool, trained on years of past case decisions, that ranks unemployed citizens for extra help, and finds it places people from certain areas lower although where they live was never meant to count.
    da: En kommune afprøver et AI-værktøj, der er trænet på mange års tidligere afgørelser og skal prioritere ledige til ekstra indsats, og opdager, at borgere fra bestemte postnumre havner lavere, selvom bopæl aldrig skulle tælle med.
  whyItMatters:
    en: An unfair pattern repeats in every automated decision until someone looks for it, so it can break equal-treatment and data protection law for thousands of people before anyone notices.
    da: En uretfærdig skævhed gentages i hver eneste automatiske afgørelse, indtil nogen leder efter den, så den kan bryde ligebehandlings- og databeskyttelsesreglerne for tusindvis af mennesker, før nogen opdager det.
edges:
  requires: [training-data, machine-learning]
  contrasts-with:
    - to: hallucination
      why:
        en: Bias is a steady tilt in results for certain groups; a hallucination is a confident answer that is simply made up.
        da: Bias er en fast skævhed i resultaterne for bestemte grupper; en hallucination er et selvsikkert svar, der simpelthen er fundet på.
      strength: normal
      confidence: high
  causes:
    - to: risk
      why:
        en: Unfair outcomes create legal, financial and reputation risk for the organisation using the system.
        da: Uretfærdige resultater skaber juridisk, økonomisk og omdømmemæssig risiko for den organisation, der bruger systemet.
      strength: minor
      confidence: medium
sources:
  - title: NIST AI 100-1 — Artificial Intelligence Risk Management Framework (AI RMF 1.0)
    tier: standard
    publisher: NIST
    url: https://doi.org/10.6028/NIST.AI.100-1
  - title: NIST SP 1270 — Towards a Standard for Identifying and Managing Bias in Artificial Intelligence
    tier: standard
    publisher: NIST
    url: https://doi.org/10.6028/NIST.SP.1270
