term:
  en: Adversarial example
  da: Adversarielt eksempel
aka:
  en: [adversarial input]
  da: [adversarielt input]
domain: [ai]
cluster: ai-risk
layer: inference
era: 2014
status: current
summary:
  en: An input altered on purpose, often in ways people cannot see, so that a trained AI model gives a confident but wrong answer.
  da: Et input, der er ændret med vilje, ofte usynligt for mennesker, så en færdigtrænet AI-model svarer forkert med stor sikkerhed.
body:
  formal:
    en: An input to a trained machine learning model, usually a neural network, that an attacker has shifted by a small, calculated amount so that the output changes to a wrong or chosen answer at inference time; the model itself is not modified.
    da: Et input til en trænet maskinlæringsmodel, typisk et neuralt netværk, som en angriber har forskudt en lille, beregnet smule, så resultatet under inferens skifter til et forkert eller bestemt svar; selve modellen ændres ikke.
  plain:
    en: Like an optical illusion made for a machine — a few dots a person would never notice make the computer see a cat as a toaster.
    da: Som en optisk illusion lavet til en maskine — nogle få prikker, et menneske aldrig ville lægge mærke til, får computeren til at se en kat som en brødrister.
  inPractice:
    en: A municipality's IT operations manager finds that its AI-based malware filter can be fooled — changing a few unused parts of a harmful file, without touching what it does, makes the filter mark it as safe.
    da: En kommunes IT-driftsansvarlige opdager, at det AI-baserede malware-filter kan narres — ændrer man nogle få dele af en skadelig fil, som filen ikke selv bruger, markerer filteret den som sikker, selvom den virker præcis som før.
  whyItMatters:
    en: A model can pass every ordinary test and still fail against an opponent who shapes the input, so high accuracy says little about safety where AI filters malware, checks faces or steers vehicles.
    da: En model kan bestå alle almindelige test og alligevel fejle over for en modstander, der former inputtet, så høj træfsikkerhed siger lidt om sikkerheden, når AI filtrerer malware, genkender ansigter eller styrer køretøjer.
edges:
  requires: [machine-learning, inference]
  exploits:
    - to: neural-network
      why:
        en: A network's answer can swing sharply after small, well-aimed changes to its input that a person would ignore.
        da: Et netværks svar kan slå kraftigt om efter små, velrettede ændringer af input, som et menneske ville overse.
      strength: primary
      confidence: high
  contrasts-with:
    - to: data-poisoning
      why:
        en: An adversarial example fools a finished model while it is in use; data poisoning corrupts the model while it learns.
        da: Et adversarielt eksempel narrer en færdig model, mens den bruges; dataforgiftning ødelægger modellen, mens den lærer.
      strength: primary
      confidence: high
sources:
