term:
  en: Self-supervised learning
  da: Selvsuperviseret læring
aka:
  en: []
  da: [self-supervised learning]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Machine learning where the right answers come from the data itself - for instance hiding a word in a sentence and guessing it back.
  da: Maskinlæring, hvor de rigtige svar kommer fra selve dataene - fx ved at skjule et ord i en sætning og gætte det igen.
body:
  formal:
    en: A form of machine learning that makes its own labels from unlabelled training data, by hiding or holding back part of each example and learning to fill it in from the rest.
    da: En form for maskinlæring, der laver sine egne mærkater ud fra træningsdata uden mærkater ved at skjule eller holde en del af hvert eksempel tilbage og lære at udfylde den ud fra resten.
  plain:
    en: Like learning a song by pausing the recording mid-line, singing the next words yourself, then playing on to check - the song is its own answer key.
    da: Som at lære en sang ved at sætte optagelsen på pause midt i en linje, synge de næste ord selv og så spille videre for at tjekke - sangen giver selv svaret.
  inPractice:
    en: A region's speech-to-text team lets a model learn from thousands of hours of Danish speech by hiding short bits of sound and guessing them, then needs only a few hours of typed-up dictations to handle doctors' notes.
    da: En regions tale-til-tekst-team lader en model lære af tusindvis af timers dansk tale ved at skjule korte bidder af lyden og gætte dem og behøver derefter kun få timers optagelser med færdig tekst for at kunne skrive lægernes notater ud.
  whyItMatters:
    en: Removing the need for human labels is what made training on the whole web possible - and why whatever is on the web, good or bad, ends up in the model.
    da: At fjerne behovet for menneskelige mærkater er det, der gjorde det muligt at træne på hele nettet - og grunden til, at alt på nettet, godt eller skidt, ender i modellen.
deepDive:
  en: |-
    The approach defines a pretext task whose target can be computed from the raw input, trains a network on it with an ordinary supervised loss, and then reuses the learned representations for downstream tasks. Two families dominate. Generative or predictive objectives reconstruct hidden parts of the input: causal language modelling predicts the next token from the preceding ones (the GPT line), masked language modelling predicts hidden tokens from both sides, and masked autoencoders for images (He et al., 2021) hide a large share of image patches, typically 75 percent, and reconstruct the pixels. Contrastive and joint-embedding objectives instead learn to map different views of the same item close together and different items apart: SimCLR (2020) contrasts two augmented crops of an image, and CLIP (2021) aligns images with their captions using a contrastive loss over large batches.

    BERT (Devlin et al., 2019) illustrates the details. It selects 15 percent of input tokens for prediction; of those, 80 percent are replaced by a [MASK] token, 10 percent by a random token and 10 percent are left unchanged, so the model cannot rely on seeing [MASK] at fine-tuning time. Speech works similarly: wav2vec 2.0 (Baevski et al., 2020) masks spans of latent speech features and solves a contrastive task over quantised targets, and showed that fine-tuning on very small amounts of transcribed audio could produce usable recognisers, which is the pattern behind low-resource languages and domain-specific dictation.

    A known failure mode for joint-embedding methods is representational collapse, where the network maps every input to the same vector and trivially satisfies the objective. Negative pairs (contrastive methods), asymmetric architectures with stop-gradient (BYOL, SimSiam) or explicit variance regularisation (VICReg) prevent it. Augmentation choices also encode assumptions: cropping and colour jitter teach invariance to those changes, which is harmful if colour matters for the downstream task.

    The terminology is contested. Some authors, including Yann LeCun, who popularised the term, distinguish it sharply from unsupervised learning; older literature files the same methods under unsupervised learning. The practical distinction is that self-supervised methods have an explicit prediction target and a supervised-style loss.

    Scale is the consequence and the risk. Because no human labelling is needed, pretraining corpora can include trillions of tokens of web text, which is what makes foundation models possible but also means that toxic content, personal data, copyrighted material and deliberately poisoned pages enter the model unless filtered. The pretrained model is usually followed by supervised fine-tuning and preference training before deployment.
  da: |-
    Tilgangen definerer en hjælpeopgave (pretext task), hvis mål kan beregnes ud fra det rå input, træner et netværk på den med et almindeligt superviseret tab og genbruger derefter de lærte repræsentationer til efterfølgende opgaver. To familier dominerer. Generative eller prædiktive mål rekonstruerer skjulte dele af inputtet: Kausal sprogmodellering forudsiger det næste token ud fra de foregående (GPT-linjen), maskeret sprogmodellering forudsiger skjulte tokens ud fra begge sider, og maskerede autoencodere til billeder (He m.fl., 2021) skjuler en stor andel af billedfelterne, typisk 75 procent, og rekonstruerer pixelværdierne. Kontrastive og joint-embedding-mål lærer i stedet at placere forskellige udgaver af samme element tæt sammen og forskellige elementer langt fra hinanden: SimCLR (2020) kontrasterer to augmenterede udsnit af et billede, og CLIP (2021) afstemmer billeder med deres billedtekster med et kontrastivt tab over store batches.

    BERT (Devlin m.fl., 2019) viser detaljerne. Modellen udvælger 15 procent af input-tokens til forudsigelse; af dem erstattes 80 procent af et [MASK]-token, 10 procent af et tilfældigt token, og 10 procent forbliver uændrede, så modellen ikke kan regne med at se [MASK] under finjustering. Tale fungerer på samme måde: wav2vec 2.0 (Baevski m.fl., 2020) maskerer afsnit af latente talefeatures og løser en kontrastiv opgave over kvantiserede mål og viste, at finjustering på meget små mængder transskriberet lyd kunne give brugbare talegenkendere, hvilket er mønstret bag sprog med få ressourcer og domænespecifik diktering.

    En kendt fejltype for joint-embedding-metoder er repræsentationskollaps, hvor netværket afbilder alle input til samme vektor og dermed trivielt opfylder målet. Negative par (kontrastive metoder), asymmetriske arkitekturer med stop-gradient (BYOL, SimSiam) eller eksplicit variansregularisering (VICReg) forhindrer det. Valget af augmentering indebærer også antagelser: Beskæring og farvevariation lærer modellen at være ufølsom over for netop de ændringer, hvilket er skadeligt, hvis farve betyder noget i den efterfølgende opgave.

    Begrebet er omstridt. Nogle forfattere, herunder Yann LeCun, der gjorde udtrykket udbredt, skelner skarpt mellem det og ikke-superviseret læring; ældre litteratur placerer de samme metoder under ikke-superviseret læring. Den praktiske forskel er, at selvsuperviserede metoder har et eksplicit forudsigelsesmål og et tab i superviseret stil.

    Skala er både konsekvensen og risikoen. Fordi der ikke kræves menneskelig mærkning, kan fortræningskorpora omfatte billioner af tokens webtekst, hvilket gør foundation models mulige, men også betyder, at giftigt indhold, personoplysninger, ophavsretligt beskyttet materiale og bevidst forgiftede sider havner i modellen, medmindre de filtreres fra. Den fortrænede model efterfølges normalt af superviseret finjustering og præferencetræning før udrulning.
edges:
  kind-of: [machine-learning]
  requires: [training-data]
  contrasts-with:
    - to: supervised-learning
      why:
        en: Both learn from right answers, but in supervised learning people write the answers; here they are cut out of the data itself.
        da: Begge lærer af rigtige svar, men i superviseret læring skriver mennesker svarene; her klippes de ud af selve dataene.
      strength: primary
      confidence: high
    - to: unsupervised-learning
      why:
        en: Neither needs human labels, but unsupervised learning only looks for groups and patterns, while self-supervised learning sets itself fill-in-the-gap tasks with a right answer.
        da: Ingen af dem kræver menneskelige mærkater, men ikke-superviseret læring leder kun efter grupper og mønstre, mens selvsuperviseret læring giver sig selv udfyld-hullet-opgaver med et rigtigt svar.
      strength: normal
      confidence: medium
sources:
  - title: 'Devlin et al. (2019), BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
    tier: reference
  - title: 'Jurafsky & Martin, Speech and Language Processing'
    tier: textbook
