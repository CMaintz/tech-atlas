term:
  en: Backpropagation
  da: Backpropagation
aka:
  en: [backprop, backward pass]
  da: [backprop, tilbagepropagering]
domain: [ai]
cluster: training
layer: training
era: 1986
status: current
summary:
  en: The bookkeeping trick that works out, layer by layer from the output back, how much each weight in a network added to its mistake.
  da: Det regnetrick, der lag for lag fra output og bagud regner ud, hvor meget hver vægt i et netværk bidrog til dets fejl.
body:
  formal:
    en: A method for computing, in one backward sweep through a neural network, how the loss would change if each weight changed; gradient descent then uses those numbers to update the model weights.
    da: En metode til i én baglæns gennemgang af et neuralt netværk at beregne, hvordan tabet ville ændre sig, hvis hver vægt ændrede sig; gradientnedstigning bruger derefter tallene til at opdatere modelvægtene.
  plain:
    en: Like a kitchen following a burnt dish back through every cook who touched it, deciding how much blame each one carries, so each knows how much to change next time.
    da: Som et køkken, der sporer en brændt ret tilbage gennem hver kok, der rørte den, og afgør, hvor meget skyld hver bærer, så alle ved, hvor meget de skal ændre næste gang.
  inPractice:
    en: A picture-sorting network guesses "dog" for a cat photo; backpropagation passes that error back through every layer and gives each of its millions of weights a small share of the blame.
    da: Et netværk, der sorterer billeder, gætter "hund" for et kattefoto; backpropagation sender fejlen tilbage gennem alle lag og giver hver af de millioner af vægte en lille del af skylden.
  whyItMatters:
    en: Without a cheap way to share out blame, networks with many layers could not be trained at all; this method is what made deep learning practical.
    da: Uden en billig måde at fordele skylden på kunne netværk med mange lag slet ikke trænes; metoden er det, der gjorde deep learning praktisk mulig.
edges:
  requires: [neural-network, gradient-descent]
  part-of: [model-training]
  used-with:
    - to: model-weights
      why:
        en: Its whole output is one number per weight saying which way that weight should move.
        da: Hele dens resultat er ét tal pr. vægt, der siger, hvilken vej vægten skal flyttes.
      strength: normal
      confidence: high
sources:
