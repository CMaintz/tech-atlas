term:
  en: MCP server
  da: MCP-server
aka:
  en: []
  da: []
domain: [ai]
cluster: agents
layer: agent
era: 2024
status: emerging
summary:
  en: A small program that offers tools or data to AI apps through the Model Context Protocol, such as reading mail or searching files.
  da: Et lille program, der tilbyder værktøjer eller data til AI-apps via Model Context Protocol, fx at læse mail eller søge i filer.
body:
  formal:
    en: A program that speaks the Model Context Protocol and tells a connected AI app which tools, data and prompts it offers, each with a name and a text description; it runs the tool calls it receives, either on the same machine or over the internet.
    da: Et program, der taler Model Context Protocol og fortæller en tilsluttet AI-app, hvilke værktøjer, data og prompts det tilbyder, hver med et navn og en tekstbeskrivelse; det udfører de værktøjskald, det modtager, enten på samme maskine eller over internettet.
  plain:
    en: Like letting a temp from an unknown agency into the office because their written list of skills looks useful — you only have their word for what they will actually do.
    da: Som at lukke en vikar fra et ukendt bureau ind på kontoret, fordi vikarens skrevne liste over, hvad vedkommende kan, ser nyttig ud — man har kun vikarens eget ord for, hvad der faktisk sker.
  inPractice:
    en: The office manager at a small Danish firm installs a free MCP server from the web so an assistant can manage her calendar; it asks for her full account login, and every tool description it sends goes straight to the model.
    da: Kontorchefen i en lille dansk virksomhed installerer en gratis MCP-server fra nettet, så en assistent kan styre hendes kalender; den beder om hele kontoens login, og hver værktøjsbeskrivelse, den sender, går direkte til modellen.
  whyItMatters:
    en: Each one is outside code with real access running next to your assistant, so a careless or hostile one can leak secrets or steer the model — it deserves the same care as installing any other software.
    da: Hver af dem er fremmed kode med reel adgang, der kører ved siden af ens assistent, så en sjusket eller ondsindet server kan lække hemmeligheder eller styre modellen — den skal installeres med samme omhu som al anden software.
edges:
  requires: [tool-calling]
  part-of:
    - to: model-context-protocol
      why:
        en: MCP servers are the side of the protocol that offers tools; the AI app on the other side calls them.
        da: MCP-servere er den side af protokollen, der tilbyder værktøjer; AI-appen på den anden side kalder dem.
      strength: primary
      confidence: high
  kind-of: [server]
  used-with:
    - to: oauth
      why:
        en: The MCP rules for logging in to remote servers build on OAuth 2.1, so a user grants limited access instead of handing over a password.
        da: MCP's regler for login på fjernservere bygger på OAuth 2.1, så en bruger giver begrænset adgang i stedet for at udlevere en adgangskode.
      strength: primary
      confidence: high
    - to: prompt-injection
      why:
        en: A tool's description is read by the model as trusted text, so a hostile MCP server can hide orders in it — known as tool poisoning.
        da: En værktøjsbeskrivelse læses af modellen som betroet tekst, så en ondsindet MCP-server kan gemme ordrer i den — kendt som tool poisoning.
      strength: primary
      confidence: high
    - to: secrets-management
      why:
        en: Many MCP servers need API keys or tokens to reach other systems; these belong in a secrets store, not in a plain settings file.
        da: Mange MCP-servere skal bruge API-nøgler eller tokens for at nå andre systemer; de hører hjemme i et hemmelighedslager, ikke i en almindelig indstillingsfil.
      strength: normal
      confidence: high
sources:
