term:
  en: Context engineering
  da: Context engineering
aka:
  en: []
  da: []
domain: [ai]
cluster: prompting
layer: application
status: emerging
era: 2025
summary:
  en: Choosing all a language model gets to see for a task - instructions, fetched documents, tool results, notes - not just the wording.
  da: At vælge alt, hvad en LLM får at se til en opgave - instruktioner, hentede dokumenter, værktøjsresultater og noter - og ikke kun ordlyden.
body:
  formal:
    en: The practice of deciding, for each step of an AI system, what goes into the context window and in what order - system prompt, retrieved documents, tool results, saved notes and earlier messages - within the limit on tokens.
    da: Praksissen at beslutte for hvert trin i et AI-system, hvad der kommer ind i kontekstvinduet og i hvilken rækkefølge - systemprompt, hentede dokumenter, værktøjsresultater, gemte noter og tidligere beskeder - inden for grænsen for antal tokens.
  plain:
    en: Like packing a small suitcase for a trip - what you leave out matters as much as what you put in, and what sits on top gets used first.
    da: Som at fylde en lille kuffert til en rejse - det, man lader blive hjemme, betyder lige så meget som det, man tager med, og det, der ligger øverst, bliver brugt først.
  inPractice:
    en: At a Danish software house, a developer sets up a coding agent to load only the task notes and the three most relevant files, and to swap long test output for a short summary before each next step.
    da: I et dansk softwarehus sætter en udvikler en kodeagent op til kun at hente opgavenoterne og de tre mest relevante filer og til at erstatte langt testoutput med et kort sammendrag før hvert nyt trin.
  whyItMatters:
    en: In long agent tasks, answers go wrong less from badly worded requests than from missing, stale or cluttered material in view, and untrusted material in view can also steer the agent.
    da: I lange agentopgaver går svar sjældnere galt på grund af dårligt formulerede ønsker end på grund af manglende, forældet eller rodet materiale i synsfeltet, og materiale, man ikke kan stole på, kan også styre agenten.
deepDive:
  en: |-
    The term gained currency in mid-2025 as agent builders argued that "prompt engineering" undersold the problem: in a multi-step agent, most of the tokens the model sees are not written by a human at all but assembled by the harness from tool definitions, retrieved documents, tool outputs, memory files and prior turns. Anthropic's engineering post "Effective context engineering for AI agents" (29 September 2025) frames the goal as finding the smallest set of high-signal tokens that maximises the likelihood of the desired outcome, treating context as a finite resource with diminishing returns.

    The underlying constraint is that model performance degrades as context grows, even well inside the nominal window. Anthropic calls this context rot; related measurements include the "lost in the middle" effect and long-context benchmarks that show effective length below advertised length. Irrelevant or contradictory material also distracts the model, and stale tool output can be mistaken for current state. Cost and latency scale with input tokens on every step of an agent loop, so an agent that re-sends a growing transcript pays quadratically over a long run unless prefix caching is exploited.

    The main techniques are well defined. System prompts should sit at the right altitude - specific enough to guide behaviour, general enough not to hard-code brittle rules - and be organised into clearly delimited sections. Tool sets should be minimal and non-overlapping, with tool outputs designed to be token-efficient (paginated, truncated, filterable). Just-in-time retrieval keeps lightweight references such as file paths, queries or URLs in context and loads content only when needed, instead of pre-loading everything. Compaction summarises a conversation nearing the limit and restarts with the summary; a lighter form clears old tool results that will not be needed again. Structured note-taking persists progress, decisions and to-do lists outside the context window, to be re-read later. Sub-agent architectures give focused tasks to helpers with clean contexts that return only condensed results to a coordinating agent.

    Ordering matters for both quality and cost: stable material (system prompt, tool definitions, reference documents) first so that prompt caching can reuse it, volatile material last, and the current question near the end where recall is strongest. Context engineering also has a security dimension that prompt engineering lacks. Every automated source - search results, fetched pages, repository files, other agents' outputs, persisted notes - is a channel for indirect prompt injection, and memory that persists between sessions can carry an injected instruction forward. Provenance labelling, separating trusted instructions from untrusted data, least-privilege tools and review of what is written to long-term memory are part of the discipline, not an add-on.
  da: |-
    Begrebet vandt udbredelse i midten af 2025, da udviklere af agenter argumenterede for, at "prompt engineering" undervurderede problemet: I en agent med mange trin er de fleste tokens, modellen ser, slet ikke skrevet af et menneske, men samlet af harnessen fra værktøjsdefinitioner, hentede dokumenter, værktøjsoutput, hukommelsesfiler og tidligere ture. Anthropics ingeniørindlæg "Effective context engineering for AI agents" (29. september 2025) beskriver målet som at finde det mindste sæt tokens med højt signal, der maksimerer sandsynligheden for det ønskede resultat, og behandler konteksten som en begrænset ressource med aftagende udbytte.

    Den underliggende begrænsning er, at modellens ydeevne falder, når konteksten vokser, også et godt stykke inden for det nominelle vindue. Anthropic kalder det context rot; beslægtede målinger omfatter "lost in the middle"-effekten og benchmarks for lang kontekst, der viser en effektiv længde under den annoncerede. Irrelevant eller modstridende materiale distraherer også modellen, og forældet værktøjsoutput kan forveksles med den aktuelle tilstand. Pris og ventetid skalerer med input-tokens i hvert trin af en agentløkke, så en agent, der gensender et voksende forløb, betaler kvadratisk over en lang kørsel, medmindre præfiks-caching udnyttes.

    De vigtigste teknikker er veldefinerede. Systemprompter skal ligge i den rette højde - præcise nok til at styre adfærden, generelle nok til ikke at hardkode skrøbelige regler - og være opdelt i tydeligt afgrænsede sektioner. Værktøjssæt skal være minimale og uden overlap, og værktøjsoutput skal være designet til at spare tokens (pagineret, afkortet, filtrerbart). Just-in-time-hentning holder lette referencer som filstier, forespørgsler eller URL'er i konteksten og indlæser først indholdet, når det skal bruges, i stedet for at forudindlæse alt. Komprimering (compaction) opsummerer en samtale, der nærmer sig grænsen, og starter forfra med resuméet; en lettere form rydder gamle værktøjsresultater, der ikke skal bruges igen. Struktureret notetagning gemmer fremdrift, beslutninger og opgavelister uden for kontekstvinduet, så de kan læses igen senere. Arkitekturer med underagenter giver afgrænsede opgaver til hjælpere med rene kontekster, der kun returnerer kondenserede resultater til en koordinerende agent.

    Rækkefølgen betyder noget for både kvalitet og pris: stabilt materiale (systemprompt, værktøjsdefinitioner, referencedokumenter) først, så prompt caching kan genbruge det, skiftende materiale sidst og det aktuelle spørgsmål nær slutningen, hvor genkaldelsen er stærkest. Context engineering har også en sikkerhedsdimension, som prompt engineering mangler. Enhver automatisk kilde - søgeresultater, hentede sider, filer i et repository, andre agenters output, gemte noter - er en kanal for indirekte prompt injection, og hukommelse, der overlever mellem sessioner, kan føre en indsat instruktion videre. Mærkning af oprindelse, adskillelse af betroede instruktioner fra upålidelige data, værktøjer med mindste privilegium og gennemgang af det, der skrives til langtidshukommelsen, er en del af disciplinen, ikke et tillæg.
edges:
  requires: [context-window]
  contrasts-with:
    - to: prompt-engineering
      why:
        en: Prompt engineering polishes the wording of one request; context engineering manages everything placed in view across many steps, much of it gathered automatically.
        da: Prompt engineering finpudser ordlyden af én forespørgsel; context engineering styrer alt, der lægges frem over mange trin, og meget af det samles automatisk.
      strength: primary
      confidence: high
  used-with:
    - to: retrieval-augmented-generation
      why:
        en: Fetching documents is one of the main ways material gets into view, and deciding which pieces to fetch is a context engineering choice.
        da: At hente dokumenter er en af de vigtigste måder, materiale kommer i synsfeltet på, og valget af, hvilke stykker der hentes, er et context engineering-valg.
      strength: normal
      confidence: high
    - to: tool-calling
      why:
        en: Tool results pile up quickly, so deciding which to keep, shorten or drop is a large part of the work.
        da: Værktøjsresultater hober sig hurtigt op, så det er en stor del af arbejdet at beslutte, hvilke der skal beholdes, forkortes eller smides ud.
      strength: normal
      confidence: high
sources:
  - title: Anthropic Engineering - Effective context engineering for AI agents (2025)
    tier: official-doc
    publisher: Anthropic
draft: true
