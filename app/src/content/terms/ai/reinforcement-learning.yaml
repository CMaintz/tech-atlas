term:
  en: Reinforcement learning
  da: Forstærkningslæring (reinforcement learning)
aka:
  en: []
  da: [reinforcement learning]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Machine learning by trial and error, where a system acts, gets a reward or a penalty, and slowly learns which actions pay off.
  da: Maskinlæring ved at prøve sig frem - et system handler, får belønning eller straf og lærer langsomt, hvilke handlinger der betaler sig.
body:
  formal:
    en: A form of machine learning in which an agent acts in a setting, receives a reward signal for the results, and learns a way of choosing actions that brings the most reward over time, without being shown the right action.
    da: En form for maskinlæring, hvor en agent handler i et miljø, modtager et belønningssignal for resultaterne og lærer en måde at vælge handlinger på, der giver mest belønning over tid, uden at få vist den rigtige handling.
  plain:
    en: Like teaching a dog a trick with treats - nobody explains the trick, the dog just learns which moves earn a treat.
    da: Som at lære en hund et trick med godbidder - ingen forklarer tricket, hunden lærer bare, hvilke bevægelser der giver en godbid.
  inPractice:
    en: A region's energy manager tests a system that adjusts the ventilation in a hospital wing; it earns a reward for using less power and a penalty each time a ward gets too warm or too cold.
    da: En energiansvarlig i en region tester et system, der styrer ventilationen i en hospitalsfløj; det får belønning for at bruge mindre strøm og straf, hver gang en afdeling bliver for varm eller for kold.
  whyItMatters:
    en: The system learns exactly what the reward measures, not what you meant, so a badly chosen reward can teach it to cheat or to please instead of to be right.
    da: Systemet lærer præcis det, belønningen måler, ikke det, man mente, så en dårligt valgt belønning kan lære det at snyde eller at behage frem for at have ret.
deepDive:
  en: |-
    The standard formalism is the Markov decision process (MDP): a set of states S, actions A, transition probabilities P(s′ | s, a), a reward function R and a discount factor γ between 0 and 1. The agent follows a policy π(a | s) and seeks to maximise the expected discounted return, the sum of γᵗ·rₜ over time. Value functions express how good a state, V(s), or a state-action pair, Q(s, a), is under a policy, and the Bellman equations relate each value to the immediate reward plus the discounted value of the successor state. When the true state is only partially observed, the setting becomes a POMDP.

    Algorithms fall into a few families. Value-based methods learn Q and act greedily on it: temporal-difference learning (Sutton, 1988) and Q-learning (Watkins, 1989) update estimates from single transitions, and DQN (Mnih et al., 2015) combined Q-learning with a deep network, experience replay and a target network to reach human-level play on many Atari games. Policy-gradient methods adjust the policy parameters directly along the gradient of expected return, starting with REINFORCE (Williams, 1992); actor-critic methods pair a policy with a learned value baseline, and Proximal Policy Optimization (PPO, 2017) constrains each update with a clipped objective and is widely used, including in RLHF. Model-based methods learn or are given the environment dynamics and plan with them, as in AlphaGo (2016) and AlphaZero, which combined Monte Carlo tree search with networks trained through self-play.

    The exploration-exploitation trade-off is intrinsic: the agent must try actions with uncertain value to discover better ones. Simple schemes include ε-greedy (a random action with probability ε) and optimism under uncertainty; the multi-armed bandit is the stateless special case used in online experimentation and recommendation. Credit assignment is the second core problem, since rewards may arrive long after the actions that caused them.

    Practical failure modes are well documented. Reward hacking or specification gaming occurs when the agent maximises the measured reward through unintended behaviour, such as circling to collect points rather than finishing a race. RL is sample-inefficient, so most training happens in simulators, and policies can fail to transfer to the real world (the sim-to-real gap). Training is also noisy and sensitive to random seeds and hyperparameters. Offline RL learns from logged data without new interaction, but must avoid overvaluing actions the logs never tried.

    In language models, reinforcement learning appears as a post-training stage: RLHF optimises against a reward model trained on human preference comparisons, and more recent reasoning models are trained with rewards from automatically verifiable outcomes such as passing unit tests or correct maths answers. The same reward-hacking risk applies, showing up as sycophancy or as gaming of the tests.
  da: |-
    Standardformalismen er Markov-beslutningsprocessen (MDP): en mængde tilstande S, handlinger A, overgangssandsynligheder P(s′ | s, a), en belønningsfunktion R og en diskonteringsfaktor γ mellem 0 og 1. Agenten følger en politik π(a | s) og søger at maksimere det forventede diskonterede afkast, summen af γᵗ·rₜ over tid. Værdifunktioner udtrykker, hvor god en tilstand, V(s), eller et par af tilstand og handling, Q(s, a), er under en given politik, og Bellman-ligningerne forbinder hver værdi med den umiddelbare belønning plus den diskonterede værdi af den efterfølgende tilstand. Når den sande tilstand kun kan observeres delvist, bliver det en POMDP.

    Algoritmerne falder i nogle få familier. Værdibaserede metoder lærer Q og handler grådigt ud fra den: temporal-difference-læring (Sutton, 1988) og Q-learning (Watkins, 1989) opdaterer estimater ud fra enkelte overgange, og DQN (Mnih m.fl., 2015) kombinerede Q-learning med et dybt netværk, experience replay og et target-netværk og nåede menneskeligt niveau i mange Atari-spil. Policy-gradient-metoder justerer politikkens parametre direkte langs gradienten af det forventede afkast, begyndende med REINFORCE (Williams, 1992); actor-critic-metoder parrer en politik med en lært værdibaseline, og Proximal Policy Optimization (PPO, 2017) begrænser hver opdatering med et klippet mål og er meget udbredt, også i RLHF. Modelbaserede metoder lærer eller får miljøets dynamik og planlægger med den, som i AlphaGo (2016) og AlphaZero, der kombinerede Monte Carlo-træsøgning med netværk trænet gennem selvspil.

    Afvejningen mellem udforskning og udnyttelse er indbygget: Agenten må prøve handlinger med usikker værdi for at finde bedre. Enkle strategier er ε-greedy (en tilfældig handling med sandsynlighed ε) og optimisme under usikkerhed; multi-armed bandit er specialtilfældet uden tilstand, som bruges i online-eksperimenter og anbefalingssystemer. Kreditfordeling er det andet kerneproblem, fordi belønningen kan komme længe efter de handlinger, der forårsagede den.

    De praktiske fejltyper er veldokumenterede. Reward hacking eller specification gaming opstår, når agenten maksimerer den målte belønning gennem utilsigtet adfærd, fx ved at køre i ring for at samle point i stedet for at gennemføre et løb. Forstærkningslæring er ineffektiv med data, så det meste træning sker i simulatorer, og politikker kan fejle ved overgangen til den virkelige verden (sim-to-real-kløften). Træningen er også støjfyldt og følsom over for seeds og hyperparametre. Offline-forstærkningslæring lærer af loggede data uden ny interaktion, men må undgå at overvurdere handlinger, som loggene aldrig har afprøvet.

    I sprogmodeller optræder forstærkningslæring som en eftertræningsfase: RLHF optimerer mod en belønningsmodel, der er trænet på menneskelige præferencesammenligninger, og nyere ræsonnerende modeller trænes med belønninger fra automatisk verificerbare udfald som beståede enhedstest eller korrekte matematiksvar. Samme risiko for reward hacking gælder og viser sig som indsmigrende svar (sycophancy) eller som snyd med testene.
edges:
  kind-of: [machine-learning]
  contrasts-with:
    - to: supervised-learning
      why:
        en: Supervised learning is shown the right answer for each example; reinforcement learning is only told afterwards how good its choice turned out.
        da: Superviseret læring får vist det rigtige svar for hvert eksempel; forstærkningslæring får kun bagefter at vide, hvor godt dens valg gik.
      strength: primary
      confidence: high
    - unsupervised-learning
  used-with: [rlhf]
