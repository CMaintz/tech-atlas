term:
  en: Context window
  da: Kontekstvindue
aka:
  en: [context length]
  da: [kontekstlængde]
domain: [ai]
cluster: llm
layer: inference
status: current
summary:
  en: The most text, counted in tokens, that a language model can take in and keep in view at one time, including its own answer.
  da: Den største mængde tekst, målt i tokens, som en sprogmodel kan tage ind og have for øje på én gang, inklusive sit eget svar.
body:
  formal:
    en: The fixed limit on how many tokens a language model can handle in one go; the prompt, earlier turns of the chat, added documents and the answer must all fit inside it.
    da: Den faste grænse for, hvor mange tokens en sprogmodel kan håndtere på én gang; prompten, tidligere dele af samtalen, tilføjede dokumenter og svaret skal alle være inden for den.
  plain:
    en: Like the size of a desk — everything the model is working on has to fit on it, and when it is full, something has to be cleared away to make room.
    da: Som størrelsen på et skrivebord — alt, modellen arbejder med, skal kunne ligge på det, og når det er fuldt, må noget ryddes væk for at gøre plads.
  inPractice:
    en: A clerk in a region works with an AI assistant through a long afternoon; it starts ignoring the format rules given at the start, because the chat app has cut the oldest messages to keep the rest inside the context window.
    da: En medarbejder i en region arbejder med en AI-assistent en hel eftermiddag; den begynder at ignorere de formatregler, den fik i starten, fordi chat-appen har skåret de ældste beskeder fra for at holde resten inden for kontekstvinduet.
  whyItMatters:
    en: It limits how much a model can weigh in one answer, and everything inside it — including text from a file nobody checked — shapes that answer.
    da: Det begrænser, hvor meget en model kan tage højde for i ét svar, og alt, hvad der ligger i vinduet — også tekst fra en fil, ingen har tjekket — påvirker svaret.
edges:
  requires: [token]
  part-of: [large-language-model]
  contrasts-with:
    - to: training-data
      why:
        en: Text in the context window is only read for the current answer; training data shaped the model beforehand. A supplier may still keep chats and reuse them as training data later.
        da: Tekst i kontekstvinduet læses kun til det aktuelle svar; træningsdata formede modellen på forhånd. En leverandør kan dog gemme samtaler og senere genbruge dem som træningsdata.
      strength: primary
      confidence: high
    - to: knowledge-cutoff
      why:
        en: The context window is what the model can read right now; the knowledge cutoff is where its built-in knowledge stops — new facts can only get in through the window.
        da: Kontekstvinduet er, hvad modellen kan læse lige nu; vidensgrænsen er, hvor dens indbyggede viden stopper — nye fakta kan kun komme ind gennem vinduet.
      strength: normal
      confidence: medium
  used-with:
    - to: kv-cache
      why:
        en: The longer the context window in use, the larger the KV cache grows, so its memory cost often sets the practical context limit.
        da: Jo længere kontekstvindue der bruges, desto større bliver KV-cachen, så dens hukommelsesforbrug sætter ofte den praktiske grænse for konteksten.
      strength: normal
      confidence: medium
sources:
  - title: Vaswani et al. (2017), Attention Is All You Need
    tier: reference
  - title: NIST AI 600-1 — Artificial Intelligence Risk Management Framework, Generative AI Profile
    tier: standard
    publisher: NIST
