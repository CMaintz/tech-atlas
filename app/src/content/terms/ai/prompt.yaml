term:
  en: Prompt
  da: Prompt
aka:
  en: []
  da: []
domain: [ai]
cluster: llm
layer: inference
status: current
summary:
  en: The text you give a language model — a question, an order, pasted files — that it treats as its starting point for an answer.
  da: Den tekst, du giver en sprogmodel — et spørgsmål, en ordre, indsatte filer — som den bruger som udgangspunkt for sit svar.
body:
  formal:
    en: The full input sent to a language model for one answer, often made of hidden instructions from the service owner (a "system prompt") plus the user's text and any added documents.
    da: Hele det input, der sendes til en sprogmodel for ét svar, ofte sammensat af skjulte instruktioner fra tjenestens ejer (en "systemprompt") plus brugerens tekst og eventuelle tilføjede dokumenter.
  plain:
    en: Like the brief you hand a new temp — the clearer and fuller it is, the better the work, but they will follow whatever the note says.
    da: Som den opgavebeskrivelse, du giver en ny vikar — jo klarere og mere udførlig, jo bedre arbejde, men vikaren følger, hvad der end står på sedlen.
  inPractice:
    en: A buyer in a region pastes a supplier contract into an approved chat assistant and writes “list the risky clauses” — the contract and the request together form the prompt.
    da: En indkøber i en region indsætter en leverandørkontrakt i en godkendt chatassistent og skriver “nævn de risikable klausuler” — kontrakten og anmodningen udgør tilsammen prompten.
  whyItMatters:
    en: Whatever goes into a prompt leaves the organisation's control and may be stored by the provider; and because the model cannot tell data from orders, text inside a prompt can steer it.
    da: Alt, hvad der kommer i en prompt, forlader organisationens kontrol og kan blive gemt af udbyderen; og da modellen ikke kan skelne data fra ordrer, kan tekst i en prompt styre den.
