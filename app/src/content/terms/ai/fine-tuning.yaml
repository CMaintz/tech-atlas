term:
  en: Fine-tuning
  da: Finjustering (fine-tuning)
aka:
  en: []
  da: [fine-tuning, finjustering]
domain: [ai]
cluster: llm
layer: training
status: current
summary:
  en: Giving an already trained model a short extra round of training on a smaller, focused set of examples to change how it behaves.
  da: At give en allerede trænet model en kort ekstra træningsrunde på et mindre, målrettet sæt eksempler for at ændre dens adfærd.
body:
  formal:
    en: A second, smaller round of model training that starts from a finished general model and adjusts some or all of its weights on task-specific data, such as a company's own texts.
    da: En anden, mindre runde modeltræning, der starter fra en færdig generel model og justerer nogle eller alle dens vægte på opgavespecifikke data, fx en virksomheds egne tekster.
  plain:
    en: Like a trained nurse doing a short course to focus on children's care — the broad skills stay, a narrow set is sharpened.
    da: Som en uddannet sygeplejerske, der tager et kort kursus i pleje af børn — de brede evner bliver, mens et snævert område bliver styrket.
  inPractice:
    en: A pension fund fine-tunes a language model on thousands of past replies to members, so that it drafts answers in the fund's own tone and format.
    da: En pensionskasse finjusterer en sprogmodel på tusindvis af tidligere svar til medlemmerne, så den skriver udkast i kassens egen tone og form.
  whyItMatters:
    en: Data used here becomes part of the model and is hard to take out again, so personal data in it may leak and cannot simply be deleted when someone asks.
    da: Data, der bruges her, bliver en del af modellen og er svære at fjerne igen, så personoplysninger i dem kan lække og ikke bare kan slettes, når nogen beder om det.
edges:
  kind-of: [model-training]
  alternative-to:
    - to: retrieval-augmented-generation
      why:
        en: Both adapt a model to your organisation; fine-tuning bakes knowledge into the model, while RAG looks it up at answer time and can be updated or limited per user.
        da: Begge tilpasser en model til organisationen; finjustering bager viden ind i modellen, mens RAG slår den op, når der svares, og kan opdateres eller begrænses per bruger.
      strength: primary
      confidence: high
  used-with: [large-language-model, training-data]
sources:
  - title: Howard & Ruder (2018), Universal Language Model Fine-tuning for Text Classification
    tier: reference
