term:
  en: Chunking
  da: Opdeling i bidder (chunking)
aka:
  en: [text splitting]
  da: [tekstopdeling]
domain: [ai]
cluster: retrieval
layer: application
status: current
summary:
  en: Cutting long documents into smaller passages before storing them, so a search can return just the part that answers a question.
  da: At skære lange dokumenter op i mindre afsnit, før de gemmes, så en søgning kan returnere netop den del, der besvarer et spørgsmål.
body:
  formal:
    en: The step that splits source documents into pieces of a chosen size, counted in tokens and often with some overlap, each of which gets its own embedding and is stored and found on its own.
    da: Det trin, der deler kildedokumenter op i stykker af en valgt størrelse, målt i tokens og ofte med et vist overlap, hvor hvert stykke får sin egen embedding og gemmes og findes for sig.
  plain:
    en: Like cutting a cookbook into recipe cards — easier to find the one you need, but cut in the wrong place and a card starts halfway through the steps.
    da: Som at klippe en kogebog op i opskriftskort — lettere at finde det kort, man skal bruge, men klip det forkerte sted, og et kort starter midt i fremgangsmåden.
  inPractice:
    en: A 200-page staff handbook is split into sections of about 500 tokens along its headings, so a leave question pulls in the leave rules instead of the whole book.
    da: En personalehåndbog på 200 sider deles i afsnit på cirka 500 tokens langs overskrifterne, så et spørgsmål om ferie henter ferieregler i stedet for hele bogen.
  whyItMatters:
    en: Bad cuts are a quiet, common reason for poor answers — a rule split from its exceptions reads as the full truth, and pieces that are too big waste the context window.
    da: Dårlige snit er en stille og almindelig årsag til dårlige svar — en regel, der er skilt fra sine undtagelser, læses som hele sandheden, og for store stykker spilder kontekstvinduet.
edges:
  part-of:
    - to: retrieval-augmented-generation
      why:
        en: Documents are cut into pieces when they are loaded, before anything can be stored or searched.
        da: Dokumenterne skæres i stykker, når de lægges ind, før noget kan gemmes eller søges i.
      strength: normal
      confidence: high
  requires:
    - token
    - to: context-window
      why:
        en: Piece size is chosen so that the handful of pieces found for a question fit in the context window next to the question itself.
        da: Stykkernes størrelse vælges, så den håndfuld stykker, der findes til et spørgsmål, kan være i kontekstvinduet sammen med selve spørgsmålet.
      strength: primary
      confidence: high
  used-with: [embedding-model]
sources:
  - title: Gao et al. (2023), Retrieval-Augmented Generation for Large Language Models — A Survey
    tier: reference
  - title: Lewis et al. (2020), Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
    tier: reference
