term:
  en: Model parameter
  da: Modelparameter
aka:
  en: [learned parameter]
  da: [lært parameter]
domain: [ai]
cluster: training
layer: model
status: current
summary:
  en: One of the numbers inside a model that is set by learning from data; their count is how model size is usually stated.
  da: Et af de tal inde i en model, der fastsættes ved at lære af data; antallet af dem er den måde, modelstørrelse normalt opgives på.
body:
  formal:
    en: An internal value of a model — mostly the model weights plus small offset values — that model training adjusts to reduce the loss; a large language model can have billions of them.
    da: En intern værdi i en model — mest modelvægtene plus små forskydningsværdier — som modeltræning justerer for at mindske tabet; en stor sprogmodel kan have milliarder af dem.
  plain:
    en: Like the tiles in a huge mosaic — no single tile means much, but together their colours make the picture, and more tiles allow finer detail.
    da: Som stenene i en kæmpe mosaik — ingen enkelt sten betyder meget, men tilsammen danner deres farver billedet, og flere sten giver finere detaljer.
  inPractice:
    en: An IT buyer in a municipality compares a “7B” and a “70B” model for an internal assistant; the figures are billions of model parameters and give a rough guide to memory needs, running cost and ability.
    da: En IT-indkøber i en kommune sammenligner en “7B”- og en “70B”-model til en intern assistent; tallene er milliarder af modelparametre og giver et groft bud på hukommelsesbehov, driftspris og evner.
  whyItMatters:
    en: Parameter count drives how much hardware, energy and money a model needs to train and run, and a larger count is no guarantee of a better result on a given task.
    da: Antallet af parametre styrer, hvor meget hardware, energi og penge en model kræver at træne og køre, og flere parametre er ingen garanti for et bedre resultat på en given opgave.
edges:
  requires: [machine-learning]
  part-of:
    - to: neural-network
      why:
        en: A neural network's behaviour is entirely set by the values of its parameters.
        da: Et neuralt netværks opførsel er helt bestemt af værdierne af dets parametre.
      strength: primary
      confidence: high
  used-with: [model-training]
sources:
  - title: 'Goodfellow, Bengio & Courville, Deep Learning'
    tier: textbook
    publisher: MIT Press
  - title: Kaplan et al. (2020), Scaling Laws for Neural Language Models
    tier: reference
