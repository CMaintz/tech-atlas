term:
  en: Encoder
  da: Encoder
aka:
  en: []
  da: []
domain: [ai]
cluster: model-architecture
layer: model
status: current
summary:
  en: The half of a model that reads the whole input at once and turns it into embeddings that capture its meaning.
  da: Den halvdel af en model, der læser hele inputtet på én gang og gør det til embeddings, som fanger betydningen.
body:
  formal:
    en: A stack of neural network layers that takes a full sequence of tokens and, letting every token look both forwards and backwards, produces one embedding per token for later steps to use.
    da: En stak af lag i et neuralt netværk, der tager en hel række tokens og, ved at lade hvert token kigge både frem og tilbage, laver én embedding pr. token til brug i de næste trin.
  plain:
    en: Like an interpreter who hears the whole sentence before saying anything, because a word at the very end can change what the first one meant.
    da: Som en tolk, der hører hele sætningen, før hun siger noget, fordi et ord helt til sidst kan ændre, hvad det første betød.
  inPractice:
    en: At a district heating company, an IT developer sorts incoming customer emails with an encoder-only model such as BERT, which reads each message whole and labels it “bill”, “fault” or “moving house”.
    da: Hos et fjernvarmeselskab sorterer en IT-udvikler indgående kundemails med en ren encoder-model som BERT, der læser hver besked i sin helhed og mærker den “regning”, “fejl” eller “flytning”.
  whyItMatters:
    en: Encoders handle search and sorting cheaply but cannot write new text, so knowing the difference lets you pick a smaller, faster tool when the job is only to understand text.
    da: Encodere klarer søgning og sortering billigt, men kan ikke skrive ny tekst, så kender man forskellen, kan man vælge et mindre og hurtigere værktøj, når opgaven kun er at forstå tekst.
edges:
  requires: [token, embedding, attention-mechanism]
  part-of:
    - to: transformer
      why:
        en: The original transformer paired an encoder that reads the input with a decoder that writes the output.
        da: Den oprindelige transformer parrede en encoder, der læser inputtet, med en decoder, der skriver outputtet.
      strength: primary
      confidence: high
sources:
