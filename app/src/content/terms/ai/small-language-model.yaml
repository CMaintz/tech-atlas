term:
  en: Small language model (SLM)
  da: Lille sprogmodel (SLM)
aka:
  en: [SLM]
  da: [SLM]
domain: [ai]
cluster: model-architecture
layer: model
status: emerging
summary:
  en: A language model small enough to run cheaply on a laptop or phone, trading some broad skill for speed, privacy and low cost.
  da: En sprogmodel, der er lille nok til at køre billigt på en bærbar eller telefon og bytter lidt kunnen for fart, privatliv og lav pris.
body:
  formal:
    en: A transformer built like a large language model but with far fewer model parameters — from a few hundred million up to around ten billion — often trained on carefully chosen data or through knowledge distillation from a larger model.
    da: En transformer bygget som en stor sprogmodel, men med langt færre modelparametre — fra nogle hundrede millioner op til omkring ti milliarder — ofte trænet på omhyggeligt udvalgte data eller gennem vidensdestillation fra en større model.
  plain:
    en: Like a pocket dictionary next to a full encyclopedia — it will not know everything, but it fits in your bag and answers the common questions right away.
    da: Som en lommeordbog ved siden af et helt leksikon — den ved ikke alt, men den passer i tasken og svarer med det samme på de almindelige spørgsmål.
  inPractice:
    en: A home-care nurse in a municipality dictates visit notes into a tablet that runs a small language model; it drafts the record entry even where there is no mobile signal, and nothing leaves the device.
    da: En sygeplejerske i en kommunes hjemmepleje indtaler besøgsnotater på en tablet, der kører en lille sprogmodel; den skriver et udkast til journalnotatet, også uden mobildækning, og intet forlader enheden.
  whyItMatters:
    en: For narrow, repeated tasks it can match a bigger model at a small share of the cost and delay, and keeping data on the device makes data protection far simpler.
    da: Til smalle, gentagne opgaver kan den matche en større model for en brøkdel af prisen og ventetiden, og når data bliver på enheden, bliver databeskyttelsen langt enklere.
edges:
  requires:
    - to: model-parameter
      why:
        en: '"Small" is measured in model parameters: fewer parameters mean less memory and faster answers, but less stored knowledge.'
        da: '"Lille" måles i modelparametre: færre parametre betyder mindre hukommelse og hurtigere svar, men mindre lagret viden.'
      strength: primary
      confidence: high
    - transformer
    - token
  used-with:
    - to: time-to-first-token
      why:
        en: A smaller model starts answering sooner, which is often the reason to choose one for live, on-device use.
        da: En mindre model begynder hurtigere at svare, hvilket ofte er grunden til at vælge den til brug direkte på enheden.
      strength: normal
      confidence: medium
sources:
  - title: Abdin et al. (2024), Phi-3 Technical Report — A Highly Capable Language Model Locally on Your Phone
    tier: reference
  - title: Gunasekar et al. (2023), Textbooks Are All You Need
    tier: reference
draft: true
