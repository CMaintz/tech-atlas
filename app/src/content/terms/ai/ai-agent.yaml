term:
  en: AI agent
  da: AI-agent
aka:
  en: [agentic AI]
  da: [agentisk AI]
domain: [ai]
cluster: llm
layer: agent
status: emerging
summary:
  en: An AI system that does not just answer but acts — it plans steps and uses tools such as email, files or web search to reach a goal.
  da: Et AI-system, der ikke bare svarer, men handler — det planlægger trin og bruger værktøjer som mail, filer eller websøgning for at nå et mål.
body:
  formal:
    en: A system, usually built around a large language model, that is given a goal and tool access, then chooses and carries out actions in a loop — calling tools, reading results, deciding the next step — with little human input.
    da: Et system, typisk bygget op om en stor sprogmodel, der får et mål og adgang til værktøjer og derefter vælger og udfører handlinger i en løkke — kalder værktøjer, læser resultater, beslutter næste trin — med lidt menneskelig indblanding.
  plain:
    en: Like an assistant given your keys and a to-do list rather than a chat window — useful, but only as safe as the keys you hand over.
    da: Som en assistent, der får dine nøgler og en huskeliste i stedet for et chatvindue — nyttig, men kun så sikker som de nøgler, du giver fra dig.
  inPractice:
    en: A ministry tests an agent that arranges meetings — it reads officials' calendars, books rooms and sends invitations under its own account, and every action it takes is logged for review.
    da: Et ministerium afprøver en agent, der arrangerer møder — den læser medarbejdernes kalendere, booker lokaler og sender invitationer fra sin egen konto, og hver handling logges, så den kan gennemgås.
  whyItMatters:
    en: An agent that reads untrusted text can be tricked into acting against its owner, so the harm it can do is set by what it may reach and do, not by how well it chats.
    da: En agent, der læser tekst, man ikke kan stole på, kan narres til at handle imod sin ejer, så den skade, den kan gøre, afhænger af, hvad den har adgang til og lov til — ikke af, hvor godt den svarer.
edges:
  requires: [large-language-model, prompt]
  used-with:
    - to: least-privilege
      why:
        en: Give an agent only the tools and rights its task needs, so a tricked or faulty agent can do little harm.
        da: Giv en agent kun de værktøjer og rettigheder, opgaven kræver, så en narret eller fejlende agent kan gøre lidt skade.
      strength: primary
      confidence: high
    - to: service-account
      why:
        en: An agent should act through its own account, not a person's, so its rights can be limited and its actions traced.
        da: En agent bør handle gennem sin egen konto, ikke en persons, så dens rettigheder kan begrænses og dens handlinger spores.
      strength: normal
      confidence: medium
    - log
    - prompt-injection
    - to: reinforcement-learning
      why:
        en: Agents that act step by step are often improved with rewards for finishing tasks well.
        da: Agenter, der handler trin for trin, forbedres ofte med belønning for at løse opgaver godt.
      strength: normal
      confidence: medium
    - to: human-in-the-loop
      why:
        en: An agent that can act should pause for a person before steps that are costly or hard to undo.
        da: En agent, der kan handle, bør stoppe og spørge en person før trin, der er dyre eller svære at gøre om.
      strength: normal
      confidence: medium
sources:
  - title: 'Russell & Norvig, Artificial Intelligence: A Modern Approach'
    tier: textbook
    publisher: Pearson
  - title: OWASP Top 10 for Large Language Model Applications (Excessive Agency)
    tier: reference
    publisher: OWASP
  - title: NIST AI 100-1 — Artificial Intelligence Risk Management Framework (AI RMF 1.0)
    tier: standard
    publisher: NIST
