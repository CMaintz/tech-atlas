term:
  en: Reasoning model
  da: Ræsonnementsmodel (reasoning model)
aka:
  en: [thinking model]
  da: [reasoning model, tænkende model]
domain: [ai]
cluster: llm
layer: model
status: emerging
era: 2024
summary:
  en: A language model trained to work through a problem step by step in hidden notes before it answers, trading time and cost for better answers.
  da: En LLM, der er trænet til at regne en opgave igennem trin for trin i skjulte noter, før den svarer — langsommere og dyrere, men bedre.
body:
  formal:
    en: A large language model trained to produce a long run of working-out tokens before its final answer, so that it spends more inference on hard tasks such as maths, code and planning.
    da: En stor sprogmodel, der er trænet til at skrive en lang række mellemregnings-tokens før sit endelige svar, så den bruger mere inferens på svære opgaver som matematik, kode og planlægning.
  plain:
    en: Like a navigator who plots the whole route on the chart before the ship leaves port — slower to get going, but with fewer wrong turns at sea.
    da: Som en navigatør, der tegner hele ruten ind på søkortet, før skibet forlader havnen — langsommere i gang, men med færre fejl undervejs.
  inPractice:
    en: A developer at a Danish webshop asks a reasoning model why some customers are charged twice at checkout; it “thinks” for a minute, tries and drops two ideas, then points to the faulty line.
    da: En udvikler i en dansk webshop spørger en ræsonnementsmodel, hvorfor nogle kunder bliver trukket to gange ved betalingen; den “tænker” et minut, prøver og dropper to idéer og peger så på den fejlbehæftede linje.
  whyItMatters:
    en: Used for simple questions it only wastes time and money, and its shown working-out is not a reliable record of how the answer was reached, so it proves nothing about whether the answer is right.
    da: Brugt til enkle spørgsmål spilder den blot tid og penge, og den viste mellemregning er ikke et pålideligt billede af, hvordan svaret blev nået, så den beviser intet om, hvorvidt svaret er rigtigt.
edges:
  kind-of: [large-language-model]
  requires:
    - to: inference
      why:
        en: Its gains come from spending more work at answer time, not only from a bigger model, so the idea rests on what happens during inference.
        da: Dens fremskridt kommer af at bruge mere arbejde, når der svares, ikke kun af en større model, så idéen bygger på, hvad der sker under inferens.
      strength: primary
      confidence: high
    - next-token-prediction
  causes:
    - to: latency
      why:
        en: Long hidden working-out must be written token by token before the answer starts, so replies can take seconds or minutes.
        da: Lang skjult mellemregning skal skrives token for token, før svaret begynder, så svar kan tage sekunder eller minutter.
      strength: normal
      confidence: high
sources:
  - title: OpenAI (2024), Learning to Reason with LLMs
    tier: official-doc
    publisher: OpenAI
  - title: 'DeepSeek-AI (2025), DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning'
    tier: reference
draft: true
