term:
  en: Prompt caching
  da: Prompt caching
aka:
  en: [context caching]
  da: [context caching]
domain: [ai]
cluster: ai-infrastructure
layer: inference
era: 2024
status: current
summary:
  en: A service feature that saves the work done on the start of a prompt, so later requests starting the same way are faster and cheaper.
  da: En funktion, der gemmer arbejdet med starten af en prompt, så senere forespørgsler, der starter ens, bliver hurtigere og billigere.
body:
  formal:
    en: A model-serving feature that stores the KV cache for the opening part of a prompt for a short time and reuses it when a later request begins with exactly the same tokens, so only the new remainder has to be read; providers usually bill reused tokens at a lower rate.
    da: En funktion i modelservering, der i kort tid gemmer KV-cache for den første del af en prompt og genbruger den, når en senere forespørgsel begynder med nøjagtig de samme tokens, så kun den nye rest skal læses; udbydere tager normalt en lavere pris for genbrugte tokens.
  plain:
    en: Like a lawyer who has already read the thick case file — each new question about it takes minutes, not a whole day of rereading.
    da: Som en advokat, der allerede har læst den tykke sagsmappe — hvert nyt spørgsmål om den tager minutter, ikke en hel dag med genlæsning.
  inPractice:
    en: At a Danish webshop, the developer behind the customer chat puts the 40 pages of delivery and return rules first in every request and the customer's question last; the provider reuses the stored start, so the chat's monthly bill falls sharply.
    da: I en dansk webshop lægger udvikleren bag kundechatten de 40 sider med leverings- og returregler først i hver forespørgsel og kundens spørgsmål til sidst; udbyderen genbruger den gemte begyndelse, så chattens månedlige regning falder markant.
  whyItMatters:
    en: It only pays off if the fixed part comes first and stays word-for-word the same. Providers keep the stored work for minutes up to a day and should never share it between customers — where it is shared, answer speed can reveal what others sent.
    da: Det betaler sig kun, hvis den faste del kommer først og forbliver ord for ord den samme. Udbydere gemmer arbejdet fra minutter op til et døgn og bør aldrig dele det mellem kunder — hvor det deles, kan svarhastigheden afsløre, hvad andre har sendt.
edges:
  requires:
    - to: kv-cache
      why:
        en: What is stored is the KV cache for the prompt's start — kept after one request ends so the next can pick it up.
        da: Det, der gemmes, er KV-cache for promptens begyndelse — bevaret, efter én forespørgsel er slut, så den næste kan tage den op.
      strength: primary
      confidence: high
    - prompt
  used-with:
    - to: time-to-first-token
      why:
        en: Skipping the reread of a long shared start is one of the biggest ways to shorten the wait before the first token.
        da: At springe genlæsningen af en lang fælles begyndelse over er en af de største måder at forkorte ventetiden før det første token.
      strength: primary
      confidence: high
    - system-prompt
