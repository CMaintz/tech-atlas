term:
  en: Multi-agent system
  da: Multiagentsystem
aka:
  en: [multi-agent architecture]
  da: [multiagentarkitektur]
domain: [ai]
cluster: agents
layer: agent
status: emerging
summary:
  en: A setup where several AI agents share a job — often a lead agent splits the work and hands parts to helper agents.
  da: En opsætning, hvor flere AI-agenter deler en opgave — ofte deler en ledende agent arbejdet op og giver dele til hjælpeagenter.
body:
  formal:
    en: A system of two or more AI agents, each with its own instructions, tools and context window, that pass tasks and results between them; a common shape has a lead agent that plans, starts helper agents in parallel and joins their findings.
    da: Et system af to eller flere AI-agenter, hver med egne instruktioner, værktøjer og kontekstvindue, der sender opgaver og resultater imellem sig; en udbredt form har en ledende agent, der planlægger, starter hjælpeagenter side om side og samler deres fund.
  plain:
    en: Like a newsroom — an editor hands stories to several reporters at once, each digs into one angle, and the editor stitches their notes into one article.
    da: Som en redaktion — en redaktør giver historier til flere journalister på én gang, hver graver i én vinkel, og redaktøren syr deres noter sammen til én artikel.
  inPractice:
    en: For a research question, a lead agent starts five helper agents that each search a different topic, then reads their short reports and writes the final answer.
    da: Ved et researchspørgsmål starter en ledende agent fem hjælpeagenter, der hver søger i et andet emne, og læser derefter deres korte rapporter og skriver det endelige svar.
  whyItMatters:
    en: Splitting work lets agents cover more ground than one context window allows, but it multiplies cost, and one tricked agent can pass bad orders on to the rest.
    da: At dele arbejdet op lader agenter nå mere, end ét kontekstvindue tillader, men det ganger omkostningen, og én narret agent kan give dårlige ordrer videre til resten.
edges:
  requires:
    - to: ai-agent
      why:
        en: Each part of a multi-agent system is itself an AI agent; the system adds the rules for how they split and share work.
        da: Hver del af et multiagentsystem er selv en AI-agent; systemet tilføjer reglerne for, hvordan de deler arbejdet.
      strength: primary
      confidence: high
  used-with:
    - to: observability
      why:
        en: With many agents handing work to each other, you need to trace who asked whom for what to find where a result went wrong.
        da: Når mange agenter giver arbejde videre til hinanden, skal man kunne spore, hvem der bad hvem om hvad, for at finde, hvor et resultat gik galt.
      strength: normal
      confidence: medium
    - to: prompt-injection
      why:
        en: Text one agent reads can carry hidden orders that it then passes to other agents as if they were its own.
        da: Tekst, som én agent læser, kan bære skjulte ordrer, som den så giver videre til andre agenter, som om de var dens egne.
      strength: normal
      confidence: medium
sources:
  - title: Wooldridge, An Introduction to MultiAgent Systems
    tier: textbook
    publisher: Wiley
  - title: 'Wu et al. (2023), AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation'
    tier: reference
