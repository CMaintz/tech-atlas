term:
  en: Classification
  da: Klassifikation
aka:
  en: []
  da: [klassificering, classification]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Teaching a computer to sort each new case into one of a fixed set of groups, such as approve or reject, or real attack or false alarm.
  da: At lære en computer at sortere hvert nyt tilfælde i én af nogle faste grupper, fx godkend eller afvis, ægte angreb eller falsk alarm.
body:
  formal:
    en: A task in machine learning where the model learns from labelled examples to give each new input one label from a known, fixed list, often together with a score for how sure it is.
    da: En opgave i maskinlæring, hvor modellen lærer af mærkede eksempler at give hvert nyt input én mærkat fra en kendt, fast liste, ofte sammen med en score for, hvor sikker den er.
  plain:
    en: Like a coin-sorting machine at a bank — every coin drops into the slot for its value, and there is no slot for a coin it has never seen.
    da: Som en møntsorteringsmaskine i banken — hver mønt falder ned i hullet for sin værdi, og der er intet hul til en mønt, den aldrig har set.
  inPractice:
    en: At a shipping company, a model trained on thousands of invoices a bookkeeper had already sorted puts each new invoice into one of 40 cost types, such as fuel or harbour fees, and sends the unsure ones back to her.
    da: I et rederi sætter en model, der er trænet på tusindvis af fakturaer, som en bogholder allerede havde sorteret, hver ny faktura i én af 40 slags udgifter, fx brændstof eller havneafgifter, og sender de usikre tilbage til hende.
  whyItMatters:
    en: No model sorts every case right, and wrong calls differ in cost — a missed attack usually costs more than a false alarm — so someone must decide which mistakes to accept and where a person checks.
    da: Ingen model sorterer alle tilfælde rigtigt, og forkerte afgørelser koster forskelligt — et overset angreb koster som regel mere end en falsk alarm — så nogen må beslutte, hvilke fejl man accepterer, og hvor et menneske tjekker.
edges:
  kind-of: [supervised-learning]
  contrasts-with:
    - to: regression
      why:
        en: Classification picks one group from a fixed list; regression gives a number on a scale, such as a price or a time.
        da: Klassifikation vælger én gruppe fra en fast liste; regression giver et tal på en skala, fx en pris eller en tid.
      strength: primary
      confidence: high
    - to: clustering
      why:
        en: Classification sorts into groups that people named in advance and taught with examples; clustering finds its own groups with no names given.
        da: Klassifikation sorterer i grupper, som mennesker har navngivet på forhånd og vist eksempler på; klyngeanalyse finder selv grupper uden givne navne.
      strength: primary
      confidence: high
    - to: generative-ai
      why:
        en: Classification only decides which group an input belongs to; generative AI makes new text, images or sound.
        da: Klassifikation afgør kun, hvilken gruppe et input hører til; generativ AI skaber ny tekst, nye billeder eller ny lyd.
      strength: normal
      confidence: high
    - to: data-classification
      why:
        en: Same word, different job — data classification is people labelling files by how secret they are, not a machine sorting inputs.
        da: Samme ord, forskelligt arbejde — dataklassifikation er, at mennesker mærker filer efter, hvor fortrolige de er, ikke at en maskine sorterer input.
      strength: normal
      confidence: high
  used-with:
    - false-positive
    - to: convolutional-neural-network
      why:
        en: CNNs are the classic tool for sorting images into categories.
        da: CNN'er er det klassiske værktøj til at sortere billeder i kategorier.
      strength: normal
      confidence: medium
sources:
