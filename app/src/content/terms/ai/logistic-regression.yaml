      why:
        en: It is the standard simple method for sorting cases into groups, giving a chance for each group rather than a number to predict.
        da: Den er standardmetoden til at sortere sager i grupper og giver en sandsynlighed for hver gruppe frem for et tal at forudsige.
      strength: primary
      confidence: high
  requires: [feature, linear-regression]
