term:
  en: Top-p sampling
  da: Top-p-sampling
aka:
  en: [nucleus sampling]
  da: [nucleus sampling]
domain: [ai]
cluster: prompting
layer: inference
status: current
era: 2019
summary:
  en: A rule letting a language model pick only among its most likely next options, until their chances add up to a set share like 90%.
  da: En regel, hvor en sprogmodel kun vælger blandt sine mest sandsynlige næste muligheder, til deres chancer tilsammen når fx 90 %.
body:
  formal:
    en: A form of sampling that sorts candidate tokens by chance, keeps the smallest group whose chances add up to at least p, and draws the next token from that group only, so the number of options grows or shrinks with how sure the model is.
    da: En form for sampling, der sorterer kandidat-tokens efter chance, beholder den mindste gruppe, hvis chancer tilsammen når mindst p, og kun trækker næste token fra den gruppe, så antallet af muligheder vokser eller bliver færre alt efter, hvor sikker modellen er.
  plain:
    en: Like a quiz team that only considers answers they are fairly sure of — when one is obvious they go with it, when unsure they weigh several, and wild guesses never make the table.
    da: Som et quizhold, der kun overvejer svar, de er rimelig sikre på — når ét er oplagt, tager de det, når de er i tvivl, vejer de flere, og vilde gæt kommer aldrig på bordet.
  inPractice:
    en: A developer in a municipality's IT department sees the letter-drafting assistant slip odd, off-topic phrases into letters; top-p is at 1, which lets any token be picked, so she lowers it to 0.9 and the stray phrases become rare.
    da: En udvikler i en kommunes IT-afdeling ser brevassistenten snige mærkelige, uvedkommende vendinger ind i breve; top-p står på 1, så ethvert token kan vælges, og hun sænker den til 0,9, hvorefter de skæve vendinger bliver sjældne.
  whyItMatters:
    en: It is a main guard against the rare, odd word choices that make long text drift into nonsense; set badly, it gives either flat, repetitive text or stray words in letters sent to real people.
    da: Det er et af de vigtigste værn mod de sjældne, skæve ordvalg, der får lang tekst til at glide ud i vrøvl; sat forkert giver det enten flad, gentagende tekst eller vildfarne ord i breve til rigtige mennesker.
edges:
  requires: [token]
  kind-of:
    - to: sampling
      why:
        en: It is one particular rule for the sampling step, limiting the draw to the most likely group of tokens.
        da: Det er én bestemt regel for sampling-trinnet, der begrænser trækningen til den mest sandsynlige gruppe af tokens.
      strength: primary
      confidence: high
