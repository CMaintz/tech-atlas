term:
  en: AI governance
  da: AI-governance
aka:
  en: [AI management system, responsible AI]
  da: [ledelsessystem for AI, ansvarlig AI]
domain: [ai]
cluster: ai-risk
status: current
summary:
  en: The rules, roles and checks an organisation uses to decide which AI it uses and to keep that use safe, lawful and fair.
  da: De regler, roller og kontroller, en organisation bruger til at vælge sin AI og holde brugen sikker, lovlig og fair.
body:
  formal:
    en: The part of governance that sets policy, ownership and oversight for AI systems across their whole life, from approval to retirement, typically built on the NIST AI Risk Management Framework (Govern, Map, Measure, Manage) or an ISO/IEC 42001 management system.
    da: Den del af governance, der fastlægger politik, ejerskab og tilsyn for AI-systemer gennem hele deres levetid, fra godkendelse til de tages ud af brug, typisk bygget på NIST's AI Risk Management Framework (Govern, Map, Measure, Manage) eller et ledelsessystem efter ISO/IEC 42001.
  plain:
    en: Like the house rules for a shared workshop — who may use which machines, who trains newcomers, who checks the safety guards, and who answers when something goes wrong.
    da: Som husreglerne for et fælles værksted — hvem må bruge hvilke maskiner, hvem oplærer nye, hvem tjekker sikkerhedsskærmene, og hvem står til ansvar, når noget går galt.
  inPractice:
    en: A Danish region sets up an AI board that keeps a register of every AI tool in its hospitals, gives each an owner, requires a risk assessment before a tool is taken into use and reviews results for unfairness every quarter.
    da: En region nedsætter et AI-udvalg, der fører et register over alle AI-værktøjer på sine hospitaler, giver hvert værktøj en ejer, kræver en risikovurdering, før et værktøj tages i brug, og gennemgår resultaterne for skævheder hvert kvartal.
  whyItMatters:
    en: AI tools spread faster than anyone can track, and the EU AI Act places duties on organisations that use them; without clear rules and owners, nobody can show what is in use or who answers for it.
    da: AI-værktøjer breder sig hurtigere, end nogen kan følge med, og EU's AI-forordning stiller krav til de organisationer, der bruger dem; uden klare regler og ejere kan ingen vise, hvad der er i brug, eller hvem der står til ansvar.
edges:
  part-of: [governance]
  requires: [artificial-intelligence, risk-management]
  mitigates:
    - to: shadow-ai
      why:
        en: Clear rules and approved tools give staff a safe way to use AI, so fewer turn to unapproved services.
        da: Klare regler og godkendte værktøjer giver medarbejderne en sikker måde at bruge AI på, så færre tyr til ikke-godkendte tjenester.
      strength: primary
      confidence: high
    - to: ai-bias
      why:
        en: Required testing and regular review catch unfair results before and after launch.
        da: Krav om test og løbende gennemgang fanger uretfærdige resultater, både før og efter systemet tages i brug.
      strength: normal
      confidence: medium
sources:
  - title: ISO/IEC 42001:2023 — Artificial intelligence — Management system
    tier: standard
    publisher: ISO/IEC
    url: https://www.iso.org/standard/81230.html
  - title: NIST AI 100-1 — Artificial Intelligence Risk Management Framework (AI RMF 1.0)
    tier: standard
    publisher: NIST
    url: https://doi.org/10.6028/NIST.AI.100-1
