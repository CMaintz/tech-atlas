term:
  en: Computer use
  da: Computerbrug (computer use)
aka:
  en: [computer-using agent]
  da: [computerbrugende agent]
domain: [ai]
cluster: agents
layer: agent
era: 2024
status: emerging
summary:
  en: Letting an AI agent work a computer like a person does — it looks at pictures of the screen and moves the mouse and types.
  da: At lade en AI-agent betjene en computer, som et menneske gør — den ser på billeder af skærmen, flytter musen og skriver.
body:
  formal:
    en: A form of tool calling in which the tools are the screen, mouse and keyboard; a multimodal model is sent pictures of the screen and answers with actions such as "click at this point" or "type this text", repeating until the task is done.
    da: En form for værktøjskald, hvor værktøjerne er skærm, mus og tastatur; en multimodal model får billeder af skærmen og svarer med handlinger som "klik her" eller "skriv denne tekst" og gentager, til opgaven er løst.
  plain:
    en: Like a stand-in sitting at your desk while you are away — they see the same screen, press the same buttons, and can do anything you could do from that chair.
    da: Som en afløser, der sidder ved dit skrivebord, mens du er væk — vedkommende ser den samme skærm, trykker på de samme knapper og kan gøre alt, hvad du kunne fra den stol.
  inPractice:
    en: A finance clerk at a shipping company has an agent copy freight totals from an old booking program with no API into the finance system; it opens each booking, reads the figures off the screen and types them in.
    da: En bogholder i et rederi lader en agent kopiere fragtbeløb fra et gammelt bookingprogram uden API over i økonomisystemet; den åbner hver booking, aflæser tallene på skærmen og taster dem ind.
  whyItMatters:
    en: It reaches any program a person can use, even without an API, but anything shown on screen — a web page, a pop-up — can carry hidden orders, and every click is a real action.
    da: Det når ethvert program, et menneske kan bruge, også uden API, men alt, der vises på skærmen — en webside, et pop op-vindue — kan bære skjulte ordrer, og hvert klik er en rigtig handling.
edges:
  kind-of: [tool-calling]
  requires:
    - ai-agent
    - to: multimodal-model
      why:
        en: The model must read pictures of the screen to know where things are before it can decide what to click.
        da: Modellen skal kunne læse billeder af skærmen for at vide, hvor tingene er, før den kan beslutte, hvad den skal klikke på.
      strength: primary
      confidence: high
  used-with:
    - to: human-in-the-loop
      why:
        en: Computer-use agents usually stop and ask a person before steps like buying, sending or logging in.
        da: Computerbrugende agenter stopper typisk og spørger en person før trin som at købe, sende eller logge ind.
      strength: normal
      confidence: high
    - to: prompt-injection
      why:
        en: Text on a web page or in a document on screen is read by the model and can steer what it does next.
        da: Tekst på en webside eller i et dokument på skærmen læses af modellen og kan styre, hvad den gør bagefter.
      strength: primary
      confidence: high
sources:
  - title: Anthropic documentation — Computer use tool
    tier: official-doc
    publisher: Anthropic
  - title: Anthropic (2024), Introducing computer use
    tier: reference
    publisher: Anthropic
