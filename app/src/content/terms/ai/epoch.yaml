term:
  en: Epoch
  da: Epoke (epoch)
aka:
  en: [training epoch]
  da: [epoch, træningsepoke]
domain: [ai]
cluster: training
layer: training
status: current
summary:
  en: One complete pass of model training through every example in the training data; training often runs for several.
  da: Én fuld gennemgang af alle eksempler i træningsdata under modeltræning; træningen kører ofte flere.
body:
  formal:
    en: A unit of model training in which each example in the training data has been used once to update the model; the number of epochs is a hyperparameter set before training starts.
    da: En enhed i modeltræning, hvor hvert eksempel i træningsdata er brugt én gang til at opdatere modellen; antallet af epoker er en hyperparameter, der sættes, før træningen starter.
  plain:
    en: Like one full run-through of a choir's concert programme; a few run-throughs polish it, but after fifty the singers can only sing it exactly as rehearsed.
    da: Som at synge et kors koncertprogram igennem én gang - et par gange gør det skarpere, men efter halvtreds gange kan sangerne kun synge det nøjagtig, som de har øvet det.
  inPractice:
    en: A data analyst at a Danish shipping company trains a model to predict fuel use from past voyages; she checks the validation set after each epoch and stops at epoch six, when results stop improving although the training error keeps falling.
    da: En dataanalytiker i et rederi træner en model, der skal forudsige brændstofforbrug ud fra tidligere sejladser; hun tjekker valideringssættet efter hver epoke og stopper ved epoke seks, hvor resultatet holder op med at blive bedre, selvom træningsfejlen bliver ved med at falde.
  whyItMatters:
    en: Too few epochs leave a model half-learned; too many make it learn its examples by heart, so picking the count is a direct trade-off between underfitting and overfitting.
    da: For få epoker efterlader en halvlært model; for mange får den til at lære eksemplerne udenad, så antallet skal lande et sted mellem undertilpasning og overtilpasning.
deepDive:
  en: |-
    With N training examples and batch size B, an epoch consists of ⌈N/B⌉ optimiser steps, or ⌊N/B⌋ when the last incomplete batch is dropped (drop_last=True in a PyTorch DataLoader). The data is normally reshuffled at the start of each epoch, so training samples without replacement within an epoch; this random reshuffling generally works better in practice than the with-replacement sampling assumed in much SGD theory. With on-the-fly data augmentation each epoch sees different random crops, flips or noise, so later epochs are not exact repeats. In distributed training each replica must see a disjoint shard per epoch, which is why samplers such as PyTorch's DistributedSampler need set_epoch() called each epoch, otherwise every epoch repeats the same order.

    The epoch is a convenient unit for logging, checkpointing and validation, but it is not what the optimiser sees; learning-rate warmup and cosine or step decay are defined in steps, so changing the batch size silently changes how many steps an epoch-based schedule contains. Typical counts vary enormously: classic ImageNet ResNet-50 recipes use about 90 epochs, small tabular or vision data sets may use hundreds, and fine-tuning a pretrained language model usually uses only one to three epochs, since more tends to cause memorisation and loss of general ability.

    Large-scale pretraining has largely abandoned multi-epoch training over the whole corpus. Most web data is seen once or less, while smaller high-quality sources are upsampled and repeated. Muennighoff et al. (2023) found that, for a fixed compute budget, up to about four epochs of repeated data yield almost the same loss as unique data, after which the value of repetition falls off quickly. Repetition also has privacy implications: sequences duplicated many times in training data are far more likely to be memorised and regurgitated verbatim (Carlini et al., 2022), which is one reason deduplication is a standard preprocessing step.

    The number of epochs is usually chosen by early stopping on the validation set, but the loss curve does not always behave as the textbook U-shape suggests. Nakkiran et al. (2019) documented epoch-wise double descent, where test error rises and then falls again with further training in sufficiently large models, and Power et al. (2022) described "grokking", where small networks on algorithmic tasks generalise long after fitting their training set perfectly. Patience-based stopping is therefore a heuristic, and for expensive runs it pays to keep periodic checkpoints rather than only the best one.
  da: |-
    Med N træningseksempler og batchstørrelse B består en epoke af ⌈N/B⌉ optimeringsskridt, eller ⌊N/B⌋, når den sidste ufuldstændige batch droppes (drop_last=True i en PyTorch-DataLoader). Data blandes normalt på ny ved starten af hver epoke, så træningen trækker uden tilbagelægning inden for en epoke; denne tilfældige omblanding virker generelt bedre i praksis end den trækning med tilbagelægning, som meget SGD-teori antager. Med dataaugmentering undervejs ser hver epoke andre tilfældige udsnit, spejlinger eller støj, så senere epoker ikke er eksakte gentagelser. Ved distribueret træning skal hver replika se et separat udsnit pr. epoke, og derfor skal samplere som PyTorchs DistributedSampler have kaldt set_epoch() i hver epoke, ellers gentager hver epoke samme rækkefølge.

    Epoken er en praktisk enhed til logning, checkpoints og validering, men det er ikke den, optimeringsalgoritmen ser; opvarmning af læringsraten og cosinus- eller trinvis nedtrapning defineres i skridt, så en ændret batchstørrelse ændrer stille, hvor mange skridt en epokebaseret plan indeholder. Typiske antal varierer enormt: klassiske opskrifter for ResNet-50 på ImageNet bruger cirka 90 epoker, små tabel- eller billeddatasæt kan bruge hundredvis, og finjustering af en fortrænet sprogmodel bruger som regel kun én til tre epoker, fordi flere har tendens til at give udenadslære og tab af generelle evner.

    Fortræning i stor skala har stort set opgivet at køre flere epoker over hele korpusset. De fleste webdata ses én gang eller mindre, mens mindre kilder af høj kvalitet opvægtes og gentages. Muennighoff m.fl. (2023) fandt, at op til omkring fire epoker med gentagne data ved et fast beregningsbudget giver næsten samme tab som unikke data, hvorefter værdien af gentagelse falder hurtigt. Gentagelse har også betydning for privatliv: sekvenser, der optræder mange gange i træningsdata, bliver langt oftere lært udenad og gengivet ordret (Carlini m.fl., 2022), hvilket er én grund til, at deduplikering er et standardtrin i forbehandlingen.

    Antallet af epoker vælges som regel med early stopping på valideringssættet, men tabskurven opfører sig ikke altid som lærebogens U-form. Nakkiran m.fl. (2019) dokumenterede epokevis double descent, hvor testfejlen stiger og derefter falder igen ved fortsat træning i tilstrækkeligt store modeller, og Power m.fl. (2022) beskrev "grokking", hvor små netværk på algoritmiske opgaver generaliserer længe efter, at de har tilpasset sig træningssættet perfekt. Stop baseret på patience er derfor en heuristik, og ved dyre kørsler betaler det sig at gemme checkpoints løbende i stedet for kun det bedste.
