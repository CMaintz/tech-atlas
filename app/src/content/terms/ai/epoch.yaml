term:
  en: Epoch
  da: Epoke (epoch)
aka:
  en: [training epoch]
  da: [epoch, træningsepoke]
domain: [ai]
cluster: training
layer: training
status: current
summary:
  en: One complete pass of model training through every example in the training data; training often runs for several.
  da: Én fuld gennemgang af alle eksempler i træningsdata under modeltræning; træningen kører ofte flere.
body:
  formal:
    en: A unit of model training in which each example in the training data has been used once to update the model; the number of epochs is a hyperparameter set before training starts.
    da: En enhed i modeltræning, hvor hvert eksempel i træningsdata er brugt én gang til at opdatere modellen; antallet af epoker er en hyperparameter, der sættes, før træningen starter.
  plain:
    en: Like one full run-through of a choir's concert programme — a few run-throughs polish it, but after fifty the singers can only sing it exactly as rehearsed.
    da: Som at synge et kors koncertprogram igennem én gang — et par gange gør det skarpere, men efter halvtreds gange kan sangerne kun synge det nøjagtig, som de har øvet det.
  inPractice:
    en: A data analyst at a Danish shipping company trains a model to predict fuel use from past voyages; she checks the validation set after each epoch and stops at epoch six, when results stop improving although the training error keeps falling.
    da: En dataanalytiker i et rederi træner en model, der skal forudsige brændstofforbrug ud fra tidligere sejladser; hun tjekker valideringssættet efter hver epoke og stopper ved epoke seks, hvor resultatet holder op med at blive bedre, selvom træningsfejlen bliver ved med at falde.
  whyItMatters:
    en: Too few epochs leave a model half-learned; too many make it learn its examples by heart, so picking the count is a direct trade-off between underfitting and overfitting.
    da: For få epoker efterlader en halvlært model; for mange får den til at lære eksemplerne udenad, så antallet skal lande et sted mellem undertilpasning og overtilpasning.
edges:
  requires: [training-data]
  used-with: [hyperparameter]
  part-of: [model-training]
  causes:
    - to: overfitting
      why:
        en: Running too many epochs lets the model learn the training data by heart instead of learning general patterns.
        da: For mange epoker lader modellen lære træningsdata udenad i stedet for generelle mønstre.
      strength: normal
      confidence: high
sources:
  - title: 'Goodfellow, Bengio & Courville, Deep Learning (ch. 7.8, early stopping)'
    tier: textbook
    publisher: MIT Press
