term:
  en: Attention mechanism
  da: Attention-mekanisme
aka:
  en: [attention, self-attention]
  da: [attention, self-attention]
domain: [ai]
cluster: model-architecture
layer: model
era: 2014
status: current
summary:
  en: The step inside a model that decides, for each token, which other tokens in the input matter most right now.
  da: Det trin i en model, der for hvert token afgør, hvilke andre tokens i inputtet der betyder mest lige nu.
body:
  formal:
    en: A method in a neural network where each token's embedding is compared with every other token's, the match scores are turned into shares that add up to one, and the token takes on a mix of the others weighted by those shares.
    da: En metode i et neuralt netværk, hvor hvert tokens embedding sammenlignes med alle andre tokens, matchscorerne laves om til andele, der tilsammen giver én, og tokenet optager en blanding af de andre vægtet efter de andele.
  plain:
    en: Like following one friend at a noisy party — out of all the voices in the room you pick up the few that matter to what you are hearing and let the rest fade.
    da: Som at følge med i, hvad én ven siger til en larmende fest — af alle stemmerne i rummet opfanger du de få, der har betydning, og lader resten glide i baggrunden.
  inPractice:
    en: A case officer in a municipality asks a chat assistant whether a 120-page local plan allows a garage; attention lets the question draw directly on the one paragraph, far back in the text, that settles it.
    da: En sagsbehandler i en kommune spørger en chatassistent, om en lokalplan på 120 sider tillader en carport; attention lader spørgsmålet trække direkte på det ene afsnit langt tilbage i teksten, der afgør sagen.
  whyItMatters:
    en: Every token is compared with every other, so the work grows much faster than the length of the input — the main reason a longer context window costs more time and money.
    da: Hvert token sammenlignes med alle de andre, så arbejdet vokser langt hurtigere end inputtets længde — hovedårsagen til, at et længere kontekstvindue koster mere tid og flere penge.
edges:
  requires: [embedding]
  part-of:
    - to: transformer
      why:
        en: Attention is the core building block that a transformer repeats layer after layer.
        da: Attention er den centrale byggesten, som en transformer gentager lag efter lag.
      strength: primary
      confidence: high
  used-with:
    - to: context-window
      why:
        en: Attention compares every token with every other, so its cost sets how large a context window can practically be.
        da: Attention sammenligner hvert token med alle andre, så dens pris bestemmer, hvor stort et kontekstvindue reelt kan være.
      strength: primary
      confidence: high
    - to: kv-cache
      why:
        en: A KV cache stores attention results for earlier tokens so they are not worked out again for each new token.
        da: En KV-cache gemmer attention-resultater for tidligere tokens, så de ikke skal regnes ud igen for hvert nyt token.
      strength: normal
      confidence: high
