term:
  en: Regression
  da: Regression
aka:
  en: []
  da: []
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Teaching a computer to guess a number on a scale - a price, a time, a size - from past examples where the real number was known.
  da: At lære en computer at gætte et tal på en skala - en pris, en tid, en størrelse - ud fra tidligere eksempler med kendte tal.
body:
  formal:
    en: A task in machine learning where the model learns from labelled examples to map an input to a number that can take any value within a range, and is judged by how far its guesses land from the real values.
    da: En opgave i maskinlæring, hvor modellen lærer af mærkede eksempler at knytte et input til et tal, der kan have enhver værdi mellem to grænser, og bedømmes på, hvor langt dens gæt ligger fra de rigtige værdier.
  plain:
    en: Like guessing a house's price from its size, age and street after seeing what many other houses sold for - the answer is an amount, not a yes or no.
    da: Som at gætte en boligs pris ud fra størrelse, alder og gade efter at have set, hvad mange andre boliger blev solgt for - svaret er et beløb, ikke et ja eller nej.
  inPractice:
    en: An operations planner at a water utility uses a model trained on five years of readings to predict tomorrow's water use hour by hour from the weather forecast and the day of the week.
    da: En driftsplanlægger på et vandværk bruger en model, der er trænet på fem års målinger, til at forudsige morgendagens vandforbrug time for time ud fra vejrudsigten og ugedagen.
  whyItMatters:
    en: Many business questions are "how much" or "how long", not "which one"; the guess always has a margin of error that must be shown, not hidden.
    da: Mange forretningsspørgsmål handler om "hvor meget" eller "hvor længe", ikke "hvilken"; gættet har altid en fejlmargin, der skal vises, ikke skjules.
deepDive:
  en: |-
    The name comes from Francis Galton's 1880s observation that children of unusually tall parents tend to be closer to average height, "regression towards mediocrity". The workhorse is linear regression fitted by ordinary least squares: minimise the sum of squared residuals, which for a design matrix X and target vector y has the closed-form solution β = (XᵀX)⁻¹Xᵀy, the normal equations. Under the Gauss-Markov assumptions (linear model, uncorrelated errors with constant variance, no perfect multicollinearity) OLS is the best linear unbiased estimator. In practice it is solved with QR or SVD decompositions rather than an explicit matrix inverse, for numerical stability.

    Regularised variants trade a little bias for lower variance: ridge regression (Hoerl and Kennard, 1970) adds an L2 penalty, lasso (Tibshirani, 1996) an L1 penalty that sets some coefficients exactly to zero, and elastic net combines both. Non-linear regression is handled by feature transformations, splines, generalised additive models, tree ensembles such as gradient boosting, or neural networks with a linear output unit. Poisson and other generalised linear models suit counts and rates; time-series forecasting adds temporal structure (autoregression, seasonality) and must be validated on strictly later periods.

    The loss function encodes what an error costs. Mean squared error targets the conditional mean and is dominated by outliers; mean absolute error targets the conditional median and is more robust; Huber loss is quadratic near zero and linear in the tails. Reported metrics include RMSE and MAE in the target's own units, MAPE (undefined when the true value is zero and asymmetric in its penalties), and R², the share of variance explained, which can be negative on test data when a model does worse than predicting the mean.

    A point forecast is incomplete without uncertainty. Quantile regression, using the pinball loss, predicts chosen quantiles such as the 10th and 90th percentile directly; conformal prediction wraps any model to give intervals with finite-sample coverage guarantees under exchangeability. Common failures are heteroscedasticity (error that grows with the level, invalidating constant-width intervals), extrapolation beyond the range seen in training, where tree models go flat and linear models continue straight lines indefinitely, and confusing correlation in coefficients with causal effect.

    Two naming traps: logistic regression is a classification method, and "regression" in software testing means a previously working feature breaking, which is unrelated. Regression also differs from classification only in the output type; ordinal targets such as ratings from 1 to 5 sit in between and can be modelled either way.
  da: |-
    Navnet stammer fra Francis Galtons iagttagelse i 1880'erne af, at børn af usædvanligt høje forældre som regel er tættere på gennemsnitshøjden, "regression mod middelmådigheden". Arbejdshesten er lineær regression tilpasset med mindste kvadraters metode (OLS): Summen af kvadrerede residualer minimeres, hvilket for en designmatrix X og en målvektor y har den lukkede løsning β = (XᵀX)⁻¹Xᵀy, normalligningerne. Under Gauss-Markov-antagelserne (lineær model, ukorrelerede fejl med konstant varians, ingen perfekt multikollinearitet) er OLS den bedste lineære middelret estimator. I praksis løses den med QR- eller SVD-dekomposition frem for en eksplicit matrixinvers af hensyn til den numeriske stabilitet.

    Regulariserede varianter bytter lidt bias for lavere varians: Ridge-regression (Hoerl og Kennard, 1970) tilføjer en L2-straf, lasso (Tibshirani, 1996) en L1-straf, der sætter nogle koefficienter præcis til nul, og elastic net kombinerer begge. Ikke-lineær regression håndteres med transformationer af features, splines, generaliserede additive modeller, træensembler som gradient boosting eller neurale netværk med en lineær outputenhed. Poisson- og andre generaliserede lineære modeller passer til optællinger og rater; tidsserieprognoser tilføjer tidsstruktur (autoregression, sæsonmønstre) og skal valideres på strengt senere perioder.

    Tabsfunktionen udtrykker, hvad en fejl koster. Mean squared error rammer den betingede middelværdi og domineres af afvigere; mean absolute error rammer den betingede median og er mere robust; Huber-tab er kvadratisk nær nul og lineært i halerne. De rapporterede mål omfatter RMSE og MAE i målvariablens egen enhed, MAPE (udefineret, når den sande værdi er nul, og asymmetrisk i sine straffe) og R², den forklarede andel af variansen, som kan blive negativ på testdata, når en model klarer sig dårligere end blot at gætte på gennemsnittet.

    En punktprognose er ufuldstændig uden usikkerhed. Kvantilregression med pinball-tab forudsiger valgte kvantiler, fx 10.- og 90.-percentilen, direkte; conformal prediction kan lægges om enhver model og giver intervaller med dækningsgarantier for endelige stikprøver under udskiftelighed. Almindelige fejl er heteroskedasticitet (fejl, der vokser med niveauet, så intervaller med fast bredde bliver forkerte), ekstrapolation ud over det interval, træningen dækkede, hvor træmodeller flader ud og lineære modeller fortsætter i lige linjer i det uendelige, og forveksling af korrelation i koefficienterne med kausal effekt.

    To navnefælder: Logistisk regression er en klassifikationsmetode, og "regression" i softwaretest betyder, at en funktion, der tidligere virkede, går i stykker, hvilket er noget helt andet. Regression adskiller sig desuden kun fra klassifikation ved outputtypen; ordinale mål som vurderinger fra 1 til 5 ligger midt imellem og kan modelleres på begge måder.
edges:
  kind-of: [supervised-learning]
  requires: [model-training]
  used-with:
    - to: validation-set
      why:
        en: How far the guesses miss is only honest when measured on examples the model did not learn from.
        da: Hvor meget gættene rammer ved siden af, er kun ærligt, når det måles på eksempler, modellen ikke har lært af.
      strength: normal
      confidence: high
