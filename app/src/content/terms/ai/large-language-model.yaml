term:
  en: Large language model (LLM)
  da: Stor sprogmodel (LLM)
aka:
  en: [LLM, language model]
  da: [LLM, sprogmodel]
domain: [ai]
cluster: llm
layer: model
era: 2020
status: current
summary:
  en: A very large model trained on huge amounts of text to predict the next word, which lets it write, sum up and answer in fluent language.
  da: En meget stor model, trænet på enorme mængder tekst til at forudsige det næste ord, så den kan skrive, opsummere og svare i flydende sprog.
body:
  formal:
    en: A deep learning model, usually a transformer with billions of weights, trained on vast text collections to predict the next token; the same skill, repeated, lets it produce long answers to a prompt.
    da: En deep learning-model, typisk en transformer med milliarder af vægte, trænet på enorme tekstsamlinger til at forudsige det næste token; den samme evne, gentaget, lader den skrive lange svar på en prompt.
  plain:
    en: Like the next-word suggestions on a phone keyboard, but trained on a large part of the internet — it knows how answers usually sound, not whether they are true.
    da: Som ordforslagene på en mobiltelefons tastatur, bare trænet på en stor del af internettet — den ved, hvordan svar plejer at lyde, ikke om de er sande.
  inPractice:
    en: Staff use a chat assistant built on an LLM to draft emails and sum up meeting notes, and the company must decide which data they may paste into it.
    da: Medarbejdere bruger en chatassistent bygget på en LLM til at skrive udkast til mails og opsummere mødenoter, og virksomheden må beslutte, hvilke data de må indsætte.
  whyItMatters:
    en: LLMs sound confident even when wrong, can be steered by hidden text, and send your input to whoever runs them — all real risks to weigh before use.
    da: LLM'er lyder sikre, selv når de tager fejl, kan styres af skjult tekst og sender dit input til den, der driver dem — alt sammen reelle risici, der skal vejes før brug.
edges:
  kind-of:
    - deep-learning
    - to: generative-ai
      why:
        en: A large language model is the text-writing kind of generative AI.
        da: En stor sprogmodel er den tekstskrivende slags generativ AI.
      strength: normal
      confidence: medium
    - to: foundation-model
      why:
        en: 'Large language models are the most common kind of foundation model: pretrained once on broad text, then adapted to many tasks.'
        da: 'Store sprogmodeller er den mest udbredte slags grundmodel: fortrænet én gang på bred tekst og derefter tilpasset til mange opgaver.'
      strength: normal
      confidence: medium
  requires: [transformer, token]
  causes:
    - to: hallucination
      why:
        en: The model is built to produce likely-sounding text, not checked facts, so it sometimes invents answers.
        da: Modellen er bygget til at skrive tekst, der lyder sandsynlig, ikke tjekkede fakta, så den finder nogle gange på svar.
      strength: primary
      confidence: high
  used-with:
    - to: self-supervised-learning
      why:
        en: Language models learn from huge amounts of unlabeled text by guessing the next piece, which is self-supervised learning.
        da: Sprogmodeller lærer af enorme mængder umærket tekst ved at gætte det næste stykke, hvilket er selvsuperviseret læring.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: small-language-model
      why:
        en: Both work the same way, but a small language model has far fewer parameters, so it is cheaper and faster but knows less.
        da: Begge virker på samme måde, men en lille sprogmodel har langt færre parametre, så den er billigere og hurtigere, men ved mindre.
      strength: normal
      confidence: medium
