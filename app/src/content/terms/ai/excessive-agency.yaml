term:
  en: Excessive agency
  da: Overdreven handlefrihed (excessive agency)
aka:
  en: []
  da: []
domain: [ai, security]
cluster: ai-risk
layer: agent
status: current
summary:
  en: Giving an AI system more tools, rights or freedom to act than its job needs, so one wrong or tricked step can do real damage.
  da: At give et AI-system flere værktøjer, rettigheder eller mere frihed, end opgaven kræver, så ét forkert skridt kan gøre reel skade.
body:
  formal:
    en: A weakness (OWASP LLM06:2025) in which a system built on a large language model has too many functions, permissions or independence, so unexpected, manipulated or made-up model output can trigger harmful actions.
    da: En svaghed (OWASP LLM06:2025), hvor et system bygget på en stor sprogmodel har for mange funktioner, tilladelser eller for stor selvstændighed, så uventet, manipuleret eller opdigtet output fra modellen kan udløse skadelige handlinger.
  plain:
    en: Like giving a new intern the master key, the company card and the power to sign contracts on day one, when all they were hired to do is sort the post.
    da: Som at give en ny praktikant hovednøglen, firmakortet og ret til at skrive under på kontrakter den første dag, selv om vedkommende kun er ansat til at sortere posten.
  inPractice:
    en: A shipping company's booking agent only needs to read the sailing schedule, but was given rights to change it; it misreads one customer's email and cancels forty bookings before an operations planner notices.
    da: Et rederis bookingagent skal kun kunne læse sejlplanen, men har fået ret til at ændre den; den misforstår én kundes mail og aflyser fyrre bookinger, før en driftsplanlægger opdager det.
  whyItMatters:
    en: No model can be made fully trustworthy, so limiting what it may do caps the damage when it is wrong or hijacked; the risk grows with every tool an agent gets.
    da: Ingen model kan gøres helt pålidelig, så det at begrænse, hvad den må, sætter et loft over skaden, når den tager fejl eller bliver kapret; risikoen vokser med hvert værktøj, en agent får.
edges:
  requires: [ai-agent, tool-calling]
  used-with:
    - to: prompt-injection
      why:
        en: Prompt injection is the usual trigger, and excessive agency decides how much harm the hijacked agent can then do.
        da: Prompt injection er den typiske udløser, og overdreven handlefrihed afgør, hvor meget skade den kaprede agent derefter kan gøre.
      strength: primary
      confidence: high
  causes:
    - to: data-breach
      why:
        en: An agent with wide access to files or email can be steered into sending data outside the organisation.
        da: En agent med bred adgang til filer eller mail kan styres til at sende data ud af organisationen.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: privilege-escalation
      why:
        en: In privilege escalation an attacker gains rights they were never given; with excessive agency the rights were handed over from the start.
        da: Ved rettighedseskalering tilegner en angriber sig rettigheder, der aldrig blev givet; ved overdreven handlefrihed blev rettighederne givet fra starten.
      strength: normal
      confidence: medium
sources:
  - title: OWASP Top 10 for LLM Applications 2025 — LLM06 Excessive Agency
    tier: reference
    publisher: OWASP
    url: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
