term:
  en: Transfer learning
  da: Overførselslæring (transfer learning)
aka:
  en: []
  da: [transfer learning]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Reusing what a model already learned on one big task as the starting point for a new, related task, instead of starting from zero.
  da: At genbruge det, en model allerede har lært på én stor opgave, som udgangspunkt for en ny, beslægtet opgave i stedet for at starte fra nul.
body:
  formal:
    en: A way of doing model training in which a model trained on a large, general body of training data is taken as the start for a new task, and only adjusted with a smaller amount of task data.
    da: En måde at lave modeltræning på, hvor en model trænet på et stort, generelt datasæt tages som start for en ny opgave og kun justeres med en mindre mængde opgavedata.
  plain:
    en: Like a car driver learning to drive a van - steering, traffic rules and road sense carry over, so only the size and the mirrors need practice.
    da: Som en bilist, der skal lære at køre varevogn - rattet, færdselsreglerne og fornemmelsen for trafikken følger med, så kun størrelsen og spejlene skal øves.
  inPractice:
    en: An engineer at a water utility takes an image model trained on millions of everyday photos and teaches it to spot cracks in sewer inspection videos, using only 3,000 labelled frames.
    da: En ingeniør i et forsyningsselskab tager en billedmodel, der er trænet på millioner af almindelige fotos, og lærer den at finde revner i kloakvideoer med kun 3.000 mærkede billeder.
  whyItMatters:
    en: It lets small teams build useful models without huge data or budgets - but the new model also inherits the old one's blind spots, biases and any hidden tampering.
    da: Det lader små teams bygge brugbare modeller uden enorme datamængder eller budgetter - men den nye model arver også den gamle models blinde vinkler, skævheder og al skjult manipulation.
deepDive:
  en: |-
    Pan and Yang's 2010 survey formalises the setting with a source domain and task and a target domain and task, where a domain is a feature space plus a marginal distribution over it. Transfer is useful when the target task has little labelled data but shares structure with the source. Their taxonomy distinguishes inductive transfer (target labels available, different task), transductive transfer (same task, different domain, often called domain adaptation) and unsupervised transfer (no labels in either).

    In deep learning the dominant pattern since the early 2010s has been to take a network pretrained on a large dataset (historically ImageNet for vision, later self-supervised text or image-text corpora) and adapt it. The spectrum runs from feature extraction, where the pretrained layers are frozen and only a new output head is trained, through partial fine-tuning of the top layers, to full fine-tuning of all weights, usually with a learning rate one or two orders of magnitude lower than for training from scratch. Early layers learn generic features (edges, textures, subword patterns) and transfer well; later layers are more task-specific. Parameter-efficient fine-tuning methods such as adapters and LoRA train a small number of added parameters while keeping the base frozen, which reduces memory and makes it cheap to keep many task variants of one base model.

    Transfer can fail. Negative transfer occurs when source and target are dissimilar enough that the pretrained starting point performs worse than training from scratch, for example natural-photo features applied to spectrograms or radar data with very different statistics. Catastrophic forgetting is the loss of source-task abilities during aggressive fine-tuning; it matters when the adapted model is still expected to handle general inputs. Domain shift between source and target, such as a different camera, language variety or document layout, can remain even after fine-tuning and should be tested explicitly.

    Transfer also moves risk. The target model inherits the source model's biases, knowledge gaps and any backdoor planted during pretraining; research has shown that backdoors can survive fine-tuning. Using a third-party base model is therefore an AI supply chain decision: verify the source, pin the exact checkpoint by hash, prefer safe serialisation formats such as safetensors over pickle-based files that can execute code on load, and check the base model's licence and documentation (model card, training-data summary).

    The terms overlap in current usage. Pretraining produces the source model, fine-tuning is the most common transfer mechanism, and prompting a foundation model with a few examples (in-context learning) achieves some of the same effect without changing any weights.
  da: |-
    Pan og Yangs oversigtsartikel fra 2010 formaliserer situationen med et kildedomæne og en kildeopgave samt et måldomæne og en målopgave, hvor et domæne er et feature-rum plus en marginalfordeling over det. Overførsel er nyttig, når målopgaven har få mærkede data, men deler struktur med kilden. Deres taksonomi skelner mellem induktiv overførsel (mærkater i målet, anden opgave), transduktiv overførsel (samme opgave, andet domæne, ofte kaldet domænetilpasning) og ikke-superviseret overførsel (ingen mærkater i nogen af dem).

    I deep learning har det dominerende mønster siden begyndelsen af 2010'erne været at tage et netværk, der er fortrænet på et stort datasæt (historisk ImageNet til billeder, senere selvsuperviserede tekst- eller billede-tekst-korpora), og tilpasse det. Spektret går fra feature extraction, hvor de fortrænede lag fryses og kun et nyt outputlag trænes, over delvis finjustering af de øverste lag til fuld finjustering af alle vægte, som regel med en læringsrate, der er en eller to størrelsesordener lavere end ved træning fra bunden. Tidlige lag lærer generiske features (kanter, teksturer, orddelsmønstre) og overføres godt; senere lag er mere opgavespecifikke. Parameter-effektive finjusteringsmetoder som adaptere og LoRA træner et lille antal tilføjede parametre, mens basismodellen holdes frosset, hvilket sparer hukommelse og gør det billigt at have mange opgavevarianter af én basismodel.

    Overførsel kan slå fejl. Negativ overførsel opstår, når kilde og mål er så forskellige, at det fortrænede udgangspunkt klarer sig dårligere end træning fra bunden, fx features fra naturfotos anvendt på spektrogrammer eller radardata med helt andre statistiske egenskaber. Katastrofal glemsel er tabet af evner fra kildeopgaven under aggressiv finjustering; det har betydning, når den tilpassede model stadig forventes at håndtere generelle input. Domæneskift mellem kilde og mål, fx et andet kamera, en anden sprogvariant eller et andet dokumentlayout, kan bestå selv efter finjustering og bør testes eksplicit.

    Overførsel flytter også risiko. Målmodellen arver kildemodellens skævheder, videnshuller og enhver bagdør, der er plantet under fortræningen; forskning har vist, at bagdøre kan overleve finjustering. Brug af en tredjeparts basismodel er derfor en beslutning om AI-forsyningskæden: Verificér kilden, fastlås det præcise checkpoint med hashværdi, foretræk sikre serialiseringsformater som safetensors frem for pickle-baserede filer, der kan afvikle kode ved indlæsning, og tjek basismodellens licens og dokumentation (model card, resumé af træningsdata).

    Begreberne overlapper i nutidig brug. Fortræning frembringer kildemodellen, finjustering er den mest udbredte overførselsmekanisme, og at prompte en foundation model med nogle få eksempler (in-context learning) opnår en del af samme effekt uden at ændre nogen vægte.
edges:
  requires: [model-training, deep-learning]
  mitigates:
    - to: overfitting
      why:
        en: Starting from broad, general knowledge makes a model less likely to just memorise a small set of task examples.
        da: At starte fra bred, generel viden gør det mindre sandsynligt, at en model bare lærer et lille sæt opgaveeksempler udenad.
      strength: normal
      confidence: medium
sources:
  - title: 'Goodfellow, Bengio & Courville, Deep Learning'
    tier: textbook
    publisher: MIT Press
  - title: Pan & Yang (2010), A Survey on Transfer Learning
    tier: reference
