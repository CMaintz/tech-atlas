term:
  en: Transfer learning
  da: Overførselslæring (transfer learning)
aka:
  en: []
  da: [transfer learning]
domain: [ai]
cluster: ml-fundamentals
layer: training
status: current
summary:
  en: Reusing what a model already learned on one big task as the starting point for a new, related task, instead of starting from zero.
  da: At genbruge det, en model allerede har lært på én stor opgave, som udgangspunkt for en ny, beslægtet opgave i stedet for at starte fra nul.
body:
  formal:
    en: A way of doing model training in which a model trained on a large, general body of training data is taken as the start for a new task, and only adjusted with a smaller amount of task data.
    da: En måde at lave modeltræning på, hvor en model trænet på et stort, generelt datasæt tages som start for en ny opgave og kun justeres med en mindre mængde opgavedata.
  plain:
    en: Like a car driver learning to drive a van — steering, traffic rules and road sense carry over, so only the size and the mirrors need practice.
    da: Som en bilist, der skal lære at køre varevogn — rattet, færdselsreglerne og fornemmelsen for trafikken følger med, så kun størrelsen og spejlene skal øves.
  inPractice:
    en: An engineer at a water utility takes an image model trained on millions of everyday photos and teaches it to spot cracks in sewer inspection videos, using only 3,000 labelled frames.
    da: En ingeniør i et forsyningsselskab tager en billedmodel, der er trænet på millioner af almindelige fotos, og lærer den at finde revner i kloakvideoer med kun 3.000 mærkede billeder.
  whyItMatters:
    en: It lets small teams build useful models without huge data or budgets — but the new model also inherits the old one's blind spots, biases and any hidden tampering.
    da: Det lader små teams bygge brugbare modeller uden enorme datamængder eller budgetter — men den nye model arver også den gamle models blinde vinkler, skævheder og al skjult manipulation.
edges:
  requires: [model-training, deep-learning]
  mitigates:
    - to: overfitting
      why:
        en: Starting from broad, general knowledge makes a model less likely to just memorise a small set of task examples.
        da: At starte fra bred, generel viden gør det mindre sandsynligt, at en model bare lærer et lille sæt opgaveeksempler udenad.
      strength: normal
      confidence: medium
sources:
  - title: 'Goodfellow, Bengio & Courville, Deep Learning'
    tier: textbook
    publisher: MIT Press
  - title: Pan & Yang (2010), A Survey on Transfer Learning
    tier: reference
