term:
  en: General-purpose AI model (GPAI)
  da: AI-model til almen brug (GPAI)
aka:
  en: [GPAI, GPAI model]
  da: [GPAI, GPAI-model]
domain: [ai]
cluster: ai-risk
layer: model
era: 2024
status: current
summary:
  en: The EU AI Act's name for a broad model that can handle many different tasks and be built into many other AI products.
  da: EU's AI-forordnings betegnelse for en bred model, der kan klare mange forskellige opgaver og bygges ind i mange andre AI-produkter.
body:
  formal:
    en: Under Art. 3(63) of the EU AI Act, a model of significant generality that can competently perform a wide range of distinct tasks and be built into many other systems; providers owe documentation, a copyright policy and a training-data summary (Art. 53), and more if the model poses risks to society as a whole (Art. 55).
    da: Efter art. 3, nr. 63, i EU's AI-forordning en model med betydelig generalitet, der kompetent kan udføre en bred vifte af forskellige opgaver og indgå i mange andre systemer; udbyderen skal levere dokumentation, en politik for ophavsret og en oversigt over træningsdata (art. 53) og mere, hvis modellen udgør en risiko for samfundet som helhed (art. 55).
  plain:
    en: Like a company whose engine ends up in cars, boats and generators — the law asks the engine's maker for proper paperwork so every builder further down the line knows what they are fitting.
    da: Som en fabrik, hvis motor ender i biler, både og generatorer — loven kræver ordentlige papirer fra fabrikken, så alle, der bygger videre, ved, hvad de sætter i.
  inPractice:
    en: A Danish research centre releases a Danish-language model under an open licence; its project lead checks that this spares it the technical documentation, but it must still publish a summary of the training data and a copyright policy.
    da: Et dansk forskningscenter udgiver en dansksproget model under en åben licens; projektlederen konstaterer, at det fritager centret for den tekniske dokumentation, men at det stadig skal offentliggøre en oversigt over træningsdataene og en politik for ophavsret.
  whyItMatters:
    en: One model can sit under thousands of products, so since August 2025 the EU has placed duties directly on its maker instead of leaving every product builder to guess at the model's risks.
    da: Én model kan ligge under tusindvis af produkter, så EU har siden august 2025 lagt pligter direkte på den, der laver modellen, i stedet for at lade hver produktbygger gætte på modellens risici.
deepDive:
  en: |-
    The AI Act separates the model from the system. A general-purpose AI model (Art. 3(63)) is the trained artefact — typically a large foundation model trained with self-supervision at scale — while a general-purpose AI system (Art. 3(66)) is a product built on such a model that can serve multiple purposes, such as a chat assistant. The model obligations in Chapter V (Arts. 51–55) sit with the provider that places the model on the EU market, and apply regardless of whether any downstream use is high-risk. Models used only for research, development or prototyping before being placed on the market are excluded. The Commission's guidelines of July 2025 add an indicative criterion: training compute above 10^23 FLOP combined with the ability to generate language, text-to-image or text-to-video; a downstream party that fine-tunes a model becomes a provider only if its modification uses more than roughly one third of the original training compute.

    Art. 53(1) requires every GPAI provider to (a) keep technical documentation per Annex XI for the AI Office and national authorities, (b) give downstream providers the information in Annex XII so they can understand capabilities and limitations and meet their own duties, (c) implement a policy to comply with EU copyright law, including respecting text-and-data-mining opt-outs under Art. 4(3) of Directive (EU) 2019/790, and (d) publish a sufficiently detailed summary of training content using the AI Office template. Under Art. 53(2), models released under a free and open-source licence with public weights, architecture and usage information are exempt from (a) and (b), but not from (c) and (d), and not at all if they carry systemic risk. Non-EU providers must appoint an authorised representative (Art. 54).

    A model has systemic risk if it has high-impact capabilities, presumed under Art. 51(2) when cumulative training compute exceeds 10^25 FLOP, or if the Commission designates it using the Annex XIII criteria. The provider must notify the Commission within two weeks of meeting the threshold (Art. 52) and may argue that the model nonetheless poses no systemic risk. Art. 55 then adds state-of-the-art model evaluation including adversarial testing, assessment and mitigation of systemic risks, tracking and reporting of serious incidents to the AI Office, and adequate cybersecurity for the model and its infrastructure.

    The obligations have applied since 2 August 2025; models placed on the market before then have until 2 August 2027 (Art. 111(3)). The Commission's fining powers under Art. 101 — up to 3 % of worldwide turnover or EUR 15 million — apply from 2 August 2026. The General-Purpose AI Code of Practice (July 2025, under Art. 56), with chapters on transparency, copyright and safety and security, is a voluntary way to demonstrate compliance; its Model Documentation Form is the de facto template for Annex XI/XII information, and a model card published alongside it covers part of the downstream transparency duty.
  da: |-
    AI-forordningen skelner mellem model og system. En AI-model til almen brug (art. 3, nr. 63) er det trænede artefakt — typisk en stor grundmodel trænet med selvsuperviseret læring i stor skala — mens et AI-system til almen brug (art. 3, nr. 66) er et produkt bygget på en sådan model, der kan tjene flere formål, fx en chatassistent. Modelforpligtelserne i kapitel V (art. 51–55) påhviler den udbyder, der bringer modellen i omsætning i EU, og gælder uanset, om nogen efterfølgende anvendelse er højrisiko. Modeller, der kun bruges til forskning, udvikling eller prototyper, før de bringes i omsætning, er undtaget. Kommissionens retningslinjer fra juli 2025 tilføjer et vejledende kriterium: træningsberegning over 10^23 FLOP kombineret med evnen til at generere sprog, tekst-til-billede eller tekst-til-video; en efterfølgende aktør, der finjusterer en model, bliver kun udbyder, hvis ændringen bruger mere end cirka en tredjedel af den oprindelige træningsberegning.

    Art. 53, stk. 1, kræver, at enhver GPAI-udbyder (a) fører teknisk dokumentation efter bilag XI til AI-kontoret og de nationale myndigheder, (b) giver efterfølgende udbydere oplysningerne i bilag XII, så de kan forstå modellens kapaciteter og begrænsninger og opfylde deres egne pligter, (c) indfører en politik for overholdelse af EU's ophavsret, herunder respekt for forbehold mod tekst- og datamining efter art. 4, stk. 3, i direktiv (EU) 2019/790, og (d) offentliggør et tilstrækkeligt detaljeret resumé af træningsindholdet efter AI-kontorets skabelon. Efter art. 53, stk. 2, er modeller udgivet under en fri open source-licens med offentlige vægte, arkitektur og brugsoplysninger fritaget for (a) og (b), men ikke for (c) og (d) — og slet ikke, hvis de har systemisk risiko. Udbydere uden for EU skal udpege en bemyndiget repræsentant (art. 54).

    En model har systemisk risiko, hvis den har kapaciteter med stor virkning, hvilket formodes efter art. 51, stk. 2, når den samlede træningsberegning overstiger 10^25 FLOP, eller hvis Kommissionen udpeger den ud fra kriterierne i bilag XIII. Udbyderen skal underrette Kommissionen inden for to uger efter at have nået tærsklen (art. 52) og kan argumentere for, at modellen alligevel ikke udgør en systemisk risiko. Art. 55 tilføjer derefter modelevaluering efter det aktuelle tekniske niveau inklusive adversarial testing, vurdering og afbødning af systemiske risici, sporing og indberetning af alvorlige hændelser til AI-kontoret samt tilstrækkelig cybersikkerhed for modellen og dens infrastruktur.

    Forpligtelserne har gældet siden 2. august 2025; modeller, der blev bragt i omsætning før da, har frist til 2. august 2027 (art. 111, stk. 3). Kommissionens bødebeføjelse efter art. 101 — op til 3 % af den globale omsætning eller 15 mio. EUR — gælder fra 2. august 2026. Adfærdskodeksen for AI-modeller til almen brug (juli 2025, efter art. 56) med kapitler om gennemsigtighed, ophavsret og sikkerhed er en frivillig måde at påvise overholdelse på; dens Model Documentation Form er de facto skabelonen for oplysningerne i bilag XI/XII, og et modelkort offentliggjort ved siden af dækker en del af gennemsigtighedspligten over for efterfølgende udbydere.
edges:
  requires: [eu-ai-act]
  used-with:
    - to: model-card
      why:
        en: Providers must hand documentation about the model to those who build on it, and a model card is a common format for that.
        da: Udbydere skal give dokumentation om modellen til dem, der bygger videre på den, og et modelkort er et udbredt format til det.
      strength: normal
      confidence: medium
    - to: open-weight-model
      why:
        en: Models released under a free and open licence with public weights are spared some documentation duties, unless they are among the largest models that pose risks to society as a whole.
        da: Modeller udgivet under en fri og åben licens med offentlige vægte er fritaget for visse dokumentationspligter, medmindre de hører til de største modeller med risiko for samfundet som helhed.
      strength: normal
      confidence: high
