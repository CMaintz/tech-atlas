term:
  en: General-purpose AI model (GPAI)
  da: AI-model til almen brug (GPAI)
aka:
  en: [GPAI, GPAI model]
  da: [GPAI, GPAI-model]
domain: [ai]
cluster: ai-risk
layer: model
era: 2024
status: current
summary:
  en: The EU AI Act's name for a broad model that can handle many different tasks and be built into many other AI products.
  da: EU's AI-forordnings betegnelse for en bred model, der kan klare mange forskellige opgaver og bygges ind i mange andre AI-produkter.
body:
  formal:
    en: Under Art. 3(63) of the EU AI Act, a model of significant generality that can competently perform a wide range of distinct tasks and be built into many other systems; providers owe documentation, a copyright policy and a training-data summary (Art. 53), and more if the model poses risks to society as a whole (Art. 55).
    da: Efter art. 3, nr. 63, i EU's AI-forordning en model med betydelig generalitet, der kompetent kan udføre en bred vifte af forskellige opgaver og indgå i mange andre systemer; udbyderen skal levere dokumentation, en politik for ophavsret og en oversigt over træningsdata (art. 53) og mere, hvis modellen udgør en risiko for samfundet som helhed (art. 55).
  plain:
    en: Like a company whose engine ends up in cars, boats and generators — the law asks the engine's maker for proper paperwork so every builder further down the line knows what they are fitting.
    da: Som en fabrik, hvis motor ender i biler, både og generatorer — loven kræver ordentlige papirer fra fabrikken, så alle, der bygger videre, ved, hvad de sætter i.
  inPractice:
    en: A Danish research centre releases a Danish-language model under an open licence; its project lead checks that this spares it the technical documentation, but it must still publish a summary of the training data and a copyright policy.
    da: Et dansk forskningscenter udgiver en dansksproget model under en åben licens; projektlederen konstaterer, at det fritager centret for den tekniske dokumentation, men at det stadig skal offentliggøre en oversigt over træningsdataene og en politik for ophavsret.
  whyItMatters:
    en: One model can sit under thousands of products, so since August 2025 the EU has placed duties directly on its maker instead of leaving every product builder to guess at the model's risks.
    da: Én model kan ligge under tusindvis af produkter, så EU har siden august 2025 lagt pligter direkte på den, der laver modellen, i stedet for at lade hver produktbygger gætte på modellens risici.
edges:
  requires: [eu-ai-act]
  used-with:
    - to: model-card
      why:
        en: Providers must hand documentation about the model to those who build on it, and a model card is a common format for that.
        da: Udbydere skal give dokumentation om modellen til dem, der bygger videre på den, og et modelkort er et udbredt format til det.
      strength: normal
      confidence: medium
    - to: open-weight-model
      why:
        en: Models released under a free and open licence with public weights are spared some documentation duties, unless they are among the largest models that pose risks to society as a whole.
        da: Modeller udgivet under en fri og åben licens med offentlige vægte er fritaget for visse dokumentationspligter, medmindre de hører til de største modeller med risiko for samfundet som helhed.
      strength: normal
      confidence: high
sources:
  - title: Regulation (EU) 2024/1689 (Artificial Intelligence Act), Art. 3(63), Art. 51–55, Annex XI–XIII
    tier: standard
    publisher: European Union
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - title: European Commission — General-Purpose AI Code of Practice (2025)
    tier: official-doc
    publisher: European Commission
draft: true
