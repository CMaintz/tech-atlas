term:
  en: Explainability
  da: Forklarlighed
aka:
  en: [explainable AI, XAI, interpretability]
  da: [forklarbar AI, XAI]
domain: [ai]
cluster: ai-risk
layer: model
status: current
era: 2016
summary:
  en: How well people can understand why an AI system reached a particular result.
  da: Hvor godt mennesker kan forstå, hvorfor et AI-system nåede frem til et bestemt resultat.
body:
  formal:
    en: The degree to which the reasons behind a model's output can be shown in terms a person can follow, for example which inputs weighed most, so that the result can be checked, challenged or corrected.
    da: I hvilken grad grundene bag en models resultat kan vises på en måde, et menneske kan følge, for eksempel hvilke oplysninger der vejede tungest, så man kan kontrollere resultatet, klage over det eller rette det.
  plain:
    en: Like a doctor who does not just say "take these pills" but tells you what they saw in your tests and why that led to the choice.
    da: Som en læge, der ikke bare siger "tag de her piller", men fortæller, hvad hun så i dine prøver, og hvorfor det førte til valget.
  inPractice:
    en: A citizen whose application for housing support is flagged for rejection by a municipality's AI tool asks why; the municipality can show that missing income papers, not age or nationality, drove the result.
    da: En borger, hvis ansøgning om boligstøtte bliver indstillet til afslag af kommunens AI-værktøj, spørger hvorfor; kommunen kan vise, at manglende indkomstoplysninger og ikke alder eller nationalitet afgjorde resultatet.
  whyItMatters:
    en: Without it, nobody can spot hidden unfairness, answer an auditor or give an affected person a real reason, so trust and accountability break down.
    da: Uden den kan ingen opdage skjult uretfærdighed, svare en revisor eller give en berørt person en reel begrundelse, og så bryder tillid og ansvarlighed sammen.
deepDive:
  en: |-
    The literature separates interpretability - models whose structure a person can inspect directly, such as sparse linear models, shallow decision trees, rule lists or generalised additive models - from post-hoc explainability, where a separate method approximates why an opaque model produced an output. Explanations are further classified as global (how the model behaves overall) or local (why this one prediction), and as model-specific or model-agnostic. Rudin (2019) argued that for high-stakes tabular decisions an interpretable model often matches black-box accuracy, making post-hoc explanation of a black box the weaker choice.

    The main post-hoc families are feature attribution, example-based and counterfactual methods. LIME (Ribeiro et al., 2016) fits a weighted linear surrogate around the instance using perturbed samples. SHAP (Lundberg and Lee, 2017) assigns each feature its Shapley value from cooperative game theory, the unique attribution satisfying efficiency, symmetry, dummy and additivity; KernelSHAP estimates it by sampling and TreeSHAP computes it exactly for tree ensembles. Gradient methods for neural networks include saliency maps, Integrated Gradients (Sundararajan et al., 2017), which integrates gradients along a path from a baseline, and Grad-CAM for convolutional networks. Counterfactual explanations (Wachter et al., 2017) state the smallest change to the input that would flip the outcome - "had declared income been above X, the application would have been approved" - which is often the most useful form for an affected person.

    Failure modes are well documented. Attributions depend on the chosen baseline or background distribution; correlated features split credit arbitrarily; saliency maps can look plausible while being insensitive to the model's weights (Adebayo et al., 2018, "Sanity Checks for Saliency Maps"); and LIME and SHAP can be manipulated so that a biased model appears to rely on innocuous features. For LLMs, a chain-of-thought is generated text and is not guaranteed to be a faithful account of the computation; mechanistic interpretability (circuits, probing, sparse autoencoders over activations) aims at faithful explanations but is still a research field. NIST IR 8312 accordingly lists four principles: explanation, meaningful, explanation accuracy and knowledge limits.

    Legally, GDPR Arts. 13(2)(f), 14(2)(g) and 15(1)(h) give data subjects a right to meaningful information about the logic involved in automated decisions under Art. 22. The CJEU held in SCHUFA (C-634/21, 2023) that a credit score can itself be such a decision, and in Dun & Bradstreet Austria (C-203/22, 2025) that the explanation must enable the person to understand the procedure and principles actually applied, without being defeated wholesale by trade-secret claims. The EU AI Act adds Art. 13 (instructions enabling deployers to interpret output), Art. 14 (human oversight) and Art. 86, a right for affected persons to obtain clear and meaningful explanations of certain decisions based on Annex III high-risk systems.
  da: |-
    Litteraturen skelner mellem fortolkelighed (interpretability) - modeller, hvis struktur et menneske kan inspicere direkte, som sparsomme lineære modeller, lave beslutningstræer, regellister eller generaliserede additive modeller - og post-hoc-forklarlighed, hvor en separat metode tilnærmer, hvorfor en uigennemsigtig model gav et bestemt output. Forklaringer inddeles desuden i globale (hvordan modellen opfører sig overordnet) og lokale (hvorfor netop denne forudsigelse) og i modelspecifikke eller modelagnostiske. Rudin (2019) argumenterede for, at en fortolkelig model ved højrisikobeslutninger på tabeldata ofte er lige så præcis som en black box, så post-hoc-forklaring af en black box er det svagere valg.

    De vigtigste post-hoc-familier er feature attribution, eksempelbaserede og kontrafaktiske metoder. LIME (Ribeiro et al., 2016) tilpasser en vægtet lineær surrogatmodel omkring det enkelte tilfælde ud fra forstyrrede eksempler. SHAP (Lundberg og Lee, 2017) tildeler hver feature dens Shapley-værdi fra kooperativ spilteori, den eneste fordeling, der opfylder efficiency, symmetry, dummy og additivity; KernelSHAP estimerer den ved sampling, og TreeSHAP beregner den eksakt for træ-ensembler. Gradientmetoder for neurale netværk omfatter saliency maps, Integrated Gradients (Sundararajan et al., 2017), der integrerer gradienter langs en sti fra en baseline, og Grad-CAM for konvolutionelle netværk. Kontrafaktiske forklaringer (Wachter et al., 2017) angiver den mindste ændring af input, der ville vende udfaldet - "havde den oplyste indkomst været over X, var ansøgningen blevet godkendt" - hvilket ofte er den mest brugbare form for en berørt person.

    Fejlkilderne er veldokumenterede. Attributioner afhænger af den valgte baseline eller baggrundsfordeling; korrelerede features deler æren vilkårligt; saliency maps kan se plausible ud og samtidig være ufølsomme over for modellens vægte (Adebayo et al., 2018, "Sanity Checks for Saliency Maps"); og LIME og SHAP kan manipuleres, så en biased model ser ud til at bygge på harmløse features. For LLM'er er en chain-of-thought genereret tekst og ikke nødvendigvis en tro gengivelse af beregningen; mekanistisk interpretability (kredsløb, probing, sparse autoencoders på aktiveringer) sigter mod tro forklaringer, men er stadig et forskningsfelt. NIST IR 8312 opstiller derfor fire principper: forklaring, meningsfuldhed, forklaringens nøjagtighed og videnens grænser.

    Juridisk giver GDPR art. 13, stk. 2, litra f, art. 14, stk. 2, litra g, og art. 15, stk. 1, litra h, den registrerede ret til meningsfulde oplysninger om logikken i automatiske afgørelser efter art. 22. EU-Domstolen fastslog i SCHUFA (C-634/21, 2023), at en kreditscore i sig selv kan være en sådan afgørelse, og i Dun & Bradstreet Austria (C-203/22, 2025), at forklaringen skal sætte personen i stand til at forstå den fremgangsmåde og de principper, der faktisk er anvendt, uden at hensynet til forretningshemmeligheder generelt kan afskære den. AI-forordningen tilføjer art. 13 (brugsanvisning, der sætter idriftsættere i stand til at fortolke output), art. 14 (menneskeligt tilsyn) og art. 86, en ret for berørte personer til at få en klar og meningsfuld forklaring på visse afgørelser, der bygger på højrisikosystemer efter bilag III.
howTo:
  steps:
    en:
      - For each AI system that affects people, write down who needs an explanation (the affected person, the caseworker, the developer, the auditor), what they must be able to do with it, and which rules apply, such as GDPR Arts. 13-15 and 22 and AI Act Arts. 13 and 86.
      - For decisions on tabular data, first try an interpretable model such as a scorecard, a shallow decision tree or a GAM, and choose a black-box model only if it is clearly better and you can explain it well enough.
      - Pick explanation methods to fit the audience, for example global feature importance for developers and auditors, local attributions such as SHAP for caseworkers, and counterfactuals ("had income been above X, the application would have been approved") for affected people.
      - Test that the explanations are faithful before you rely on them, with sanity checks such as randomising the model weights, comparing baselines and checking correlated features, and note their limits as NIST IR 8312 recommends.
      - Build the explanation into the workflow, so the caseworker sees the main reasons next to the result and the letter to the citizen states the role of the AI and the main elements of the decision in plain language.
      - Document the chosen methods, their limits and example explanations in the technical documentation or model card, and train the staff who have to pass explanations on.
      - Review explanations with every model update and sample complaints and appeals to see whether people understood them, then adjust the wording or method.
    da:
      - Skriv for hvert AI-system, der påvirker mennesker, ned, hvem der har brug for en forklaring (den berørte person, sagsbehandleren, udvikleren, revisoren), hvad de skal kunne bruge den til, og hvilke regler der gælder, fx GDPR art. 13-15 og 22 og AI-forordningens art. 13 og 86.
      - Prøv ved afgørelser på tabeldata først en fortolkelig model som et pointkort, et lavt beslutningstræ eller en GAM, og vælg kun en black box-model, hvis den er klart bedre, og I kan forklare den godt nok.
      - Vælg forklaringsmetoder efter målgruppen, fx global feature importance til udviklere og revisorer, lokale attributioner som SHAP til sagsbehandlere og kontrafaktiske forklaringer ("havde indkomsten været over X, var ansøgningen blevet godkendt") til berørte personer.
      - Test, at forklaringerne er tro mod modellen, før I stoler på dem, med sanity checks som at randomisere modellens vægte, sammenligne baselines og tjekke korrelerede features, og beskriv deres begrænsninger, som NIST IR 8312 anbefaler.
      - Byg forklaringen ind i arbejdsgangen, så sagsbehandleren ser de vigtigste grunde ved siden af resultatet, og brevet til borgeren i et klart sprog oplyser AI'ens rolle og de vigtigste elementer i afgørelsen.
      - Dokumentér de valgte metoder, deres begrænsninger og eksempler på forklaringer i den tekniske dokumentation eller modelkortet, og uddan de medarbejdere, der skal give forklaringerne videre.
      - Gennemgå forklaringerne ved hver modelopdatering, og tag stikprøver af klager og anker for at se, om folk forstod dem, og justér så formuleringen eller metoden.
  pitfalls:
    en:
      - Trusting a saliency map or SHAP chart because it looks plausible, without checking that it actually reflects what the model does.
      - Giving affected people a technical feature list or a trade-secret refusal instead of the procedure and principles actually applied, which the CJEU has said they are entitled to understand.
      - Presenting an LLM's chain-of-thought as the real reason for its answer, although it is generated text and not a faithful record of the computation.
    da:
      - At stole på et saliency map eller et SHAP-diagram, fordi det ser plausibelt ud, uden at tjekke, at det faktisk afspejler, hvad modellen gør.
      - At give berørte personer en teknisk liste over features eller et afslag med henvisning til forretningshemmeligheder i stedet for den fremgangsmåde og de principper, der faktisk er brugt, som EU-Domstolen har sagt, at de har krav på at forstå.
      - At fremstille en LLM's chain-of-thought som den egentlige grund til svaret, selv om det er genereret tekst og ikke en tro gengivelse af beregningen.
