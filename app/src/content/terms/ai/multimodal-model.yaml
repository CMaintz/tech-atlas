term:
  en: Multimodal model
  da: Multimodal model
aka:
  en: [multimodal AI]
  da: [multimodal AI]
domain: [ai]
cluster: model-architecture
layer: model
status: current
summary:
  en: A model that can take in, and sometimes produce, more than one kind of content — such as text, photos and speech — in one conversation.
  da: En model, der kan tage imod — og nogle gange selv skabe — flere slags indhold, fx tekst, fotos og tale, i den samme samtale.
body:
  formal:
    en: A foundation model that turns different kinds of input — text, images, sound — into embeddings in one shared space, usually with a separate encoder for each kind, so a single transformer can reason across them together.
    da: En grundmodel, der laver forskellige slags input — tekst, billeder, lyd — om til embeddings i ét fælles rum, typisk med en separat encoder for hver slags, så en enkelt transformer kan ræsonnere på tværs af dem samlet.
  plain:
    en: Like a colleague you can hand a photo, play a voice message to and write to, all in one conversation — instead of three helpers who can each only read, look or listen.
    da: Som en kollega, du kan række et foto, afspille en talebesked for og skrive til — alt i én samtale — i stedet for tre hjælpere, der hver kun kan læse, se eller lytte.
  inPractice:
    en: A building inspector in a municipality photographs a hand-drawn floor plan sent with an application and asks the assistant for the total floor area; the model reads the measurements off the drawing, and she checks the sum.
    da: En byggesagsbehandler i en kommune fotograferer en håndtegnet plantegning, der fulgte med en ansøgning, og beder assistenten om det samlede antal kvadratmeter; modellen aflæser målene på tegningen, og hun tjekker summen.
  whyItMatters:
    en: Every new kind of input is a new way in — text hidden inside a picture can carry instructions the user never sees, so images and audio need the same care as typed text.
    da: Hver ny slags input er en ny vej ind — tekst gemt i et billede kan bære instruktioner, brugeren aldrig ser, så billeder og lyd kræver samme omhu som indtastet tekst.
edges:
  kind-of: [foundation-model]
  requires: [embedding, encoder]
  used-with:
    - to: prompt-injection
      why:
        en: Instructions can be hidden in an image or audio clip, giving prompt injection a path that text filters do not see.
        da: Instruktioner kan gemmes i et billede eller et lydklip, hvilket giver prompt injection en vej, som tekstfiltre ikke ser.
      strength: primary
      confidence: high
    - prompt
    - transformer
sources:
  - title: Radford et al. (2021), Learning Transferable Visual Models From Natural Language Supervision (CLIP)
    tier: reference
  - title: OWASP Top 10 for LLM Applications 2025 (LLM01 Prompt Injection — multimodal injection)
    tier: reference
    publisher: OWASP
