term:
  en: Fill-in-the-middle (FIM)
  da: Fill-in-the-middle (FIM)
aka:
  en: [FIM, infilling, code infilling]
  da: [FIM, infilling]
domain: [ai]
cluster: ai-coding
layer: training
era: 2022
status: current
summary:
  en: A training trick that teaches a model to write the missing piece between the text before a gap and the text after it.
  da: Et træningstrick, der lærer en model at skrive det manglende stykke mellem teksten før et hul og teksten efter det.
body:
  formal:
    en: During pretraining, a document is cut into a start, a middle and an end, and the pieces are reordered with special marker tokens as start, end, then middle; ordinary next-token prediction on that order teaches the model to produce a middle that fits both sides.
    da: Under fortræningen skæres et dokument i en start, en midte og en slutning, og stykkerne stilles om med særlige markør-tokens som start, slutning og så midte; almindelig forudsigelse af næste token på den rækkefølge lærer modellen at lave en midte, der passer til begge sider.
  plain:
    en: Like fitting the last piece of a jigsaw — the pieces on every side of the hole show its shape far better than looking at one side alone.
    da: Som at finde den sidste brik i et puslespil — brikkerne på alle sider af hullet viser formen langt bedre end én side alene.
  inPractice:
    en: At a Danish university, a developer clicks into the middle of a half-written function in the exam booking app; the editor sends the lines above and below, and the model returns only the few lines that belong in the gap.
    da: På et dansk universitet sætter en udvikler markøren midt i en halvskrevet funktion i appen til eksamensbooking; editoren sender linjerne over og under, og modellen returnerer kun de få linjer, der hører til i hullet.
  whyItMatters:
    en: Real editing rarely happens at the end of a file, so without it a model would guess blindly about everything below the spot being edited and suggest lines that clash with the rest.
    da: Rigtig redigering sker sjældent i slutningen af en fil, så uden det ville en model gætte i blinde om alt under det sted, man retter, og foreslå linjer, der støder mod resten.
edges:
  requires:
    - to: next-token-prediction
      why:
        en: It does not change how the model predicts; it only reorders the text so that plain left-to-right prediction ends up filling the gap.
        da: Det ændrer ikke, hvordan modellen forudsiger; det stiller blot teksten om, så almindelig forudsigelse fra venstre mod højre ender med at udfylde hullet.
      strength: primary
      confidence: high
    - token
  part-of:
    - to: pretraining
      why:
        en: The reordering is applied to a share of the documents during pretraining, so the ability comes built in rather than added afterwards.
        da: Omstillingen anvendes på en del af dokumenterne under fortræningen, så evnen er indbygget i stedet for tilføjet bagefter.
      strength: normal
      confidence: high
  used-with: [tokenizer]
sources:
  - title: Bavarian et al. (2022), Efficient Training of Language Models to Fill in the Middle
    tier: reference
  - title: Fried et al. (2022), InCoder — A Generative Model for Code Infilling and Synthesis
    tier: reference
draft: true
