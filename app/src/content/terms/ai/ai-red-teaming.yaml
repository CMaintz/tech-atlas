term:
  en: AI red teaming
  da: AI red teaming
aka:
  en: [red teaming of AI systems]
  da: [red teaming af AI-systemer]
domain: [ai, security]
cluster: ai-risk
layer: governance
status: emerging
era: 2023
summary:
  en: Testers attack an AI system on purpose, before and after release, to find ways it can be tricked into harmful or unsafe behaviour.
  da: Testere angriber med vilje et AI-system før og efter lancering for at finde måder, det kan narres til skadelig eller usikker adfærd.
body:
  formal:
    en: A structured, authorised exercise in which people, often helped by automated tools, act as attackers against an AI model or product to find harmful output, prompt injection, rule breaking, data leaks and other failures, and report them so they can be fixed.
    da: En struktureret, godkendt øvelse, hvor personer, ofte hjulpet af automatiske værktøjer, optræder som angribere mod en AI-model eller et AI-produkt for at finde skadeligt output, prompt injection, regelbrud, datalæk og andre fejl og rapportere dem, så de kan rettes.
  plain:
    en: Like hiring clever troublemakers to spend a week trying to talk a new shop assistant into breaking every rule, so you learn where the training falls short before real customers do.
    da: Som at hyre snedige ballademagere til at bruge en uge på at få en ny ekspedient til at bryde alle regler, så du opdager hullerne i oplæringen, før rigtige kunder gør.
  inPractice:
    en: Before a municipality opens a chat assistant for citizens, a team spends two weeks trying to make it reveal other citizens' case details, give wrong advice about benefits or ignore its rules, and each trick found is blocked.
    da: Før en kommune åbner en chatassistent for borgerne, bruger et team to uger på at få den til at afsløre andre borgeres sagsoplysninger, give forkerte råd om ydelser eller ignorere sine regler, og hvert trick, de finder, bliver lukket.
  whyItMatters:
    en: AI systems fail in ways ordinary functional tests never try, and the EU AI Act requires this kind of attack testing for the largest general-purpose models, whose failures could cause harm across society.
    da: AI-systemer fejler på måder, almindelige funktionstest aldrig afprøver, og EU's AI-forordning kræver den slags angrebstest af de største AI-modeller til almen brug, hvis fejl kan skade hele samfundet.
edges:
  requires: [artificial-intelligence]
  part-of:
    - ai-governance
    - to: model-evaluation
      why:
        en: Deliberate attacks on a model are one of the ways its safety is checked, alongside scores, benchmarks and human review.
        da: Bevidste angreb på en model er en af måderne, dens sikkerhed kontrolleres på, sammen med tal, benchmarks og menneskelig gennemgang.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: penetration-test
      why:
        en: A pentest looks for ways into systems and data; AI red teaming also hunts for harmful, false or rule-breaking answers from the model itself.
        da: En pentest leder efter veje ind til systemer og data; AI red teaming jagter også skadelige, falske eller regelbrydende svar fra selve modellen.
      strength: primary
      confidence: high
  mitigates:
    - to: prompt-injection
      why:
        en: Testers try many hidden and direct instructions so weak spots are found and blocked before attackers find them.
        da: Testerne prøver mange skjulte og direkte instruktioner, så svage punkter bliver fundet og lukket, før angribere finder dem.
      strength: normal
      confidence: high
  used-with:
    - to: jailbreak
      why:
        en: Red teamers try jailbreaks on purpose to find where a model's safety rules give way before attackers do.
        da: Red teamere forsøger bevidst jailbreaks for at finde, hvor en models sikkerhedsregler giver efter, før angribere gør det.
      strength: normal
      confidence: medium
sources:
