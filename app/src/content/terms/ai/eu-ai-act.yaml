edges:
  kind-of: [eu-regulation]
  requires: [risk, artificial-intelligence]
  mandates:
    - to: ai-red-teaming
      why:
        en: Providers of general-purpose models with systemic risk must carry out and document attack testing of the model to find and reduce its risks.
        da: Udbydere af AI-modeller til almen brug med systemisk risiko skal udføre og dokumentere angrebstest af modellen for at finde og mindske dens risici.
      strength: primary
      confidence: high
    - to: risk-management
      why:
        en: Providers of high-risk systems must run a documented risk management process across the system's whole life.
        da: Udbydere af højrisikosystemer skal have en dokumenteret risikostyringsproces gennem hele systemets levetid.
      strength: primary
      confidence: high
    - to: ai-governance
      why:
        en: The Act requires quality management, human oversight, record keeping and AI literacy among staff, which together form AI governance.
        da: Forordningen kræver kvalitetsstyring, menneskeligt tilsyn, dokumentation og AI-kompetencer hos medarbejderne, som tilsammen udgør AI-governance.
      strength: primary
      confidence: high
    - to: explainability
      why:
        en: High-risk systems must come with enough information for users to read and use their output correctly, and affected people can ask for an explanation of decisions.
        da: Højrisikosystemer skal leveres med oplysninger nok til, at brugerne kan forstå og bruge deres resultater korrekt, og berørte personer kan kræve en forklaring på afgørelser.
      strength: normal
      confidence: medium
    - to: incident-reporting
      why:
        en: Providers must report serious incidents involving high-risk systems to the market authorities.
        da: Udbydere skal indberette alvorlige hændelser med højrisikosystemer til markedsovervågningsmyndighederne.
      strength: normal
      confidence: high
    - to: model-card
      why:
        en: Providers of general-purpose AI models must keep technical documentation and give information to those who build on the model (Art. 53, Annex XI/XII); the Act does not name model cards, but a model card is a common way to meet part of that duty.
        da: Udbydere af AI-modeller til almen brug skal føre teknisk dokumentation og give oplysninger til dem, der bygger videre på modellen (art. 53, bilag XI/XII); forordningen nævner ikke modelkort, men et modelkort er en udbredt måde at opfylde en del af pligten på.
      strength: normal
      confidence: medium
    - to: model-evaluation
      why:
        en: The Act requires high-risk AI systems to be tested for accuracy, robustness and security before and during use (Art. 9, 15).
        da: Forordningen kræver, at højrisiko-AI-systemer testes for nøjagtighed, robusthed og sikkerhed før og under brug (art. 9, 15).
      strength: normal
      confidence: medium
    - to: human-in-the-loop
      why:
        en: Article 14 requires high-risk AI systems to be built so people can oversee them effectively.
        da: Artikel 14 kræver, at højrisiko-AI-systemer indrettes til effektivt menneskeligt tilsyn.
      strength: normal
      confidence: medium
  contrasts-with:
    - to: gdpr
      why:
        en: GDPR protects personal data wherever it is used; the AI Act governs AI systems as products, whether or not they touch personal data. Both often apply at once.
        da: GDPR beskytter personoplysninger, uanset hvor de bruges; AI-forordningen regulerer AI-systemer som produkter, uanset om de rører personoplysninger. Ofte gælder begge på én gang.
      strength: normal
      confidence: high
