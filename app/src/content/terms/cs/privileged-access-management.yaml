edges:
  part-of: [access-management]
  implements: [least-privilege]
  requires: [privileged-account]
  mitigates:
    - to: privilege-escalation
      why:
        en: With no standing admin rights to steal and every use approved and recorded, there is little higher access left to grab.
        da: Uden faste administratorrettigheder at stjæle og med hver brug godkendt og optaget er der kun lidt højere adgang tilbage at snuppe.
      strength: normal
      confidence: medium
    - to: insider-threat
      why:
        en: Time-limited, recorded admin sessions make it hard for a trusted insider to misuse far-reaching rights unseen.
        da: Tidsbegrænsede, optagede administratorsessioner gør det svært for en betroet insider at misbruge vidtgående rettigheder ubemærket.
      strength: normal
      confidence: high
sources:
  - title: NIST SP 1800-18 - Privileged Account Management for the Financial Services Sector
    tier: standard
    publisher: NIST
  - title: CIS Controls v8 - Control 5 (Account Management) and Control 6 (Access Control Management)
    tier: standard
    publisher: Center for Internet Security
