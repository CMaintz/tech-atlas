term:
  en: Internet
  da: Internettet
aka:
  en: [the net]
  da: [nettet]
domain: [cs]
cluster: networking
layer: network
status: current
era: 1983
summary:
  en: The worldwide network of networks that lets almost any connected device reach almost any other.
  da: Det verdensomspændende netværk af netværk, der lader næsten enhver tilsluttet enhed nå næsten enhver anden.
body:
  formal:
    en: A global system of separately owned networks joined by routers, which all follow TCP/IP so that data from one network can be passed on and delivered to an IP address in another.
    da: Et globalt system af selvstændigt ejede netværk, forbundet af routere, som alle følger TCP/IP, så data fra ét netværk kan sendes videre og leveres til en IP-adresse i et andet.
  plain:
    en: Like the world's postal services agreeing on one way to write addresses, so a letter posted in Denmark can reach a house in Tokyo.
    da: Som hvis alverdens postvæsener blev enige om én måde at skrive adresser på, så et brev sendt i Danmark kan nå et hus i Tokyo.
  inPractice:
    en: A small shop's card terminal, website and email all reach customers and the bank through the same internet connection from its provider.
    da: En lille butiks betalingsterminal, hjemmeside og e-mail når alle kunder og banken gennem den samme internetforbindelse fra udbyderen.
  whyItMatters:
    en: Being on the internet means anyone in the world can try to reach you, which is why so many controls guard the point where a company meets it.
    da: At være på internettet betyder, at alle i verden kan forsøge at nå dig, og derfor vogter så mange kontroller stedet, hvor virksomheden møder det.
edges:
  kind-of: [network]
  requires: [tcp-ip, ip-address, router]
