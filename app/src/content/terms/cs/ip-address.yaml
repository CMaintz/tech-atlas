term:
  en: IP address
  da: IP-adresse
aka:
  en: [Internet Protocol address, IPv4 address, IPv6 address]
  da: [IPv4-adresse, IPv6-adresse]
domain: [cs]
cluster: networking
layer: network
status: current
era: 1981
summary:
  en: A number that identifies a device on a network so that data can be delivered to it.
  da: Et nummer, der identificerer en enhed på et netværk, så data kan leveres til den.
body:
  formal:
    en: A numeric label assigned to a device's network connection, which the TCP/IP protocols use to mark where each packet comes from and where it must go. IPv4 addresses are 32 bits long; IPv6 addresses are 128 bits.
    da: En talværdi, der tildeles en enheds netværksforbindelse, og som TCP/IP-protokollerne bruger til at angive, hvor hver pakke kommer fra, og hvor den skal hen. IPv4-adresser er på 32 bit, IPv6-adresser på 128 bit.
  plain:
    en: Like a street address for a house — without it, the postman has no idea where to deliver the letter.
    da: Som en gadeadresse til et hus — uden den aner postbudet ikke, hvor brevet skal afleveres.
  inPractice:
    en: An analyst in a region's SOC sees hundreds of failed logins to the hospitals' remote access, all from one IP address abroad, and blocks that address in the firewall.
    da: En analytiker i regionens SOC ser hundredvis af mislykkede login til hospitalernes fjernadgang, alle fra én IP-adresse i udlandet, og blokerer adressen i firewallen.
  whyItMatters:
    en: Blocking, logging and tracing attacks all start from addresses, yet an address alone does not prove who is behind it — many users can share one, and attackers often borrow someone else's.
    da: Når man blokerer, logger og sporer angreb, tager man udgangspunkt i adresser, men en adresse alene beviser ikke, hvem der står bag — mange brugere kan dele én, og angribere låner ofte andres.
edges:
