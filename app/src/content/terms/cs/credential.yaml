term:
  en: Credential
  da: Loginoplysning (credential)
aka:
  en: [login details]
  da: [loginoplysninger, legitimation, credential]
domain: [cs]
cluster: identity
layer: identity
status: current
summary:
  en: Something a user presents to prove who they are, such as a password, a key card or a fingerprint.
  da: Noget, en bruger fremviser for at bevise, hvem vedkommende er, fx en adgangskode, et nøglekort eller et fingeraftryk.
body:
  formal:
    en: An item or piece of information bound to an identity and used during authentication to show that whoever presents it is the rightful holder of that identity.
    da: En genstand eller oplysning, der er knyttet til en identitet og bruges under autentificering til at vise, at den, der fremviser den, er identitetens retmæssige indehaver.
  plain:
    en: Like a house key — whoever holds it is let in, which is exactly why you do not lend it out or leave it under the doormat.
    da: Som en husnøgle — den, der har den, bliver lukket ind, og netop derfor låner man den ikke ud eller lægger den under dørmåtten.
  inPractice:
    en: The user name and password of a consultant at an auditing firm turn up for sale online; anyone who buys them can log in to client systems as the consultant until the password is changed.
    da: Brugernavn og adgangskode til en konsulent i et revisionsfirma bliver sat til salg på nettet; enhver, der køber dem, kan logge ind i kundernes systemer som konsulenten, indtil adgangskoden bliver skiftet.
  whyItMatters:
    en: Stolen credentials are one of the most common ways attackers get in, because with them they look exactly like a legitimate user.
    da: Stjålne loginoplysninger er en af angribernes mest almindelige veje ind, fordi de med dem ligner en helt almindelig, legitim bruger.
edges:
  requires: [identity]
  used-with:
    - to: identity-provider
      why:
        en: An identity provider stores and checks credentials on behalf of many applications.
        da: En identitetsudbyder gemmer og kontrollerer loginoplysninger på vegne af mange programmer.
sources:
  - title: NIST SP 800-63-3, Digital Identity Guidelines
    url: https://pages.nist.gov/800-63-3/sp800-63-3.html
    tier: standard
    publisher: NIST
draft: true
