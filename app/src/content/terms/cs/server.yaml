domain: [cs]
cluster: networking
layer: network
status: current
summary:
  en: A computer or program that waits for requests over a network and answers them, such as sending a web page or storing email.
  da: En computer eller et program, der venter på forespørgsler over et netværk og besvarer dem, fx ved at sende en webside eller gemme e-mail.
body:
  formal:
    en: A program, or the machine running it, that listens on a port for incoming requests from clients and returns responses according to an agreed protocol.
    da: Et program, eller maskinen der kører det, som lytter på en port efter indkommende forespørgsler fra klienter og sender svar tilbage efter en aftalt protokol.
  plain:
    en: Like the counter at a library — it stays open, waits for people to ask for a book, and hands over what they asked for.
    da: Som skranken på et bibliotek — den holder åbent, venter på, at folk spørger efter en bog, og udleverer det, de bad om.
  inPractice:
    en: A region runs its patient record system on servers in two data centres; thousands of computers at its hospitals send requests to them all day, and if one centre fails, the other takes over.
    da: En region kører sit patientjournalsystem på servere i to datacentre; tusindvis af computere på regionens hospitaler sender forespørgsler til dem hele dagen, og hvis det ene center svigter, overtager det andet.
  whyItMatters:
    en: Servers hold the shared data and services everyone depends on and can be reached at all times, which makes them prime targets; they usually count among an organisation's critical assets.
    da: Servere rummer de fælles data og tjenester, alle er afhængige af, og kan nås døgnet rundt, hvilket gør dem til oplagte mål; de hører typisk til organisationens kritiske aktiver.
