term:
  en: Client
  da: Klient
aka:
  en: []
  da: []
domain: [cs]
cluster: networking
layer: network
status: current
summary:
  en: The program or device that starts a conversation over a network by sending a request, such as a web browser asking for a page.
  da: Det program eller den enhed, der starter en samtale over et netværk ved at sende en forespørgsel, fx en browser, der beder om en side.
body:
  formal:
    en: The side of a network exchange that opens the connection and sends requests, following a protocol, to a server that answers them.
    da: Den side af en udveksling over netværket, der åbner forbindelsen og sender forespørgsler efter en protokol til en server, som besvarer dem.
  plain:
    en: Like a customer walking up to a shop counter — the customer asks, the shop answers, and it is always the customer who starts.
    da: Som en kunde, der går hen til disken i en butik — kunden spørger, butikken svarer, og det er altid kunden, der begynder.
  inPractice:
    en: The mail app on an employee's phone is a client that contacts the company's mail server every few minutes to check for new messages.
    da: Mail-appen på en medarbejders telefon er en klient, der kontakter virksomhedens mailserver med få minutters mellemrum for at se efter nye beskeder.
  whyItMatters:
    en: Clients run on the devices people use every day, so a tricked or outdated client is often how an attacker first gets inside.
    da: Klienter kører på de enheder, folk bruger hver dag, så en narret eller forældet klient er ofte den vej, en angriber først kommer ind ad.
edges:
  requires: [network, protocol]
  contrasts-with:
    - to: server
      why:
        en: The client asks and starts the exchange; the server waits and answers. The same machine can play either role.
        da: Klienten spørger og starter udvekslingen; serveren venter og svarer. Den samme maskine kan spille begge roller.
      strength: primary
      confidence: high
sources:
  - title: 'Kurose & Ross, Computer Networking: A Top-Down Approach'
    tier: textbook
draft: true
