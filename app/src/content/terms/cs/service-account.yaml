term:
  en: Service account
  da: Servicekonto
aka:
  en: [machine account, non-human account]
  da: [maskinkonto, systemkonto]
domain: [cs]
cluster: identity
layer: identity
status: current
summary:
  en: An account used by a program rather than a person, so that software can log in to other systems on its own.
  da: En konto, som bruges af et program i stedet for et menneske, så software selv kan logge på andre systemer.
body:
  formal:
    en: An account that belongs to an application or service instead of a named person, holding its own credential and permissions so the software can reach databases, files or other services without anyone typing a password.
    da: En konto, der tilhører en applikation eller tjeneste i stedet for en navngiven person, med sin egen loginoplysning og egne rettigheder, så softwaren kan tilgå databaser, filer eller andre tjenester, uden at nogen taster en adgangskode.
  plain:
    en: Like a staff key card given to the cleaning robot rather than to a worker — it opens only the doors the robot needs, at any hour, with nobody holding it.
    da: Som et adgangskort, der er udstedt til rengøringsrobotten i stedet for til en medarbejder — det åbner kun de døre, robotten har brug for, på alle tider af døgnet, uden at nogen holder det.
  inPractice:
    en: A nightly backup job signs in to the file server with its own service account, which may only read files, not delete them, and whose password is kept in a locked store rather than in a script.
    da: Et natligt backupjob logger på filserveren med sin egen servicekonto, der kun må læse filer, ikke slette dem, og hvis adgangskode opbevares i et låst lager i stedet for i et script.
  whyItMatters:
    en: These accounts often hold wide rights and old passwords that no one watches, making them a quiet way in for attackers; clear ownership and small rights keep them safe.
    da: Disse konti har ofte brede rettigheder og gamle adgangskoder, som ingen holder øje med, hvilket gør dem til en stille vej ind for angribere; klart ejerskab og små rettigheder holder dem sikre.
edges:
  kind-of: [account]
  requires: [service, credential]
