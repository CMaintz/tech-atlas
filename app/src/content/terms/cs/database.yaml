term:
  en: Database
  da: Database
aka:
  en: [DB]
  da: [DB]
domain: [cs]
cluster: web
layer: application
status: current
summary:
  en: An organised store of data that many programs and users can search, add to and change at the same time without mixing it up.
  da: Et organiseret lager af data, som mange programmer og brugere kan søge i, tilføje til og ændre på samme tid, uden at det bliver rodet.
body:
  formal:
    en: A structured collection of data run by a database management system, which lets programs look up, insert, update and delete records through a query language such as SQL while keeping the data correct when many changes happen at once.
    da: En struktureret samling af data, som styres af et databasesystem, der lader programmer slå op, indsætte, opdatere og slette poster gennem et forespørgselssprog som SQL, mens data holdes korrekte, når mange ændringer sker på én gang.
  plain:
    en: Like a well-run warehouse with a stock list — every item has a fixed place and a line in the list, so staff can find, add or move goods in seconds, and two clerks never undo each other's changes.
    da: Som et velordnet lager med en vareliste — hver vare har en fast plads og en linje på listen, så personalet kan finde, tilføje eller flytte varer på få sekunder, og to ekspedienter aldrig overskriver hinandens rettelser.
  inPractice:
    en: When a customer orders from a Danish web shop, the web application writes the order, the address and the new stock count to the database as one step, so a crash halfway never leaves half an order.
    da: Når en kunde bestiller i en dansk webshop, skriver webapplikationen ordren, adressen og det nye lagertal til databasen i ét samlet trin, så et nedbrud midt i processen aldrig efterlader en halv ordre.
  whyItMatters:
    en: The database is often where an organisation's most valuable data lives, so who can reach it and what they may ask of it decides how bad a breach can be.
    da: Databasen er ofte der, hvor en organisations mest værdifulde data ligger, så hvem der kan nå den, og hvad de må spørge den om, afgør, hvor slemt et brud kan blive.
edges:
  contrasts-with:
    - to: file-system
      why:
        en: A file system stores whole files by name; a database stores records it understands, so it can search them and keep many changes in step.
        da: Et filsystem gemmer hele filer under et navn; en database gemmer poster, den forstår, så den kan søge i dem og holde mange samtidige ændringer i trit.
      strength: normal
      confidence: high
  used-with: [server, web-application]
sources:
