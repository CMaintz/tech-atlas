term:
  en: Database
  da: Database
aka:
  en: [DB]
  da: [DB]
domain: [cs]
cluster: web
layer: application
status: current
summary:
  en: An organised store of data that many programs and users can search, add to and change at the same time without mixing it up.
  da: Et organiseret lager af data, som mange programmer og brugere kan søge i, tilføje til og ændre på samme tid, uden at det bliver rodet.
body:
  formal:
    en: A structured collection of data run by a database management system, which lets programs look up, insert, update and delete records through a query language such as SQL while keeping the data consistent when many changes happen at once.
    da: En struktureret samling af data, som styres af et databasesystem, der lader programmer slå op, indsætte, opdatere og slette poster gennem et forespørgselssprog som SQL, mens data holdes konsistente, når mange ændringer sker på én gang.
  plain:
    en: Like a well-run library catalogue — every book has a card in a fixed place, so a librarian can find, add or move one in seconds without losing the rest.
    da: Som kartoteket på et velordnet bibliotek — hver bog har et kort på en fast plads, så bibliotekaren kan finde, tilføje eller flytte én på få sekunder uden at miste resten.
  inPractice:
    en: When a customer places an order in a web shop, the web application writes the order, the address and the new stock count to the shop's database in one step.
    da: Når en kunde afgiver en ordre i en webshop, skriver webapplikationen ordren, adressen og det nye lagertal til butikkens database i ét hug.
  whyItMatters:
    en: The database is often where a company's most valuable data lives, so who can reach it and what they may ask of it decides how bad a breach can be.
    da: Databasen er ofte der, hvor en virksomheds mest værdifulde data ligger, så hvem der kan nå den, og hvad de må spørge den om, afgør, hvor slemt et brud kan blive.
edges:
  contrasts-with:
    - to: file-system
      why:
        en: A file system stores whole files by name; a database stores records it understands, so it can search them and keep many changes in step.
        da: Et filsystem gemmer hele filer under et navn; en database gemmer poster, den forstår, så den kan søge i dem og holde mange samtidige ændringer i trit.
      strength: normal
      confidence: high
  used-with: [server, web-application]
sources:
  - title: Silberschatz, Korth & Sudarshan, Database System Concepts
    tier: textbook
  - title: 'E. F. Codd, A Relational Model of Data for Large Shared Data Banks (1970)'
    url: https://doi.org/10.1145/362384.362685
    tier: reference
    publisher: ACM
