term:
  en: REST API
  da: REST API
aka:
  en: [RESTful API]
  da: [RESTful API]
domain: [cs]
cluster: web
layer: application
status: current
era: 2000
summary:
  en: A common style of web API where each thing has its own URL and programs use plain HTTP methods to read, add, change or delete it.
  da: En udbredt slags web-API, hvor hver ting har sin egen URL, og programmer læser, tilføjer, ændrer eller sletter den med HTTP-metoder.
body:
  formal:
    en: An API that follows the REST style described by Roy Fielding in 2000 — each resource has its own URL, HTTP methods such as GET, POST, PUT and DELETE say what to do with it, and the server keeps no memory of the client between requests.
    da: Et API, der følger REST-stilen, som Roy Fielding beskrev i 2000 — hver ressource har sin egen URL, HTTP-metoder som GET, POST, PUT og DELETE siger, hvad der skal ske med den, og serveren husker ikke klienten mellem forespørgslerne.
  plain:
    en: Like a library where every book has a fixed shelf number, and there are only a handful of desk requests — borrow, return, add, remove — that work the same for every book.
    da: Som et bibliotek, hvor hver bog har et fast hyldenummer, og der kun er en håndfuld ting, man kan bede om ved skranken — låne, aflevere, tilføje, fjerne — som virker ens for alle bøger.
  inPractice:
    en: A shop's mobile app sends GET to the address for order 42 to show its status, and DELETE to the same address when the customer cancels it.
    da: En butiks mobilapp sender GET til adressen for ordre 42 for at vise dens status og DELETE til samme adresse, når kunden annullerer den.
  whyItMatters:
    en: Its simple, shared rules let any team build a client without special tools; each address is also a door into the system, so every one needs its own access checks.
    da: Dens enkle, fælles regler lader ethvert team bygge en klient uden særlige værktøjer; hver adresse er samtidig en dør ind i systemet, så hver enkelt skal have sin egen adgangskontrol.
