term:
  en: Digital certificate
  da: Digitalt certifikat
aka:
  en: [public key certificate, X.509 certificate, SSL certificate]
  da: [certifikat, X.509-certifikat, SSL-certifikat]
domain: [cs]
cluster: cryptography
layer: theory
status: current
era: 1988
summary:
  en: A signed digital document that ties a public key to a name, such as a website address, so others can trust whose key it is.
  da: Et signeret digitalt dokument, der knytter en offentlig nøgle til et navn, fx en webadresse, så andre kan stole på, hvis nøgle det er.
body:
  formal:
    en: A data record holding a public key, the identity it belongs to and a validity period, signed by a trusted body whose own signature can in turn be checked, forming a chain back to a body the device already trusts.
    da: En datapost med en offentlig nøgle, den identitet, den tilhører, og en gyldighedsperiode, signeret af en betroet udsteder, hvis egen signatur igen kan tjekkes, så der dannes en kæde tilbage til en udsteder, enheden allerede stoler på.
  plain:
    en: Like a passport — the photo and name are vouched for by a government you trust, so a stranger can accept that you are who you say.
    da: Som et pas — billede og navn er bekræftet af en stat, du stoler på, så en fremmed kan godtage, at du er den, du siger.
  inPractice:
    en: A company forgets to renew its website certificate; the next morning customers' browsers show a full-page warning and many leave the shop.
    da: En virksomhed glemmer at forny certifikatet til sit websted; næste morgen viser kundernes browsere en helsides advarsel, og mange forlader butikken.
  whyItMatters:
    en: Encryption is useless if you are talking privately to the wrong party; certificates are what prove a website or server is the real one.
    da: Kryptering er værdiløs, hvis man taler fortroligt med den forkerte; certifikater er det, der beviser, at et websted eller en server er den ægte.
edges:
  requires: [public-key-cryptography, identity]
  implements: [authentication, non-repudiation]
sources:
  - title: RFC 5280 — Internet X.509 Public Key Infrastructure Certificate and CRL Profile
    tier: standard
  - title: Paar & Pelzl, Understanding Cryptography
    tier: textbook
draft: true
