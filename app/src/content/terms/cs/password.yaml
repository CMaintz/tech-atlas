term:
  en: Password
  da: Adgangskode
aka:
  en: [passphrase]
  da: [password, kodeord, adgangsfrase]
domain: [cs]
cluster: identity
layer: identity
status: current
era: 1961
summary:
  en: A secret string of characters, known only to the user, typed in to prove they are who they claim to be.
  da: En hemmelig række tegn, som kun brugeren kender, og som indtastes for at bevise, at vedkommende er den, de udgiver sig for.
body:
  formal:
    en: A memorised secret used as a credential in authentication. The system should store it only in a scrambled form that cannot be turned back, so that not even the system itself can read it.
    da: En hemmelighed, som brugeren husker udenad, og som bruges som loginoplysning ved autentificering. Systemet bør kun gemme den i en forvansket form, der ikke kan regnes tilbage, så ikke engang systemet selv kan læse den.
  plain:
    en: Like a secret knock agreed with a friend — it works only while nobody else knows it, and it is useless once someone has overheard it.
    da: Som en hemmelig bankekode aftalt med en ven — den virker kun, så længe ingen andre kender den, og er værdiløs, når nogen har hørt den.
  inPractice:
    en: Following NIST guidance, the IT manager at a small Danish company stops forcing password changes every 90 days and instead requires long passphrases, checked against lists of known leaked passwords.
    da: Efter NIST's anbefaling holder IT-chefen i en mindre dansk virksomhed op med at kræve skift af adgangskode hver 90. dag og kræver i stedet lange adgangsfraser, der tjekkes mod lister over kendte lækkede adgangskoder.
  whyItMatters:
    en: Passwords are easy to guess, use again and trick out of people with phishing, so on their own they are weak — that weakness is why MFA exists.
    da: Adgangskoder er lette at gætte, genbruge og lokke ud af folk med phishing, så alene er de svage — netop derfor findes MFA.
edges:
  kind-of: [credential]
  used-with:
    - to: two-factor-authentication
      why:
        en: A password is usually the first of the two factors, combined with a code or a phone prompt.
        da: En adgangskode er typisk den første af de to faktorer, kombineret med en kode eller en anmodning på telefonen.
sources:
  - title: NIST SP 800-63B, Authentication and Lifecycle Management
    url: https://pages.nist.gov/800-63-3/sp800-63b.html
    tier: standard
    publisher: NIST
