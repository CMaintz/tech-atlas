term:
  en: Key management
  da: Nøglehåndtering
aka:
  en: [cryptographic key management]
  da: [håndtering af kryptografiske nøgler]
domain: [cs]
cluster: cryptography
layer: theory
status: current
summary:
  en: Looking after cryptographic keys over their whole life — making, storing, handing out, changing and finally destroying them.
  da: At passe på kryptografiske nøgler gennem hele deres levetid — at skabe, gemme, udlevere, skifte og til sidst destruere dem.
body:
  formal:
    en: The rules, roles and tools that govern each stage of a key's life — creation from a good random source, protected storage, controlled sharing and use, planned replacement, cancelling a leaked key and destroying retired ones — including who may do each step.
    da: De regler, roller og værktøjer, der styrer hvert trin i en nøgles liv — skabelse fra en god tilfældighedskilde, beskyttet opbevaring, kontrolleret deling og brug, planlagt udskiftning, tilbagekaldelse af en lækket nøgle og destruktion af nøgler, der er taget ud af brug — herunder hvem der må udføre hvert trin.
  plain:
    en: Like a building manager's key cabinet — keys are cut, numbered, signed out, changed when a tenant moves and melted down when a lock is replaced.
    da: Som viceværtens nøgleskab — nøgler bliver lavet, nummereret, kvitteret for, skiftet, når en lejer flytter, og smeltet om, når en lås udskiftes.
  inPractice:
    en: The IT security manager at a pension fund keeps its signing keys in sealed hardware that never lets them out, replaces them every year on a set date, and has a written plan for what to do if one is exposed.
    da: IT-sikkerhedschefen i en pensionskasse opbevarer signeringsnøglerne i forseglet hardware, der aldrig slipper dem ud, skifter dem hvert år på en fast dato og har en skriftlig plan for, hvad der skal ske, hvis én bliver afsløret.
  whyItMatters:
    en: Strong encryption fails the moment a key is stolen, lost or kept in use for too long, and most real failures come from careless handling of keys rather than from weak maths.
    da: Stærk kryptering svigter i det øjeblik, en nøgle bliver stjålet, mistet eller brugt for længe, og de fleste virkelige svigt skyldes sjusket håndtering af nøgler snarere end svag matematik.
edges:
  requires: [cryptographic-key, encryption]
  used-with:
    - to: secrets-management
      why:
        en: Secrets management stores and hands out keys to programs; key management sets the rules for how those keys are made, changed and retired.
        da: Håndtering af hemmeligheder gemmer og udleverer nøgler til programmer; nøglehåndtering fastsætter reglerne for, hvordan nøglerne skabes, skiftes og udfases.
      strength: normal
      confidence: high
    - public-key-infrastructure
  mitigates:
    - to: data-breach
      why:
        en: Keys that are kept apart from the data, changed often and cancelled quickly when leaked limit how much a thief can read.
        da: Nøgler, der holdes adskilt fra data, skiftes ofte og tilbagekaldes hurtigt ved læk, begrænser, hvor meget en tyv kan læse.
      strength: normal
      confidence: medium
sources:
  - title: NIST SP 800-57 Part 1 Rev. 5 — Recommendation for Key Management
    url: https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final
    tier: standard
    publisher: NIST
draft: true
