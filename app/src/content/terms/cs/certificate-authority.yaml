term:
  en: Certificate authority (CA)
  da: Certifikatudsteder (CA)
aka:
  en: [certification authority]
  da: []
domain: [cs]
cluster: cryptography
layer: theory
status: current
era: 1988
summary:
  en: A trusted body that checks who someone is and then signs digital certificates vouching that a public key belongs to them.
  da: En betroet instans, der kontrollerer identiteten på en ansøger og signerer digitale certifikater om, hvem en offentlig nøgle tilhører.
body:
  formal:
    en: The issuing party in a public key infrastructure. It signs each certificate with its own private key, keeps public lists of certificates it has cancelled before they expire, and is trusted because its root certificate is already stored in browsers and operating systems.
    da: Den udstedende part i en offentlig nøgleinfrastruktur. Den signerer hvert certifikat med sin egen private nøgle, offentliggør lister over certifikater, den har tilbagekaldt før udløb, og nyder tillid, fordi dens rodcertifikat allerede ligger i browsere og styresystemer.
  plain:
    en: Like the passport office — it checks your papers before issuing a passport, and border guards accept the passport because they trust the office, not because they know you.
    da: Som paskontoret — det tjekker dine papirer, før det udsteder et pas, og grænsevagter godtager passet, fordi de stoler på kontoret, ikke fordi de kender dig.
  inPractice:
    en: A regional hospital needs a new certificate for its patient portal. The CA checks that the region really controls the web address and signs the certificate, and patients' browsers then open the site without a warning.
    da: Et regionshospital skal have et nyt certifikat til sin patientportal. Udstederen kontrollerer, at regionen faktisk råder over webadressen, og signerer certifikatet, hvorefter patienternes browsere åbner siden uden advarsel.
  whyItMatters:
    en: The whole chain of trust rests on a small number of issuers; if one is broken into or careless, attackers can get real-looking certificates for sites that are not theirs.
    da: Hele tillidskæden hviler på et lille antal udstedere; bliver der brudt ind hos én af dem, eller er den uforsigtig, kan angribere få ægte udseende certifikater til websteder, der ikke er deres.
edges:
  part-of: [public-key-infrastructure]
  requires: [digital-certificate, digital-signature, identity]
  used-with:
    - to: tls
      why:
        en: TLS checks the other side's certificate, and that check only means something because a trusted CA signed it.
        da: TLS tjekker modpartens certifikat, og det tjek betyder kun noget, fordi en betroet CA har signeret det.
      strength: normal
      confidence: high
sources:
  - title: RFC 5280 — Internet X.509 Public Key Infrastructure Certificate and CRL Profile
    url: https://www.rfc-editor.org/rfc/rfc5280
    tier: standard
    publisher: IETF
  - title: NIST SP 800-32 — Introduction to Public Key Technology and the Federal PKI Infrastructure
    url: https://csrc.nist.gov/pubs/sp/800/32/final
    tier: standard
    publisher: NIST
