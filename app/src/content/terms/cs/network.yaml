term:
  en: Network
  da: Netværk
aka:
  en: [computer network]
  da: [computernetværk]
domain: [cs]
cluster: networking
layer: network
status: current
summary:
  en: A set of connected devices that can send data to each other over cables or radio signals.
  da: En samling forbundne enheder, der kan sende data til hinanden via kabler eller radiosignaler.
body:
  formal:
    en: A collection of devices joined by links, where each device can exchange data with the others by following shared rules for how messages are sent and delivered.
    da: En samling enheder forbundet af forbindelser, hvor hver enhed kan udveksle data med de andre ved at følge fælles regler for, hvordan beskeder sendes og leveres.
  plain:
    en: Like the roads between the houses in a town — once the roads are there, anyone can carry a letter from one door to another.
    da: Som vejene mellem husene i en by — når vejene først er der, kan hvem som helst bringe et brev fra én dør til en anden.
  inPractice:
    en: At a small accounting firm, the ten computers, the shared printer and the file server all sit on one office network, so staff can print, share client files and reach the internet through a single router.
    da: Hos et lille revisionsfirma er de ti computere, den fælles printer og filserveren på ét kontornetværk, så medarbejderne kan printe, dele kundemapper og komme på internettet gennem én router.
  whyItMatters:
    en: Almost every security control decides who may travel on which roads, so network boundaries are where most defences sit — and a flat network with no inner walls lets one attacker reach everything.
    da: Næsten alle sikkerhedskontroller afgør, hvem der må færdes på hvilke veje, så netværkets grænser er dér, hvor det meste forsvar sidder — og et netværk uden indre vægge lader én angriber nå alt.
