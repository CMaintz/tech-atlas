summary:
  en: A set of connected devices that can send data to each other over cables or radio signals.
  da: En samling forbundne enheder, der kan sende data til hinanden via kabler eller radiosignaler.
body:
  formal:
    en: A collection of devices joined by links, where each device can exchange data with the others by following shared rules for how messages are sent and delivered.
    da: En samling enheder forbundet af forbindelser, hvor hver enhed kan udveksle data med de andre ved at følge fælles regler for, hvordan beskeder sendes og leveres.
  plain:
    en: Like the roads between the houses in a town — once the roads are there, anyone can carry a letter from one door to another.
    da: Som vejene mellem husene i en by — når vejene først er der, kan hvem som helst bringe et brev fra én dør til en anden.
  inPractice:
    en: At a small accounting firm, the ten computers, the shared printer and the file server all sit on one office network, so staff can print, share client files and reach the internet through a single router.
    da: Hos et lille revisionsfirma er de ti computere, den fælles printer og filserveren på ét kontornetværk, så medarbejderne kan printe, dele kundemapper og komme på internettet gennem én router.
  whyItMatters:
    en: Almost every security control decides who may travel on which roads, so network boundaries are where most defences sit — and a flat network with no inner walls lets one attacker reach everything.
    da: Næsten alle sikkerhedskontroller afgør, hvem der må færdes på hvilke veje, så netværkets grænser er dér, hvor det meste forsvar sidder — og et netværk uden indre vægge lader én angriber nå alt.
deepDive:
  en: |-
    Networks are classified by scope (personal, local, metropolitan and wide area networks), by topology (bus, ring, star, mesh) and by how they share capacity. Telephone networks traditionally used circuit switching, reserving a fixed path and bandwidth for the whole call; computer networks use packet switching, where data is chopped into packets that share links through statistical multiplexing. Packet switching uses capacity far more efficiently for bursty traffic, at the price of variable delay and possible loss when queues overflow. Physically, a modern office LAN is a switched star: every device has its own link to a switch port, and switches are linked to each other and to routers.

    Inside a LAN, the link layer does the delivery. Ethernet (IEEE 802.3) and Wi-Fi (IEEE 802.11) carry frames addressed by 48-bit MAC addresses. A switch learns which MAC address sits behind which port and stores this in its forwarding (CAM) table; frames to unknown addresses and broadcasts are flooded to all ports in the same broadcast domain. VLANs (IEEE 802.1Q) split one physical switch fabric into several logical broadcast domains, and routers connect those domains at the IP layer. ARP (RFC 826) glues the layers together by finding the MAC address that belongs to an IPv4 address, and the Spanning Tree Protocol prevents the forwarding loops that redundant cabling would otherwise create.

    Performance is described by bandwidth (the link's capacity), throughput (what is actually achieved), latency (the sum of propagation, transmission, queuing and processing delay), jitter and packet loss. The bandwidth-delay product states how much data must be in flight to fill a path: at 1 Gbit/s and a 10 ms round-trip time it is about 1.25 MB, which is why transport protocols need large windows on fast, long paths.

    The local network was built on trust, and many classic attacks exploit that. ARP spoofing lets a host on the same segment claim another host's IP address and place itself in the middle; MAC flooding fills a switch's table so that it floods traffic to every port; rogue DHCP servers hand out a malicious gateway or DNS server. Managed switches counter these with dynamic ARP inspection, DHCP snooping and port security, and IEEE 802.1X lets a switch or access point require authentication before a device gets network access at all. At the design level, a flat network where every device can reach every other lets one compromised laptop scan and attack the whole organisation, which is why network segmentation, up-to-date network diagrams and an inventory of connected devices are basic controls.
  da: |-
    Netværk inddeles efter udstrækning (personlige, lokale, regionale og vidtstrakte netværk — PAN, LAN, MAN og WAN), efter topologi (bus, ring, stjerne, mesh) og efter, hvordan de deler kapaciteten. Telefonnettet brugte traditionelt kredsløbskobling, hvor en fast vej og båndbredde reserveres i hele samtalens varighed; computernetværk bruger pakkekobling, hvor data hakkes op i pakker, der deler forbindelserne gennem statistisk multipleksing. Pakkekobling udnytter kapaciteten langt bedre ved trafik, der kommer i ryk, men prisen er varierende forsinkelse og mulige tab, når køerne løber over. Fysisk er et moderne kontor-LAN en switchet stjerne: Hver enhed har sin egen forbindelse til en switchport, og switchene er forbundet med hinanden og med routere.

    Inden for et LAN er det linklaget, der står for leveringen. Ethernet (IEEE 802.3) og Wi-Fi (IEEE 802.11) bærer frames adresseret med 48-bit MAC-adresser. En switch lærer, hvilken MAC-adresse der sidder bag hvilken port, og gemmer det i sin forwarding-tabel (CAM-tabel); frames til ukendte adresser og broadcasts sendes ud på alle porte i det samme broadcast-domæne. VLAN'er (IEEE 802.1Q) deler ét fysisk switchnet op i flere logiske broadcast-domæner, og routere forbinder domænerne på IP-laget. ARP (RFC 826) binder lagene sammen ved at finde den MAC-adresse, der hører til en IPv4-adresse, og Spanning Tree Protocol forhindrer de løkker, som redundant kabling ellers ville skabe.

    Ydeevne beskrives med båndbredde (forbindelsens kapacitet), throughput (det, der faktisk opnås), latens (summen af udbredelses-, transmissions-, kø- og behandlingsforsinkelse), jitter og pakketab. Båndbredde-forsinkelses-produktet angiver, hvor mange data der skal være undervejs for at fylde en vej ud: Ved 1 Gbit/s og 10 ms rundturstid er det omkring 1,25 MB, og derfor har transportprotokoller brug for store vinduer på hurtige, lange strækninger.

    Det lokale netværk blev bygget på tillid, og mange klassiske angreb udnytter det. ARP-spoofing lader en maskine på samme segment påstå, at den har en anden maskines IP-adresse, og placere sig i midten; MAC-flooding fylder switchens tabel, så den sender trafik ud på alle porte; falske DHCP-servere uddeler en ondsindet gateway eller DNS-server. Administrerede switche modvirker det med dynamic ARP inspection, DHCP snooping og port security, og IEEE 802.1X lader en switch eller et adgangspunkt kræve autentifikation, før en enhed overhovedet får netværksadgang. På designniveau lader et fladt netværk, hvor alle enheder kan nå alle andre, én kompromitteret bærbar scanne og angribe hele organisationen — derfor er netværkssegmentering, opdaterede netværkstegninger og en oversigt over tilsluttede enheder grundlæggende kontroller.
