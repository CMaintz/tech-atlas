term:
  en: Access control
  da: Adgangskontrol
aka:
  en: []
  da: []
domain: [cs, security]
cluster: identity
layer: identity
status: current
summary:
  en: The rules and mechanisms that decide who may use which systems, data or rooms, and in what way.
  da: De regler og mekanismer, der afgør, hvem der må bruge hvilke systemer, data eller lokaler, og på hvilken måde.
body:
  formal:
    en: The enforcement of a policy on every request to use a resource, combining authentication (who is asking) with authorization (what they may do) to allow or refuse it. It covers digital resources and physical ones such as doors and server rooms.
    da: Håndhævelsen af en politik ved hver anmodning om at bruge en ressource, hvor autentificering (hvem spørger) og autorisation (hvad må vedkommende) tilsammen afgør, om den tillades eller afvises. Det gælder både digitale ressourcer og fysiske som døre og serverrum.
  plain:
    en: Like the whole door system of an office building — the key-card readers, the list of who may enter which floor, and the lock that actually holds the door shut.
    da: Som hele dørsystemet i en kontorbygning — kortlæserne, listen over, hvem der må komme på hvilken etage, og låsen, der faktisk holder døren lukket.
  inPractice:
    en: At a Danish regional hospital, nurses can open records only for patients on their own ward; the patient record system checks every lookup against that rule and logs each refused attempt.
    da: På et regionshospital kan sygeplejersker kun åbne journaler for patienter på deres eget afsnit; journalsystemet tjekker hvert opslag mod den regel og logger alle afviste forsøg.
  whyItMatters:
    en: It is where the confidentiality and integrity of data are actually enforced; without it, every security policy is just words on paper.
    da: Det er her, dataenes fortrolighed og integritet rent faktisk håndhæves; uden den er enhver sikkerhedspolitik blot ord på papir.
edges:
  kind-of: [control]
  requires: [authentication]
  contrasts-with:
    - to: access-management
      why:
        en: Access control is the mechanism that allows or refuses each request; access management is the ongoing process of granting, reviewing and removing that access.
        da: Adgangskontrol er mekanismen, der tillader eller afviser hver anmodning; adgangsstyring er den løbende proces med at tildele, gennemgå og fjerne adgangen.
      strength: primary
      confidence: high
  used-with:
    - least-privilege
    - ai-agent
    - to: vector-database
      why:
        en: "Retrieval must respect who may see which document: a vector database often holds copies of private files, so each lookup has to be filtered by the asking user's rights."
        da: 'Søgningen skal respektere, hvem der må se hvilket dokument: en vektordatabase rummer ofte kopier af fortrolige filer, så hvert opslag skal filtreres efter den spørgende brugers rettigheder.'
      strength: normal
      confidence: medium
sources:
  - title: NIST SP 800-162, Guide to Attribute Based Access Control (ABAC) Definition and Considerations
    url: https://doi.org/10.6028/NIST.SP.800-162
    tier: standard
    publisher: NIST
