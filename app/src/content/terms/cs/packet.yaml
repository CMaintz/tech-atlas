term:
  en: Packet
  da: Pakke
aka:
  en: [data packet]
  da: [datapakke]
domain: [cs]
cluster: networking
layer: network
status: current
era: 1965
summary:
  en: A small, labelled chunk of data that travels across a network on its own and is put back together at the end.
  da: En lille, mærket bid data, der rejser selvstændigt over et netværk og samles igen ved modtageren.
body:
  formal:
    en: A unit of data carried across a network, made of a header holding control details such as sender and receiver addresses, followed by the content itself. Each packet is routed separately, so packets from one message may take different paths.
    da: En enhed af data, der sendes over et netværk, bestående af et hoved med styreoplysninger som afsender- og modtageradresse efterfulgt af selve indholdet. Hver pakke sendes af sted for sig, så pakker fra samme besked kan tage forskellige veje.
  plain:
    en: Like sending a book by post one page at a time, each page in its own addressed envelope, and reassembling the book when all envelopes arrive.
    da: Som at sende en bog med posten én side ad gangen, hver side i sin egen adresserede kuvert, og samle bogen igen, når alle kuverterne er kommet frem.
  inPractice:
    en: During a video consultation between a doctor and a patient, the call is split into thousands of packets per second; if some are lost on the way, the picture freezes for a moment but the call carries on.
    da: Under en videokonsultation mellem en læge og en patient deles samtalen op i tusindvis af pakker i sekundet; går nogle tabt undervejs, fryser billedet et øjeblik, men samtalen fortsætter.
  whyItMatters:
    en: Firewalls and intrusion detection systems inspect traffic packet by packet, so the packet is the unit most network controls actually see and judge.
    da: Firewalls og IDS'er undersøger trafikken pakke for pakke, så pakken er den enhed, de fleste netværkskontroller faktisk ser og vurderer.
deepDive:
  en: |-
    Packet switching was conceived independently by Paul Baran at RAND in the early 1960s, as "message blocks" in a survivable distributed network, and by Donald Davies at the UK National Physical Laboratory, who coined the word "packet" in 1965; ARPANET put the idea into practice from 1969. Strictly, the names differ by layer: the link layer sends frames, IP sends packets (or datagrams), TCP sends segments and UDP sends datagrams. Each layer encapsulates the one above, so a typical Ethernet frame contains a 14-byte Ethernet header, an IPv4 header of 20 to 60 bytes, a TCP header of at least 20 bytes, the payload and a 4-byte frame check sequence.

    The IPv4 header (RFC 791) holds version and header length, DSCP/ECN bits for quality of service and congestion signalling, total length, an identification field, the DF and MF flags and fragment offset used for fragmentation, time to live (TTL), the protocol number of the payload (6 for TCP, 17 for UDP), a header checksum and the source and destination addresses. IPv6 (RFC 8200) replaces this with a fixed 40-byte header with a hop limit, a flow label and a chain of extension headers, and drops the header checksum. Every router decrements TTL or hop limit and discards the packet at zero, returning an ICMP Time Exceeded message; traceroute exploits exactly this to map the path.

    Packet size is bounded by the MTU of each link, 1500 bytes of payload on standard Ethernet, giving a TCP maximum segment size of 1460 bytes over IPv4 without options. IPv4 routers may fragment packets that do not have DF set, while in IPv6 only the sender fragments and every link must carry at least 1280 bytes. Path MTU Discovery (RFC 1191 for IPv4, RFC 8201 for IPv6) depends on ICMP "Fragmentation Needed" and "Packet Too Big" messages, so firewalls that block all ICMP create black holes: small requests work but large transfers hang, a classic symptom after adding VPN tunnels whose headers shrink the usable MTU.

    Packets can be lost, duplicated, reordered or corrupted, and IP itself does nothing about it; recovery is up to the transport or the application. Security tools work at different depths: stateless filters read only headers, stateful firewalls add flow context, and deep packet inspection reassembles streams to look at content. Fragmentation and overlapping segments have long been used to crash stacks (Teardrop, Ping of Death) and to evade intrusion detection systems that reassemble differently from the target host, a problem described by Ptacek and Newsham in 1998. For investigations, full packet capture (pcap files from tcpdump or Wireshark) gives complete evidence but is costly to store, whereas flow records such as NetFlow or IPFIX keep only metadata; with most traffic encrypted by TLS, metadata is increasingly all that can be inspected anyway.
  da: |-
    Pakkekobling blev udtænkt uafhængigt af Paul Baran hos RAND i begyndelsen af 1960'erne, som "message blocks" i et robust, decentralt netværk, og af Donald Davies på det britiske National Physical Laboratory, som fandt på ordet "packet" i 1965; ARPANET gjorde idéen til virkelighed fra 1969. Strengt taget skifter betegnelsen med laget: Linklaget sender frames, IP sender pakker (eller datagrammer), TCP sender segmenter, og UDP sender datagrammer. Hvert lag indkapsler laget ovenover, så en typisk Ethernet-frame indeholder en Ethernet-header på 14 byte, en IPv4-header på 20 til 60 byte, en TCP-header på mindst 20 byte, selve indholdet og en frame check sequence på 4 byte.

    IPv4-headeren (RFC 791) rummer version og headerlængde, DSCP/ECN-bits til servicekvalitet og signalering om trængsel, samlet længde, et identifikationsfelt, flagene DF og MF samt fragment offset til fragmentering, time to live (TTL), protokolnummeret for indholdet (6 for TCP, 17 for UDP), en header-checksum og kilde- og destinationsadresse. IPv6 (RFC 8200) erstatter det med en fast header på 40 byte med hop limit, flow label og en kæde af extension headers og har ingen header-checksum. Hver router tæller TTL eller hop limit ned og kasserer pakken ved nul med en ICMP Time Exceeded-besked tilbage; det er præcis det, traceroute udnytter til at kortlægge vejen.

    Pakkestørrelsen begrænses af hver forbindelses MTU, 1500 byte nyttelast på almindeligt Ethernet, hvilket giver en maksimal TCP-segmentstørrelse (MSS) på 1460 byte over IPv4 uden options. IPv4-routere må fragmentere pakker, hvor DF ikke er sat, mens det i IPv6 kun er afsenderen, der fragmenterer, og alle forbindelser skal kunne bære mindst 1280 byte. Path MTU Discovery (RFC 1191 for IPv4, RFC 8201 for IPv6) afhænger af ICMP-beskederne "Fragmentation Needed" og "Packet Too Big", så firewalls, der blokerer al ICMP, skaber sorte huller: Små forespørgsler virker, men store overførsler hænger - et klassisk symptom, efter at der er indført VPN-tunneler, hvis ekstra headere mindsker den brugbare MTU.

    Pakker kan gå tabt, blive dubleret, komme i forkert rækkefølge eller blive beskadiget, og IP gør ikke selv noget ved det; genopretning er transportlagets eller applikationens opgave. Sikkerhedsværktøjer arbejder i forskellige dybder: Tilstandsløse filtre læser kun headere, stateful firewalls tilføjer kendskab til flowet, og deep packet inspection samler strømme igen for at se på indholdet. Fragmentering og overlappende segmenter er længe blevet brugt til at få netværksstakke til at gå ned (Teardrop, Ping of Death) og til at undgå IDS'er, der samler pakkerne anderledes end målmaskinen - et problem, Ptacek og Newsham beskrev i 1998. Til efterforskning giver fuld pakkeopsamling (pcap-filer fra tcpdump eller Wireshark) det komplette bevis, men er dyr at opbevare, mens flow-data som NetFlow eller IPFIX kun gemmer metadata; og når det meste trafik alligevel er krypteret med TLS, er metadata i stigende grad det eneste, der kan undersøges.
