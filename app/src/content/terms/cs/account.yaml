term:
  en: User account
  da: Brugerkonto
aka:
  en: [account]
  da: [konto]
domain: [cs]
cluster: identity
layer: identity
status: current
summary:
  en: A record in a system that lets a particular person or program log in, and holds the permissions it has been given.
  da: En registrering i et system, der lader en bestemt person eller et program logge ind, og som rummer de tildelte rettigheder.
body:
  formal:
    en: An entry in an operating system or application that links one identity to its credentials, settings and permissions. One person may have several accounts, and some accounts belong to programs rather than people.
    da: En post i et styresystem eller program, der knytter én identitet til dens loginoplysninger, indstillinger og rettigheder. Én person kan have flere konti, og nogle konti tilhører programmer frem for mennesker.
  plain:
    en: Like a membership card at a gym — the card is not you, but it is how the gym knows you, what you have paid for and which classes you may join.
    da: Som et medlemskort i et fitnesscenter — kortet er ikke dig, men det er sådan, centret kender dig og ved, hvad du har betalt for, og hvilke hold du må deltage i.
  inPractice:
    en: Before the yearly audit, the IT manager at a small Danish company compares the list of active user accounts with HR's staff list and finds six accounts still open for people who left last year.
    da: Før den årlige revision sammenligner IT-chefen i en mindre dansk virksomhed listen over aktive brugerkonti med HR's medarbejderliste og finder seks konti, der stadig er åbne for folk, som stoppede sidste år.
  whyItMatters:
    en: Every action is recorded against an account, so accounts are the basis for both access and accountability; shared or forgotten accounts break both and give attackers an unnoticed way in.
    da: Alle handlinger registreres på en konto, så konti er grundlaget for både adgang og ansvar; delte eller glemte konti undergraver begge dele og giver angribere en ubemærket vej ind.
edges:
  contrasts-with:
    - to: identity
      why:
        en: An identity is who someone is; an account is one login they hold in one system. One identity can have many accounts.
        da: En identitet er, hvem nogen er; en konto er ét login, vedkommende har i ét system. Én identitet kan have mange konti.
      strength: primary
      confidence: high
  used-with:
    - credential
    - to: process
      why:
        en: Every process runs on behalf of an account and gets that account's rights.
        da: Hver proces kører på vegne af en konto og får kontoens rettigheder.
