term:
  en: Encryption
  da: Kryptering
aka:
  en: [enciphering]
  da: [chiffrering]
domain: [cs, security]
cluster: networking
layer: data
status: current
summary:
  en: Scrambling data with a secret so only someone holding the matching secret can read it.
  da: At forvrænge data med en hemmelighed, så kun den, der har den tilsvarende hemmelighed, kan læse dem.
body:
  formal:
    en: A mathematical process that transforms readable data into unreadable form using a secret value, such that only a holder of the right secret value can reverse it.
    da: En matematisk proces, der omdanner læsbare data til ulæselig form ved hjælp af en hemmelig værdi, så kun den, der har den rette hemmelige værdi, kan vende processen om.
  plain:
    en: Like writing a letter in a secret code only you and a friend know — anyone who steals the letter sees only gibberish.
    da: Som at skrive et brev i en hemmelig kode, kun du og en ven kender — enhver, der stjæler brevet, ser kun volapyk.
  inPractice:
    en: A lost company laptop has an encrypted disk, so the finder cannot read the customer files on it without the owner's password.
    da: En tabt firmabærbar har en krypteret disk, så finderen ikke kan læse kundefilerne på den uden ejerens adgangskode.
  whyItMatters:
    en: It keeps data confidential even after it is stolen or overheard, which can turn a serious data breach into a minor incident.
    da: Den holder data fortrolige, selv efter de er stjålet eller aflyttet, hvilket kan gøre et alvorligt databrud til en mindre hændelse.
edges:
  kind-of: [control]
  implements:
    - to: confidentiality
      why:
        en: Encrypted data stays unreadable to anyone without the secret, which is exactly what confidentiality asks for.
        da: Krypterede data forbliver ulæselige for alle uden hemmeligheden, hvilket netop er, hvad fortrolighed kræver.
      strength: primary
      confidence: high
  mitigates:
    - to: data-breach
      why:
        en: Stolen data that is encrypted is useless to the thief as long as the secret stays safe.
        da: Stjålne data, der er krypterede, er værdiløse for tyven, så længe hemmeligheden holdes sikker.
      strength: primary
      confidence: high
  used-with: [tls, vpn]
  contrasts-with:
    - to: hashing
      why:
        en: Encryption can be reversed by whoever holds the key; hashing is one-way and can never give the original data back.
        da: Kryptering kan vendes om af den, der har nøglen; hashing er envejs og kan aldrig give de oprindelige data tilbage.
      strength: primary
      confidence: high
