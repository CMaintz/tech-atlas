term:
  en: JSON
  da: JSON
aka:
  en: [JavaScript Object Notation]
  da: [JavaScript Object Notation]
domain: [cs]
cluster: web
layer: application
status: current
era: 2001
summary:
  en: A simple text format for writing down data as named values and lists, easy for both people and programs to read.
  da: Et enkelt tekstformat til at skrive data ned som navngivne værdier og lister, let at læse for både mennesker og programmer.
body:
  formal:
    en: A text format built from just a few pieces — objects of name and value pairs in curly brackets, lists in square brackets, and values that are text, numbers, true, false or null — that can be nested inside each other.
    da: Et tekstformat bygget af ganske få dele — objekter med par af navn og værdi i { }, lister i [ ] og værdier, der er tekst, tal, true, false eller null — som kan lægges inden i hinanden.
  plain:
    en: Like a neatly filled-in form where every box has a label, so anyone picking it up knows which answer belongs to which question.
    da: Som en pænt udfyldt blanket, hvor hvert felt har en overskrift, så enhver, der samler den op, ved, hvilket svar der hører til hvilket spørgsmål.
  inPractice:
    en: A developer at a region looks into a fault in a patient app and sees that the server's JSON reply for a booking has the field for the appointment time left empty, so the app shows no time.
    da: En udvikler i en region undersøger en fejl i en patientapp og ser, at serverens JSON-svar for en booking har feltet med aftaletidspunktet tomt, så appen ikke viser noget tidspunkt.
  whyItMatters:
    en: Because almost every language can read and write it, it has become the common way programs swap data over the web; reading untrusted JSON carelessly is also a known source of flaws.
    da: Fordi næsten alle sprog kan læse og skrive det, er det blevet den almindelige måde, programmer udveksler data på over nettet; at læse JSON fra ukendte kilder uden omtanke er også en kendt kilde til fejl.
edges:
  used-with:
    - to: rest-api
      why:
        en: Most REST APIs send and receive their data as JSON.
        da: De fleste REST API'er sender og modtager deres data som JSON.
      strength: primary
      confidence: high
    - web-application
    - to: structured-output
      why:
        en: JSON is the usual shape a structured-output reply is forced into.
        da: JSON er den sædvanlige form, et struktureret output tvinges ind i.
      strength: normal
      confidence: medium
    - to: model-context-protocol
      why:
        en: MCP messages are written as JSON, so any app or server can read the other side's requests and answers with ordinary tools.
        da: MCP-beskeder skrives som JSON, så enhver app eller server kan læse den anden sides anmodninger og svar med almindelige værktøjer.
      strength: normal
      confidence: medium
sources:
  - title: RFC 8259 — The JavaScript Object Notation (JSON) Data Interchange Format
    tier: standard
    publisher: IETF
    url: https://www.rfc-editor.org/rfc/rfc8259
  - title: ECMA-404 — The JSON Data Interchange Syntax
    tier: standard
    publisher: Ecma International
    url: https://ecma-international.org/publications-and-standards/standards/ecma-404/
draft: true
