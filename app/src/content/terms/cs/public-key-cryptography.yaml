term:
  en: Public-key cryptography
  da: Asymmetrisk kryptografi (public key)
aka:
  en: [asymmetric cryptography, asymmetric encryption]
  da: [public key-kryptografi, asymmetrisk kryptering]
domain: [cs]
cluster: cryptography
layer: theory
status: current
era: 1976
summary:
  en: Encryption that uses a pair of keys — one shared openly, one kept private — so strangers can protect data for you without a shared secret.
  da: Kryptering med et nøglepar — én delt åbent, én holdt privat — så fremmede kan beskytte data til dig uden en fælles hemmelighed.
body:
  formal:
    en: A family of methods in which each party has a linked pair of keys; data locked with the public key can only be unlocked with the private key, and anything signed with the private key can be checked by anyone holding the public key.
    da: En familie af metoder, hvor hver part har et sammenhørende nøglepar; data låst med den offentlige nøgle kan kun låses op med den private nøgle, og alt signeret med den private nøgle kan tjekkes af alle, der har den offentlige nøgle.
  plain:
    en: Like a mailbox with a slot — anyone can drop a letter in, but only the owner has the key to take letters out.
    da: Som en postkasse med en sprække — alle kan putte et brev i, men kun ejeren har nøglen til at tage brevene ud.
  inPractice:
    en: When a browser connects to a bank for the first time, TLS uses public-key cryptography so the two can agree on a secret without ever having met.
    da: Når en browser forbinder til en bank for første gang, bruger TLS asymmetrisk kryptografi, så de to kan aftale en hemmelighed uden at have mødt hinanden før.
  whyItMatters:
    en: It solves the problem of sharing a secret safely with strangers, and makes digital signatures possible, which is what lets you trust who is on the other end.
    da: Den løser problemet med at dele en hemmelighed sikkert med fremmede og gør digitale signaturer mulige — det er det, der lader dig stole på, hvem der er i den anden ende.
edges:
  kind-of: [encryption]
  requires: [cryptographic-key]
  used-with: [tls]
