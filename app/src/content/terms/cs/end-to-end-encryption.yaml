term:
  en: End-to-end encryption
  da: End-to-end-kryptering
aka:
  en: [E2EE]
  da: [E2EE]
domain: [cs, security]
cluster: cryptography
layer: application
status: current
summary:
  en: Scrambling a message on the sender's device so that only the receiver's device can read it, not even the service carrying it.
  da: At forvrænge en besked på afsenderens enhed, så kun modtagerens enhed kan læse den — heller ikke tjenesten, der bringer den frem.
body:
  formal:
    en: A design in which data is encrypted on the sending device with keys held only by the people talking, so every server in between, including the provider's own, passes along data it has no key to read.
    da: Et design, hvor data krypteres på den afsendende enhed med nøgler, som kun de samtalende parter har, så alle servere undervejs, også udbyderens egne, sender data videre, som de ikke har nøgle til at læse.
  plain:
    en: Like posting a locked box that only your friend has the key to — the postal service carries it all the way but can never open it.
    da: Som at sende en aflåst kasse, som kun din ven har nøglen til — posten bringer den hele vejen, men kan aldrig åbne den.
  inPractice:
    en: When a chat app uses end-to-end encryption, a court order to the company cannot produce readable messages, because the company never had the keys.
    da: Når en chatapp bruger end-to-end-kryptering, kan en retskendelse mod firmaet ikke give læsbare beskeder, fordi firmaet aldrig har haft nøglerne.
  whyItMatters:
    en: It removes the need to trust the service provider, so a break-in at the provider or a curious member of its staff cannot expose what users say.
    da: Den fjerner behovet for at stole på tjenesteudbyderen, så et indbrud hos udbyderen eller en nysgerrig medarbejder ikke kan afsløre, hvad brugerne siger.
edges:
  requires: [public-key-cryptography, encryption]
  implements: [confidentiality]
  contrasts-with:
    - to: tls
      why:
        en: TLS protects data only on each hop and the server reads it in the middle; end-to-end encryption keeps it closed all the way from sender to receiver.
        da: TLS beskytter kun data på hver strækning, og serveren læser dem undervejs; end-to-end-kryptering holder dem lukkede hele vejen fra afsender til modtager.
      strength: primary
      confidence: high
  mitigates:
    - to: data-breach
      why:
        en: A break-in at the provider's servers finds only scrambled messages, because the keys live on the users' devices.
        da: Et indbrud på udbyderens servere finder kun forvrængede beskeder, fordi nøglerne ligger på brugernes enheder.
      strength: normal
      confidence: medium
sources:
