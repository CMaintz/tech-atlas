  part-of: [encryption]
  contrasts-with:
    - to: password
      why:
        en: A password is chosen and remembered by a person; a key is a long random value made and stored by a machine.
        da: En adgangskode vælges og huskes af et menneske; en nøgle er en lang tilfældig værdi, der skabes og gemmes af en maskine.
      strength: normal
      confidence: high
