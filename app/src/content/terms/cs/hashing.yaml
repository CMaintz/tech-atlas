term:
  en: Hashing
  da: Hashing
aka:
  en: [hash function, cryptographic hash]
  da: [hashfunktion, kryptografisk hash]
domain: [cs]
cluster: cryptography
layer: theory
status: current
summary:
  en: Turning any amount of data into a short, fixed-length fingerprint that changes completely if even one character changes.
  da: At lave en vilkårlig mængde data om til et kort fingeraftryk af fast længde, der ændrer sig helt, hvis blot ét tegn ændres.
body:
  formal:
    en: A one-way calculation that maps input of any size to a fixed-size value; it cannot be reversed, and it is practically impossible to find two different inputs with the same result.
    da: En envejsberegning, der omsætter data af enhver størrelse til en værdi af fast størrelse; den kan ikke vendes om, og det er praktisk talt umuligt at finde to forskellige input med samme resultat.
  plain:
    en: Like a fingerprint — it identifies a person without containing the person, and you cannot rebuild someone from their fingerprint.
    da: Som et fingeraftryk — det identificerer en person uden at indeholde personen, og man kan ikke genskabe nogen ud fra deres fingeraftryk.
  inPractice:
    en: A website stores only the hash of each password; at login it hashes what the user typed and compares, so a stolen database holds no passwords anyone can read.
    da: Et websted gemmer kun hashen af hver adgangskode; ved login hasher det det indtastede og sammenligner, så en stjålen database ikke rummer læsbare adgangskoder.
  whyItMatters:
    en: It is how systems spot tampering with files and messages, and how they check passwords without having to keep them.
    da: Det er sådan, systemer opdager manipulation af filer og beskeder, og sådan de tjekker adgangskoder uden at skulle gemme dem.
edges:
  implements:
    - to: integrity
      why:
        en: Comparing fingerprints before and after shows at once whether data was changed.
        da: Ved at sammenligne fingeraftryk før og efter ses det straks, om data er blevet ændret.
      strength: primary
      confidence: high
  used-with: [password, tls]
sources:
  - title: NIST FIPS 180-4 — Secure Hash Standard (SHS)
    tier: standard
  - title: Paar & Pelzl, Understanding Cryptography
    tier: textbook
