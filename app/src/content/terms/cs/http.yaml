term:
  en: HTTP
  da: HTTP
aka:
  en: [Hypertext Transfer Protocol]
  da: [Hypertext Transfer Protocol]
domain: [cs]
cluster: web
layer: network
status: current
era: 1991
summary:
  en: The request-and-answer rules a web browser and a server follow to fetch pages, pictures and data across the internet.
  da: De regler for forespørgsel og svar, som en webbrowser og en server følger for at hente sider, billeder og data over internettet.
body:
  formal:
    en: A protocol in which a client sends a request naming a resource and a method, such as GET or POST, and the server replies with a status code and content. Each request stands alone, so the server keeps no memory between them by itself; newer versions carry the same messages in faster forms.
    da: En protokol, hvor en klient sender en forespørgsel med en ressource og en metode, fx GET eller POST, og serveren svarer med en statuskode og indhold. Hver forespørgsel står alene, så serveren husker ikke selv noget mellem dem; nyere versioner bærer de samme beskeder i hurtigere former.
  plain:
    en: Like ordering at a counter by slip of paper — you write what you want, hand it over, and get back either the item or a note saying why not.
    da: Som at bestille ved en disk med en seddel — du skriver, hvad du vil have, rækker den over og får enten varen eller en besked om, hvorfor ikke.
  inPractice:
    en: A citizen clicks an old link to a page on the municipality’s website. The browser sends a GET request, and because the page has since been deleted, the server answers with status 404 instead of the page.
    da: En borger klikker på et gammelt link til en side på kommunens hjemmeside. Browseren sender en GET-forespørgsel, og fordi siden er blevet slettet, svarer serveren med status 404 i stedet for siden.
  whyItMatters:
    en: Almost everything on the web, from pages to apps talking to each other, travels over it; on its own it is sent as open text that anyone on the route can read or change, which is why HTTPS exists.
    da: Næsten alt på nettet, fra sider til apps, der taler sammen, sendes med protokollen; alene går den som åben tekst, som alle på ruten kan læse eller ændre, og derfor findes HTTPS.
edges:
  kind-of: [protocol]
  requires: [tcp-ip, client, server]
  used-with:
    - to: url
      why:
        en: Every HTTP request names the resource it wants by its URL.
        da: Hver HTTP-forespørgsel angiver den ressource, den vil have, med dens URL.
      strength: primary
      confidence: high
    - json
sources:
  - title: RFC 9110 — HTTP Semantics
    url: https://www.rfc-editor.org/rfc/rfc9110
    tier: standard
    publisher: IETF
  - title: 'Kurose & Ross, Computer Networking: A Top-Down Approach'
    tier: textbook
draft: true
