questions:
  - id: risk-ale-webshop-ransomware
    terms:
      - security/quantitative-risk-analysis
      - security/likelihood
      - security/impact
    kind: scenario
    stem:
      en: >-
        A Danish SMB runs a webshop whose systems and data are valued at DKK 2,000,000.
        The IT manager estimates that a ransomware attack would destroy about 20% of that
        value each time it happens, and that such an attack is expected about once every
        four years. Using SLE × ARO, what is the annualised loss expectancy (ALE)?
      da: >-
        En dansk SMV driver en webshop, hvis systemer og data er vurderet til 2.000.000
        kr. It-chefen skønner, at et ransomwareangreb vil ødelægge omkring 20 % af den
        værdi, hver gang det sker, og at man kan forvente sådan et angreb cirka én gang
        hvert fjerde år. Hvad er det forventede årlige tab (ALE), beregnet som SLE × ARO?
    options:
      - en: DKK 400,000 per year
        da: 400.000 kr. om året
      - en: DKK 1,600,000 per year
        da: 1.600.000 kr. om året
      - en: DKK 100,000 per year
        da: 100.000 kr. om året
      - en: DKK 500,000 per year
        da: 500.000 kr. om året
    answer: 2
    explanation:
      en: >-
        The single loss expectancy is asset value × exposure factor: DKK 2,000,000 × 20% =
        DKK 400,000 per attack. Once every four years is an annual rate of occurrence of
        0.25, so ALE = 400,000 × 0.25 = DKK 100,000 per year. DKK 400,000 is only the SLE
        — the loss from one attack, not the yearly average. DKK 1,600,000 multiplies by 4
        instead of dividing, reading "every four years" as four times a year. DKK 500,000
        applies the frequency to the whole asset value and skips the 20% exposure factor.
      da: >-
        Det enkelte tab (SLE) er aktivets værdi × eksponeringsfaktoren: 2.000.000 kr. × 20
        % = 400.000 kr. pr. angreb. Én gang hvert fjerde år svarer til en årlig hyppighed
        (ARO) på 0,25, så ALE = 400.000 × 0,25 = 100.000 kr. om året. 400.000 kr. er kun
        SLE — tabet ved ét angreb, ikke gennemsnittet pr. år. 1.600.000 kr. ganger med 4 i
        stedet for at dividere, som om angrebet skete fire gange om året. 500.000 kr.
        bruger hyppigheden på hele aktivets værdi og springer eksponeringsfaktoren på 20 %
        over.
    difficulty: 2
    sources:
      - title: Annualized loss expectancy — Wikipedia
        url: https://en.wikipedia.org/wiki/Annualized_loss_expectancy
        tier: reference
      - title: >-
          NISTIR 8286A — Identifying and Estimating Cybersecurity Risk for Enterprise Risk
          Management
        url: https://nvlpubs.nist.gov/nistpubs/ir/2021/NIST.IR.8286A.pdf
        tier: official-doc
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-cyber-insurance-treatment
    terms:
      - security/risk-transfer
      - security/risk-treatment
    kind: scenario
    stem:
      en: >-
        A Danish engineering firm with 40 employees cannot afford a full-time security
        team. After its risk assessment, management signs a cyber insurance policy that
        pays for forensic help, restoring systems and lost revenue if the firm is hit by
        ransomware. Which way of handling the risk has management chosen?
      da: >-
        En dansk ingeniørvirksomhed med 40 ansatte har ikke råd til et fuldtids
        sikkerhedsteam. Efter risikoanalysen tegner ledelsen en cyberforsikring, der betaler
        for forensisk bistand, genetablering af systemer og tabt omsætning, hvis
        virksomheden rammes af ransomware. Hvilken måde at håndtere risikoen på har
        ledelsen valgt?
    options:
      - en: Risk mitigation
        da: Risikoreduktion
      - en: Risk transfer
        da: Risikooverførsel
      - en: Risk acceptance
        da: Risikoaccept
      - en: Risk avoidance
        da: Risikoundgåelse
    answer: 1
    explanation:
      en: >-
        Insurance moves the financial cost of the incident to another party, which is risk
        transfer (also called sharing). It is not mitigation: the policy does not make a
        ransomware attack any less likely or less disruptive — only the bill is paid by
        someone else. It is not acceptance either, because the firm has acted on the risk
        instead of simply living with it. Avoidance would mean stopping the activity that
        creates the risk, and the firm keeps running its systems. Note that the firm still
        owns the operational and legal consequences, such as its GDPR duties.
      da: >-
        En forsikring flytter de økonomiske omkostninger ved hændelsen over på en anden
        part, og det er risikooverførsel (også kaldet deling). Det er ikke risikoreduktion:
        policen gør hverken et ransomwareangreb mindre sandsynligt eller mindre
        forstyrrende — det er kun regningen, som en anden betaler. Det er heller ikke
        accept, for virksomheden har gjort noget ved risikoen i stedet for bare at leve med
        den. Undgåelse ville betyde, at man stopper den aktivitet, der skaber risikoen, og
        virksomheden bruger fortsat sine systemer. Virksomheden bærer stadig de
        driftsmæssige og juridiske konsekvenser, fx sine forpligtelser efter GDPR.
    difficulty: 1
    sources:
      - title: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments
        url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-30r1.pdf
        tier: standard
      - title: ISO 31000 — Wikipedia
        url: https://en.wikipedia.org/wiki/ISO_31000
        tier: reference
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-residual-after-mfa
    terms:
      - security/residual-risk
      - security/risk-acceptance
      - security/risk-appetite
    kind: scenario
    stem:
      en: >-
        A municipality has rolled out MFA and endpoint detection after its risk assessment
        rated "account takeover via phishing" as high. At the next management meeting, the
        head of department asks the information security coordinator whether the risk can
        now be removed from the risk register. What is the best answer?
      da: >-
        En kommune har indført MFA og endpoint detection, efter at risikoanalysen vurderede
        "kontoovertagelse via phishing" som høj. På næste ledelsesmøde spørger
        afdelingschefen informationssikkerhedskoordinatoren, om risikoen nu kan fjernes fra
        risikoregistret. Hvad er det bedste svar?
    options:
      - en: >-
          Yes — once the planned controls are in place and meet the policy, the risk is
          gone
        da: >-
          Ja — når de planlagte kontroller er på plads og lever op til politikken, er
          risikoen væk
      - en: >-
          No — but the remaining risk now belongs to the IT supplier that runs the controls
        da: >-
          Nej — men den tilbageværende risiko ligger nu hos den it-leverandør, der driver
          kontrollerne
      - en: >-
          Yes — what is left only needs to be recorded again if an incident actually occurs
        da: >-
          Ja — det, der er tilbage, skal først registreres igen, hvis en hændelse faktisk
          sker
      - en: >-
          No — the remaining risk must be re-rated and then accepted by its owner or treated
          further
        da: >-
          Nej — den tilbageværende risiko skal vurderes igen og derefter accepteres af
          ejeren eller håndteres yderligere
    answer: 3
    explanation:
      en: >-
        No control removes a risk completely: MFA can be bypassed, for example by MFA
        fatigue or token theft, so some residual risk remains. It stays in the register
        with a new rating, is compared with the organisation's risk appetite, and is then
        either formally accepted by the risk owner or treated further. Saying the risk is
        gone because the controls meet the policy confuses compliance with risk. Running
        controls through a supplier does not move ownership of the risk to the supplier.
        Waiting for an incident before recording the leftover risk defeats the purpose of
        the register.
      da: >-
        Ingen kontrol fjerner en risiko helt: MFA kan omgås, fx ved MFA-træthed eller
        tyveri af tokens, så der er stadig en residual risiko. Den bliver i registret med
        en ny vurdering, holdes op mod organisationens risikoappetit og bliver derefter
        enten accepteret formelt af risikoejeren eller håndteret yderligere. At sige, at
        risikoen er væk, fordi kontrollerne lever op til politikken, blander compliance
        sammen med risiko. At en leverandør driver kontrollerne, flytter ikke ejerskabet af
        risikoen over på leverandøren. At vente med at registrere den tilbageværende risiko,
        til der sker en hændelse, underminerer hele formålet med registret.
    difficulty: 2
    sources:
      - title: NIST CSRC Glossary — residual risk
        url: https://csrc.nist.gov/glossary/term/residual_risk
        tier: official-doc
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-appetite-utility-two-risks
    terms:
      - security/risk-appetite
      - security/risk-acceptance
      - security/risk-treatment
    kind: scenario
    stem:
      en: >-
        The board of a Danish water utility has approved this risk appetite: "We accept up
        to medium risk for administrative systems, but only low risk for systems that
        control the water supply." The latest assessment rates two risks as medium: one in
        the HR system and one in the SCADA system that controls the pumping stations. Which
        decision fits the board's statement?
      da: >-
        Bestyrelsen i et dansk vandforsyningsselskab har godkendt denne risikoappetit: "Vi
        accepterer op til middel risiko for administrative systemer, men kun lav risiko for
        systemer, der styrer vandforsyningen." Den seneste analyse vurderer to risici som
        middel: én i HR-systemet og én i det SCADA-system, der styrer pumpestationerne.
        Hvilken beslutning passer til bestyrelsens udmelding?
    options:
      - en: >-
          Accept the HR risk on record, and treat the SCADA risk further until it is low
        da: >-
          Acceptér HR-risikoen skriftligt, og håndtér SCADA-risikoen yderligere, til den er
          lav
      - en: >-
          Treat both risks further, since any medium risk lies above the stated appetite
        da: >-
          Håndtér begge risici yderligere, da enhver middel risiko ligger over appetitten
      - en: >-
          Accept both risks on record, since they have the same rating on the same scale
        da: >-
          Acceptér begge risici skriftligt, da de har samme vurdering på samme skala
      - en: >-
          Insure both risks, since insured risks no longer count against the appetite
        da: >-
          Forsikr begge risici, da forsikrede risici ikke længere tæller med i appetitten
    answer: 0
    explanation:
      en: >-
        Risk appetite is the amount and type of risk leadership is willing to accept, and it
        can differ between kinds of assets. A medium risk in the HR system lies within the
        stated line, so it can be formally accepted; a medium risk in SCADA lies above the
        "low" line for water supply and needs further treatment. Treating both ignores that
        the board set a higher limit for administrative systems. Accepting both ignores that
        the limit depends on the type of system, not only the rating. Insurance can cover
        costs, but it does not keep the water running, so it does not bring the SCADA risk
        within the appetite.
      da: >-
        Risikoappetit er den mængde og type risiko, ledelsen er villig til at acceptere, og
        den kan være forskellig for forskellige slags aktiver. En middel risiko i
        HR-systemet ligger inden for den udmeldte grænse og kan accepteres formelt; en
        middel risiko i SCADA ligger over grænsen "lav" for vandforsyningen og skal
        håndteres yderligere. At håndtere begge overser, at bestyrelsen har sat en højere
        grænse for administrative systemer. At acceptere begge overser, at grænsen afhænger
        af systemtypen og ikke kun af vurderingen. En forsikring kan dække udgifter, men den
        holder ikke vandet flydende, så den bringer ikke SCADA-risikoen inden for
        appetitten.
    difficulty: 3
    sources:
      - title: NIST CSRC Glossary — risk appetite
        url: https://csrc.nist.gov/glossary/term/risk_appetite
        tier: official-doc
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-heat-map-bank-priority
    terms:
      - security/heat-map
      - security/likelihood
      - security/impact
      - security/risk-assessment
    kind: scenario
    stem:
      en: >-
        A Danish bank places its IT risks on a 5 × 5 heat map, with likelihood (1–5) on one
        axis and impact (1–5) on the other. A cell's colour is set by likelihood × impact,
        running from green at the low end to red at the top. Which of these risks lands
        furthest into the red and should be handled first?
      da: >-
        En dansk bank placerer sine it-risici på et 5 × 5 heat-map med sandsynlighed (1–5)
        på den ene akse og konsekvens (1–5) på den anden. Feltets farve bestemmes af
        sandsynlighed × konsekvens og går fra grøn i den lave ende til rød i toppen. Hvilken
        af disse risici ligger længst inde i det røde og bør håndteres først?
    options:
      - en: 'Phishing that compromises a mailbox: likelihood 5, impact 2'
        da: 'Phishing, der kompromitterer en postkasse: sandsynlighed 5, konsekvens 2'
      - en: "Fire in the bank's own data centre: likelihood 1, impact 5"
        da: 'Brand i bankens eget datacenter: sandsynlighed 1, konsekvens 5'
      - en: 'An insider leaking customer data: likelihood 2, impact 4'
        da: 'En insider, der lækker kundedata: sandsynlighed 2, konsekvens 4'
      - en: 'Ransomware on the payment platform: likelihood 4, impact 5'
        da: 'Ransomware på betalingsplatformen: sandsynlighed 4, konsekvens 5'
    answer: 3
    explanation:
      en: >-
        On this map the score is likelihood × impact, so ransomware on the payment platform
        scores 4 × 5 = 20, the highest by far and the reddest cell. Phishing is the most
        likely event, but its low impact gives only 5 × 2 = 10. The data-centre fire has
        the highest impact, yet it is so unlikely that it scores just 1 × 5 = 5. The insider
        leak scores 2 × 4 = 8. A heat map is useful exactly because it combines both
        factors: looking at only one of them — the most frequent or the most harmful event —
        gives the wrong priority.
      da: >-
        På dette heat-map er scoren sandsynlighed × konsekvens, så ransomware på
        betalingsplatformen får 4 × 5 = 20, klart det højeste og det rødeste felt. Phishing
        er den mest sandsynlige hændelse, men den lave konsekvens giver kun 5 × 2 = 10.
        Branden i datacentret har den største konsekvens, men er så usandsynlig, at den kun
        får 1 × 5 = 5. Insiderlækket får 2 × 4 = 8. Et heat-map er netop nyttigt, fordi det
        kombinerer begge faktorer: kigger man kun på den ene — den hyppigste eller den mest
        skadelige hændelse — prioriterer man forkert.
    difficulty: 1
    sources:
      - title: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments (Table I-2)
        url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-30r1.pdf
        tier: standard
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-process-order-iso31000
    terms:
      - security/risk-management
      - security/risk-identification
      - security/risk-assessment
    kind: order
    stem:
      en: >-
        An information security coordinator at a Danish region is setting up the region's
        risk management process along the lines of ISO 31000 and ISO/IEC 27005. In which
        order do the main steps come?
      da: >-
        En informationssikkerhedskoordinator i en dansk region skal opbygge regionens
        risikostyringsproces efter ISO 31000 og ISO/IEC 27005. I hvilken rækkefølge kommer
        hovedtrinene?
    options:
      - en: Establish context → Identify → Evaluate → Analyse → Treat
        da: Fastlæg kontekst → Identificér → Vurdér → Analysér → Håndtér
      - en: Establish context → Identify → Analyse → Evaluate → Treat
        da: Fastlæg kontekst → Identificér → Analysér → Vurdér → Håndtér
      - en: Identify → Establish context → Analyse → Treat → Evaluate
        da: Identificér → Fastlæg kontekst → Analysér → Håndtér → Vurdér
      - en: Establish context → Analyse → Identify → Evaluate → Treat
        da: Fastlæg kontekst → Analysér → Identificér → Vurdér → Håndtér
    answer: 1
    explanation:
      en: >-
        First the context and criteria are set (scope, what matters, how risk will be
        judged). Then comes the risk assessment: identify what could go wrong, analyse its
        likelihood and consequences, and evaluate the result against the criteria to decide
        which risks need action. Only then are risks treated. Evaluating before analysing
        is impossible, because there is no level to compare against the criteria yet. You
        cannot analyse a risk you have not yet identified, and identifying before the
        context is set leaves nothing to decide what is in scope. Monitoring, review and
        communication run alongside every step rather than coming at a fixed place.
      da: >-
        Først fastlægges kontekst og kriterier (omfang, hvad der er vigtigt, og hvordan
        risiko skal bedømmes). Derefter kommer risikovurderingen: identificér, hvad der kan
        gå galt, analysér sandsynlighed og konsekvens, og vurdér resultatet mod kriterierne
        for at afgøre, hvilke risici der kræver handling. Først derefter håndteres
        risiciene. At vurdere før analysen går ikke, for der er endnu intet risikoniveau at
        holde op mod kriterierne. Man kan ikke analysere en risiko, man endnu ikke har
        identificeret, og identificerer man før konteksten er fastlagt, er der intet, der
        afgør, hvad der er med. Monitorering, opfølgning og kommunikation løber sideløbende
        med alle trin i stedet for at have en fast plads.
    difficulty: 2
    sources:
      - title: ISO 31000 — Wikipedia
        url: https://en.wikipedia.org/wiki/ISO_31000
        tier: reference
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-qualitative-vs-quantitative
    terms:
      - security/qualitative-risk-analysis
      - security/quantitative-risk-analysis
    kind: compare
    stem:
      en: >-
        A hospital's IT security team must choose between a qualitative and a quantitative
        risk analysis for its patient systems. Which statement describes the trade-off
        between the two correctly?
      da: >-
        Et hospitals it-sikkerhedsteam skal vælge mellem en kvalitativ og en kvantitativ
        risikoanalyse af sine patientsystemer. Hvilket udsagn beskriver afvejningen mellem
        de to korrekt?
    options:
      - en: >-
          Quantitative is always the more objective choice, because numbers remove human
          judgement
        da: >-
          Kvantitativ er altid det mest objektive valg, fordi tal fjerner menneskelig
          vurdering
      - en: >-
          Qualitative rates threats, while quantitative rates vulnerabilities in the same
          systems
        da: >-
          Kvalitativ vurderer trusler, mens kvantitativ vurderer sårbarheder i de samme
          systemer
      - en: >-
          Quantitative allows cost-benefit sums in kroner but needs data; qualitative is
          faster but subjective
        da: >-
          Kvantitativ giver cost-benefit-regnestykker i kroner men kræver data; kvalitativ
          er hurtigere men subjektiv
      - en: >-
          Qualitative is required by ISO/IEC 27005, so quantitative is only for insurance
          companies
        da: >-
          Kvalitativ er et krav i ISO/IEC 27005, så kvantitativ bruges kun af
          forsikringsselskaber
    answer: 2
    explanation:
      en: >-
        A quantitative analysis puts numbers on likelihood and loss, which lets you weigh a
        control's cost against the expected loss — but it depends on reliable data and
        takes more effort. A qualitative analysis uses scales such as low, medium and high:
        it is quicker and easier to communicate, but the ratings rest on judgement. Numbers
        are not automatically objective; NIST SP 800-30 warns that subjective estimates
        buried in a quantitative model weaken its rigour. Both methods rate risks, which
        combine threats and vulnerabilities, so neither is limited to one of them. The
        standards leave the choice of method to the organisation.
      da: >-
        En kvantitativ analyse sætter tal på sandsynlighed og tab, så man kan veje en
        kontrols pris op mod det forventede tab — men den kræver pålidelige data og mere
        arbejde. En kvalitativ analyse bruger skalaer som lav, middel og høj: den er
        hurtigere og lettere at kommunikere, men vurderingerne bygger på skøn. Tal er ikke
        automatisk objektive; NIST SP 800-30 advarer om, at subjektive skøn gemt i en
        kvantitativ model svækker dens stringens. Begge metoder vurderer risici, som
        kombinerer trusler og sårbarheder, så ingen af dem er begrænset til det ene.
        Standarderne overlader valget af metode til organisationen.
    difficulty: 2
    sources:
      - title: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments (section 2.3.2)
        url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-30r1.pdf
        tier: standard
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true

  - id: risk-monitoring-vpn-warning
    terms:
      - security/risk-monitoring
      - security/threat-intelligence
      - security/likelihood
    kind: scenario
    stem:
      en: >-
        In March, a Danish region's management approved a risk register that rates
        "break-in through the remote-access VPN" as medium likelihood. In June, the
        national cyber security authorities warn that attackers are actively exploiting a
        newly published weakness in exactly the VPN product the region uses. What should
        the information security coordinator do about the register?
      da: >-
        I marts godkendte ledelsen i en dansk region et risikoregister, hvor "indbrud via
        fjernadgangs-VPN'en" er vurderet til middel sandsynlighed. I juni advarer de danske
        cybersikkerhedsmyndigheder om, at angribere aktivt udnytter en nyligt offentliggjort
        sårbarhed i netop det VPN-produkt, regionen bruger. Hvad bør
        informationssikkerhedskoordinatoren gøre ved risikoregistret?
    options:
      - en: >-
          Reassess the VPN risk now with a higher likelihood, and check the treatment still
          holds
        da: >-
          Vurdér VPN-risikoen igen nu med højere sandsynlighed, og tjek, at håndteringen
          stadig holder
      - en: >-
          Keep the approved rating until the yearly review, so the register stays consistent
        da: >-
          Behold den godkendte vurdering til den årlige gennemgang, så registret forbliver
          konsistent
      - en: >-
          Raise the impact rating, since a known weakness makes a break-in more damaging
        da: >-
          Hæv konsekvensvurderingen, da en kendt sårbarhed gør et indbrud mere skadeligt
      - en: >-
          Leave the register alone, since outside warnings are not the region's own risks
        da: >-
          Lad registret være, da advarsler udefra ikke er regionens egne risici
    answer: 0
    explanation:
      en: >-
        Risk monitoring exists to catch risk-impacting changes between formal reviews, and
        an actively exploited weakness in the region's own VPN product makes a break-in far
        more likely. The risk should be reassessed now and the treatment checked — for
        example, whether the patch is applied. Waiting for the yearly review lets an
        approved rating go stale exactly when it matters. The warning changes how likely an
        attack is, not how much harm a successful break-in does, so raising the impact is
        the right idea on the wrong factor. Threat intelligence about a product the region
        runs is directly about the region's own risk.
      da: >-
        Risikoovervågning skal fange ændringer, der påvirker risikoen mellem de formelle
        gennemgange, og en aktivt udnyttet sårbarhed i regionens eget VPN-produkt gør et
        indbrud langt mere sandsynligt. Risikoen bør vurderes igen nu, og håndteringen
        tjekkes — fx om rettelsen er installeret. At vente til den årlige gennemgang lader
        en godkendt vurdering blive forældet, netop når det gælder. Advarslen ændrer, hvor
        sandsynligt et angreb er, ikke hvor stor skade et vellykket indbrud gør, så at hæve
        konsekvensen er den rigtige tanke på den forkerte faktor. Threat intelligence om et
        produkt, regionen bruger, handler direkte om regionens egen risiko.
    difficulty: 2
    sources:
      - title: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments
        url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-30r1.pdf
        tier: standard
      - title: Cyber Security Fast Track — kursuskompendium
        tier: course-material
    draft: true
