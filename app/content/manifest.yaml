# Canonical v1 term manifest — the "curated term list" step of the content
# pipeline (SPEC §5). Every authored edge must target an id in this list.
# Security terms come from the course ordliste (the granularity oracle);
# CS terms are the networking / OS / identity bridge set (D6).
# `folder` is where the file lives: src/content/terms/<folder>/<id>.yaml
# `audit` exists in BOTH domains (a deliberate collision) — always write
# `security/audit` or `cs/audit` when linking to it.

