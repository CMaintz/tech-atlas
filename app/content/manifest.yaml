# Canonical term manifest — the "curated term list" step of the content pipeline
# (SPEC §5). Every authored edge must target an id in this list. Security terms
# come from the course ordliste (the granularity oracle) plus batches 2–3; CS terms
# are the networking / OS / identity / cryptography bridge set.
# Files live at src/content/terms/<folder>/<id>.yaml (<folder> = top-level key).
# `audit` exists in BOTH domains (a deliberate collision) — always link to it as
# `security/audit` or `cs/audit`.
# Block style on purpose: prettier rewraps long inline maps.

