# Foundry gate — the six-verb contract (see AGENTS.md). Tasks operate in app/.
[tools]
node = "22.14.0"
# Secret scanner for `mise run audit` (A89); rules and allowlist in .gitleaks.toml.
gitleaks = "8.30.1"

[tasks.fix]
description = "Apply every mechanically-safe fix (format). No judgement calls."
dir = "app"
run = "npx prettier --write ."

[tasks.lint]
description = "Report style violations and content-model smells."
dir = "app"
run = ["npx prettier --check .", "npm run lint:content"]

[tasks.typecheck]
description = "Static type analysis."
dir = "app"
run = "npm run check"

[tasks.test]
description = "Unit tests (vitest), then the full production build as a smoke test."
dir = "app"
run = ["npm test", "npm run build"]

[tasks.audit]
description = "Dependency vulnerabilities, registry signatures, and secrets anywhere in git history."
dir = "app"
run = [
  "npm audit --audit-level=high",
  "npm audit signatures",
  "gitleaks git --redact --no-banner --config ../.gitleaks.toml ..",
]

[tasks.gate]
description = "lint -> typecheck -> test -> audit, in order. The oracle."
run = ["mise run lint", "mise run typecheck", "mise run test", "mise run audit"]
