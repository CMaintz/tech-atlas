# Foundry gate - the six-verb contract (see AGENTS.md), on Foundry v2 (CMaintz/foundry,
# template mise/ts.toml). CI runs these same verbs through the `gate.yml` facade with
# working_directory = app/, which finds this root config by mise's parent-directory lookup.
[tools]
node = "22.14.0"
# Secret scanner for `mise run audit`; rules and allowlist in .gitleaks.toml.
gitleaks = "8.30.1"
# Type checker for the Supabase Edge Functions (Deno runtime), in `mise run typecheck`.
deno = "2.9.7"

[env]
# The Foundry scripts (foundry-verb-wrap, npm-audit-ratchet.mjs, foundry-explain and its
# rule catalog) are provisioned by setup:foundry-scripts into a cache dir at this ref, not
# vendored into the repo (see that task for why). Renovate tracks the pin via the comment
# above it.
# A bump must also update the sha256 lines in setup:foundry-scripts.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.14.0"
# The app's local binaries, the Foundry gate scripts cached by setup:foundry-scripts (so the
# gate can call `foundry-verb-wrap` by name), and the repo's own scripts/ last.
_.path = [
    "{{config_root}}/app/node_modules/.bin",
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]
# Loop telemetry: each gate verb appends one JSONL line here (gitignored .foundry/).
# Read it with `foundry-loop-report`.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"
# Deno code for `deno check` in `typecheck` (the Foundry v2.3 ts-template variable):
# every Edge Function and supabase/functions/_shared, with Deno's own types.
FOUNDRY_DENO_PATHS = "supabase/functions"

[hooks]
# Provision the pinned Foundry gate scripts on `mise install` (local and CI alike); no-ops
# on a warm install.
postinstall = "mise run setup:foundry-scripts"

# Fetch the pinned Foundry scripts into a cache dir instead of copying them into the repo
# (agent/CI plumbing, not the repo's code; a copy drifts and needs a re-sync on every bump).
# Every run checks each script against its sha256 below, cached or not: the tag is only a
# locator, so a moved tag, a proxy page or a truncated download is re-fetched once and then
# refused, never cached. A verified cache needs no network, so the gate hot path stays
# offline; a ref bump needs the network once. cut-release.sh writes the digests for the tag
# it cuts, so bumping FOUNDRY_SCRIPTS_REF means taking that tag's digest lines with it.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry scripts into a cache dir, sha256-verified"
run = '''
set -eu
# <file> <sha256 of that file at FOUNDRY_SCRIPTS_REF>, one per line. A bare name is
# scripts/<name>; a path (the rule catalog) is fetched from there, cached by basename.
# foundry-smells joins this list at the next FOUNDRY_SCRIPTS_REF bump (once a tag ships
# it); until then the `smells` task falls back to habit-hooks directly. Do NOT add a
# comment inside the quoted block below - `read -r s want` would try to fetch it.
scripts='
foundry-verb-wrap bec5e917c13c22ed534ea0a3a49e33b099be35f05d8fc39473b0bd960fc4bf0e
npm-audit-ratchet.mjs 169376a3227c5806f7438ef8641d2b5d5460d78a704c87e639fb176350f09cdb
foundry-explain 6b483daf5867badb4db5d222fccbe717b310deda6ebd064e8f478ec3f2dcef60
presets/rules/catalog.toml c311172c29dd735821e2a0efe566aecc35320f45d375bfac1a2622a43ba4fb9b
presets/rules/matchers.toml 8f0a748fc181e1a37c754d79e7a196e4d9006592e633826c8031b89acba7f455
'
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF"
# sha256sum ships with Linux and Git Bash; macOS has only shasum.
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
mkdir -p "$dst"
while read -r s want; do
  [ -n "$s" ] || continue
  case "$s" in */*) src="$s" ;; *) src="scripts/$s" ;; esac
  f="${s##*/}"
  [ -f "$dst/$f" ] && [ "$(digest "$dst/$f")" = "$want" ] && continue
  # A per-run temp file, moved into place only once verified: concurrent runs (parallel
  # worktrees share $HOME) never write into each other's download or expose a partial one.
  tmp=$(mktemp "$dst/.$f.XXXXXX")
  if ! curl -fsSL "$base/$src" -o "$tmp"; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    exit 1
  fi
  got=$(digest "$tmp")
  if [ "$got" != "$want" ]; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: $s at $FOUNDRY_SCRIPTS_REF has sha256 $got, expected $want; refusing it." >&2
    echo "  If FOUNDRY_SCRIPTS_REF was just bumped, copy the digest lines from that ref's mise template;" >&2
    echo "  otherwise the download was not the script (proxy or captive page, truncation, moved tag)." >&2
    exit 1
  fi
  chmod +x "$tmp" 2>/dev/null || true
  mv -f "$tmp" "$dst/$f"
done <<EOF
$scripts
EOF
'''

[tasks.fix]
description = "Apply every mechanically-safe fix (format). No judgement calls."
dir = "app"
run = "npx prettier --write ."

[tasks.lint]
description = "Report style violations, content-model smells, and oversized functions/files."
dir = "app"
run = ["npx prettier --check .", "npm run lint:eslint", "npm run lint:content", "npm run lint:size"]

[tasks.typecheck]
description = "Static type analysis: the Astro app (astro check), then the Edge Functions (deno check)."
# As in Foundry's ts template, a missing tsconfig.json fails loudly: without it
# `astro check` silently covers .astro files only.
run = [
  "test -f app/tsconfig.json || { echo 'app/tsconfig.json is required' >&2; exit 1; }",
  "cd app && npm run check",
  # Unquoted on purpose: a space-separated list of directories/files.
  "deno check $FOUNDRY_DENO_PATHS",
]

[tasks.test]
description = "Unit tests (vitest), the full production build, then the MCP Worker bundled from it."
dir = "app"
# The Worker step bundles the build's JSON and runs `wrangler deploy --dry-run`, so a
# Worker that will not bundle (or a site JSON shape it cannot read) fails here, not at deploy.
run = ["npm test", "npm run build", "npm run build -w mcp"]

# Not part of `gate`: CI runs these in tests.yml, alongside the gate.
[tasks.e2e]
description = "Browser smoke tests (Playwright, Chromium) against the production build."
dir = "app"
# The Chromium build is the one the locked @playwright/test version ships with, so
# package-lock.json pins the browser. On a bare Linux runner, install its system
# libraries first: `npx playwright install-deps chromium` (tests.yml does).
run = ["npx playwright install chromium", "npm run build", "npm run test:e2e"]

[tasks.coverage]
description = "Unit tests with a v8 coverage report (app/coverage/). No floor yet."
dir = "app"
run = "npm run test:coverage"

[tasks.audit]
description = "Dependency vulnerabilities, registry signatures, and secrets anywhere in git history."
dir = "app"
# Foundry's ratcheted npm audit: fails on any high+ advisory not accepted, with a
# reason, in app/.audit-allowlist.json (none today), and on stale allowlist entries.
# The level stays at high (Foundry's template default is critical). The ratchet script is
# cached by setup:foundry-scripts; address it through $HOME in plain shell, NOT a mise
# `{{...}}` template, because on Windows a templated path carries backslashes bash would strip.
run = [
  "npm audit --json | node \"$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF/npm-audit-ratchet.mjs\" --level=high --allowlist=.audit-allowlist.json",
  "npm audit signatures",
  "gitleaks git --redact --no-banner --config ../.gitleaks.toml ..",
]

[tasks.gate]
description = "lint -> typecheck -> test -> audit, in order. The oracle."
# The one setup:foundry-scripts dep provisions the cached gate scripts first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. Do NOT
# add the VERBS as `depends`: mise runs dependencies in parallel with no ordering guarantee,
# which makes gate output unreadable and hides which check failed first. The verbs stay in
# the sequential array below.
depends = ["setup:foundry-scripts"]
# `foundry-verb-wrap` times each verb, appends to FOUNDRY_TELEMETRY and passes the exit
# code through unchanged, so a failing verb still stops the sequence.
run = [
  "foundry-verb-wrap lint      -- mise run lint",
  "foundry-verb-wrap typecheck -- mise run typecheck",
  "foundry-verb-wrap test      -- mise run test",
  "foundry-verb-wrap audit     -- mise run audit",
]
