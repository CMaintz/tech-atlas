# Secret scanning for `mise run audit` (A89): gitleaks' default rules plus the
# credentials this project actually holds. Scans the full git history in the gate.
title = "Atlas gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (bypasses Row Level Security)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{16,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-access-token"
description = "Supabase personal access token (controls the whole account)"
regex = '''\bsbp_[0-9a-f]{40}\b'''
keywords = ["sbp_"]

[[rules]]
id = "supabase-service-role-jwt"
description = "Legacy Supabase service_role key (a JWT whose payload says role service_role)"
# "service_role" base64url-encoded at each of the three byte alignments.
regex = '''eyJ[\w-]{8,}\.eyJ[\w-]*(?:c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG)[\w-]*\.[\w-]+'''
keywords = ["eyj"]

# Per-term passage hashes (A76): 16 hex digits keyed by a term id, which generic-api-key
# mistakes for keys when the id contains "api", "token" or "auth". Narrow: only these
# generated files, and only lines of exactly that shape. app/public/semantic/vectors.json
# no longer exists but is in history.
[[allowlists]]
description = "term passage hashes"
condition = "AND"
paths = [
  '''^supabase/seed/term-vectors\.json$''',
  '''^app/public/semantic/vectors\.json$''',
]
regexTarget = "line"
regexes = ['''^\s*"[a-z0-9-]+/[a-z0-9-]+": "[0-9a-f]{16}",?$''']
