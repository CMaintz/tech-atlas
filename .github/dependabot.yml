# Weekly, grouped dependency updates (A63). Each PR runs the gate like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for every minor/patch bump; majors arrive one per package.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A pair that moves together, by hand (A55): onnxruntime-web is pinned to exactly
      # the dev prerelease @huggingface/transformers requires, and the self-hosted
      # runtime must match it. A bump of either alone can't be caught by the gate.
      - dependency-name: onnxruntime-web
      - dependency-name: '@huggingface/transformers'
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
