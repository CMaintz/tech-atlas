# Weekly, grouped dependency updates (A67). Each PR runs the gate like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Supply chain (A89): skip releases younger than a few days — most hijacked npm
    # versions are caught and pulled within that window. Security updates ignore this.
    cooldown:
      default-days: 5
    groups:
      # One PR for every minor/patch bump; majors arrive one per package.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A pair that moves together, by hand (A55): onnxruntime-web is pinned to exactly
      # the dev prerelease @huggingface/transformers requires, and the self-hosted
      # runtime must match it. A bump of either alone can't be caught by the gate.
      - dependency-name: onnxruntime-web
      - dependency-name: '@huggingface/transformers'
      # Majors that break the toolchain (TS 7 vs @astrojs/check peer range, Zod 4 API,
      # @types/node ahead of the pinned Node 22 runtime): upgrade by hand in their own PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
