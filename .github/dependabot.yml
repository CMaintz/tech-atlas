# Weekly, grouped dependency updates (A63). Each PR runs the gate like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for every minor/patch bump; majors arrive one per package.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to exactly the dev prerelease @huggingface/transformers requires (A55);
      # it moves only together with transformers.js, by hand.
      - dependency-name: onnxruntime-web
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
