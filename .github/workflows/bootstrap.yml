name: bootstrap
# Foundry v2 habit-hooks baseline refresh, run on Linux: the first run seeds
# app/.habit-hooks/snooze.json (a PR for the owner to review); later runs prune it
# (shrink-only, auto-merge armed). Never a required check.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@323a0ebbb78012cf933a5a24717ca9630cfb445c # v2.5.0
    permissions:
      contents: write
      pull-requests: write
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: app
      habit_hooks_plugin: habit-hooks-typescript
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
