name: deploy
# Deploys only what passed the gate: runs after a `gate` run on a push to main
# succeeds, and builds exactly the commit that run checked. A gate run cancelled by a
# newer push (gate.yml cancel-in-progress) deploys nothing; the newer run deploys.
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Manual runs on main only; the github-pages environment enforces it again.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the RSS feeds date each term by the commit that added it.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        working-directory: app
        # onnxruntime-node (used only by a local `npm run embed`) otherwise downloads CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Build
        working-directory: app
        # Public Supabase config. Unset repo variables => empty => accounts hidden.
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          # Sign-in buttons offered, e.g. github,linkedin_oidc; unset => GitHub only.
          PUBLIC_AUTH_PROVIDERS: ${{ vars.PUBLIC_AUTH_PROVIDERS }}
          # Search by meaning: the semantic-search function URL; unset => name search only.
          PUBLIC_SEMANTIC_SEARCH_URL: ${{ vars.PUBLIC_SEMANTIC_SEARCH_URL }}
          # Feedback form: the feedback function URL; unset => no Feedback button.
          PUBLIC_FEEDBACK_URL: ${{ vars.PUBLIC_FEEDBACK_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist
      # The published JSON the MCP Worker bundles, so it serves exactly this build's data.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-data
          path: |
            app/dist/api/terms.json
            app/dist/graph.json
            app/dist/search-index.json
            app/dist/questions-en.json
            app/dist/questions-da.json
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # The MCP server (app/mcp), a Cloudflare Worker at mcp.atlas.maintz.dev, deployed from
  # the same build as the site. Its steps skip (not fail) until CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID are set; the token needs Workers Scripts edit plus, for the
  # custom domain, Workers Routes and DNS edit on the maintz.dev zone.
  mcp:
    # After the Pages deploy, so the Worker never serves data the live site does not show.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: mcp
      cancel-in-progress: false
    steps:
      - name: Check configuration
        id: cfg
        # Only whether each secret is set, never its value.
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN not set - skipping the MCP Worker deploy."
          fi
      - if: steps.cfg.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - if: steps.cfg.outputs.deploy == 'true'
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.5
      - name: Install dependencies
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: app
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - if: steps.cfg.outputs.deploy == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mcp-data
          path: app/dist
      - name: Bundle the data and check the Worker builds
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: app
        run: npm run build -w mcp
      - name: Deploy the Worker
        if: steps.cfg.outputs.deploy == 'true'
        working-directory: app/mcp
        # Only this step sees the Cloudflare secrets.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Smoke test the MCP endpoint
        # Set MCP_URL (e.g. https://mcp.atlas.maintz.dev/mcp) once the custom domain is live.
        if: steps.cfg.outputs.deploy == 'true' && vars.MCP_URL != ''
        working-directory: app
        env:
          MCP_URL: ${{ vars.MCP_URL }}
        run: npm run smoke -w mcp -- "$MCP_URL"
