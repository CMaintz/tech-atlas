name: backend
# Deploys the Supabase side of search by meaning (A74): migrations, the `semantic-search`
# Edge Function (+ its Cloudflare secrets) and the committed term vectors.
# Skipped entirely until the repository variable SUPABASE_PROJECT_REF is set; its steps
# are skipped (not failed) until the secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD are set too. Setup: docs/SUPABASE_SETUP.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — skipping the backend deploy."
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - if: steps.cfg.outputs.ready == 'true'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.5
      - name: Apply migrations
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all
      - name: Set function secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
              CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN not set — the function answers 503 (the site falls back to name search) until they are set here or in the Supabase dashboard."
          fi
      - name: Deploy the Edge Function
        if: steps.cfg.outputs.ready == 'true'
        run: supabase functions deploy semantic-search --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        working-directory: app
        # onnxruntime-node (used only by a local `npm run embed`) otherwise downloads CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Seed term vectors
        if: steps.cfg.outputs.ready == 'true'
        working-directory: app
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s);const f=(p)=>k.find(p)?.api_key;process.stdout.write(f((x)=>x.type==="secret")||f((x)=>x.name==="service_role")||"")})')
          if [ -z "$key" ]; then echo "::error::no secret/service_role key found"; exit 1; fi
          echo "::add-mask::$key"
          SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$key" npm run seed:vectors
