name: backend
# Deploys the Supabase side of search by meaning (A75–A78): migrations, the
# `semantic-search` Edge Function + its Cloudflare secrets, the term vectors (re-embedded
# through Workers AI, the same call the function makes), then a smoke test that fails the
# job unless known questions find their terms.
#
# Like deploy.yml (A65) it deploys only what passed the gate: it runs after a `gate` run
# on a push to main succeeds, on exactly that commit; a manual run is allowed on main only.
# Skipped entirely until the repository variable SUPABASE_PROJECT_REF is set; its steps
# are skipped (not failed) until the secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD are set, and everything after the migrations until
# CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are set. Setup: docs/SUPABASE_SETUP.md.
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.SUPABASE_PROJECT_REF != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — skipping the backend deploy."
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] &&
             [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "search=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN not set — applying migrations only; search by meaning is not deployed."
          fi
      - if: steps.cfg.outputs.db == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.cfg.outputs.db == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Apply migrations
        if: steps.cfg.outputs.db == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --include-all
      - name: Set function secrets
        if: steps.cfg.outputs.search == 'true'
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
      - name: Deploy the Edge Function
        if: steps.cfg.outputs.search == 'true'
        run: supabase functions deploy semantic-search --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - if: steps.cfg.outputs.search == 'true'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.5
      - name: Install dependencies
        if: steps.cfg.outputs.search == 'true'
        working-directory: app
        # onnxruntime-node (used only by a local `npm run embed`) otherwise downloads CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Embed (Workers AI) and seed term vectors
        if: steps.cfg.outputs.search == 'true'
        working-directory: app
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s);const f=(p)=>k.find(p)?.api_key;process.stdout.write(f((x)=>x.type==="secret")||f((x)=>x.name==="service_role")||"")})')
          if [ -z "$key" ]; then echo "::error::no secret/service_role key found"; exit 1; fi
          echo "::add-mask::$key"
          SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$key" npm run seed:vectors
      - name: Smoke test search by meaning
        if: steps.cfg.outputs.search == 'true'
        working-directory: app
        env:
          SEMANTIC_SEARCH_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/semantic-search
        run: npm run smoke:semantic
