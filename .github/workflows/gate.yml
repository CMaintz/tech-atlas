name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the RSS feeds date each term by the commit that added it (A71).
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.5
      - name: Install dependencies
        working-directory: app
        # onnxruntime-node (used only by a local `npm run embed`) otherwise downloads CUDA binaries (A75).
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Gate
        run: mise run gate
