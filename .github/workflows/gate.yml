name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the RSS feeds date each term by the commit that added it (A71).
          fetch-depth: 0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.8.5
      - name: Install dependencies
        working-directory: app
        # onnxruntime-node (used only by `npm run embed`) otherwise downloads CUDA binaries (A55).
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Gate
        run: mise run gate
