name: gate
# Foundry v2 language gate (CMaintz/foundry `gate.yml` facade, stack ts): the verbs one
# step each (lint, typecheck, test, audit from mise.toml) plus the structural-smell job
# (habit-hooks, app/.habit-hooks/). Branch protection requires `gate / gate-ok`.
#
# deploy.yml and backend.yml run after this workflow (by its name, `gate`) succeeds on a
# push to main, so it keeps its name and both triggers.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    # The public facade, pinned by SHA (Dependabot bumps it). Never pin the _-prefixed internals.
    uses: CMaintz/foundry/.github/workflows/gate.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      stack: ts
      # package.json, package-lock.json, .npmrc and .habit-hooks/ live in app/; the verbs
      # come from the root mise.toml, which mise finds from app/ by parent lookup.
      working_directory: app
