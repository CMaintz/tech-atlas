name: ratchet
# Foundry v2 ratchet report: a PR comment showing how the accepted-debt baseline moved.
on:
  pull_request:
permissions:
  contents: read
jobs:
  ratchet:
    # v2.2.0 fails while the baseline is not on main yet. Pinned to the fix commit
    # (CMaintz/foundry fix/facade-permissions-and-ratchet) until it is released.
    uses: CMaintz/foundry/.github/workflows/ratchet-report.yml@5e16845f82440eddb408b7a20d3176db9f15fc55 # v2.2.0 + fix
    permissions:
      contents: read
      pull-requests: write
    with:
      baselines: app/.habit-hooks/snooze.json
